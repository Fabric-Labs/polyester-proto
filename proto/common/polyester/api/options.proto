syntax = "proto3";

package polyester.api;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/polyester/api;polyesterapiv1";

// Proto-only API metadata used for docs generation and UI behavior.
// This does not affect runtime payloads.

// MFARequirement describes the interactive MFA assurance documented for an RPC.
enum MFARequirement {
  // No interactive MFA requirement is declared; documentation treats this as none.
  MFA_UNSPECIFIED = 0;
  // The RPC requires a recently MFA-elevated interactive session.
  MFA_RECENT = 1;
  // The RPC requires a fresh, single-use step-up proof.
  MFA_FRESH_STEP_UP = 2;
  // The RPC's MFA requirement depends on the caller or request.
  MFA_CONDITIONAL = 3;
}

extend google.protobuf.MethodOptions {
  // When true, this RPC is publicly accessible (no auth required).
  bool public = 50001;

  // When true, this RPC is excluded from generated docs artifacts (nav/connect/openapi).
  // Use this for internal-only helper RPCs (e.g. intra-service calls).
  bool hidden = 50002;

  // Interactive MFA assurance documented for this RPC.
  // This metadata does not enforce runtime authorization.
  MFARequirement mfa_requirement = 50003;
}
