syntax = "proto3";

package changelog.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/changelog/v1;changelogv1";
// Document-level OpenAPI metadata for the Changelog API.
option (gnostic.openapi.v3.document) = {
  tags: [{
    name: "Changelog Service"
    description: "Published product changelog of this environment: posts and the changes they announce."
  }]
};

// ChangeCategory classifies one change.
enum ChangeCategory {
  // Not set. Never returned.
  CATEGORY_UNSPECIFIED = 0;
  // Breaking change: existing integrations may need to change.
  BREAKING_CHANGE = 1;
  // New capability.
  NEW_FEATURE = 2;
  // Improvement to existing behavior.
  IMPROVEMENT = 3;
  // Bug fix.
  BUG_FIX = 4;
}

// Audience is a group of users a change is addressed to.
enum Audience {
  // Not set. Never returned.
  AUDIENCE_UNSPECIFIED = 0;
  // Everyone.
  ALL_USERS = 1;
  // Traders.
  TRADERS = 2;
  // Market makers.
  MARKET_MAKERS = 3;
  // Developers and API integrators.
  DEVELOPERS = 4;
}

// Surface is the product area a change affects.
enum Surface {
  // Not set. Never in Change.surfaces; Section.surface carries it for a section
  // not tied to one area.
  SURFACE_UNSPECIFIED = 0;
  // Orders, triggers and protective orders, and order outcomes.
  TRADING = 1;
  // Deposits, withdrawals and transfers.
  FUNDING = 2;
  // Accounts, subaccounts and security.
  ACCOUNTS = 3;
  // Programmatic API.
  API = 4;
  // Block explorer.
  EXPLORER = 5;
  // Documentation.
  DOCUMENTATION = 6;
  // Platform-wide behavior.
  PLATFORM = 7;
  // Market data: prices, candles, order book, heatmaps and market overviews.
  MARKET_DATA = 8;
  // The QuickSwap swap app.
  QUICKSWAP = 9;
  // Rewards: daily claims, campaigns, VIP tiers and fee discounts.
  REWARDS = 10;
  // The AI assistant: chats, approvals, memories and preferences.
  ASSISTANT = 11;
}

// Environment is a Polyester network with its own changelog.
enum Environment {
  // Not set. Never returned.
  ENVIRONMENT_UNSPECIFIED = 0;
  // Development network.
  DEVNET = 1;
  // Test network.
  TESTNET = 2;
  // Main network.
  MAINNET = 3;
}

// ChangeAvailability is how one change of a release differs from its release
// in one environment.
enum ChangeAvailability {
  // Not set. Never returned.
  AVAILABILITY_UNSPECIFIED = 0;
  // Available in the environment while its release is still pending there.
  AHEAD = 1;
  // Not yet available in the environment although its release is live there.
  PENDING = 2;
  // Not available in the environment for now, whatever its release's status.
  UNAVAILABLE = 3;
}

// SortDirection orders changes by post publication time.
enum SortDirection {
  // Default: descending.
  SORT_DIRECTION_UNSPECIFIED = 0;
  // Ascending (oldest first).
  SORT_ASC = 1;
  // Descending (newest first).
  SORT_DESC = 2;
}

// EnvironmentStatus says whether a release is live in one environment.
message EnvironmentStatus {
  // Environment.
  Environment environment = 1;
  // When the release went live in the environment. Omitted while it is
  // pending there.
  google.protobuf.Timestamp live_at = 2;
}

// ChangeException is the status of one change in one environment where it
// differs from its release's status.
message ChangeException {
  // Environment.
  Environment environment = 1;
  // How the change differs from its release there.
  ChangeAvailability availability = 2;
  // When the change became available in the environment; set for AHEAD only.
  google.protobuf.Timestamp live_at = 3;
}

// Change is one announced change. A republished post may reword or withdraw it.
message Change {
  // Stable opaque 64-bit identifier, identical across environments and across
  // revisions of a post.
  fixed64 id = 1;
  // Short title.
  string title = 2;
  // One-paragraph summary.
  string summary = 3;
  // Longer explanation; paragraphs separated by blank lines. Omitted when absent.
  optional string details = 4;
  // Category.
  ChangeCategory category = 5;
  // True when users or integrators must act.
  bool action_required = 6;
  // What to do, when action is required. Omitted when absent.
  optional string migration_guidance = 7;
  // Audiences addressed. Never empty.
  repeated Audience audiences = 8;
  // Product areas affected. May be empty.
  repeated Surface surfaces = 9;
  // Environments where this change differs from its release's status, in any
  // environment, not only this one. Empty outside release posts and when the
  // change follows its release everywhere.
  repeated ChangeException environment_exceptions = 10;
}

// Section groups related changes inside a post.
message Section {
  // Section heading.
  string heading = 1;
  // Section summary. Omitted when absent.
  optional string summary = 2;
  // Changes in publication order.
  repeated Change changes = 3;
  // Product area of the section. SURFACE_UNSPECIFIED for sections not tied to
  // one area (for example changes that need your attention, or general).
  Surface surface = 4;
}

// PostSummary describes one published post without its changes.
message PostSummary {
  // Stable post identifier, unique within this environment. It never changes
  // when the post is republished.
  string slug = 1;
  // Title.
  string title = 2;
  // Introduction.
  string introduction = 3;
  // Time of first publication. It never changes when the post is republished.
  google.protobuf.Timestamp published_at = 4;
  // Exclusive upper bound of the period covered. Omitted when unknown.
  google.protobuf.Timestamp coverage_cutoff = 5;
  // Exact number of changes.
  uint32 change_count = 6;
  // Exact number of BREAKING_CHANGE changes.
  uint32 breaking_change_count = 7;
  // Exact number of changes with action_required.
  uint32 action_required_count = 8;
  // Exact number of NEW_FEATURE changes.
  uint32 new_feature_count = 9;
  // Exact number of IMPROVEMENT changes.
  uint32 improvement_count = 10;
  // Exact number of BUG_FIX changes.
  uint32 bug_fix_count = 11;
  // When the current revision was published; equals published_at for revision 1.
  google.protobuf.Timestamp updated_at = 12;
  // Published revision, starting at 1. Each republication of the post, for
  // example to correct its copy or withdraw a change, increments it.
  uint32 revision = 13;
  // Release the post announces, for example "0.92.9". Omitted for posts that
  // do not announce one release. A release post has the same slug, for
  // example "v0.92.9", and the same content in every environment, and is
  // listed in every environment, including environments where it is still
  // pending.
  optional string release_version = 14;
  // Status of the post's release in each environment: DEVNET, TESTNET and
  // MAINNET, in that order. Empty for posts without release_version. The
  // status changes when the release goes live, without a new revision.
  repeated EnvironmentStatus environments = 15;
  // Slug of the deployment group that brought the release to this
  // environment. Omitted while the release is pending here and for posts
  // without release_version.
  optional string deployment_group_slug = 16;
}

// Post is one complete published post at its current revision.
message Post {
  // Post summary.
  PostSummary summary = 1;
  // Sections in publication order.
  repeated Section sections = 2;
}

// ListPostsRequest pages through published posts, newest first.
message ListPostsRequest {
  // Maximum posts to return. 0 means the default of 20; maximum 100.
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 100];
  // Opaque, keyset-backed, exclusive cursor from a previous response.
  // Bound to publication time and slug.
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
}

// ListPostsResponse returns post summaries, newest first.
message ListPostsResponse {
  // Post summaries ordered by publication time descending, then slug descending.
  repeated PostSummary posts = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// GetPostRequest selects one post.
message GetPostRequest {
  // Post slug.
  string slug = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
}

// GetPostResponse returns one complete post.
message GetPostResponse {
  // The post with every section and change. A post can hold several hundred
  // changes; use ListChanges with post_slug to page through them instead.
  Post post = 1;
}

// ListChangesRequest queries changes across posts. Filters on different fields
// combine with AND; values within one field combine with OR.
message ListChangesRequest {
  option (buf.validate.message).cel = {
    id: "list_changes_request.valid_window"
    message: "end_time must be after start_time when both are set"
    expression: "!has(this.start_time) || !has(this.end_time) || this.end_time > this.start_time"
  };
  // Categories to include. Empty means all.
  repeated ChangeCategory categories = 1 [(buf.validate.field).repeated = {
    max_items: 4, unique: true, items: {enum: {defined_only: true, not_in: [0]}}
  }];
  // When set, only changes whose action_required equals this value.
  optional bool action_required = 2;
  // Surfaces to include. Empty means all.
  repeated Surface surfaces = 3 [(buf.validate.field).repeated = {
    max_items: 11, unique: true, items: {enum: {defined_only: true, not_in: [0]}}
  }];
  // Audiences to include. Empty means all. Changes addressed to ALL_USERS
  // always match.
  repeated Audience audiences = 4 [(buf.validate.field).repeated = {
    max_items: 4, unique: true, items: {enum: {defined_only: true, not_in: [0]}}
  }];
  // Inclusive lower bound on post publication time. Optional.
  google.protobuf.Timestamp start_time = 5;
  // Exclusive upper bound on post publication time. Optional; must be after
  // start_time when both are set.
  google.protobuf.Timestamp end_time = 6;
  // Restrict to one post. Optional.
  string post_slug = 7 [(buf.validate.field).string.max_len = 200];
  // Order of posts. Changes keep publication order inside each post.
  SortDirection sort = 8 [(buf.validate.field).enum.defined_only = true];
  // Maximum changes to return. 0 means the default of 100; maximum 500.
  uint32 limit = 9 [(buf.validate.field).uint32.lte = 500];
  // Opaque, keyset-backed, exclusive cursor from a previous response. Reuse
  // it only with the same filters, time bounds and sort. When the post it
  // points into was republished since, paging restarts at the first change of
  // that post's current revision, so changes of that post can appear again;
  // match them by id.
  string page_token = 10 [(buf.validate.field).string.max_len = 512];
}

// ChangeEntry is one change with the post that announced it.
message ChangeEntry {
  // The change.
  Change change = 1;
  // Slug of the announcing post.
  string post_slug = 2;
  // Time of first publication of the announcing post.
  google.protobuf.Timestamp published_at = 3;
  // Heading of the section containing the change.
  string section_heading = 4;
}

// ListChangesResponse returns matching changes.
message ListChangesResponse {
  // Matching changes in the requested order.
  repeated ChangeEntry changes = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// DeploymentGroupPost is one published release post a deployment group
// brought.
message DeploymentGroupPost {
  // Post slug, for example "v0.92.9".
  string slug = 1;
  // Release the post announces, for example "0.92.9".
  string release_version = 2;
  // Post title.
  string title = 3;
  // Time of first publication of the post.
  google.protobuf.Timestamp published_at = 4;
  // Published revision of the post, starting at 1.
  uint32 revision = 5;
  // When the post's current revision was published.
  google.protobuf.Timestamp updated_at = 6;
}

// DeploymentGroupSummary describes one deployment group without its details.
// A deployment group is one deployment to this environment that raised its
// release version, and brought every release above the previous group's
// version up to and including its own.
message DeploymentGroupSummary {
  // Stable shareable identifier: the environment and the group's own
  // release, for example "testnet-v0.92.9". It never changes.
  string slug = 1;
  // Environment the group was deployed to.
  Environment environment = 2;
  // When the deployment ran.
  google.protobuf.Timestamp occurred_at = 3;
  // The group's own, highest release, for example "0.92.9".
  string release_version = 4;
  // Release tag of the group's own release, for example "v0.92.9". Omitted
  // when unknown.
  optional string release_tag = 5;
  // Release of the previous deployment group. Omitted for the first group.
  optional string previous_release_version = 6;
  // Every release the group brought, ascending, for example ["0.92.8",
  // "0.92.9"].
  repeated string versions = 7;
  // Published release posts of those releases, ascending by release. A
  // release without a published post has none.
  repeated DeploymentGroupPost posts = 8;
}

// DeploymentGroupAttention is one change of a deployment group that needs
// attention.
message DeploymentGroupAttention {
  // Slug of the release post that announces the change.
  string post_slug = 1;
  // Release of that post.
  string release_version = 2;
  // The change, as in its post.
  Change change = 3;
}

// DeploymentGroupHighlight is one highlight of a release post in a deployment
// group.
message DeploymentGroupHighlight {
  // Slug of the release post.
  string post_slug = 1;
  // Release of that post.
  string release_version = 2;
  // Highlight text, inline Markdown.
  string text = 3;
}

// DeploymentGroup is one complete deployment group.
message DeploymentGroup {
  // Group summary.
  DeploymentGroupSummary summary = 1;
  // Breaking changes and changes with action_required across the group's
  // posts, in post order (ascending release), then section and change order.
  repeated DeploymentGroupAttention attention = 2;
  // Highlights of the group's posts, in post order.
  repeated DeploymentGroupHighlight highlights = 3;
}

// ListDeploymentGroupsRequest pages through this environment's deployment
// groups, newest first.
message ListDeploymentGroupsRequest {
  // Maximum groups to return. 0 means the default of 20; maximum 100.
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 100];
  // Opaque, keyset-backed, exclusive cursor from a previous response.
  // Bound to deployment time and slug.
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
}

// ListDeploymentGroupsResponse returns deployment group summaries, newest
// first.
message ListDeploymentGroupsResponse {
  // Group summaries ordered by deployment time descending, then slug
  // descending.
  repeated DeploymentGroupSummary groups = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// GetDeploymentGroupRequest selects one deployment group.
message GetDeploymentGroupRequest {
  // Group slug, for example "testnet-v0.92.9".
  string slug = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
}

// GetDeploymentGroupResponse returns one complete deployment group.
message GetDeploymentGroupResponse {
  // The group with its attention changes and highlights.
  DeploymentGroup group = 1;
}

// ChangelogService serves the published changelog of this environment. It is
// public and caller-independent, and supports cacheable ConnectRPC GET.
service ChangelogService {
  option (polyester.api.docs_group) = "changelog";

  // List published post summaries, newest first. Use limit 1 to poll for the
  // latest post. To follow edits to published posts, compare each post's
  // revision.
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/changelog/posts"};
    option (gnostic.openapi.v3.operation) = {summary: "List Changelog Posts" tags: "Changelog Service" security: [{}]};
  }
  // Get one complete published post by slug, at its current revision.
  rpc GetPost(GetPostRequest) returns (GetPostResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/changelog/posts/{slug}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get Changelog Post" tags: "Changelog Service" security: [{}]};
  }
  // List changes across published posts, for example every breaking change
  // since a given time.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/changelog/changes"};
    option (gnostic.openapi.v3.operation) = {summary: "List Changelog Changes" tags: "Changelog Service" security: [{}]};
  }
  // List this environment's deployment groups, newest first: each deployment
  // that brought new releases, with the release posts it brought.
  rpc ListDeploymentGroups(ListDeploymentGroupsRequest) returns (ListDeploymentGroupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/changelog/deployment-groups"};
    option (gnostic.openapi.v3.operation) = {summary: "List Changelog Deployment Groups" tags: "Changelog Service" security: [{}]};
  }
  // Get one deployment group by slug, with the changes that need attention
  // and the highlights of its release posts.
  rpc GetDeploymentGroup(GetDeploymentGroupRequest) returns (GetDeploymentGroupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/changelog/deployment-groups/{slug}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get Changelog Deployment Group" tags: "Changelog Service" security: [{}]};
  }
}
