  ERROR_CODE_CHILD_QTY_EXCEEDS_REMAINING = 296;
  // The order cancellation was sent but not confirmed in time. Its outcome is
  // unknown and it may still apply; read the order before retrying. For a batch
  // cancellation, every item's outcome is unknown; read them back. For a cancel
  // all, some or all of the matching orders may be canceled; read open orders.
  // For a cancel all after heartbeat, the switch may or may not have been armed,
  // refreshed or disabled; send the heartbeat again.
  ERROR_CODE_ORDER_CANCEL_OUTCOME_UNKNOWN = 297;
  // The order modification was sent but not confirmed in time. Its outcome is
  // unknown and it may still apply; read the order before retrying. For a batch
  // replacement, every item's outcome is unknown; read them back.
  ERROR_CODE_ORDER_MODIFY_OUTCOME_UNKNOWN = 298;
  // This order is being canceled while the account's balances are brought back
  // in line, so it can't be changed. Nothing changed; cancels still work, and
  // the account's other orders can still be changed.
  ERROR_CODE_ORDER_REPAIRING = 299;
  // This account's orders are being canceled while its balances are brought
  // back in line, so new orders, changes and trigger orders are paused for a
  // short time. Nothing changed; cancels still work. Try again shortly.
  ERROR_CODE_ACCOUNT_REPAIRING = 300;
  // The change would act on the trigger at once. The new trigger price of a
  // stop-loss or take-profit, or the trigger price a new trailing distance
  // gives an activated trailing stop, is already reached by the price the
  // trigger watches (at or past it), so the trigger would fire at once and send
  // its order; or the new activation price of a trailing stop not yet
  // activated is already reached by that price, so it would activate at once.
  // Nothing changed; the trigger keeps its previous settings. Returned by
  // ModifyTrigger, and by an order modify that moves an attached take-profit,
  // stop-loss or trailing stop of an order with a fill. Also returned when a
  // market order is created or previewed with an attached take-profit or
  // stop-loss on the last price that its own fill would trigger, at or past
  // the best price the order takes (the best ask for a buy, the best bid for
  // a sell); the order is not placed, and a field violation on the leg's
  // trigger price names it, as RiskPolicy describes. A market order with an
  // attached take-profit or stop-loss on the index price that the index has
  // already reached is accepted, then rejected with this reason before it
  // trades, and so is one whose last-price leg the market reaches before the
  // order reaches the book; nothing is placed. Choose a price the market has
  // not reached.
  ERROR_CODE_TRIGGER_WOULD_TRIGGER_IMMEDIATELY = 302;
  // The order was sent but not confirmed in time. Its outcome is unknown and
  // it may have been accepted; read the order by its client order ID, or read
  // open orders, before retrying. For a batch create, every item's outcome is
  // unknown; read them back, or repeat the batch with the same request ID and
  // payload within 15 minutes, which returns decided items' original results
  // and retries the rest without admitting any item twice.
  ERROR_CODE_ORDER_CREATE_OUTCOME_UNKNOWN = 303;
  // The trigger was sent but not confirmed in time. Its outcome is unknown and
  // it may have been created; read the triggers for its client trigger ID,
  // or an OCO's for its client list ID, before retrying.
  ERROR_CODE_TRIGGER_CREATE_OUTCOME_UNKNOWN = 304;
  // The request names a listed trading pair other than the trigger's own, so
  // it was refused. Nothing changed; name the trigger's own pair, or omit the
  // symbol. A pair that is not listed is ERROR_CODE_UNKNOWN_SYMBOL.
  ERROR_CODE_TRIGGER_SYMBOL_MISMATCH = 305;
  // The account has reached its maximum number of resting orders in this
  // market. Good-till-cancelled and good-till-date orders count until they
  // end; immediate-or-cancel, fill-or-kill and market orders never count, and
  // a replace keeps its order's place. Nothing changed; cancel a resting order
  // in this market first.
  ERROR_CODE_MAX_OPEN_ORDERS_PER_PAIR = 306;
  // Self-trade prevention expired the order of an attached take-profit,
  // stop-loss or trailing stop because it would have traded with another of
  // the account's resting orders. It is reported as the trigger's fire refusal
  // reason, never as the answer to a request: the attached order stays active.
  // New trades and price updates do not fire it while the other order is first
  // in line at the best price; once that order is gone or no longer first
  // there, it fires again if its trigger condition still holds.
  ERROR_CODE_SELF_TRADE_PREVENTED = 307;
  // The order already carries every attached leg it may hold, so another
  // attached leg was refused. Legs being cancelled count until they end:
  // retry once they have ended.
  ERROR_CODE_ATTACHED_LEGS_EXCEEDED = 86;
  // The trigger's fee asset was not valid.
  ERROR_CODE_FEE_ASSET_INVALID = 87;
  // The trigger's maximum fee rate was not valid.
  ERROR_CODE_FEE_CEILING_INVALID = 88;
  // The trigger set a field that must be left unset.
  ERROR_CODE_UNSUPPORTED_FIELD_SET = 89;
  // The trigger could not fire again.
  ERROR_CODE_TRIGGER_FIRE_LIMIT_REACHED = 90;
  // The trigger's condition flags were not valid.
  ERROR_CODE_CONDITION_FLAGS_INVALID = 91;
  // The trigger set a condition parameter its condition does not take.
  ERROR_CODE_CONDITION_PARAMETER_SET = 92;
  // The market had no room for another TWAP order.
  ERROR_CODE_TWAP_CAPACITY_REACHED = 93;
  // The trigger's child order did not match the order the trigger requested,
  // so the trigger failed and the child order was canceled.
  ERROR_CODE_CHILD_ORDER_INCONSISTENT = 94;
  // A non-empty resource ID in the REST request body differs from the path ID.
  // Nothing changed. Use the same ID in both places, or omit the body ID.
  ERROR_CODE_PATH_BODY_ID_MISMATCH = 95;
  // The request's receive window ended before it was sent on for admission:
  // the request was not processed and changed nothing. The window is the
  // request's timestamp plus its receive window: the X-API-RECV-WINDOW header
  // of a signed request, or recv_window_ms of a WebSocket command. Send a new
  // request with a fresh timestamp.
  ERROR_CODE_REQUEST_DEADLINE_EXCEEDED = 308;
  // A display quantity was set on an order that cannot be an iceberg order.
  // Only good-till-cancelled and good-till-date limit orders without attached
  // take-profit, stop-loss or trailing stop orders can be iceberg orders.
  // Nothing changed.
  ERROR_CODE_ICEBERG_NOT_ALLOWED = 309;
  // The iceberg display quantity is below the pair's minimum order quantity,
  // or splits the order's quantity into more than 100 parts: it must be at
  // least the order's quantity divided by 100, rounded up. Nothing changed.
  ERROR_CODE_ICEBERG_DISPLAY_TOO_SMALL = 310;
  // The iceberg display quantity is not below the order's quantity, or is not
  // a multiple of the pair's quantity step. Nothing changed.
  ERROR_CODE_ICEBERG_DISPLAY_INVALID = 311;
  // Resolved peg exceeds its buy cap or falls below its sell floor.
  ERROR_CODE_PEG_LIMIT_VIOLATION = 312;
  // Selected entry-peg book side has no live quote.
  ERROR_CODE_PEG_REFERENCE_UNAVAILABLE = 313;
  // Entry peg has an invalid reference or unsupported combination.
  ERROR_CODE_INVALID_PEG = 314;
  // ModifyTrigger attempted to set a new or different nonzero activation
  // price after the trailing stop started tracking. Nothing changed: the
  // existing peak or trough and trigger price keep protecting the position.
  // Clearing activation with zero and repeating the current activation price
  // remain valid. To wait for a new activation price, cancel the trigger and
  // create a new one.
  ERROR_CODE_TRIGGER_ACTIVATION_PRICE_NOT_MODIFIABLE = 315;
  // The OCO's client list ID is empty, longer than 36 characters, or has a
  // character other than a letter, digit, period, underscore, colon, slash or
  // hyphen. Answered by CreateOco and by the ListTriggers client_list_id
  // filter. Nothing changed.
  ERROR_CODE_CLIENT_LIST_ID_INVALID = 318;
  // An admitted item of a batch replace had not applied 2 seconds after its
  // admission, so it was refused when it applied. Nothing changed: the item
  // left the order as it was, and a replacement's successor never exists.
  // Send a new batch with the current quote.
  ERROR_CODE_MODIFY_APPLY_EXPIRED = 319;
}

// FieldViolation describes one actionable request validation failure.
message FieldViolation {
  // Protobuf field path, using canonical field names, relative to the message
  // the error answers. An error that refuses a whole request names the field
  // in that request, a batch item's field under its index (items[i]). A batch
  // item's own result answers that item alone and names the field in the
  // item, without its index. A BatchCreateOrders item's rejection
  // (BatchCreateRejected) names it as a CreateOrderRequest carrying the item
  // would, under order, for example
  // order.attached_risk.take_profit.trigger_price_ticks; the item is the
  // result's position in the response. A BatchReplaceOrders item's error
  // (BatchReplaceAdmissionItem) names it as the request item does, for
  // example new_attached_risk.stop_loss or order_id; the item is the result's
  // item_index. REST names the same fields by REST field names: a
  // BatchCreateOrders item's as a REST create carrying it would, for example
  // order.attachedRisk.takeProfit.triggerPrice, and a BatchReplaceOrders
  // item's as the REST request item does, for example newPrice.
  string field_path = 1;
  // Stable validation rule identifier suitable for programmatic matching.
  string rule_id = 2;
  // Human-readable explanation of the violation.
  string message = 3;
}

// ErrorDetail is attached to ConnectRPC errors for structured error handling.
// Clients can inspect this to get a stable machine-readable error code.
message ErrorDetail {
  // Stable error code matching the REST problem+json "code" field.
  ErrorCode code = 1;
  // Field-level validation failures. Empty for non-validation domain errors.
  repeated FieldViolation violations = 2;
  // Structured quota state. Present only for rate-limit rejections.
  polyester.ratelimit.v1.RateLimitDetail rate_limit = 3;
  // Public order ID holding this account's client order ID when a create is
  // rejected with CONFLICT_DUPLICATE_CLIENT_ORDER_ID. Present only when an
  // existing holder is known; omitted for duplicates rejected within the same
  // batch before an order is assigned. Use GetOrder to obtain its current state.
  optional fixed64 existing_order_id = 4;
  // Why the refused order of a ladder can't be placed, when a trigger create
  // is rejected with LADDER_LEVEL_REJECTED: the code that order would return
  // as a single order, for example MAX_OPEN_ORDERS_PER_PAIR. Unspecified for
  // every other error.
  ErrorCode cause_code = 8;
  // The refused order of a ladder, when a trigger create is rejected with
  // LADDER_LEVEL_REJECTED: its zero-based index among the ladder's orders, the
  // i of the violation's trigger.strategy.ladder.levels[i], so 0 is the first
  // order. Omitted for every other error.
  optional uint32 level_index = 9;
  // The price band limit the order's limit price is past, when a preview is
  // not admissible with PRICE_BAND_VIOLATION: the highest admitted buy price
  // for a buy, the lowest admitted sell price for a sell, as the market last
  // published its band. REST returns priceBandLimit as a decimal string in
  // quote asset units per base asset unit, for example "1837.5". Protobuf
  // uses quote units scaled by 1e9. Omitted for every other error.
  optional int64 price_band_limit_ticks = 10;
}

// =============================================================================
// Trigger System: Risk Controls + Conditional Orders
// =============================================================================

// TriggerPriceSource defines which price a trigger watches. Standalone
// stop-loss, take-profit and trailing-stop triggers watch LAST_PRICE unless
// INDEX_PRICE is requested; MARK_PRICE is not supported on spot markets.
enum TriggerPriceSource {
  // Trigger price source was not provided; spot triggers default to LAST_PRICE.
  TRIGGER_PRICE_SOURCE_UNSPECIFIED = 0;
  // Last traded price on the market (default for spot).
  LAST_PRICE = 1;
  // The market's index price, aggregated from external exchanges. A trigger
  // that watches it acts only on a current index value: while the index is
  // stale or unavailable the trigger stays armed and waits, and never fires on
  // an outdated value.
  INDEX_PRICE = 2;
  // Mark price for perpetuals; not supported on spot markets.
  MARK_PRICE = 3;
}

// TriggerDirection defines whether the trigger fires when price goes above or
// below threshold.
enum TriggerDirection {
  // Trigger direction was not provided.
  TRIGGER_DIRECTION_UNSPECIFIED = 0;
  // Fire when price >= trigger_price (e.g., take-profit for long, stop-loss for
  // short).
  ABOVE = 1;
  // Fire when price <= trigger_price (e.g., stop-loss for long, take-profit for
  // short).
  BELOW = 2;
}

// RiskMarketIoc configures an attached risk leg that submits a market child
// with implicit immediate-or-cancel behavior. It takes no max-slippage cap:
// the child always uses the pair's default market slippage for its side, or
// 200 basis points if no positive default is configured. A cap cannot be
// added later either: ModifyTrigger with max_slippage on a take-profit or
// stop-loss leg that uses it is rejected with
// ERROR_CODE_TRIGGER_NOT_MODIFIABLE and leaves the leg unchanged, while its
// trigger price remains modifiable.
message RiskMarketIoc {}

// RiskLimitGtc configures an attached risk leg that submits a resting limit
// child. Attached risk legs do not support post-only.
message RiskLimitGtc {
  // Positive limit price in quote units scaled by 1e9.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
}

// RiskExecution selects the child execution supported by attached take-profit
// and stop-loss policies.
message RiskExecution {
  // Required child execution: exactly one variant.
  oneof execution {
    option (buf.validate.oneof).required = true;
    // Market child with implicit IOC behavior.
    RiskMarketIoc market_ioc = 1;
    // Resting GTC limit child.
    RiskLimitGtc limit_gtc = 2;
  }
}

// TakeProfitPolicy defines a take-profit attached to an order. It watches the
// last traded price or the index price (trigger_price_source), arms after the
// parent fills, and submits the selected child.
message TakeProfitPolicy {
  // Positive trigger price in quote units scaled by 1e9.
  int64 trigger_price_ticks = 1 [(buf.validate.field).int64.gt = 0];
  // Required child execution when the threshold is crossed.
  RiskExecution child = 2 [(buf.validate.field).required = true];
  // Price the take-profit watches. Unspecified or LAST_PRICE watches the last
  // traded price. INDEX_PRICE watches the market's index price; on a market
  // without an index price the order is rejected before any fill with
  // reject_reason ERROR_CODE_TRIGGER_PRICE_SOURCE_UNSUPPORTED, and a modify
  // that adds such a leg is refused with the same code, leaving the order and
  // its legs unchanged. MARK_PRICE is not supported. A modify naming
  // another source replaces the leg.
  TriggerPriceSource trigger_price_source = 3 [(buf.validate.field).enum.defined_only = true];
}

// StopLossPolicy defines a stop-loss attached to an order. It watches the last
// traded price or the index price (trigger_price_source), arms after the
// parent fills, and submits the selected child.
message StopLossPolicy {
  // Positive trigger price in quote units scaled by 1e9.
  int64 trigger_price_ticks = 1 [(buf.validate.field).int64.gt = 0];
  // Required child execution when the threshold is crossed.
  RiskExecution child = 2 [(buf.validate.field).required = true];
  // Price the stop-loss watches. Unspecified or LAST_PRICE watches the last
  // traded price. INDEX_PRICE watches the market's index price; on a market
  // without an index price the order is rejected before any fill with
  // reject_reason ERROR_CODE_TRIGGER_PRICE_SOURCE_UNSUPPORTED, and a modify
  // that adds such a leg is refused with the same code, leaving the order and
  // its legs unchanged. MARK_PRICE is not supported. A modify naming
  // another source replaces the leg.
  TriggerPriceSource trigger_price_source = 3 [(buf.validate.field).enum.defined_only = true];
}

// TrailingStopPolicy defines a trailing stop attached to an order.
// Tracks peak (for sell) or trough (for buy) and fires when price reverses by
// the distance.
message TrailingStopPolicy {
  // Trailing distance. Exactly one of these should be set.
  oneof trailing_distance {
    // Positive trailing distance as a price delta in 1e-9 quote-unit ticks.
    int64 trailing_distance_ticks = 1 [(buf.validate.field).int64.gt = 0];
    // Trailing distance in basis points (1 bp = 0.01%), from 1 to 10000.
    int32 trailing_distance_bps = 2 [(buf.validate.field).int32 = {
      gt: 0
      lte: 10000
    }];
  }
  // Optional slippage override for the trailing-stop child. When set, the
  // child uses an IOC limit bounded by this delta from the trigger price and,
  // for a buy, by limit_price_ticks. When omitted, a market child uses the
  // pair's default market slippage for its side, or 200 basis points if no
  // positive default is configured. A buy child remains bounded by
  // limit_price_ticks. Set at most one of these fields.
  oneof max_slippage {
    // Positive maximum absolute price delta in quote units scaled by 1e9. The
    // "ticks" in this name are 1e-9 quote units, not the pair's tick size,
    // and the value need not be a multiple of the pair's tick size: the
    // child's protection price, the price that fired it moved by this delta,
    // is put on the tick grid toward that price, as MarketIoc describes.
    int64 max_slippage_ticks = 6 [(buf.validate.field).int64.gt = 0];
    // Maximum allowed slippage in basis points (1 bp = 0.01%), from 1 to 9999
    // whichever side the exit trades. An order whose trailing stop sets 10000
    // is rejected with ERROR_CODE_MAX_SLIPPAGE_INVALID, because a 100% cap
    // would leave an exit that sells no positive price to sell at.
    int32 max_slippage_bps = 7 [(buf.validate.field).int32 = {
      gt: 0
      lte: 10000
    }];
  }
  // Optional activation price: trailing only starts after this price is
  // reached. If omitted, trailing starts immediately after the parent order
  // fills. Expressed in quote units scaled by 1e9.
  int64 activation_price_ticks = 3;
  // Price the trailing stop watches and trails: its peak or trough, activation
  // and fire all follow this price. Unspecified or LAST_PRICE watches the last
  // traded price. INDEX_PRICE watches the market's index price; on a market
  // without an index price the order is rejected before any fill with
  // reject_reason ERROR_CODE_TRIGGER_PRICE_SOURCE_UNSUPPORTED, and a modify
  // that adds such a leg is refused with the same code, leaving the order and
  // its legs unchanged. MARK_PRICE is not supported. A modify naming
  // another source replaces the leg.
  TriggerPriceSource trigger_price_source = 8 [(buf.validate.field).enum.defined_only = true];
  // Positive maximum price of a trailing stop that buys back, in quote units
  // scaled by 1e9: the most its exit pays per unit, at which the quote it may
  // spend is reserved with the exit's fee. Required when the parent order
  // sells, so the trailing stop buys; must be unset when the parent order
  // buys. A rise that fires above it still fires, and the exit fills only at
  // or below it. Changing it with ModifyOrder replaces the leg.
  int64 limit_price_ticks = 4 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// RiskPolicy defines optional risk controls (take-profit, stop-loss or
// trailing stop) attached to an order. The legs protect the parent order's
// filled position: they arm as the parent fills and follow its later fills.
// A buy sized by max_quote_debit_scaled has no fixed quantity: its legs
// protect what its fills buy. When the order is created, each leg's exit is
// checked against the pair's minimums at the quantity the whole amount buys
// at the order's limit price, or a market order's maximum slippage price:
// the least it buys if it spends the amount.
//
// Each leg's exit must be able to meet the pair's minimum quantity, step size
// and minimum notional for the parent's whole quantity, valued where it would
// execute: a buy-back at its maximum price (a market exit's slippage bound
// above its trigger price, a limit exit's limit price, a trailing stop's limit
// price), a market sell exit at its slippage bound below its trigger price, a
// limit sell exit at its limit price, and a trailing sell exit by its quantity
// alone. An order, or a ModifyOrder, whose leg could never meet them is
// rejected with that check's code (ERROR_CODE_MIN_QTY,
// ERROR_CODE_QTY_STEP_SIZE or ERROR_CODE_MIN_NOTIONAL), as for the order
// itself, and its ErrorDetail names the leg with a field violation on its
// attached-risk field (take_profit, stop_loss or trailing_stop) whose rule is
// that code. Nothing is placed or changed.
//
// A buy's take-profit trigger price must be above its parent's price and its
// stop-loss trigger price below it, so the take-profit is above the stop-loss;
// a sell's the other way round. The parent's price is a limit order's limit
// price, or for a market order the best price it takes (the best ask for a
// buy, the best bid for a sell), against which only a leg on the last price
// is checked. A leg at or past that price is rejected with
// ERROR_CODE_TRIGGER_PRICE_INVALID for a limit order and
// ERROR_CODE_TRIGGER_WOULD_TRIGGER_IMMEDIATELY for a market order, and its
// ErrorDetail names the leg with a field violation on its trigger price (for
// example order.attached_risk.take_profit.trigger_price_ticks) whose rule is
// that code and whose message states the order the prices must take for the
// order's side. When both legs are past it, the take-profit is named. A
// ModifyOrder's new_attached_risk is checked against the order's price the
// same way; its message states the order for both sides. Nothing is placed
// or changed.
//
// The legs of one parent share that position, whether or not oco is set, and
// only one exit works at a time. The first leg whose condition is met submits
// an exit for the whole remaining position, rounded down to the pair's step
// size; a remainder below one step stays in the balance. If another leg's
// condition is met while that exit works, the working exit is canceled; once
// it ends, that leg is checked again against the latest price it watches and,
// if its condition still holds, exits what remains. After an exit ends, the legs keep
// protecting whatever position remains, unless you canceled the exit: canceling
// a leg's exit order, alone or with a cancel-all, ends that leg, and with oco
// set the other leg too. Canceling a leg itself with CancelTrigger ends only
// that leg, whether or not oco is set, and the other leg stays active.
//
// The legs end once the parent order is terminal and no position they can
// exit remains: the leg whose exit ended last completes, and the others are
// canceled with TRIGGER_CANCEL_REASON_OCO. If the parent order ends without a
// fill, the legs are canceled with
// TRIGGER_CANCEL_REASON_PARENT_CANCELED_NO_FILL. If no exit ran and the
// parent's whole fill is below one step, the legs fail.
//
// The legs reserve what their exits would sell or spend, once for both legs:
// the base a sell exit sells, as each parent fill settles, and the quote a
// buy-back may spend at its legs' highest maximum price. A buy-back is
// reserved from the order's creation for the part of that cost the sale
// itself may not return, so an order whose balance cannot cover it is
// rejected with ERROR_CODE_INSUFFICIENT_FUNDS. The reserve shows in the
// balance's reserved amount, and an exit uses it when it is submitted. While
// the legs protect a position, orders and withdrawals that would use the
// reserved funds are rejected with ERROR_CODE_INSUFFICIENT_FUNDS: reduce or
// cancel the legs first. What the legs no longer need is released as they
// change and in full when they end.
message RiskPolicy {
  option (buf.validate.message).cel = {
    id: "risk_policy.oco_requires_tp_and_one_stop"
    message: "oco requires take_profit and exactly one stop leg (stop_loss or trailing_stop)"
    expression: "!this.oco || (has(this.take_profit) && (has(this.stop_loss) != has(this.trailing_stop)))"
  };

  // Optional take-profit configuration.
  TakeProfitPolicy take_profit = 1;

  // At most one stop leg can be configured for attached risk.
  oneof stop_leg {
    // Optional stop-loss configuration.
    StopLossPolicy stop_loss = 2;
    // Optional trailing stop configuration.
    TrailingStopPolicy trailing_stop = 3;
  }

  // If true, the take-profit and the configured stop leg (stop-loss or
  // trailing stop) are linked and shown as one-cancels-the-other. Requires a
  // take-profit and exactly one stop leg. The legs of every parent share one
  // position and end together as described on RiskPolicy, so this setting
  // does not change when exits are submitted. It decides only what canceling
  // a leg's exit order ends: with oco set, canceling one leg's exit ends both
  // legs; without it, only that leg ends and the other keeps protecting the
  // remaining position. Canceling a leg itself with CancelTrigger ends only
  // that leg either way, and the other leg stays active. Changing only this
  // setting with ModifyOrder keeps the existing legs, with their IDs, arming
  // and a trailing stop's tracked peak; changing a leg's terms, such as its
  // trigger price, limit price or trailing distance, still replaces that leg.
  // Default is false.
  bool oco = 4;
}

// ModifyBehavior controls how ModifyOrder should handle amend-vs-replace paths.
// MODIFY_BEHAVIOR_UNSPECIFIED is treated as AMEND_OR_REPLACE by server logic.
//
// An amend keeps the order in place, under the same order ID and with its
// queue priority kept; a replace ends it and creates a successor under a new
// order ID, with its queue priority reset. Either way, a new total quantity at
// or below the order's filled quantity when the change applies, fills after
// the request was sent included, ends the order at its filled quantity
// (CANCEL_REASON_QTY_AT_OR_BELOW_FILLED) with no successor, and ModifyOrder
// answers AMENDED with the order's ID rather than an error.
//
// Order the states of one order ID by version (Order.version), keeping the
// highest applied. A terminal status is final: no later state of that order ID
// is open. Price and quantity order only two open states of one GTC or GTD
// limit order at version 1 or above: its price stays the same and its total
// quantity never rises, so the state with the larger total quantity is the
// older.
enum ModifyBehavior {
  // Behavior was not provided; server treats this as AMEND_OR_REPLACE.
  MODIFY_BEHAVIOR_UNSPECIFIED = 0;
  // Replace the order when the patch sets a price other than the order's, a
  // total quantity above the order's total quantity, or a client order ID
  // other than the order's; otherwise amend it in place.
  AMEND_OR_REPLACE = 1;
  // Amend the order in place when AMEND_OR_REPLACE would amend it; reject
  // with MODIFICATION_REQUIRES_REPLACE a patch that AMEND_OR_REPLACE would
  // replace. Other checks can reject the patch first with their own codes.
  AMEND_ONLY = 2;
  // Replace the order, even when the patch changes no value.
  REPLACE_ONLY = 3;
}

// ModifyActionTaken describes what action was applied for a modify request.
enum ModifyActionTaken {
  // Modify action is unknown or the request was rejected.
  MODIFY_ACTION_UNSPECIFIED = 0;
  // Existing order was amended in place.
  AMENDED = 1;
  // Existing order was canceled and replaced with a new order.
  REPLACED = 2;
}

// BatchReplaceAdmissionStatus summarizes admission of one quote-refresh batch.
enum BatchReplaceAdmissionStatus {
  // Admission status is unavailable.
  BATCH_REPLACE_ADMISSION_STATUS_UNSPECIFIED = 0;
  // Every requested operation was admitted, amended items included.
  BATCH_REPLACE_ADMISSION_STATUS_ADMITTED = 1;
  // Some requested replacements were admitted and others were rejected.
  BATCH_REPLACE_ADMISSION_STATUS_PARTIALLY_ADMITTED = 2;
  // No requested replacement was admitted.
  BATCH_REPLACE_ADMISSION_STATUS_REJECTED = 3;
}

// BatchReplaceItemAdmissionStatus describes admission of one replacement.
enum BatchReplaceItemAdmissionStatus {
  // Item admission status is unavailable.
  BATCH_REPLACE_ITEM_ADMISSION_STATUS_UNSPECIFIED = 0;
  // The operation was admitted and handed to execution. action_taken tells whether
  // the order was amended under its own order ID or replaced by a successor.
  BATCH_REPLACE_ITEM_ADMISSION_STATUS_ADMITTED = 1;
  // The replacement was rejected before execution handoff.
  BATCH_REPLACE_ITEM_ADMISSION_STATUS_REJECTED = 2;
}

// =============================================================================
// CancelAllOrders: filter-based mass cancel (kill switch / safety)
// =============================================================================

// CancelAllOrdersRequest cancels all matching open orders for an account,
// and with `include_triggers` its matching triggers too: see CancelAllOrders
// for what happens to stop-loss, take-profit and trailing stops, TWAPs,
// ladders and attached legs without it. To cancel triggers without
// canceling orders, use triggers.v1.TriggersService.CancelAllTriggers.
message CancelAllOrdersRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Optional trading-pair IDs from GetSpotConfig. Empty matches all symbols.
  // At most 100 positive IDs; duplicates are ignored and ordering is immaterial.
  repeated uint32 symbol_ids = 2 [(buf.validate.field).repeated = {
    max_items: 100
    items: {uint32: {gt: 0}}
  }];
  // Side filter. When set, only orders on this side are canceled.
  Side side = 3 [(buf.validate.field).enum.defined_only = true];
  // If true, return matched counts without actually canceling.
  bool dry_run = 4;
  // Idempotency key (required). Reuse the same key and criteria for retries.
  // Completed results are retained for at least two minutes. Use a fresh key
  // for a new cancellation; do not reuse a key after its replay window.
  // 1 to 64 ASCII characters using letters, digits, period, underscore, colon,
  // slash, or hyphen.
  string request_id = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
  ];
  // If true, also stops the account's triggers in the same scope: every
  // stop-loss, take-profit, trailing stop, TWAP, ladder, standalone OCO (both
  // its legs) and attached take-profit, stop-loss or trailing leg on the
  // matched symbols whose orders trade on the side filter, created before the
  // request was accepted. Each ends canceled with reason
  // `TRIGGER_CANCEL_REASON_CANCEL_ALL` and releases its reserved funds, its
  // open orders are canceled with the others, and none places an order after
  // the response. Defaults to false: only orders are canceled and triggers
  // keep running. Part of the criteria a retry must keep.
  bool include_triggers = 7;
}

// CancelledOrder identifies one order whose cancellation a cancel-all
// requested.
message CancelledOrder {
  // Order ID.
  fixed64 order_id = 1;
  // The order's client order ID; empty when the order has none.
  string client_order_id = 2;
}

// CancelAllOrdersResponse returns the result of a cancel-all operation.
// The response confirms that cancellation was requested for every matching
// order; each order's final state is reported on the order update stream and
// read paths.
message CancelAllOrdersResponse {
  // Cancel-all submission outcome.
  enum Status {
    // Cancel-all status was not provided.
    STATUS_UNSPECIFIED = 0;
    // Matching cancellation requests were submitted for processing.
    SUBMITTED = 1;
    // The request only counted matching orders and submitted no cancellations.
    DRY_RUN = 2;
  }

  // Availability of the order listing, separate from the submission outcome.
  enum ListingStatus {
    // Listing availability was not provided.
    LISTING_UNSPECIFIED = 0;
    // The initial response includes its listing, possibly empty, up to 200 orders.
    INCLUDED = 1;
    // A retry returns its original outcome and counts without the historical
    // listing. Read open orders for current state and use order updates for
    // final outcomes. No new cancellations are requested by the retry.
    NOT_RETAINED_READ_OPEN_ORDERS = 2;
  }

  // Cancel-all submission outcome.
  Status status = 1 [(buf.validate.field).enum.defined_only = true];
  // Number of open orders that matched the filter when the request was
  // accepted, including orders whose cancellation was already in progress
  // and open orders that triggers placed. Triggers themselves are never
  // counted. Orders placed after acceptance are not counted. Unless
  // `dry_run` is set, equals `submitted_cancels` plus `failed_cancels`.
  uint32 matched_orders = 2;
  // Number of matched orders for which cancellation was requested, including
  // orders whose cancellation was already in progress. Observe order updates or
  // reads for final outcomes; orders may execute before cancellation takes
  // effect. Zero when `dry_run` is set.
  uint32 submitted_cancels = 3;
  // Number of matched orders that could not be submitted for cancellation
  // because the cancel-all could not be recorded for their symbol. This
  // request does not cancel them; send a new cancel-all with a new
  // `request_id` if they are still open. Zero when `dry_run` is set.
  uint32 failed_cancels = 4;
  // Server timestamp.
  google.protobuf.Timestamp ts = 5;
  // Server timestamp as epoch nanoseconds (for bots).
  uint64 ts_ns = 6;
  // Orders whose cancellation was requested, oldest first (the order in
  // which they were created), at most 200. When more orders were canceled,
  // these are the 200 oldest and `truncated` is true; the order update stream
  // and read paths report every one. Empty when `dry_run` is set. Retrying
  // with the same `request_id` and criteria within 120 seconds returns the
  // original status, counts and timestamp, an empty list, and
  // `listing_status = NOT_RETAINED_READ_OPEN_ORDERS`. It requests no new
  // cancellations. Read open orders for current state and use order updates
  // for final outcomes.
  repeated CancelledOrder cancelled_orders = 7 [(buf.validate.field).repeated.max_items = 200];
  // Number of orders whose cancellation was requested, including those not
  // listed in `cancelled_orders`. Equals `submitted_cancels`. Zero when
  // `dry_run` is set.
  uint32 total_cancelled = 8;
  // True when more orders were canceled than `cancelled_orders` lists.
  bool truncated = 9;
  // Availability of the historical listing. An empty retry listing does not
  // change the original counts or mean that no cancellations were requested.
  ListingStatus listing_status = 10 [(buf.validate.field).enum.defined_only = true];
  // With `include_triggers`, the number of the account's triggers that matched
  // the filters when the request was accepted, each stopped unless `dry_run`
  // is set. Zero without `include_triggers`.
  uint32 matched_triggers = 11;
}

// =============================================================================
// CancelAllAfter: dead-man switch heartbeat
// =============================================================================

// CancelAllAfterRequest arms/disables a dead-man switch for automatic cancel-all.
// When the switch fires, it cancels what a CancelAllOrders with the same
// scope cancels: open orders, and triggers only with `include_triggers`.
// See CancelAllAfter.
message CancelAllAfterRequest {
  option (buf.validate.message).cel = {
    id: "cancel_all_after.timeout_range"
    message: "timeout_sec must be 0 or between 10 and 120"
    expression: "this.timeout_sec == 0u || (this.timeout_sec >= 10u && this.timeout_sec <= 120u)"
  };

  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Heartbeat timeout in seconds.
  // - 0 disables the dead-man switch for this account.
  // - 10..120 arms or refreshes the switch.
  uint32 timeout_sec = 2;
  // Optional symbol ID filter. When set, only orders on this symbol are
  // canceled on expiry. When zero, all symbols are canceled.
  uint32 symbol_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).uint32.gt = 0
  ];
  // Optional side filter for cancel-on-expiry.
  Side side = 4 [(buf.validate.field).enum.defined_only = true];
  // Idempotency/trace key from caller (required).
  // 1 to 64 ASCII characters using letters, digits, period, underscore, colon,
  // slash, or hyphen.
  string request_id = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
  ];
  // If true, the switch's expiry also stops the account's triggers in its
  // scope, as CancelAllOrders with `include_triggers` does: those created
  // before the expiry time, even when the expiry is processed later, and
  // none of them places an order once it is processed. A trigger created at
  // or after the expiry time is not stopped. Defaults to false: only orders
  // are canceled on expiry. Each arm or refresh sets it again; a disable
  // ignores it.
  bool include_triggers = 6;
}

// DeadManSwitchScope describes the recorded scope of an armed dead-man switch.
// Expiry cancels working orders in this scope, including orders that
// triggers placed. Unless the switch was armed with `include_triggers`, it
// cancels no trigger: armed stop-loss, take-profit and trailing stops and
// running TWAPs remain active and may create further orders after expiry.
// Cancel them with triggers.v1.TriggersService.CancelAllTriggers.
message DeadManSwitchScope {
  // Public ID of the account or sub-account whose orders are canceled.
  fixed64 account_id = 1;
  // Symbol ID whose orders are canceled. Zero or omitted means all symbols.
  uint32 symbol_id = 2;
  // Order side that is canceled. Not set means both sides; JSON and REST
  // responses then omit it.
  Side side = 3 [(buf.validate.field).enum.defined_only = true];
}

// CancelAllAfterResponse returns dead-man switch arming/disable status.
message CancelAllAfterResponse {
  // Dead-man switch state after applying the request.
  enum Status {
    // Dead-man switch status was not provided.
    STATUS_UNSPECIFIED = 0;
    // The dead-man switch is armed or refreshed.
    ARMED = 1;
    // The dead-man switch is disabled.
    DISABLED = 2;
  }

  // Dead-man switch state after applying the request.
  Status status = 1 [(buf.validate.field).enum.defined_only = true];
  // Effective timeout in seconds (0 when disabled).
  uint32 effective_timeout_sec = 2;
  // Expiry timestamp in epoch nanoseconds (0 when disabled).
  uint64 expires_at_ts_ns = 3;
  // Server timestamp.
  google.protobuf.Timestamp ts = 4;
  // Server timestamp as epoch nanoseconds (for bots).
  uint64 ts_ns = 5;
  // Recorded scope after arming or refreshing. Absent when disabled.
  // Describes the current armed switch only. Cancellations already in progress
  // are unaffected by a later refresh or disable.
  DeadManSwitchScope effective_scope = 6;
}

// =============================================================================
// BatchCreateOrders: best-effort batch order placement
// =============================================================================

// BatchCreateAccepted contains the assigned identifiers for an admitted item.
message BatchCreateAccepted {
  // Assigned order ID.
  fixed64 order_id = 1;
  // Trigger ID for attached take-profit (when accepted and configured).
  optional uint64 take_profit_trigger_id = 2;
  // Trigger ID for attached stop-loss (when accepted and configured).
  optional uint64 stop_loss_trigger_id = 3;
  // Trigger ID for attached trailing stop (when accepted and configured).
  optional uint64 trailing_stop_trigger_id = 4;
  // Gross base quantity admission resolved, scaled by the pair's
  // base_quantity_scale from GetSpotConfig. For base_qty_scaled sizing, the
  // order's quantity. For quote sizing (max_quote_debit_scaled BUY or
  // quote_proceeds_scaled SELL), the quantity the quote amount buys or sells at
  // the order's limit price, or a market order's protection price: a BUY can
  // fill more at better prices, or less when the book runs out, and a SELL sells
  // at most this. The executed quantity is the order's cumulative filled
  // quantity (cum_qty_scaled in GetOrder) or the sum of its fills
  // (GetUserTrades, or the fills of its private order events).
  int64 resolved_base_qty_scaled = 5;
  // Submitted hard all-in quote debit limit, scaled by the pair's
  // quote_quantity_scale from GetSpotConfig. Present only when submitted.
  optional int64 submitted_max_quote_debit_scaled = 6;
  // Submitted quote proceeds target, scaled by the pair's
  // quote_quantity_scale from GetSpotConfig. Present only when submitted.
  optional int64 submitted_quote_proceeds_scaled = 7;
}

// BatchCreateRejected contains the typed reason an item was not admitted.
message BatchCreateRejected {
  // Structured rejection detail. Its violations name the item's fields as a
  // CreateOrderRequest carrying the item would, under order (for example
  // order.limit_gtc.price_ticks), not under items; the item is this result's
  // position in the response. REST names them as a REST create carrying the
  // item would (for example order.limitGtc.price).
  ErrorDetail error = 1 [(buf.validate.field).required = true];
}

// BatchCreateResultItem contains exactly one per-item batch outcome.
message BatchCreateResultItem {
  // Echoed client order ID.
  string client_order_id = 1;
  // Accepted or rejected outcome.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // Item was admitted.
    BatchCreateAccepted accepted = 2;
    // Item was rejected before admission.
    BatchCreateRejected rejected = 3;
  }
}

// BatchCreateOrdersRequest places multiple orders in one request. A request can
// be refused as a whole before admission, admitting nothing: for example an
// invalid request_id or number of items, an item whose fields cannot be decoded
// over REST (a malformed decimal, or more than one execution or sizing field),
// or a failed authentication, permission or receive-window check. Once a
// request reaches admission, each item is admitted or rejected on its own,
// never all-or-nothing: a rejected item does not stop the other items from
// being admitted.
message BatchCreateOrdersRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Required account-scoped idempotency key for the entire ordered batch.
  // Reusing it with the same payload within 15 minutes returns each decided
  // item's original result and result time, and retries the items still
  // unresolved, never admitting an already admitted item again. Reusing it
  // with a different payload during that window returns
  // CONFLICT_IDEMPOTENCY_KEY_REUSE. After 15 minutes the ID is free: a repeat
  // is a new request and can place its orders again, so read the items back
  // instead of repeating an older batch.
  // 1 to 64 ASCII characters using letters, digits, period, underscore, colon,
  // slash, or hyphen.
  string request_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
  ];
  // Orders to create, 1 to 20. client_order_id is optional per item. For a new
  // request_id, a reused client_order_id rejects only that item with
  // CONFLICT_DUPLICATE_CLIENT_ORDER_ID; other valid items continue.
  repeated OrderIntent items = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
  }];
}

// BatchCreateOrdersResponse returns per-item results for a batch create.
message BatchCreateOrdersResponse {
  // Per-item results in same order as request.
  repeated BatchCreateResultItem results = 1;
  // Number of requested orders that were accepted.
  uint32 accepted_count = 2;
  // Number of requested orders that were rejected.
  uint32 rejected_count = 3;
  // Server timestamp.
  google.protobuf.Timestamp ts = 4;
  // Server timestamp as epoch nanoseconds (for bots).
  uint64 ts_ns = 5;
}

// =============================================================================
// BatchCancelOrders: explicit-ID batch cancel (bot control loop)
// =============================================================================

// ModifyOrderRequest updates an existing order using policy-driven amend/replace behavior.
message ModifyOrderRequest {
  // At least one patch field must be provided.
  option (buf.validate.message).cel = {
    id: "modify_order.patch_required"
    message: "at least one of new_price_ticks, new_qty_scaled, or new_attached_risk must be set"
    expression: "has(this.new_price_ticks) || has(this.new_qty_scaled) || has(this.new_attached_risk)"
  };

  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Target key: exactly one of order_id or client_order_id is required.
  oneof key {
    option (buf.validate.oneof).required = true;
    // Public order ID.
    fixed64 order_id = 2 [(buf.validate.field).fixed64.gt = 0];
    // Client order ID to resolve within the caller account: 1 to 36 ASCII
    // characters using letters, digits, period, underscore, colon, slash, or
    // hyphen.
    string client_order_id = 3 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 36,
      (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
    ];
  }
  // Idempotency key (required). Outstanding modifications retain this key;
  // identical retries replay the final result for 60 seconds after the answer.
  // 1 to 64 ASCII characters using letters, digits, period, underscore, colon,
  // slash, or hyphen.
  string request_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
  ];

  // Patch fields (presence-based): set at least one of new_price_ticks,
  // new_qty_scaled or new_attached_risk.
  // Positive new limit price in quote units scaled by 1e9. Required for price
  // changes.
  optional int64 new_price_ticks = 5 [(buf.validate.field).int64.gt = 0];
  // Positive target total quantity after modify/replace, scaled by the
  // pair's base_quantity_scale from GetSpotConfig.
  optional int64 new_qty_scaled = 6 [(buf.validate.field).int64.gt = 0];
  // Replacement attached-risk policy for the order. The order's change and its
  // take-profit, stop-loss and trailing legs apply together: either all of
  // them change, or the whole modify is refused and the order and its legs
  // stay as they were.
  RiskPolicy new_attached_risk = 7;

  // Modify behavior policy.
  // MODIFY_BEHAVIOR_UNSPECIFIED is treated as AMEND_OR_REPLACE.
  ModifyBehavior behavior = 8 [(buf.validate.field).enum.defined_only = true];
  // Optional new client order id when replace path is taken: at most 36 ASCII
  // characters using letters, digits, period, underscore, colon, slash, or
  // hyphen.
  string new_client_order_id = 9 [
    (buf.validate.field).string.max_len = 36,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Trading symbol numeric identifier. Required for API-key market policy and
  // must match the target order.
  uint32 symbol_id = 10 [
    (buf.validate.field).uint32.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

// ModifyOrderResponse returns deterministic modify outcome.
message ModifyOrderResponse {
  // Action applied; unspecified when rejected.
  ModifyActionTaken action_taken = 1;
  // Original order ID that was amended or replaced.
  fixed64 old_order_id = 2;
  // Final active order ID; same as old_order_id for amendments.
  fixed64 final_order_id = 3;
  // Error code if rejected.
  string code = 4;
  // Trigger ID for attached take-profit after modification, when configured.
  optional uint64 take_profit_trigger_id = 5;
  // Trigger ID for attached stop-loss after modification, when configured.
  optional uint64 stop_loss_trigger_id = 6;
  // Trigger ID for attached trailing stop after modification, when configured.
  optional uint64 trailing_stop_trigger_id = 7;
  // Server timestamp.
  google.protobuf.Timestamp ts = 8;
  // Server timestamp as epoch nanoseconds (for bots).
  uint64 ts_ns = 9;
}

// BatchReplaceOrderItem identifies one order to modify inside a quote-refresh
// batch. Each item follows ModifyOrder's default AMEND_OR_REPLACE rule: an item
// that keeps the order's price (new_price_ticks unset or equal to it), does not
// raise its total quantity and keeps its client order ID amends the order in
// place, under the same order ID and with its queue priority kept. A new
// price, a larger total quantity or a new client order ID replaces it with a
// successor order under a new order ID, with its queue priority reset. Either
// way, a new total quantity at or below the order's filled quantity when the
// item applies ends the order at its filled quantity with no successor (see
// ModifyBehavior). To force a replacement, use ModifyOrder with REPLACE_ONLY.
message BatchReplaceOrderItem {
  // At least one patch field must be provided.
  option (buf.validate.message).cel = {
    id: "batch_replace_item.patch_required"
    message: "at least one patch field must be set"
    expression: "has(this.new_price_ticks) || has(this.new_qty_scaled) || has(this.new_attached_risk)"
  };

  oneof key {
    option (buf.validate.oneof).required = true;
    // Public order ID. Exactly one of order_id or client_order_id.
    fixed64 order_id = 1 [(buf.validate.field).fixed64.gt = 0];
    // Client order ID: 1 to 36 ASCII characters using letters, digits,
    // period, underscore, colon, slash, or hyphen. Exactly one of order_id or
    // client_order_id.
    string client_order_id = 2 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 36,
      (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
    ];
  }

  // Patch fields (presence-based): set at least one of new_price_ticks,
  // new_qty_scaled or new_attached_risk.
  // Positive new limit price in quote units scaled by 1e9.
  optional int64 new_price_ticks = 3 [(buf.validate.field).int64.gt = 0];
  // Positive target total quantity after modify/replace, scaled by the
  // pair's base_quantity_scale from GetSpotConfig.
  optional int64 new_qty_scaled = 4 [(buf.validate.field).int64.gt = 0];
  // Replacement attached-risk policy for the order.
  RiskPolicy new_attached_risk = 5;

  // Optional client order ID for the successor. A value other than the order's
  // client order ID makes the item a replacement. At most 36 ASCII characters
  // using letters, digits, period, underscore, colon, slash, or hyphen.
  string new_client_order_id = 6 [
    (buf.validate.field).string.max_len = 36,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// BatchReplaceAdmissionItem contains the index-stable admission result for one item.
message BatchReplaceAdmissionItem {
  // Zero-based index in the request.
  uint32 item_index = 1;
  // Admission result for this item.
  BatchReplaceItemAdmissionStatus status = 2;
  // Original order targeted by the replacement: the requested order ID, or the
  // order the requested client order ID names. Rejected items keep it too. Unset
  // only when the requested client order ID names no order.
  fixed64 old_order_id = 3;
  // Assigned successor order ID, for a REPLACED item only. Unset for an AMENDED
  // item, whose order keeps old_order_id, and for rejected items. If the item
  // is refused when it applies, this successor never exists as an order.
  fixed64 replacement_order_id = 4;
  // Client order ID assigned to the successor, for a REPLACED item only.
  string client_order_id = 5;
  // Stable rejection code. Empty for admitted items.
  string code = 6;
  // Structured rejection details. Present for rate-limit guidance and other typed failures.
  // Its violations name this item's own fields, as the request item names
  // them, without its index (for example new_attached_risk.stop_loss or
  // order_id); the item is item_index. REST names them by the REST request
  // item's field names (for example newAttachedRisk.stopLoss).
  ErrorDetail error = 7;
  // REPLACED admits a successor under replacement_order_id, with queue priority
  // reset. AMENDED keeps the order under old_order_id with no successor: the
  // order is amended in place and keeps its queue priority, or, when the new
  // total quantity is at or below its filled quantity, ends at its filled
  // quantity. Keep tracking old_order_id for an AMENDED item. Not set for
  // rejected items; JSON and REST responses then omit it.
  ModifyActionTaken action_taken = 8;
}

// BatchReplaceOrdersRequest modifies same-symbol orders as one quote refresh:
// each item is amended in place or replaced as ModifyOrder decides by default.
// A request can be refused as a whole before admission, changing nothing: for
// example an invalid request_id or number of items, an item that names no
// order, supplies no patch field or breaks a field rule, or a failed
// authentication, permission or receive-window check. Once a request reaches
// admission, each item is admitted or rejected on its own.
// Identical retries replay the admission result for 60 seconds from acceptance;
// a different payload under the same key conflicts. Use a fresh key for a new batch.
// Read the batch's status with GetBatchReplaceStatus within the same window;
// after it, reconcile the individual orders and never resubmit an accepted batch.
// The response answers admission, before an admitted item's change completes.
// Until it completes, a later change of that order, an item of the next batch
// included, is rejected with a retryable code: ORDER_MODIFY_IN_PROGRESS when it
// names the order by client order ID, and ORDER_PLACEMENT_PENDING (or
// ORDER_MODIFY_IN_PROGRESS) when it names the replacement_order_id returned
// here. Resend only the rejected items, in a new batch under a fresh key, after
// a short backoff: the rejected batch's key keeps replaying its rejection, and
// admitted items must not be sent again.
// An admitted item that amends or replaces its order can still be refused when
// it applies: the item changes nothing, leaving the order as it was (at its old
// price, quantity and client order ID unless it had ended), and a refused
// replacement's successor never exists as an order. Such an item that has not applied 2 seconds after its admission is
// refused with ERROR_CODE_MODIFY_APPLY_EXPIRED, so none applies later than
// that. The trading WebSocket reports each such refusal with one
// BatchReplaceItemReject, which can arrive before this response. A refusal at
// admission is reported in this response alone, so the same code there means
// the item was never admitted. For 60 seconds from acceptance,
// GetBatchReplaceStatus reports a refused item as REJECTED, and GetOrder of a
// refused replacement's successor answers REJECTED with the same code, with no
// order terms: you know them from the batch you sent. After
// that window, a successor that is not found while the order it would have
// replaced is not CANCELED with CANCEL_REASON_REPLACED never becomes an order:
// the item was refused, or it applied by ending that order at its filled
// quantity, which that order's CANCEL_REASON_QTY_AT_OR_BELOW_FILLED shows
// unless a later change of yours ended it so.
message BatchReplaceOrdersRequest {
  // Prevent duplicate order targets in the same batch.
  option (buf.validate.message).cel = {
    id: "batch_replace_orders.unique_targets"
    message: "each item target must be unique within a batch"
    expression: "this.items.map(i, i.order_id > 0u ? \"o:\" + string(i.order_id) : \"c:\" + i.client_order_id).unique()"
  };
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Trading symbol shared by every replacement. An item whose order is on
  // another symbol is refused alone as an unknown order.
  uint32 symbol_id = 2 [(buf.validate.field).uint32.gt = 0];
  // Client idempotency key (required).
  // 1 to 64 ASCII characters using letters, digits, period, underscore, colon,
  // slash, or hyphen.
  string request_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
  ];
  // Replacement items, 1 to 50, each targeting a different order.
  repeated BatchReplaceOrderItem items = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

// BatchReplaceOrdersResponse is the durable admission receipt for a batch.
message BatchReplaceOrdersResponse {
  // Server-issued opaque identity used for status and private realtime correlation.
  fixed64 batch_request_id = 1;
  // Aggregate admission status.
  BatchReplaceAdmissionStatus status = 2;
  // Per-item admission results in request order.
  repeated BatchReplaceAdmissionItem results = 3;
  // Number of items admitted and handed to execution.
  uint32 accepted_count = 4;
  // Number of items rejected before execution handoff.
  uint32 rejected_count = 5;
  // Server acceptance timestamp.
  google.protobuf.Timestamp accepted_ts = 6;
  // Server acceptance timestamp as epoch nanoseconds.
  uint64 accepted_ts_ns = 7;
}

// BatchCancelItem identifies a single order to cancel within a batch.
message BatchCancelItem {
  // Exactly one of order_id or client_order_id must be set.
  option (buf.validate.message).cel = {
    id: "batch_cancel_item.key_required"
    message: "exactly one of order_id or client_order_id must be set"
    expression: "(this.order_id > 0u) != (this.client_order_id != \"\")"
  };

  // Public order ID. Exactly one of order_id or client_order_id.
  fixed64 order_id = 1 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // Client order ID: 1 to 36 ASCII characters using letters, digits, period,
  // underscore, colon, slash, or hyphen. Exactly one of order_id or
  // client_order_id.
  string client_order_id = 2 [
    (buf.validate.field).string.max_len = 36,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]*$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Optional trading symbol numeric identifier. When set, it must match the
  // order's symbol, or the item is refused as an unknown order. When omitted,
  // the order's own symbol is used.
  uint32 symbol_id = 3;
}

// BatchCancelResultItem contains the per-item result of a batch cancel.
message BatchCancelResultItem {
  // Per-item cancellation outcome.
  enum Status {
    // Batch cancellation outcome was not provided.
    STATUS_UNSPECIFIED = 0;
    // The cancellation request was accepted for processing.
    ACCEPTED = 1;
    // The cancellation request was rejected.
    REJECTED = 2;
  }

  // Per-item cancellation outcome.
  Status status = 1 [(buf.validate.field).enum.defined_only = true];
  // Resolved order ID (populated on accept).
  fixed64 order_id = 2;
  // Echoed client order ID (when provided).
  string client_order_id = 3;
  // Error code if rejected.
  string code = 4;
  // Structured rejection details. Present for rate-limit guidance and other typed failures.
  ErrorDetail error = 5;
}

// BatchCancelOrdersRequest cancels multiple orders by explicit ID. A request
// can be refused as a whole before admission, canceling nothing: for example an
// invalid request_id or number of items, an item that sets both order_id and
// client_order_id or neither, or a failed authentication, permission or
// receive-window check. Once a request reaches admission, each item's
// cancellation is accepted or rejected on its own.
message BatchCancelOrdersRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Idempotency key (required).
  // 1 to 64 ASCII characters using letters, digits, period, underscore, colon,
  // slash, or hyphen.
  string request_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
  ];
  // Orders to cancel, 1 to 50.
  repeated BatchCancelItem items = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

// BatchCancelOrdersResponse returns per-item results for a batch cancel.
message BatchCancelOrdersResponse {
  // Per-item results in same order as request.
  repeated BatchCancelResultItem results = 1;
  // Number of requested cancellations that were accepted.
  uint32 accepted_count = 2;
  // Number of requested cancellations that were rejected.
  uint32 rejected_count = 3;
  // Server timestamp.
  google.protobuf.Timestamp ts = 4;
  // Server timestamp as epoch nanoseconds (for bots).
  uint64 ts_ns = 5;
}

service OrdersService {
  option (polyester.api.docs_group) = "trading";

  // Check whether an order is currently admissible without creating an order,
  // claiming its client order ID, or reserving funds.
  rpc PreviewOrder(PreviewOrderRequest) returns (PreviewOrderResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Preview Order"
      description:
        "Check current order eligibility and available balance without creating an order "
        "or reservation. Returns resolved sizing and price protection when available."
      tags: "Orders Service"
    };
  }

  // Create a new order.
  // REST clients submit decimal quantity and price strings. ConnectRPC clients
  // submit scaled integer values.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Order"
      description:
        "Create a single order with side, type, quantity, and optional price fields. "
        "Supports optional client order IDs and attached risk instructions (take-profit, stop-loss, trailing stop)."
      tags: "Orders Service"
    };
  }

  // Cancels an existing order by id or client order id.
  // REST clients submit base58 order IDs. ConnectRPC clients submit fixed64
  // order IDs.
  // A cancel of an order that has already ended returns
  // ERROR_CODE_ORDER_ALREADY_TERMINAL, including a cancel retried after a
  // timeout once the order has ended: treat it as already done. A repeat
  // while an earlier cancel of the order is still in progress is accepted
  // again and changes nothing.
  // By client order ID, an ended order returns
  // ERROR_CODE_ORDER_ALREADY_TERMINAL for at least a minute after it ends;
  // later the client order ID may name no order, and the cancel returns
  // ERROR_CODE_ORDER_UNKNOWN.
  // By order ID, an ended order returns ERROR_CODE_ORDER_ALREADY_TERMINAL
  // while the exchange can still confirm that it placed an order under that
  // ID. After some exchange maintenance, such as a market listing or a
  // recovery, an order that ended before it can no longer be confirmed and
  // returns ERROR_CODE_ORDER_UNKNOWN, as an order ID that was never placed
  // does.
  // ERROR_CODE_ORDER_UNKNOWN therefore does not prove that an order never
  // existed. A client that knows the order ended, for example when retrying a
  // cancel that timed out, can treat it as done: an open order is never
  // reported unknown under its own order ID and symbol. Otherwise retry by
  // client order ID within its window, or read the order with
  // OrdersReadService.GetOrder to tell an ended order from one that was never
  // placed.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Cancel Order"
      description:
        "Cancel a single open order by order ID or client order ID. "
        "Supports optional subaccount and symbol scoping."
      tags: "Orders Service"
    };
  }

  // Cancels all matching open orders for an account (kill switch).
  // Unless dry_run is set, what it cancels is fixed when its request_id is
  // first admitted: every matching order of the account admitted before
  // that, from any interface, and none admitted after it. An order whose create, batch
  // create, modify or batch replace response arrived before this request was
  // sent was admitted before it and is covered, including an order not yet
  // reported open and an order that replaced an earlier one. Requests still
  // in flight when this request is sent, and requests whose outcome is
  // unknown, have no defined order with it: an order they create may be
  // admitted after it and stay open. Wait for their responses before sending
  // the cancel-all, or send another once they are answered.
  //
  // It requests cancellation of every covered order, however many match. The
  // response confirms admission, not completion, and lists up to 200 of them,
  // oldest first, with the total count. Each covered order eventually ends;
  // any still open when the cancellation applies is canceled. Final state is
  // confirmed via the order update stream or read path. A retry with the same
  // request_id returns the original outcome and covers no order admitted
  // after the original request. A rejected request, or one whose outcome is
  // unknown, is no barrier: orders sent before it may stay open, so retry it
  // or read open orders before relying on it.
  //
  // By default it cancels orders, not triggers; with `include_triggers` it
  // also stops the account's matching triggers (see the field). Open orders
  // that triggers placed match like any other order and are canceled: a TWAP's working slice, a
  // ladder's levels, the order a fired stop placed, and the working exit of
  // an attached take-profit, stop-loss or trailing stop. The triggers
  // themselves are not canceled, and their reserved funds stay reserved:
  // - A stop-loss, take-profit or trailing stop that has not fired stays
  //   armed and places its order when its condition is met.
  // - A TWAP keeps running and places its next slice when it is due.
  // - A ladder ends once none of its levels remains open: canceled when
  //   none of them filled, completed when any did.
  // - An attached leg whose working exit is canceled ends canceled, and so
  //   do the parent's other legs when oco is set. Attached legs without a
  //   working exit keep protecting the parent's filled position, even when
  //   the parent order itself is canceled; they end only if the parent is
  //   canceled before any fill.
  // - A paused trigger stays paused and can be resumed.
  //
  // To stop all automated trading in one request, set `include_triggers`:
  // every matching trigger ends canceled with reason
  // TRIGGER_CANCEL_REASON_CANCEL_ALL, none places an order after the
  // response, and `matched_triggers` counts them. To cancel triggers without
  // canceling orders, use triggers.v1.TriggersService.CancelAllTriggers.
  //
  // Every request counts 10 against the account's cancel rate limit,
  // however many orders it cancels: a dry run and a retry with the same
  // request_id count the same.
  rpc CancelAllOrders(CancelAllOrdersRequest) returns (CancelAllOrdersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Cancel All Orders"
      description:
        "Cancel all matching open orders for an account. "
        "Supports an optional list of symbols and a side filter plus dry-run preview. "
        "Returns up to 200 canceled order IDs, oldest first, with the total count. "
        "Unless it is a dry run, it covers every matching order admitted before its "
        "requestId was first admitted, from any interface, including orders not yet "
        "open and replacement orders: an order whose create or replace response "
        "arrived before the first request with this requestId was sent is covered, "
        "while requests still in flight or with an unknown outcome have no defined "
        "order with it. A retry with the same requestId keeps the original scope and "
        "covers no order admitted since; use a fresh requestId for a new cancellation. "
        "Each covered order eventually ends; any still open when the cancellation "
        "applies is canceled. "
        "It cancels open orders, including those that triggers placed (TWAP slices, "
        "ladder levels and exit orders). By default it does not cancel triggers: "
        "standalone stop-loss, take-profit and trailing triggers and TWAPs keep running "
        "and can place new orders; a ladder stops once its levels are canceled. An "
        "attached stop-loss, take-profit or trailing leg whose exit order is canceled "
        "ends, and so do the parent's other legs when oco is set, so the position loses "
        "that protection. Other attached legs keep protecting the parent's filled "
        "quantity; those of a parent canceled before any fill end with it. Set "
        "include_triggers to also stop every matching trigger, attached legs included, "
        "in the same request; matched_triggers counts them. Every request counts 10 "
        "against the cancel rate limit, however many orders it cancels, a dry run and "
        "a retry included."
      tags: "Orders Service"
    };
  }

  // Set cancel-all-after (dead-man switch).
  // Arms or disables automatic cancel-all if heartbeat is not refreshed before expiry.
  // When the switch fires, it cancels what CancelAllOrders with the same
  // symbol and side scope cancels: open orders, including those that
  // triggers placed, and, only with `include_triggers`, the matching
  // triggers. Without it, standalone stop-loss, take-profit and trailing
  // stops and running TWAPs stay active and can place new orders after it
  // fires, and attached legs end or keep protecting the position exactly
  // as after CancelAllOrders.
  rpc CancelAllAfter(CancelAllAfterRequest) returns (CancelAllAfterResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Cancel All After (Dead-Man Switch)"
      description:
        "Set or disable a dead-man switch timeout for automatic cancel-all. "
        "Supports optional symbol and side scope with idempotent heartbeat refresh. "
        "On expiry it cancels open orders in scope, including those that triggers placed "
        "(TWAP slices, ladder levels and exit orders). By default it does not cancel "
        "triggers: standalone stop-loss, take-profit and trailing triggers and TWAPs keep "
        "running and can place new orders; a ladder stops once its levels are canceled. "
        "An attached stop-loss, take-profit or trailing leg whose exit order is canceled "
        "ends, and so do the parent's other legs when oco is set, so the position loses "
        "that protection. Other attached legs keep protecting the parent's filled "
        "quantity; those of a parent canceled before any fill end with it. Set "
        "include_triggers to also stop every matching trigger, attached legs included, "
        "when the switch fires."
      tags: "Orders Service"
    };
  }

  // Places multiple orders in a single request. A request can be refused as a
  // whole before admission, admitting nothing: for example an invalid
  // request_id or number of items, an item whose fields cannot be decoded over
  // REST (a malformed decimal, or more than one execution or sizing field), or
  // a failed authentication, permission or receive-window check. Once a request
  // reaches admission, each item is admitted or rejected on its own, never
  // all-or-nothing: a rejected item does not stop the other items from being
  // admitted.
  rpc BatchCreateOrders(BatchCreateOrdersRequest) returns (BatchCreateOrdersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Batch Create Orders"
      description:
        "Create up to 20 orders in a single request with per-item results. "
        "Supports mixed symbols and attached risk payloads. "
        "A request can be refused as a whole before admission, admitting nothing: "
        "for example an invalid request ID or number of items, an item whose fields cannot be decoded over REST "
        "(a malformed decimal, or more than one execution or sizing field), "
        "or a failed authentication, permission or receive-window check. "
        "Once a request reaches admission, each item is admitted or rejected on its own, never all-or-nothing: "
        "a rejected item does not stop the other items from being admitted."
      tags: "Orders Service"
    };
  }

  // Modifies an existing order using explicit behavior policy.
  // A modify of an order that has already ended is refused with
  // ERROR_CODE_ORDER_ALREADY_TERMINAL; one naming no order is refused with
  // ERROR_CODE_ORDER_UNKNOWN. An ended order is told apart as for
  // CancelOrder: by client order ID it returns
  // ERROR_CODE_ORDER_ALREADY_TERMINAL for at least a minute after it ends; by
  // order ID it returns ERROR_CODE_ORDER_UNKNOWN once the exchange can no
  // longer confirm that it placed an order under that ID. Read the order with
  // OrdersReadService.GetOrder to tell the two apart.
  rpc ModifyOrder(ModifyOrderRequest) returns (ModifyOrderResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Modify Order"
      description:
        "Modify a single open order by order ID or client order ID. "
        "Supports amend-or-replace behavior policies, price and quantity updates, and attached risk updates."
      tags: "Orders Service"
    };
  }

  // Amends or replaces same-symbol orders and returns after authoritative
  // admission. A request can be refused as a whole before admission, changing
  // nothing: for example an invalid request_id or number of items, an item that
  // names no order, supplies no patch field or breaks a field rule, or a failed
  // authentication, permission or receive-window check. Once a request reaches
  // admission, each item is admitted or rejected on its own. An item naming an
  // ended order is refused with ERROR_CODE_ORDER_ALREADY_TERMINAL or
  // ERROR_CODE_ORDER_UNKNOWN as for ModifyOrder.
  rpc BatchReplaceOrders(BatchReplaceOrdersRequest) returns (BatchReplaceOrdersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Batch Replace Orders"
      description:
        "Modify up to 50 orders for one symbol as a quote refresh. "
        "Each item amends its order in place, keeping its order ID and queue priority, "
        "when it keeps the price, does not raise the total quantity and keeps the client order ID; "
        "otherwise it replaces the order with a successor under a new order ID. "
        "Returns an admission receipt for status and private realtime reconciliation. "
        "A request can be refused as a whole before admission, changing nothing: "
        "for example an invalid request ID or number of items, an item that names no order, supplies no patch field or breaks a field rule, "
        "or a failed authentication, permission or receive-window check. "
        "Once a request reaches admission, each item is admitted or rejected on its own."
      tags: "Orders Service"
    };
  }

  // Cancels multiple orders by explicit ID in a single request. A request can
  // be refused as a whole before admission, canceling nothing: for example an
  // invalid request_id or number of items, an item that sets both order_id and
  // client_order_id or neither, or a failed authentication, permission or
  // receive-window check. Once a request reaches admission, each item's
  // cancellation is accepted or rejected on its own. An item naming an
  // ended order is rejected with ERROR_CODE_ORDER_ALREADY_TERMINAL
  // or ERROR_CODE_ORDER_UNKNOWN as for CancelOrder.
  // Final state is confirmed via the order update stream or read path.
  rpc BatchCancelOrders(BatchCancelOrdersRequest) returns (BatchCancelOrdersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Batch Cancel Orders"
      description:
        "Cancel up to 50 orders by order ID or client order ID in one request. "
        "A request can be refused as a whole before admission, canceling nothing: "
        "for example an invalid request ID or number of items, an item that sets both identifiers or neither, "
        "or a failed authentication, permission or receive-window check. "
        "Once a request reaches admission, each item's cancellation is accepted or rejected on its own, "
        "with per-item results and aggregate counts."
      tags: "Orders Service"
    };
  }
}
