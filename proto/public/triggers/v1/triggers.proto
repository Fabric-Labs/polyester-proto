syntax = "proto3";

package triggers.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "orders/v1/orders.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/triggers/v1;triggersv1";
// Document-level OpenAPI metadata for Triggers API
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Triggers Service"
      description:
        "Public surface for managing standalone triggers (Stop "
        "orders, TWAP, Ladder)."
    }
  ]
};

// =============================================================================
// Trigger Types and Status
// =============================================================================

// TriggerType defines the category of standalone trigger.
enum TriggerType {
  // Trigger type was not provided.
  TRIGGER_TYPE_UNSPECIFIED = 0;
  // Stop-loss: fires when the price crosses a threshold.
  STOP_LOSS = 1;
  // Take-profit: fires when the price crosses a threshold.
  TAKE_PROFIT = 2;
  // Trailing stop: dynamic stop that trails price by a distance.
  TRAILING_STOP = 3;
  // TWAP: Time-Weighted Average Price execution over a duration.
  TWAP = 4;
  // Ladder/Scaled: Multiple orders placed across a price range.
  LADDER = 5;
}

// TriggerStatus represents the lifecycle state of a trigger.
enum TriggerStatus {
  // Trigger status was not provided.
  STATUS_UNSPECIFIED = 0;
  // Trigger was created and is pending activation.
  STATUS_CREATED = 1;
  // Trigger admitted and actively evaluating conditions.
  STATUS_ARMED = 2;
  // Trigger is actively executing (for example, TWAP slices in progress).
  STATUS_RUNNING = 3;
  // Trigger completed successfully (all child orders placed/filled).
  STATUS_COMPLETED = 4;
  // Trigger was canceled by user.
  STATUS_CANCELED = 5;
  // Trigger failed (for example, reservation failure, child order rejection).
  STATUS_FAILED = 6;
  // Trigger is paused (user-initiated, can be resumed).
  STATUS_PAUSED = 7;
}

// TriggerEventType defines append-only trigger lifecycle events for history.
enum TriggerEventType {
  // Trigger event type was not provided.
  EVENT_UNSPECIFIED = 0;
  // Trigger fired and may have created a child order.
  EVENT_FIRED = 1;
  // Trigger was canceled.
  EVENT_CANCELED = 2;
  // Trigger configuration or lifecycle state was updated.
  EVENT_UPDATED = 3;
}

// LadderDistribution defines how quantity is distributed across ladder levels.
enum LadderDistribution {
  // Ladder distribution was not provided.
  LADDER_DISTRIBUTION_UNSPECIFIED = 0;
  // Equal quantity at each level.
  LINEAR = 1;
  // More quantity toward the edges (U-shape).
  GEOMETRIC = 2;
  // More quantity at favorable prices.
  WEIGHTED_FAVORABLE = 3;
}

// =============================================================================
// Create Trigger Request/Response
// =============================================================================

// TriggerMarketIoc configures an immediate market child.
message TriggerMarketIoc {}

// TriggerLimitGtc configures a resting limit child.
message TriggerLimitGtc {
  // Limit price in quote units scaled by 1e6.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
  // Reject instead of taking liquidity.
  bool post_only = 2;
}

// TriggerLimitIoc configures an immediate-or-cancel limit child.
message TriggerLimitIoc {
  // Limit price in quote units scaled by 1e6.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
}

// TriggerLimitFok configures a fill-or-kill limit child.
message TriggerLimitFok {
  // Limit price in quote units scaled by 1e6.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
}

// ConditionalChildExecution selects the child submitted by a stop-loss or
// take-profit trigger. BUY market children are not supported in spot.
message ConditionalChildExecution {
  oneof execution {
    option (buf.validate.oneof).required = true;
    // Market child with implicit IOC behavior.
    TriggerMarketIoc market_ioc = 1;
    // Resting GTC limit child, optionally post-only.
    TriggerLimitGtc limit_gtc = 2;
    // Immediate-or-cancel limit child.
    TriggerLimitIoc limit_ioc = 3;
    // Fill-or-kill limit child.
    TriggerLimitFok limit_fok = 4;
  }
}

// ConditionalTrigger configures a standalone stop-loss or take-profit.
message ConditionalTrigger {
  option (buf.validate.message).cel = {
    id: "conditional_trigger.buy_requires_limit"
    message: "BUY stop-loss and take-profit triggers require a limit child"
    expression: "this.side != 1 || !has(this.child.market_ioc)"
  };

  // Trigger threshold in quote units scaled by 1e6.
  int64 trigger_price_ticks = 1 [(buf.validate.field).int64.gt = 0];
  // Child order side.
  orders.v1.Side side = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Child execution.
  ConditionalChildExecution child = 3 [(buf.validate.field).required = true];
}

// TrailingStopTrigger configures a spot trailing-stop strategy.
// Standalone triggers currently support SELL market-IOC children. Attached
// trailing stops may use either side, opposite their parent order.
message TrailingStopTrigger {
  // Required trailing distance.
  oneof trailing_distance {
    option (buf.validate.oneof).required = true;
    // Distance as a price delta in 1e-6 quote-unit ticks.
    int64 trailing_distance_ticks = 1 [(buf.validate.field).int64.gt = 0];
    // Distance in basis points (1 bp = 0.01%).
    int32 trailing_distance_bps = 2 [(buf.validate.field).int32 = {
      gt: 0
      lte: 10000
    }];
  }
  // Optional activation price in quote units scaled by 1e6.
  int64 activation_price_ticks = 3 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Optional protection applied when the market child fires.
  oneof max_slippage {
    // Maximum slippage as a price delta in 1e-6 quote-unit ticks.
    int32 max_slippage_ticks = 4 [(buf.validate.field).int32.gt = 0];
    // Maximum slippage in basis points (1 bp = 0.01%).
    int32 max_slippage_bps = 5 [(buf.validate.field).int32 = {
      gt: 0
      lte: 10000
    }];
  }
  // Child order side.
  orders.v1.Side side = 6 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// TwapMarketIoc configures server-priced market-IOC slices.
message TwapMarketIoc {}

// TwapLimitGtc configures one resting limit slice at a time. A previous open
// slice is canceled before the next interval.
message TwapLimitGtc {
  // Slice limit price in quote units scaled by 1e6.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
}

// TwapTrigger configures a proven TWAP execution mode.
message TwapTrigger {
  option (buf.validate.message).cel = {
    id: "twap_trigger.window"
    message: "slice_interval_ms must be between 100 and duration_ms"
    expression: "this.duration_ms >= 1000 && this.slice_interval_ms >= 100 && this.slice_interval_ms <= this.duration_ms"
  };

  // Child side.
  orders.v1.Side side = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Total execution duration in milliseconds.
  int64 duration_ms = 2;
  // Interval between slices in milliseconds.
  int64 slice_interval_ms = 3;
  // Proven slice execution behavior.
  oneof execution {
    option (buf.validate.oneof).required = true;
    // Server-priced market IOC slices.
    TwapMarketIoc market_ioc = 4;
    // Limit GTC slices with cancel-before-next behavior.
    TwapLimitGtc limit_gtc = 5;
  }
}

// LadderTrigger configures the supported LINEAR limit-GTC ladder. All levels
// are admitted immediately and may rest concurrently.
message LadderTrigger {
  option (buf.validate.message).cel = {
    id: "ladder_trigger.range"
    message: "price_max_ticks must be greater than price_min_ticks"
    expression: "this.price_max_ticks > this.price_min_ticks"
  };

  // Child side.
  orders.v1.Side side = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Minimum generated level price in quote units scaled by 1e6.
  int64 price_min_ticks = 2 [(buf.validate.field).int64.gt = 0];
  // Maximum generated level price in quote units scaled by 1e6.
  int64 price_max_ticks = 3 [(buf.validate.field).int64.gt = 0];
  // Number of linearly distributed levels.
  int32 levels = 4 [(buf.validate.field).int32 = {
    gte: 2
    lte: 100
  }];
  // Reject each level instead of taking liquidity.
  bool post_only = 5;
}

// TriggerIntent contains one standalone trigger's immutable configuration.
message TriggerIntent {
  // Symbol, for example "BTC-USDT".
  string symbol = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
  // Total quantity scaled by the pair's base_quantity_scale.
  int64 qty_scaled = 2 [
    (buf.validate.field).int64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  // Fee asset for BUY children. SELL children must use QUOTE.
  orders.v1.FeeAsset fee_asset = 3 [(buf.validate.field).enum.defined_only = true];
  // Child self-trade prevention mode. Defaults to EXPIRE_MAKER.
  orders.v1.SelfTradePreventionMode self_trade_prevention_mode = 4 [(buf.validate.field).enum.defined_only = true];
  // Client-provided trigger ID for idempotency.
  string client_trigger_id = 5 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
  // Required trigger strategy.
  oneof strategy {
    option (buf.validate.oneof).required = true;
    // Standalone stop-loss.
    ConditionalTrigger stop_loss = 10;
    // Standalone take-profit.
    ConditionalTrigger take_profit = 11;
    // SELL market-IOC trailing stop.
    TrailingStopTrigger trailing_stop = 12;
    // TWAP strategy.
    TwapTrigger twap = 13;
    // LINEAR limit-GTC ladder.
    LadderTrigger ladder = 14;
  }
}

// CreateTriggerRequest submits one standalone trigger intent for admission.
message CreateTriggerRequest {
  // Target sub-account. When omitted, uses the caller's root account.
  optional fixed64 subaccount_id = 1;
  // Trigger to admit.
  TriggerIntent trigger = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// CreateTriggerResponse acknowledges trigger creation only. Arming and child
// execution happen asynchronously and are visible through trigger reads/events.
message CreateTriggerResponse {
  // Assigned trigger ID.
  fixed64 trigger_id = 1;
  // Echoed client trigger ID.
  string client_trigger_id = 2;
  // Time creation admission completed.
  google.protobuf.Timestamp accepted_at = 3;
  // Admission completion time in nanoseconds since epoch (UTC).
  uint64 accepted_at_ts_ns = 4;
}

// =============================================================================
// Get Trigger
// =============================================================================

// GetTriggerRequest retrieves one trigger by ID.
message GetTriggerRequest {
  // Trigger ID to retrieve.
  fixed64 trigger_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional sub-account for authorization.
  optional fixed64 subaccount_id = 2;
}

// GetTriggerResponse returns the requested trigger.
message GetTriggerResponse {
  // Trigger state and configuration.
  Trigger trigger = 1;
}

// =============================================================================
// List Triggers
// =============================================================================

// ListTriggersRequest lists triggers for an account.
message ListTriggersRequest {
  // Optional sub-account to list triggers for. When empty or omitted, uses the
  // caller's root account.
  optional fixed64 subaccount_id = 1;
  // Optional filter by symbol.
  string symbol = 2;
  // Optional filter by status (can specify multiple).
  repeated TriggerStatus status = 3 [(buf.validate.field).repeated.items.enum.defined_only = true];
  // Optional filter by type.
  TriggerType trigger_type = 4 [(buf.validate.field).enum.defined_only = true];
  // Optional filter by attached parent order ID.
  optional fixed64 parent_order_id = 5;
  // Maximum number of triggers to return. Defaults to 100 when omitted;
  // maximum is 1000.
  uint32 limit = 10 [(buf.validate.field).uint32 = {
    lte: 1000
  }];
  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to the authenticated account, sub-account scope, filters, and newest
  // first sort order.
  string page_token = 12 [(buf.validate.field).string.max_len = 512];
}

// ListTriggersResponse returns triggers ordered newest-first.
message ListTriggersResponse {
  // Triggers ordered by creation time descending, then trigger ID descending.
  repeated Trigger triggers = 1;
  // Opaque cursor for the next page. Empty when no more results exist.
  string next_page_token = 3 [(buf.validate.field).string.max_len = 512];
}

// =============================================================================
// Trigger Events (History / Audit)
// =============================================================================

// ListTriggerEventsRequest lists historical events for one trigger.
message ListTriggerEventsRequest {
  // Trigger ID to list events for.
  fixed64 trigger_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional sub-account (authorization). When empty or omitted, uses the
  // caller's root account.
  optional fixed64 subaccount_id = 2;
  // Maximum number of events to return. Defaults to 100 when omitted; maximum
  // is 1000.
  uint32 limit = 3 [(buf.validate.field).uint32 = {
    lte: 1000
  }];
  // Optional event category filter. When unspecified, returns all event
  // categories. Use EVENT_FIRED to enumerate child-order actions.
  TriggerEventType event_type = 4 [(buf.validate.field).enum.defined_only = true];
  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to the authenticated account, trigger, sub-account scope, event
  // filter, and newest-first sort order.
  string page_token = 5 [(buf.validate.field).string.max_len = 512];
}

// TriggerEvent describes one historical trigger lifecycle event.
message TriggerEvent {
  // Trigger ID associated with the event.
  fixed64 trigger_id = 1;
  // Public account or sub-account ID associated with the trigger.
  fixed64 subaccount_id = 2;
  // Trading symbol numeric identifier.
  uint32 symbol_id = 3;
  // Trigger type at the time of the event.
  TriggerType trigger_type = 4;
  // Event category.
  TriggerEventType event_type = 5;

  // Event timestamp in nanoseconds since epoch (UTC).
  uint64 ts_ns = 10;
  // Child sequence number for multi-child trigger strategies.
  int32 child_seq = 11;
  // Child order ID created by this event, if any.
  fixed64 child_order_id = 12;
  // Price that caused the trigger to fire, in quote units scaled by 1e6. Zero
  // when not applicable.
  int64 fire_price_ticks = 13;

  // Optional cancel reason.
  string reason = 20;
}

// ListTriggerEventsResponse returns historical events ordered newest-first.
message ListTriggerEventsResponse {
  // Events ordered by event time descending, child sequence descending, and
  // stable event tie-breakers descending.
  repeated TriggerEvent events = 1;
  // Opaque cursor for the next page. Empty when no more results exist.
  string next_page_token = 3 [(buf.validate.field).string.max_len = 512];
}

// =============================================================================
// Cancel Trigger
// =============================================================================

// CancelTriggerRequest cancels an active trigger by ID.
message CancelTriggerRequest {
  // Trigger ID to cancel.
  fixed64 trigger_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional sub-account for authorization.
  optional fixed64 subaccount_id = 2;
}

// CancelTriggerResponse returns the final status after cancellation.
message CancelTriggerResponse {
  // Trigger ID that was canceled.
  fixed64 trigger_id = 1;
  // Final status (should be STATUS_CANCELED).
  TriggerStatus status = 2;
  // Server timestamp.
  google.protobuf.Timestamp ts = 3;
  // Server timestamp in nanoseconds since epoch (UTC).
  uint64 ts_ns = 4;
}

// =============================================================================
// Modify / Pause / Resume Trigger
// =============================================================================

// ModifyTriggerRequest applies a limited patch to an existing trigger.
message ModifyTriggerRequest {
  // Trigger ID to modify.
  fixed64 trigger_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional sub-account for authorization.
  optional fixed64 subaccount_id = 2;

  // Patch fields for safe price, trailing-distance, and slippage edits.
  // For stop/take-profit:
  // Updated trigger price in quote units scaled by 1e6.
  optional int64 trigger_price_ticks = 10;
  // Updated limit price in quote units scaled by 1e6 for LIMIT child orders.
  optional int64 limit_price_ticks = 11;

  // For trailing stop:
  oneof trailing_distance {
    // Updated trailing distance as a price delta in 1e-6 quote-unit ticks.
    int64 trailing_distance_ticks = 12;
    // Updated trailing distance in basis points (1 bp = 0.01%).
    int32 trailing_distance_bps = 13;
  }
  // Updated activation price in quote units scaled by 1e6.
  optional int64 activation_price_ticks = 14;
  // Optional price protection.
  oneof max_slippage {
    // Updated maximum allowed slippage as a price delta in 1e-6 quote-unit ticks.
    int32 max_slippage_ticks = 15;
    // Updated maximum allowed slippage in basis points (1 bp = 0.01%).
    int32 max_slippage_bps = 16;
  }
}

// ModifyTriggerResponse returns the trigger status after modification.
message ModifyTriggerResponse {
  // Modified trigger ID.
  fixed64 trigger_id = 1;
  // Current trigger status after modification.
  TriggerStatus status = 2;
  // Server timestamp.
  google.protobuf.Timestamp ts = 3;
  // Server timestamp in nanoseconds since epoch (UTC).
  uint64 ts_ns = 4;
}

// PauseTriggerRequest pauses an active trigger by ID.
message PauseTriggerRequest {
  // Trigger ID to pause.
  fixed64 trigger_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional sub-account for authorization.
  optional fixed64 subaccount_id = 2;
}

// PauseTriggerResponse returns the trigger status after pausing.
message PauseTriggerResponse {
  // Paused trigger ID.
  fixed64 trigger_id = 1;
  // Current trigger status after pausing.
  TriggerStatus status = 2;
  // Server timestamp.
  google.protobuf.Timestamp ts = 3;
  // Server timestamp in nanoseconds since epoch (UTC).
  uint64 ts_ns = 4;
}

// ResumeTriggerRequest resumes a paused trigger by ID.
message ResumeTriggerRequest {
  // Trigger ID to resume.
  fixed64 trigger_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional sub-account for authorization.
  optional fixed64 subaccount_id = 2;
}

// ResumeTriggerResponse returns the trigger status after resuming.
message ResumeTriggerResponse {
  // Resumed trigger ID.
  fixed64 trigger_id = 1;
  // Current trigger status after resuming.
  TriggerStatus status = 2;
  // Server timestamp.
  google.protobuf.Timestamp ts = 3;
  // Server timestamp in nanoseconds since epoch (UTC).
  uint64 ts_ns = 4;
}

// =============================================================================
// Trigger Model
// =============================================================================

// StopDetails contains configuration for STOP_LOSS and TAKE_PROFIT triggers.
message StopDetails {
  // Trigger threshold price in quote units scaled by 1e6.
  int64 trigger_price_ticks = 1;
  // Price source used for trigger evaluation.
  orders.v1.TriggerPriceSource trigger_price_source = 2;
  // Direction the price must cross to fire the trigger.
  orders.v1.TriggerDirection trigger_direction = 3;
}

// TrailingDetails contains configuration and runtime state for TRAILING_STOP
// triggers.
message TrailingDetails {
  // Trailing distance as a price delta in 1e-6 quote-unit ticks.
  int64 trailing_distance_ticks = 1;
  // Optional activation price: trailing only starts after this price is
  // reached. Expressed in quote units scaled by 1e6.
  int64 activation_price_ticks = 2;
  // Current peak price in quote units scaled by 1e6 for sell trailing stops.
  int64 peak_price_ticks = 3;
  // Current trough price in quote units scaled by 1e6 for buy trailing stops.
  int64 trough_price_ticks = 4;
  // Trailing distance in basis points (1 bp = 0.01%).
  int32 trailing_distance_bps = 5;
  // Optional maximum allowed slippage as a price delta in 1e-6 quote-unit ticks.
  int32 max_slippage_ticks = 6;
  // Optional maximum allowed slippage in basis points (1 bp = 0.01%).
  int32 max_slippage_bps = 7;
  // Price source used for trigger evaluation. Fixed for the lifetime of the
  // trigger and exposed for completeness.
  orders.v1.TriggerPriceSource trigger_price_source = 8;
  // Direction the price must cross to fire the trigger. Fixed for the lifetime
  // of the trigger and exposed for completeness.
  orders.v1.TriggerDirection trigger_direction = 9;
}

// TwapDetails contains configuration and runtime state for TWAP triggers.
message TwapDetails {
  // Total duration of TWAP execution in milliseconds.
  int64 twap_duration_ms = 1;
  // Interval between TWAP slices in milliseconds.
  int64 twap_slice_interval_ms = 2;
  // Current slice index, zero-based.
  int32 slice_idx = 4;
  // Total number of planned slices.
  int32 slice_count = 5;
  // Cumulative filled child-order base quantity scaled by the pair's
  // base_quantity_scale from GetSpotConfig.
  int64 executed_qty_scaled = 6;
}

// LadderDetails contains configuration for LADDER triggers.
message LadderDetails {
  // Minimum price in quote units scaled by 1e6 for the ladder range.
  int64 ladder_price_min_ticks = 1;
  // Maximum price in quote units scaled by 1e6 for the ladder range.
  int64 ladder_price_max_ticks = 2;
  // Number of price levels in the ladder.
  int32 ladder_levels = 3;
  // Quantity distribution across ladder levels.
  LadderDistribution ladder_distribution = 4;
}

// Trigger represents current trigger configuration, lifecycle state, and
// aggregate strategy progress. Use ListTriggerEvents to enumerate child-order
// actions and inspect append-only lifecycle history.
message Trigger {
  // Trigger ID.
  fixed64 trigger_id = 1;
  // Public account or sub-account ID associated with the trigger.
  fixed64 subaccount_id = 2;
  // Trading symbol numeric identifier.
  uint32 symbol_id = 3;
  // Trading symbol, for example "BTC-USDT".
  string symbol = 4;
  // Current trigger lifecycle status.
  TriggerStatus status = 5;
  // Parent order ID for attached-risk triggers; empty for standalone triggers.
  optional fixed64 parent_order_id = 6;

  // Child quantity scaled by the pair's base_quantity_scale from GetSpotConfig.
  int64 qty_scaled = 20;
  // Fee asset for BUY child orders.
  orders.v1.FeeAsset fee_asset = 21;
  // Self-trade prevention mode for child orders.
  orders.v1.SelfTradePreventionMode self_trade_prevention_mode = 22;

  // Immutable strategy configuration. The selected variant is the trigger
  // category and uses the same shape accepted by CreateTrigger.
  oneof configuration {
    // Stop-loss configuration.
    ConditionalTrigger stop_loss = 30;
    // Take-profit configuration.
    ConditionalTrigger take_profit = 31;
    // Trailing-stop configuration.
    TrailingStopTrigger trailing_stop = 32;
    // TWAP configuration.
    TwapTrigger twap = 33;
    // Ladder configuration.
    LadderTrigger ladder = 34;
  }

  // Type-specific runtime state.
  oneof runtime_details {
    // Stop-loss or take-profit trigger details.
    StopDetails stop = 100;
    // Trailing-stop trigger details.
    TrailingDetails trailing = 101;
    // TWAP trigger details.
    TwapDetails twap_state = 102;
    // Ladder trigger details.
    LadderDetails ladder_state = 103;
  }

  // Client-provided trigger ID for idempotency and correlation.
  string client_trigger_id = 60;
  // Creation timestamp.
  google.protobuf.Timestamp created_at = 61;
  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 62;
  // Timestamp when the trigger became armed.
  google.protobuf.Timestamp armed_at = 63;
  // Timestamp when the trigger reached a terminal successful state.
  google.protobuf.Timestamp completed_at = 64;
}

// =============================================================================
// Service Definition
// =============================================================================

service TriggersService {
  // Create a standalone trigger (stop order, TWAP, ladder).
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse) {
    option (google.api.http) = {
      post: "/v1/triggers"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Trigger"
      description:
        "Create a standalone trigger order. Supports stop, "
        "trailing, TWAP, and ladder trigger configurations."
      tags: "Triggers Service"
    };
  }

  // Get a trigger by ID.
  rpc GetTrigger(GetTriggerRequest) returns (GetTriggerResponse) {
    option (google.api.http) = {get: "/v1/triggers/{trigger_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Trigger"
      description:
        "Retrieve a single trigger by trigger ID, including "
        "lifecycle state and strategy-specific fields."
      tags: "Triggers Service"
    };
  }

  // List triggers for a sub-account with optional filters.
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse) {
    option (google.api.http) = {get: "/v1/triggers"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Triggers"
      description:
        "List triggers for an account with optional symbol, status, "
        "and trigger-type filters."
      tags: "Triggers Service"
    };
  }

  // List trigger events (append-only history).
  rpc ListTriggerEvents(ListTriggerEventsRequest) returns (ListTriggerEventsResponse) {
    option (google.api.http) = {get: "/v1/triggers/{trigger_id}/events"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Trigger Events"
      description:
        "List append-only trigger events for a trigger, including "
        "child-order actions, with optional event-category filtering "
        "and reverse-time pagination."
      tags: "Triggers Service"
    };
  }

  // Cancel a trigger.
  rpc CancelTrigger(CancelTriggerRequest) returns (CancelTriggerResponse) {
    option (google.api.http) = {delete: "/v1/triggers/{trigger_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Cancel Trigger"
      description:
