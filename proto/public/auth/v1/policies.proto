syntax = "proto3";

package auth.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/auth/v1;authv1";

// PolicyAction is a high-level permission that can be granted by a policy.
// Product actions apply to sub-account and API-key policies, and their
// write-style actions also grant the matching read visibility where needed by
// the product experience. Account permissions, each documented below as an
// account permission or a main-account permission, apply to API-key policies
// only: a sub-account policy refuses them. Each account permission grants
// exactly the calls it names and never implies another permission. A
// main-account permission is honored only for an API key scoped to the main
// account; a key scoped to a sub-account is refused even when its policy
// grants it. An API key without a policy has no permission at all.
enum PolicyAction {
  // No policy action selected. An empty API-key action list grants no access;
  // sub-account policies retain their mandatory read-only actions.
  UNSPECIFIED = 0;
  // Allow all spot order mutations: create, modify, replace, cancel, batch
  // operations, live cancel-all, and arming or disabling cancel-all-after.
  // Includes reading spot orders and trades and placing or modifying triggers.
  // Authorized cancellation remains available when trading activity is disabled;
  // this does not grant mutation access to a read-only API key.
  TRADE_SPOT = 1;
  // Allow internal transfers between sub-accounts or linked Polyester accounts,
  // including reading internal transfer history. Moves value out of the
  // account, so an assistant API key can never be allowed it.
  INTERNAL_TRANSFER = 3;
  // Allow value to leave Trading through external withdrawals. Destination
  // authorization is enforced separately from this policy. Moves value out of
  // the account, so an assistant API key can never be allowed it.
  EXTERNAL_WITHDRAW = 4;
  // Allow reading balances and equity for a sub-account or API key.
  READ_BALANCES = 5;
  // Allow reading spot orders and trades, subscriptions, and cancel-all dry-run.
  // Strictly non-mutating: cancellation and cancel-all-after changes require TRADE_SPOT.
  READ_SPOT = 6;
  // Allow reading internal transfer history.
  READ_INTERNAL_TRANSFERS = 8;
  // Allow reading saved, recent, and whitelisted address-book destinations.
  READ_ADDRESS_BOOK = 11;
  // Allow creating, updating, deleting, and copying saved destination entries,
  // including reading the address book. Address-book writes accept only a
  // session token, so on an API-key policy this grants address-book reads only.
  // It manages where value can leave the account, so an assistant API key can
  // never be allowed it.
  MANAGE_ADDRESS_BOOK = 12;
  // Allow reading the auto-withdraw rule and its runs.
  READ_AUTO_WITHDRAW = 14;
  // Allow creating, changing, and disabling the auto-withdraw rule, including
  // reading it. A rule pays value out, so changing one also requires
  // EXTERNAL_WITHDRAW, API keys can never change one, and an assistant API key
  // can never be allowed it.
  MANAGE_AUTO_WITHDRAW = 15;
  // Allow quoting, creating, and reading Swaps: market conversions of the
  // account's own Trading balance from one asset into another. Each Swap places
  // spot orders on the account's behalf, which also remain subject to the
  // sub-account's spot trading policy.
  SWAP = 16;
  // Allow listing and reading API keys. A key scoped to the main account sees
  // the main account's keys and those of its sub-accounts; a key scoped to a
  // sub-account sees only that sub-account's keys. Account permission.
  READ_API_KEYS = 17;
  // Allow listing and reading API-key policies. A key scoped to the main
  // account sees every API-key policy of the main account; a key scoped to a
  // sub-account sees only the policies attached to that sub-account's keys.
  // Account permission.
  READ_API_POLICIES = 18;
  // Allow listing and reading sub-account policies. A key scoped to the main
  // account sees every sub-account policy of the main account; a key scoped to
  // a sub-account sees only the policy attached to that sub-account. Account
  // permission.
  READ_SUBACCOUNT_POLICIES = 19;
  // Allow reading what the key itself may do on a sub-account within its
  // scope. Account permission.
  READ_SUBACCOUNT_PERMISSIONS = 20;
  // Allow reading the main account's VIP status. Main-account permission.
  READ_VIP_STATUS = 21;
  // Allow reading the main account's social verification status: provider,
  // handle, status, and verification time. Main-account permission.
  READ_SOCIAL_VERIFICATION = 22;
  // Allow reading the main account's profile and username history.
  // Main-account permission.
  READ_PROFILE = 23;
  // Allow resolving an account by username, account ID, or smart-account
  // address. Any key of the main account may use it, whatever its scope.
  // Account permission.
  READ_ACCOUNT_DIRECTORY = 24;
  // Allow validating an external withdraw destination within the key's scope
  // without creating, signing, or reserving a withdraw. It does not allow
  // withdrawing. Account permission.
  READ_WITHDRAW_VALIDATION = 25;
  // Allow reading the main account's daily reward claim status.
  // Main-account permission.
  READ_DAILY_CLAIMS = 26;
  // Allow claiming the main account's daily reward, paid to the main account
  // or a sub-account it owns. Main-account permission.
  CLAIM_DAILY_REWARD = 27;
  // Allow reading the main account's checkpoints. Main-account permission.
  READ_CHECKPOINTS = 28;
  // Allow reading the main account's published reward awards. Main-account
  // permission.
  READ_REWARDS = 29;
  // Allow creating a deposit address within the key's scope. Account
  // permission.
  CREATE_DEPOSIT_ADDRESS = 10;
  // Allow listing the deposit addresses within the key's scope. Account
  // permission.
  READ_DEPOSIT_ADDRESSES = 30;
  // Allow listing and reading the subaccounts within the key's scope. Account
  // permission.
  READ_SUBACCOUNTS = 31;
  // Allow reading the activity of the subaccounts within the key's scope.
  // Account permission.
  READ_SUBACCOUNT_ACTIVITY = 32;
  // Allow listing the members of the subaccounts within the key's scope.
  // Account permission.
  READ_SUBACCOUNT_MEMBERS = 33;
  // Allow listing the outgoing invites of the subaccounts within the key's
  // scope. Account permission.
  READ_SUBACCOUNT_INVITES = 34;
  // Allow reading the Guard Signer status within the key's scope; a key never
  // reads another main account's Guard Signer. Account permission.
  READ_GUARD_SIGNER_STATUS = 35;
}

// MarketScope describes how a policy applies to spot markets.
message MarketScope {
  // Value is the market-level scope:
  // - ALL: no market-level restriction; new listings are automatically allowed.
  // - ALLOWLIST: only the listed markets are allowed.
  enum Value {
    // No scope selected. Create and update requests treat this as ALL.
    UNSPECIFIED = 0;
    // Allow all current and future markets for this policy.
    ALL = 1;
    // Allow only the markets listed on this policy.
    ALLOWLIST = 2;
  }
}

// SpotMarketSelector identifies an allowed spot market in policy mutations.
message SpotMarketSelector {
  // Stable numeric pair ID from GetSpotConfig.
  uint32 symbol_id = 1 [(buf.validate.field).uint32.gt = 0];
}

// SpotMarketRule describes an allowed spot market in policy views.
message SpotMarketRule {
  // Stable numeric pair ID.
  uint32 symbol_id = 1;
}

// SubaccountPolicyView is the public view of a sub-account policy.
message SubaccountPolicyView {
  // Policy identifier (opaque ID).
  fixed64 id = 1;
  // Human-readable policy name.
  string name = 2;
  // Optional policy description for dashboards and audits.
  string description = 3;

  // Allowed spot markets for this sub-account.
  repeated SpotMarketRule spot_markets = 4;

  // Market-level scope for spot markets. When ALL, spot_markets is returned
  // for display only and is not enforced.
  MarketScope.Value spot_market_scope = 6 [(buf.validate.field).enum = {defined_only: true}];

  // Effective high-level actions enabled for the sub-account. Mandatory
  // read-only actions are always included.
  repeated PolicyAction actions = 8 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 64
    },
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // True if this policy is a reusable template; false if it is a
  // per-sub-account instance.
  bool is_template = 10;

  // Optional source template this policy was copied from (opaque ID). This is
  // audit metadata only and does not imply live linkage.
  fixed64 source_template_id = 11;

  // Maximum notional size allowed for any single order on this sub-account,
  // expressed in canonical quote microunits (one unit is 0.000001 USDT).
  // A value of 0 means "no explicit cap".
  uint64 max_order_notional = 13;

  // Maximum number of resting orders allowed on this sub-account at any time.
  // A value of 0 means "no explicit cap".
  uint32 max_open_orders = 14;

  // --- Safety / kill-switch controls ---

  // When true, new orders and exposure-increasing order or trigger changes are
  // rejected regardless of other settings. Existing orders and triggers may
  // still be canceled or paused by an otherwise authorized caller.
  bool trading_halted = 23;

  // --- Governance / lifecycle metadata ---

  // When true, this policy is write-protected and requires an elevated approval
  // flow to modify it.
  bool locked = 27;

  // Optional review time in UTC. This is governance metadata and does not
  // automatically disable the policy.
  google.protobuf.Timestamp review_at = 28;
  // Optional expiry time in UTC. This is governance metadata and does not
  // automatically disable the policy.
  google.protobuf.Timestamp expires_at = 29;

  // Creation time in UTC.
  google.protobuf.Timestamp created_at = 20;
  // Last update time in UTC.
  google.protobuf.Timestamp updated_at = 21;
  // Monotonic resource revision used for conditional updates.
  uint64 revision = 30;
}

// ListSubaccountPoliciesRequest lists the finite set of sub-account policies
// visible in the requested account scope. Results are sorted by ascending
// policy ID and are not paginated.
message ListSubaccountPoliciesRequest {
  // Optional sub-account context. When provided, a current member may read the
  // policy attached to that sub-account; the owner retains visibility of all
  // policies owned by their root account. When omitted, only policies owned by
  // the caller's root account are returned.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// ListSubaccountPoliciesResponse contains sub-account policy templates sorted
// by ascending policy ID.
message ListSubaccountPoliciesResponse {
  // Sub-account policy templates visible to the caller.
  repeated SubaccountPolicyView policies = 1;
}

// GetSubaccountPolicyRequest fetches one sub-account policy template by ID.
message GetSubaccountPolicyRequest {
  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional sub-account context. When provided, a current member may read the
  // policy attached to that sub-account; the owner may also read another policy
  // owned by their root account. When omitted, the policy must be owned by the
  // caller's root account.
  optional fixed64 subaccount_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// GetSubaccountPolicyResponse returns the requested sub-account policy.
message GetSubaccountPolicyResponse {
  // Matching sub-account policy.
  SubaccountPolicyView policy = 1;
}

// SubaccountPolicySpec contains the mutable configuration of a sub-account policy.
message SubaccountPolicySpec {
  option (buf.validate.message).cel = {
    id: "spot_allowlist_requires_markets"
    message: "spot_markets must be non-empty when spot_market_scope is ALLOWLIST"
    expression: "this.spot_market_scope != 2 ? true : size(this.spot_markets) > 0"
  };
  option (buf.validate.message).cel = {
    id: "spot_markets_unique"
    message: "spot_markets must not contain duplicate symbol IDs"
    expression: "this.spot_markets.map(m, m.symbol_id).unique()"
  };

  // Human-readable policy name. Create requires a non-empty value; update
  // validates it after merging fields selected by update_mask.
  string name = 1 [
    (buf.validate.field).string.max_len = 64
  ];
  // Optional policy description for dashboards and audits. Maximum 256 characters.
  string description = 2 [(buf.validate.field).string.max_len = 256];

  // Allowed spot markets for this policy.
  repeated SpotMarketSelector spot_markets = 3;
  // Market-level scope for spot markets. When unspecified, defaults to ALL.
  MarketScope.Value spot_market_scope = 5 [(buf.validate.field).enum = {defined_only: true}];

  // High-level actions enabled for the sub-account policy. Mandatory read-only
  // actions are included when omitted. Up to 64 unique explicit actions are
  // allowed. Account permissions such as READ_API_KEYS apply to API-key
  // policies only and are refused here.
  repeated PolicyAction actions = 7 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 64
    },
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Maximum notional size for any single order on this sub-account, expressed
  // in canonical quote microunits (one unit is 0.000001 USDT). A value of 0
  // means no explicit cap.
  uint64 max_order_notional = 13;
  // Maximum number of resting orders allowed on this sub-account at any time.
  // A value of 0 means no explicit cap.
  uint32 max_open_orders = 14;
  // When true, new orders and exposure-increasing order or trigger changes are
  // rejected regardless of other settings. Existing orders and triggers may
  // still be canceled or paused by an otherwise authorized caller.
  bool trading_halted = 21;
  // When true, the policy is write-protected and requires an elevated mutation path.
  bool locked = 25;
  // Optional review time in UTC. This does not automatically disable the policy.
  google.protobuf.Timestamp review_at = 26;
  // Optional expiry time in UTC. This does not automatically disable the policy.
  google.protobuf.Timestamp expires_at = 27;
}

// CreateSubaccountPolicyRequest defines a new sub-account policy template, with
// an optional attach step for one target sub-account.
message CreateSubaccountPolicyRequest {
  // Complete mutable policy configuration.
  SubaccountPolicySpec policy = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Optional target sub-account to attach atomically after creation.
  optional fixed64 subaccount_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// CreateSubaccountPolicyResponse returns the created sub-account policy.
message CreateSubaccountPolicyResponse {
  // Created sub-account policy.
  SubaccountPolicyView policy = 1;
}

// UpdateSubaccountPolicyRequest changes selected mutable fields on an existing
// sub-account policy.
message UpdateSubaccountPolicyRequest {
  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  // Candidate values for fields selected by update_mask.
  SubaccountPolicySpec policy = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Mutable fields to apply. Paths are relative to policy. The mask is required,
  // must be non-empty, and cannot contain "*".
  google.protobuf.FieldMask update_mask = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Revision returned by the latest successful read. Stale revisions fail with
  // a conflict before no-op detection.
  uint64 expected_revision = 4 [
    (buf.validate.field).uint64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

// UpdateSubaccountPolicyResponse returns the updated sub-account policy.
message UpdateSubaccountPolicyResponse {
  // Updated sub-account policy.
  SubaccountPolicyView policy = 1;
}

// DeleteSubaccountPolicyRequest deletes a sub-account policy template when it
// is not in use.
message DeleteSubaccountPolicyRequest {
  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// DeleteSubaccountPolicyResponse is empty when the delete succeeds.
message DeleteSubaccountPolicyResponse {}

// SetSubaccountPolicyRequest attaches or clears a policy template on a
// sub-account.
message SetSubaccountPolicyRequest {
  // Sub-account identifier (opaque ID).
  fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];

  // Policy template to attach (opaque ID). A value of 0 clears the explicit
  // binding and restores the system Read Only policy.
  fixed64 policy_id = 2;
}

// SetSubaccountPolicyResponse is empty when the policy binding succeeds.
message SetSubaccountPolicyResponse {}

// ApiPolicyView is the public view of an API key policy template. Its action
// and spot-market floor cannot exceed an attached sub-account policy.
message ApiPolicyView {
  // Policy identifier (opaque ID).
  fixed64 id = 1;
  // Human-readable policy name.
  string name = 2;
  // Optional policy description for dashboards and audits.
  string description = 3;

  // Allowed spot markets for this API key policy.
  repeated SpotMarketRule spot_markets = 4;

  // High-level actions enabled for this API key. Up to 64 unique explicit
  // actions may be returned.
  repeated PolicyAction actions = 6 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 64
    },
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Market-level scope for spot markets. When ALL, spot_markets is returned
  // for display only and is not enforced.
  MarketScope.Value spot_market_scope = 7 [(buf.validate.field).enum = {defined_only: true}];
  // --- Template / lifecycle metadata ---

  // When true, this policy is intended to be reused as a template across
  // multiple API keys. When false, it represents a single-key instance.
  bool is_template = 19;

  // Optional source template this policy was copied from (opaque ID). This is
  // audit metadata only and does not imply live linkage.
  fixed64 source_template_id = 20;

  // Creation time in UTC.
  google.protobuf.Timestamp created_at = 21;
  // Last update time in UTC.
  google.protobuf.Timestamp updated_at = 22;
  // Monotonic resource revision used for conditional updates.
  uint64 revision = 23;
}

// ListApiPoliciesRequest lists the finite set of API key policies visible in
// the requested account scope. Results are sorted by ascending policy ID and
// are not paginated.
message ListApiPoliciesRequest {
  // Optional API key context for delegated administration. When omitted, only
  // policies owned by the caller's root account are returned.
  optional string key_id = 1 [
    (buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$"
  ];
}

// ListApiPoliciesResponse contains API key policy templates sorted by ascending
// policy ID.
message ListApiPoliciesResponse {
  // API key policy templates visible to the caller.
  repeated ApiPolicyView policies = 1;
}

// GetApiPolicyRequest fetches one API key policy template by ID.
message GetApiPolicyRequest {
  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional API key context for delegated administration. When omitted, the
  // policy must be owned by the caller's root account.
  optional string key_id = 2 [
    (buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$"
  ];
}

// GetApiPolicyResponse returns the requested API key policy.
message GetApiPolicyResponse {
  // Matching API key policy.
  ApiPolicyView policy = 1;
}

// ApiPolicySpec contains the mutable configuration of an API key policy.
message ApiPolicySpec {
  option (buf.validate.message).cel = {
    id: "spot_allowlist_requires_markets"
    message: "spot_markets must be non-empty when spot_market_scope is ALLOWLIST"
    expression: "this.spot_market_scope != 2 ? true : size(this.spot_markets) > 0"
  };
  option (buf.validate.message).cel = {
    id: "spot_markets_unique"
    message: "spot_markets must not contain duplicate symbol IDs"
    expression: "this.spot_markets.map(m, m.symbol_id).unique()"
  };

  // Human-readable policy name. Create requires a non-empty value; update
  // validates it after merging fields selected by update_mask.
  string name = 1 [
    (buf.validate.field).string.max_len = 64
  ];
  // Optional policy description for dashboards and audits. Maximum 256 characters.
  string description = 2 [(buf.validate.field).string.max_len = 256];

  // Allowed spot markets for this API key policy.
  repeated SpotMarketSelector spot_markets = 3;
  // Market-level scope for spot markets. When unspecified, defaults to ALL.
  MarketScope.Value spot_market_scope = 5 [(buf.validate.field).enum = {defined_only: true}];

  // High-level actions enabled for the API key policy. An empty list grants no
  // access. Up to 64 unique explicit actions are allowed.
  repeated PolicyAction actions = 7 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 64
    },
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Whether this policy should be treated as a reusable template.
  bool is_template = 19;

}

// CreateApiPolicyRequest defines a new API key policy template.
message CreateApiPolicyRequest {
  // Complete mutable policy configuration.
  ApiPolicySpec policy = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Optional API key identifier to bind this newly-created policy to
  // atomically. When set, the caller must be allowed to manage the key and the
  // create+assign operation consumes a single fresh step-up proof. An
  // assistant API key cannot be assigned a policy that allows a money-out
  // action: FailedPrecondition with AUTH_ASSISTANT_KEY_ACTION_NOT_ALLOWED.
  string assign_to_key_id = 2 [(buf.validate.field).string.pattern = "^$|^ak_[a-f0-9]{32}$"];
}

// CreateApiPolicyResponse returns the created API key policy.
message CreateApiPolicyResponse {
  // Created API key policy.
  ApiPolicyView policy = 1;
}

// UpdateApiPolicyRequest changes selected mutable fields on an existing API
// key policy.
message UpdateApiPolicyRequest {
  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  // Candidate values for fields selected by update_mask.
  ApiPolicySpec policy = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Mutable fields to apply. Paths are relative to policy. The mask is required,
  // must be non-empty, and cannot contain "*".
  google.protobuf.FieldMask update_mask = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Revision returned by the latest successful read. Stale revisions fail with
  // a conflict before no-op detection.
  uint64 expected_revision = 4 [
    (buf.validate.field).uint64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

// UpdateApiPolicyResponse returns the updated API key policy.
message UpdateApiPolicyResponse {
  // Updated API key policy.
  ApiPolicyView policy = 1;
}

// DeleteApiPolicyRequest deletes an API key policy template when it is not in use.
message DeleteApiPolicyRequest {
  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// DeleteApiPolicyResponse is empty when the delete succeeds.
message DeleteApiPolicyResponse {}

// SetApiKeyPolicyRequest attaches or clears a policy template on an API key.
message SetApiKeyPolicyRequest {
  // Opaque API key identifier, formatted as "ak_" followed by 32 lowercase hex
  // characters.
  string key_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$",
    (google.api.field_behavior) = REQUIRED
  ];

  // Policy template to attach (opaque ID). A value of 0 clears the binding.
  // An API key without an attached policy has no permissions.
  fixed64 policy_id = 2;
}

// SetApiKeyPolicyResponse is empty when the policy binding succeeds.
message SetApiKeyPolicyResponse {}

// PolicyService manages sub-account and API key policy templates and bindings.
service PolicyService {
  option (polyester.api.docs_group) = "account";

  // List sub-account policy templates available to the caller. An API key
  // needs READ_SUBACCOUNT_POLICIES; a key scoped to a sub-account sees only the
  // policy attached to that sub-account.
  rpc ListSubaccountPolicies(ListSubaccountPoliciesRequest) returns (ListSubaccountPoliciesResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/policies/subaccounts"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Subaccount Policies"
      description: "List sub-account policy templates available to the caller. An API key needs READ_SUBACCOUNT_POLICIES; a key scoped to a sub-account sees only the policy attached to that sub-account."
      tags: "Auth Service"
    };
  }

  // Get a sub-account policy template by id. An API key needs
  // READ_SUBACCOUNT_POLICIES; a key scoped to a sub-account reads only the
  // policy attached to that sub-account.
  rpc GetSubaccountPolicy(GetSubaccountPolicyRequest) returns (GetSubaccountPolicyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/policies/subaccounts/{policy_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Subaccount Policy"
      description: "Retrieve a single sub-account policy template by policy ID. An API key needs READ_SUBACCOUNT_POLICIES; a key scoped to a sub-account reads only the policy attached to that sub-account."
      tags: "Auth Service"
    };
  }

  // Create a new sub-account policy template (optionally attach to a sub-account).
  rpc CreateSubaccountPolicy(CreateSubaccountPolicyRequest) returns (CreateSubaccountPolicyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
      post: "/v1/auth/policies/subaccounts"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Subaccount Policy"
      description: "Create a new sub-account policy template for the caller account or workspace."
      tags: "Auth Service"
    };
  }

  // Change selected fields on an existing sub-account policy template.
  rpc UpdateSubaccountPolicy(UpdateSubaccountPolicyRequest) returns (UpdateSubaccountPolicyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
