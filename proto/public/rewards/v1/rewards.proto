syntax = "proto3";

package rewards.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/rewards/v1;rewardsv1";
option (gnostic.openapi.v3.document) = { tags: [{ name: "Rewards" description: "Published campaign awards for authenticated root accounts." }] };

// RewardFulfillmentMethod identifies how an award will be delivered.
enum RewardFulfillmentMethod {
  METHOD_UNSPECIFIED = 0;
  EXTERNAL_TESTNET = 1;
  INTERNAL_TRADING = 2;
}

// RewardFulfillmentState describes the current delivery state.
enum RewardFulfillmentState {
  STATE_UNSPECIFIED = 0;
  AWAITING_DESTINATION = 1;
  READY_FOR_PAYOUT = 2;
  PAID = 3;
  FAILED = 4;
  CANCELED = 5;
}

// RewardAward contains immutable published terms and current delivery details for the authenticated root account.
message RewardAward {
  // Stable opaque award identifier.
  string award_id = 1;
  // Stable campaign identifier.
  string campaign_id = 2;
  // Campaign display name frozen at publication.
  string campaign_name = 3;
  // Canonical asset identifier.
  uint32 asset_id = 4;
  // Exact integer amount in the asset's smallest base unit.
  string amount_base_units = 5;
  // Selected delivery method.
  RewardFulfillmentMethod fulfillment_method = 6;
  // Current delivery state.
  RewardFulfillmentState fulfillment_state = 7;
  // Publication time.
  google.protobuf.Timestamp published_at = 8;
  // Campaign payout network. Interpret destination_address in this network.
  string network = 9;
  // Current fulfillment revision for optimistic concurrency.
  uint64 fulfillment_revision = 10;
  // Recipient payout destination once submitted. Empty until provided.
  string destination_address = 11;
  // External transaction identifier once staff records delivery. Empty until delivered.
  string transaction_id = 12;
}

// SetMyRewardDestinationRequest records the authenticated recipient's payout destination.
message SetMyRewardDestinationRequest {
  // Award owned by the authenticated root account.
  string award_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  // Destination address interpreted according to the award campaign's network.
  string destination_address = 2 [(buf.validate.field).string = {min_len: 1, max_len: 512}];
  // Fulfillment revision observed by the recipient.
  uint64 expected_revision = 3 [(buf.validate.field).uint64.gt = 0];
  // Client-generated idempotency identifier. Maximum 128 characters.
  string request_id = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

// SetMyRewardDestinationResponse returns the updated award.
message SetMyRewardDestinationResponse {
  // Award with the persisted destination and updated fulfillment state.
  RewardAward award = 1;
}

// ListMyRewardAwardsRequest requests a page of awards for the authenticated root account.
message ListMyRewardAwardsRequest {
  // Maximum awards to return. Zero uses 50; maximum 100.
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 100];
  // Opaque exclusive continuation token bound to the authenticated root account.
  string page_token = 2 [(buf.validate.field).string.max_len = 256];
}

// ListMyRewardAwardsResponse contains newest awards first.
message ListMyRewardAwardsResponse {
  // Awards ordered by publication time and award identifier, newest first.
  repeated RewardAward awards = 1;
  // Opaque continuation token. Empty when no more results exist.
  string next_page_token = 2;
}

// RewardCampaignService exposes published rewards to authenticated recipients.
service RewardCampaignService {
  // List published awards for the authenticated root account, newest first.
  rpc ListMyRewardAwards(ListMyRewardAwardsRequest) returns (ListMyRewardAwardsResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {get: "/v1/rewards/awards"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List My Reward Awards"
      description: "List published campaign awards for the authenticated root account. Requires a session token."
      tags: "Rewards"
    };
  }

  // Record a write-once external payout destination for an award owned by the authenticated root account.
  rpc SetMyRewardDestination(SetMyRewardDestinationRequest) returns (SetMyRewardDestinationResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {
      put: "/v1/rewards/awards/{award_id}/destination"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Set My Reward Destination"
      description: "Record a write-once payout destination for the authenticated recipient's award. Requires a session token and fresh step-up proof. This does not execute a transfer or mark the award delivered."
      tags: "Rewards"
    };
  }
}
