  MarketScope.Value spot_market_scope = 5 [(buf.validate.field).enum = {defined_only: true}];
  // Market-level scope for perp contracts. When unspecified, defaults to ALL.
  MarketScope.Value perp_market_scope = 6 [(buf.validate.field).enum = {defined_only: true}];

  // High-level actions enabled for the API key policy. Up to 64 unique explicit
  // actions are allowed.
  repeated PolicyAction actions = 7 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 64
    },
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Maximum notional size for any single order submitted with this API key,
  // expressed in the canonical quote unit (for example, micro-USDT). A value of
  // 0 means no additional cap beyond the sub-account policy.
  uint64 max_order_notional = 13;

  // Maximum total notional this API key can transfer out internally per rolling
  // day, expressed in the canonical quote unit (for example, micro-USDT). A
  // value of 0 means no additional cap beyond the sub-account policy.
  uint64 daily_internal_transfer_out_limit = 17;
  // Maximum total notional this API key can withdraw per rolling day, expressed
  // in the canonical quote unit (for example, micro-USDT). A value of 0 means
  // no additional cap beyond the sub-account policy.
  uint64 daily_withdraw_limit = 18;

  // Whether this policy should be treated as a reusable template.
  bool is_template = 19;

  // Optional API key identifier to bind this newly-created policy to
  // atomically. When set, the caller must be allowed to manage the key and the
  // create+assign operation consumes a single fresh step-up proof.
  string assign_to_key_id = 20 [(buf.validate.field).string.pattern = "^$|^ak_[a-f0-9]{32}$"];
}

// CreateApiPolicyResponse returns the created API key policy.
message CreateApiPolicyResponse {
  // Created API key policy.
  ApiPolicyView policy = 1;
}

// UpdateApiPolicyRequest replaces an existing API key policy template.
message UpdateApiPolicyRequest {
  option (buf.validate.message).cel = {
    id: "spot_allowlist_requires_markets"
    message: "spot_markets must be non-empty when spot_market_scope is ALLOWLIST"
    expression: "this.spot_market_scope != 2 ? true : size(this.spot_markets) > 0"
  };
  option (buf.validate.message).cel = {
    id: "perp_allowlist_requires_markets"
    message: "perp_markets must be non-empty when perp_market_scope is ALLOWLIST"
    expression: "this.perp_market_scope != 2 ? true : size(this.perp_markets) > 0"
  };
  option (buf.validate.message).cel = {
    id: "spot_markets_unique"
    message: "spot_markets must not contain duplicate symbols"
    expression: "this.spot_markets.map(m, m.symbol).unique()"
  };
  option (buf.validate.message).cel = {
    id: "perp_markets_unique"
    message: "perp_markets must not contain duplicate symbols"
    expression: "this.perp_markets.map(m, m.symbol).unique()"
  };

  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [(buf.validate.field).fixed64.gt = 0];

  // Human-readable policy name. Required; 1 to 64 characters.
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (google.api.field_behavior) = REQUIRED
  ];
  // Optional policy description for dashboards and audits. Maximum 256 characters.
  string description = 3 [(buf.validate.field).string.max_len = 256];

  // Allowed spot markets for this API key policy.
  repeated SpotMarketRule spot_markets = 4;
  // Allowed perp markets and optional per-contract leverage caps.
  repeated PerpMarketRule perp_markets = 5;

  // Market-level scope for spot markets. When unspecified, defaults to ALL.
  MarketScope.Value spot_market_scope = 6 [(buf.validate.field).enum = {defined_only: true}];
  // Market-level scope for perp contracts. When unspecified, defaults to ALL.
  MarketScope.Value perp_market_scope = 7 [(buf.validate.field).enum = {defined_only: true}];

  // High-level actions enabled for the API key policy. Up to 64 unique explicit
  // actions are allowed.
  repeated PolicyAction actions = 8 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 64
    },
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Maximum notional size for any single order submitted with this API key,
  // expressed in the canonical quote unit (for example, micro-USDT). A value of
  // 0 means no additional cap beyond the sub-account policy.
  uint64 max_order_notional = 13;

  // Maximum total notional this API key can transfer out internally per rolling
  // day, expressed in the canonical quote unit (for example, micro-USDT). A
  // value of 0 means no additional cap beyond the sub-account policy.
  uint64 daily_internal_transfer_out_limit = 17;
  // Maximum total notional this API key can withdraw per rolling day, expressed
  // in the canonical quote unit (for example, micro-USDT). A value of 0 means
  // no additional cap beyond the sub-account policy.
  uint64 daily_withdraw_limit = 18;

  // Whether this policy should be treated as a reusable template.
  bool is_template = 19;
}

// UpdateApiPolicyResponse returns the updated API key policy.
message UpdateApiPolicyResponse {
  // Updated API key policy.
  ApiPolicyView policy = 1;
}

// DeleteApiPolicyRequest deletes an API key policy template when it is not in use.
message DeleteApiPolicyRequest {
  // Policy identifier (opaque ID).
  fixed64 policy_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// DeleteApiPolicyResponse is empty when the delete succeeds.
message DeleteApiPolicyResponse {}

// SetApiKeyPolicyRequest attaches or clears a policy template on an API key.
message SetApiKeyPolicyRequest {
  // Opaque API key identifier, formatted as "ak_" followed by 32 lowercase hex
  // characters.
  string key_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$",
    (google.api.field_behavior) = REQUIRED
  ];

  // Policy template to attach (opaque ID). A value of 0 clears the policy
  // and reverts to no per-key policy. The sub-account policy and role remain
  // the permission ceiling.
  fixed64 policy_id = 2;
}

// SetApiKeyPolicyResponse is empty when the policy binding succeeds.
message SetApiKeyPolicyResponse {}

// PolicyService manages sub-account and API key policy templates and bindings.
service PolicyService {
  // List sub-account policy templates available to the caller.
  rpc ListSubaccountPolicies(ListSubaccountPoliciesRequest) returns (ListSubaccountPoliciesResponse) {
    option (google.api.http) = {get: "/v1/auth/policies/subaccounts"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Subaccount Policies"
      description: "List sub-account policy templates available to the caller."
      tags: "Auth Service"
    };
  }

  // Get a sub-account policy template by id.
  rpc GetSubaccountPolicy(GetSubaccountPolicyRequest) returns (GetSubaccountPolicyResponse) {
    option (google.api.http) = {get: "/v1/auth/policies/subaccounts/{policy_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Subaccount Policy"
      description: "Retrieve a single sub-account policy template by policy ID."
      tags: "Auth Service"
    };
  }

  // Create a new sub-account policy template (optionally attach to a sub-account).
  rpc CreateSubaccountPolicy(CreateSubaccountPolicyRequest) returns (CreateSubaccountPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/auth/policies/subaccounts"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Subaccount Policy"
      description: "Create a new sub-account policy template for the caller account or workspace."
      tags: "Auth Service"
    };
  }

  // Replace an existing sub-account policy template.
  rpc UpdateSubaccountPolicy(UpdateSubaccountPolicyRequest) returns (UpdateSubaccountPolicyResponse) {
    option (google.api.http) = {
      patch: "/v1/auth/policies/subaccounts/{policy_id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Update Subaccount Policy"
      description: "Replace an existing sub-account policy template."
      tags: "Auth Service"
    };
  }

  // Delete a sub-account policy template.
  rpc DeleteSubaccountPolicy(DeleteSubaccountPolicyRequest) returns (DeleteSubaccountPolicyResponse) {
    option (google.api.http) = {delete: "/v1/auth/policies/subaccounts/{policy_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Delete Subaccount Policy"
      description: "Delete an existing sub-account policy template when it is not in use."
      tags: "Auth Service"
    };
  }

  // Attach or clear a sub-account policy for a sub-account.
  rpc SetSubaccountPolicy(SetSubaccountPolicyRequest) returns (SetSubaccountPolicyResponse) {
    option (google.api.http) = {
      patch: "/v1/auth/subaccounts/{subaccount_id}/policy"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Set Subaccount Policy"
      description: "Attach or clear a sub-account policy for the target sub-account."
      tags: "Auth Service"
    };
  }

  // --- API key policies ---

  // List API key policy templates available to the caller.
  rpc ListApiPolicies(ListApiPoliciesRequest) returns (ListApiPoliciesResponse) {
    option (google.api.http) = {get: "/v1/auth/policies/api-keys"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List API Key Policies"
      description: "List API key policy templates available to the caller."
      tags: "Auth Service"
    };
  }

  // Get an API key policy template by id.
  rpc GetApiPolicy(GetApiPolicyRequest) returns (GetApiPolicyResponse) {
    option (google.api.http) = {get: "/v1/auth/policies/api-keys/{policy_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get API Key Policy"
      description: "Retrieve a single API key policy template by policy ID."
      tags: "Auth Service"
    };
  }

  // Create a new API key policy template.
  rpc CreateApiPolicy(CreateApiPolicyRequest) returns (CreateApiPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/auth/policies/api-keys"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create API Key Policy"
      description: "Create a new API key policy template for the caller account or workspace."
      tags: "Auth Service"
    };
  }

  // Replace an existing API key policy template.
  rpc UpdateApiPolicy(UpdateApiPolicyRequest) returns (UpdateApiPolicyResponse) {
    option (google.api.http) = {
      patch: "/v1/auth/policies/api-keys/{policy_id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Update API Key Policy"
      description: "Replace an existing API key policy template."
      tags: "Auth Service"
    };
  }

  // Delete an API key policy template.
  rpc DeleteApiPolicy(DeleteApiPolicyRequest) returns (DeleteApiPolicyResponse) {
    option (google.api.http) = {delete: "/v1/auth/policies/api-keys/{policy_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Delete API Key Policy"
      description: "Delete an existing API key policy template when it is not in use."
      tags: "Auth Service"
    };
  }

  // Attach or clear an API key policy for a key.
  rpc SetApiKeyPolicy(SetApiKeyPolicyRequest) returns (SetApiKeyPolicyResponse) {
    option (google.api.http) = {
      patch: "/v1/auth/api-keys/{key_id}/policy"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Set API Key Policy"
      description: "Attach or clear an API key policy for the target key."
      tags: "Auth Service"
    };
  }
}
