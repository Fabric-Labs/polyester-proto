syntax = "proto3";

package chain.analytics.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/chain/analytics/v1;chainanalyticsv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Chain Analytics"
      description: "Read public chain analytics chart series."
    }
  ]
};

// ChainAnalyticsRange selects a standard chart window and default bucket size.
enum ChainAnalyticsRange {
  // Default chart range. The server treats this as 1 day.
  RANGE_UNSPECIFIED = 0;

  // 1 day.
  DAY_1 = 1;

  // 7 days.
  DAY_7 = 2;

  // 30 days.
  DAY_30 = 3;

  // 90 days.
  DAY_90 = 4;

  // 180 days.
  DAY_180 = 5;

  // 365 days.
  DAY_365 = 6;
}

// GetZippedAssetSupplyRequest selects the route-scoped zToken supply series.
message GetZippedAssetSupplyRequest {
  option (buf.validate.message).cel = {
    id: "chain_analytics.zipped_asset_supply_window"
    message: "start_ts_sec must be before end_ts_sec"
    expression: "this.start_ts_sec == 0u || this.end_ts_sec == 0u || this.start_ts_sec < this.end_ts_sec"
  };
  option (buf.validate.message).cel = {
    id: "chain_analytics.zipped_asset_supply_window_for_range"
    message: "window must not exceed selected range"
    expression:
      "this.start_ts_sec == 0u || this.end_ts_sec == 0u || this.start_ts_sec >= this.end_ts_sec || "
      "(((this.range == 0 || this.range == 1) && this.end_ts_sec - this.start_ts_sec <= 86400u) || "
      "(this.range == 2 && this.end_ts_sec - this.start_ts_sec <= 604800u) || "
      "(this.range == 3 && this.end_ts_sec - this.start_ts_sec <= 2592000u) || "
      "(this.range == 4 && this.end_ts_sec - this.start_ts_sec <= 7776000u) || "
      "(this.range == 5 && this.end_ts_sec - this.start_ts_sec <= 15552000u) || "
      "(this.range == 6 && this.end_ts_sec - this.start_ts_sec <= 31536000u))"
  };
  option (buf.validate.message).cel = {
    id: "chain_analytics.zipped_asset_supply_bucket_for_range"
    message: "bucket is not valid for range"
    expression:
      "this.bucket == '' || "
      "((this.range == 0 || this.range == 1) && this.bucket in ['1m', '5m']) || "
      "(this.range == 2 && this.bucket in ['10m', '15m', '30m']) || "
      "(this.range == 3 && this.bucket in ['30m', '1h', '2h']) || "
      "(this.range == 4 && this.bucket in ['2h', '4h', '8h']) || "
      "(this.range == 5 && this.bucket in ['4h', '8h', '12h']) || "
      "(this.range == 6 && this.bucket in ['8h', '12h', '1d'])"
  };

  // Zipped asset route identifier.
  uint32 zipped_asset_id = 1 [(buf.validate.field).uint32.gt = 0];

  // Standard history window. Defaults to 1 day when unspecified.
  ChainAnalyticsRange range = 2 [(buf.validate.field).enum.defined_only = true];

  // Optional explicit bucket. Allowed values are 1m, 5m, 10m, 15m, 30m, 1h, 2h, 4h, 8h, 12h, or 1d.
  // Valid buckets depend on range to keep chart payloads near 1k points.
  // When omitted, the server picks the default bucket for the selected range.
  string bucket = 3 [(buf.validate.field).string = {
    max_len: 3
    pattern: "^$|^(1m|5m|10m|15m|30m|1h|2h|4h|8h|12h|1d)$"
  }];

  // Optional inclusive start timestamp in seconds since Unix epoch.
  fixed32 start_ts_sec = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed32.gt = 0
  ];

  // Optional inclusive end timestamp in seconds since Unix epoch.
  fixed32 end_ts_sec = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed32.gt = 0
  ];
}

// GetZippedAssetSupplyResponse returns zipped asset supply chart columns.
message GetZippedAssetSupplyResponse {
  // Zipped asset route identifier.
  uint32 zipped_asset_id = 1;

  // Resolved history window.
  ChainAnalyticsRange range = 2;

  // Resolved bucket duration.
  string bucket = 3;

  // First bucket timestamp in seconds since Unix epoch.
  fixed32 start_ts_sec = 4;

  // Last bucket timestamp in seconds since Unix epoch.
  fixed32 end_ts_sec = 5;

  // Number of buckets represented by each value column.
  uint32 points = 6;

  // Total zToken supply per bucket in asset units scaled by the asset quantity scale.
  // Resolve the scale from Spot Config for the zipped asset's unified asset.
  repeated uint64 total_supply_q = 7;
}

// ZippedAssetSupplySeries is one zipped asset supply column in a grouped chart.
message ZippedAssetSupplySeries {
  // Zipped asset route identifier.
  uint32 zipped_asset_id = 1;

  // Total zToken supply per bucket in asset units scaled by the asset quantity scale.
  // Resolve the scale from Spot Config for the zipped asset's unified asset.
  repeated uint64 total_supply_q = 2;
}

