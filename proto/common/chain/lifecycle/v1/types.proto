syntax = "proto3";

package chain.lifecycle.v1;

import "polyester/type/v1/u128.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/chain/lifecycle/v1;chainlifecyclev1";

// AssetIds identifies the asset roles involved in one lifecycle.
message AssetIds {
  // Chain asset identifier for the chain-specific asset mapping row. This is
  // the canonical id from `chain_zipped_assets`, which already represents the
  // source-chain asset metadata plus its mapped zToken relationship when
  // relevant.
  uint32 chain_asset_id = 1;

  reserved 2;

  // Unified asset identifier for the uAsset used by funding or trading flows
  // when relevant. This is the canonical Polyester asset identity used by
  // FundingAccount, TradingGateway, Lending, and other downstream product
  // domains.
  uint32 unified_asset_id = 3;
}

// RequestFeeStatus identifies the current lifecycle state of a request-scoped
// on-chain fee snapshot.
enum RequestFeeStatus {
  REQUEST_FEE_STATUS_UNSPECIFIED = 0;

  // The request locked a fee snapshot at creation time.
  REQUEST_FEE_STATUS_LOCKED = 1;

  // The request completed far enough for the locked fee to settle.
  REQUEST_FEE_STATUS_SETTLED = 2;
}

// RequestFee captures the on-chain fee associated with a deposit or withdrawal
// request. This is separate from `amount_e18`, which remains the request
// principal or net credited lifecycle amount.
message RequestFee {
  AssetIds asset_ids = 1;
  polyester.type.v1.U128 amount_e18 = 2;
  string recipient_address = 3;
  RequestFeeStatus status = 4;
}

// FlowKind identifies the product flow family.
enum FlowKind {
  KIND_UNSPECIFIED = 0;

  // Deposit flow into Polyester-controlled assets or accounts.
  KIND_DEPOSIT = 1;

  // Withdraw flow out of Polyester-controlled assets or accounts.
  KIND_WITHDRAW = 2;

  // Internal transfer flow between Polyester-controlled accounts.
  KIND_TRANSFER = 3;
}

// FlowDomain identifies the product domain that currently owns or processes the
// value represented by the lifecycle.
enum FlowDomain {
  DOMAIN_UNSPECIFIED = 0;

  // Value still belongs to an external chain outside Polyester.
  DOMAIN_EXTERNAL_CHAIN = 1;

  // Value is inside the Zipper layer on Polyester Chain.
  DOMAIN_ZIPPER = 2;

  // Value is inside FundingAccount.
  DOMAIN_FUNDING = 3;

  // Value is inside TradingGateway or the trading domain.
  DOMAIN_TRADING = 4;

  // Value is inside the lending domain or pool.
  DOMAIN_LENDING = 5;
}

// LifecycleSource identifies the subsystem that emitted a normalized fact or
// visible milestone.
enum LifecycleSource {
  SOURCE_UNSPECIFIED = 0;

  // Off-chain relayer or source-chain watcher.
  SOURCE_RELAYER = 1;

  // Polyester Chain contract event or other chain-owned lifecycle fact.
  SOURCE_POLYESTER_CHAIN = 2;

  // Executor-owned lifecycle fact.
  SOURCE_EXECUTOR = 3;

  // Off-chain ledger posting or settlement fact.
  SOURCE_LEDGER = 4;
}

// FlowState is the latest lifecycle state after folding normalized facts.
enum FlowState {
  STATE_UNSPECIFIED = 0;

  // Flow exists and is still waiting on source-chain progress.
  STATE_PENDING_SOURCE = 1;

  // Flow is now progressing on Polyester Chain after source readiness.
  STATE_PENDING_POLYESTER_CHAIN = 2;

  // Flow is now waiting for an off-chain ledger effect or settlement effect.
  STATE_PENDING_LEDGER = 3;

  // Flow completed successfully.
  STATE_COMPLETED = 4;

  // Flow failed and is no longer progressing.
  STATE_FAILED = 5;

  // Flow was dropped before successful completion.
  STATE_DROPPED = 6;

  // Flow ended in a refund or reversal.
  STATE_REFUNDED = 7;
}
