syntax = "proto3";

package chain.deposit.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/chain/deposit/v1;chaindepositv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Deposit Addresses"
      description:
        "Create and list deposit addresses for a Polyester account or "
        "subaccount."
    }
  ]
};

// DepositAddress describes one assigned deposit address for one external chain.
message DepositAddress {
  // PolyChain-registered source chain id used across deposit flows.
  uint32 chain_id = 1;

  // Assigned external-chain deposit address for the selected account target.
  string deposit_address = 2;
}

// CreateDepositAddressRequest creates or returns the deposit address for one
// selected account target and chain.
message CreateDepositAddressRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  fixed64 subaccount_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed64.gt = 0
  ];

  // PolyChain-registered source chain id to assign the deposit address for.
  uint32 chain_id = 2 [(buf.validate.field).uint32.gt = 0];
}

// CreateDepositAddressResponse returns the assigned deposit address for the
// requested target and chain.
message CreateDepositAddressResponse {
  // Assigned deposit address for the requested target and chain.
  DepositAddress deposit_address = 1;
}

// ListDepositAddressesRequest lists known deposit addresses for one selected
// account target.
message ListDepositAddressesRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  fixed64 subaccount_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed64.gt = 0
  ];

  // Optional PolyChain-registered source chain id filter. When omitted, the
  // response returns the known deposit addresses for the selected target on
  // chains that currently accept deposits, ordered by ascending chain id. A
  // chain whose deposits are unavailable returns FailedPrecondition.
  uint32 chain_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).uint32.gt = 0
  ];
}

// ListDepositAddressesResponse returns the known deposit addresses for the
// selected target on chains that currently accept deposits, ordered by
// ascending chain id.
message ListDepositAddressesResponse {
  // Known deposit addresses for the selected target.
  repeated DepositAddress deposit_addresses = 1;
}

// DepositAddressService manages deposit addresses for root accounts and
// subaccounts.
service DepositAddressService {
  option (polyester.api.docs_group) = "chain";

  // Create or return the assigned deposit address for one target and source
  // chain. The acting caller's root account must have accepted the current
  // terms, including requests using an API key or targeting a shared subaccount.
  // Otherwise FailedPrecondition is returned. Listing and using existing deposit
  // addresses remain available without acceptance. FailedPrecondition is also
  // returned when deposits on the requested chain are unavailable. An API key
  // needs CREATE_DEPOSIT_ADDRESS within its scope.
  rpc CreateDepositAddress(CreateDepositAddressRequest) returns (CreateDepositAddressResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {
      post: "/v1/chain/deposit-addresses"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Deposit Address"
      description:
        "Create or return the assigned deposit address for one "
        "account target and source chain. Requires the acting caller's root account to have accepted the current terms, including when using an API key. "
        "An API key needs CREATE_DEPOSIT_ADDRESS within its scope."
      tags: "Deposit Addresses"
    };
  }

  // List known deposit addresses for one target on chains that currently
  // accept deposits. Results are served from Polyester-owned state rather than
  // a live upstream read. An API key needs READ_DEPOSIT_ADDRESSES within its
  // scope.
  rpc ListDepositAddresses(ListDepositAddressesRequest) returns (ListDepositAddressesResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/chain/deposit-addresses"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Deposit Addresses"
      description: "List known deposit addresses for one account target. An API key needs READ_DEPOSIT_ADDRESSES within its scope."
      tags: "Deposit Addresses"
    };
  }
}
