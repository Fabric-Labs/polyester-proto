syntax = "proto3";

package strategies.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/strategies/v1;strategiesv1";
// Document-level OpenAPI metadata for the Strategies API.
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Strategies Service"
      description: "Write, test and propose trading bots: the bot format, validation, behaviour examples, backtests, deploy proposals, and reads of the caller's bots."
    }
  ]
};

// ErrorCode identifies a Strategies API error.
enum ErrorCode {
  // No code.
  ERROR_UNSPECIFIED = 0;
  // No strategy version of the caller has this ID, or it expired. Another
  // account's version is reported the same way.
  VERSION_NOT_FOUND = 1;
  // No backtest of the caller has this ID.
  BACKTEST_NOT_FOUND = 2;
  // No deploy proposal of the caller has this ID.
  PROPOSAL_NOT_FOUND = 3;
  // No bot of the caller has this ID.
  BOT_NOT_FOUND = 4;
  // The requested runtime version is not offered. GetStrategyReference
  // without a runtime version names the current one.
  RUNTIME_VERSION_UNSUPPORTED = 5;
  // The manifest is larger than 65536 bytes (64 KiB), measured as compact
  // JSON.
  MANIFEST_TOO_LARGE = 6;
  // A setting is unknown to the version's settings form, or its value is not
  // a valid value of its kind or lies outside its bounds. field_path names it.
  SETTINGS_INVALID = 7;
  // A funding or initial balance names an asset twice, or an asset the bot's
  // markets do not trade. field_path names it.
  FUNDING_INVALID = 8;
  // The version did not validate: its check returned valid false. Fix the
  // errors and save the draft again.
  VERSION_INVALID = 9;
  // A behaviour example of the version fails, or the examples were never
  // run. RunScenarios shows each result.
  SCENARIOS_FAILING = 10;
  // The version has no finished backtest. A bot that cannot be backtested
  // (NOT_BACKTESTABLE, for any of the NotBacktestableReason causes) is exempt:
  // its proposal records why, and the deploy page tells the user before they
  // approve. Not returned until backtests are available.
  BACKTEST_MISSING = 11;
  // A market of the bot is not open to bots. markets lists them.
  MARKET_NOT_ALLOWED = 12;
  // The funding account does not hold the funding. shortfall gives the
  // missing amounts.
  INSUFFICIENT_FUNDS = 13;
  // The caller already runs as many bots as their VIP tier allows. bot_cap
  // gives the tier, the cap and the next tier's cap.
  BOT_CAP_REACHED = 14;
  // The backtest window holds no market data for the bot's markets and
  // timeframes.
  WINDOW_HAS_NO_DATA = 15;
  // The bot cannot be backtested on candles: it reacts to events candles do
  // not carry, such as top-of-book or trade updates, or social signals; it
  // reads trading volume, which the reference price history does not
  // include; its markets have different quote assets; or a market has no
  // reference candles over the window. Only bots that trade with market orders,
  // including exits on watched price levels, are backtested: a bot's first
  // limit order ends its backtest as NOT_BACKTESTABLE. ExplainStrategy says
  // so for what is known before a backtest runs: the events, markets and
  // quote assets the bot reads. A limit order is found only while it runs.
  NOT_BACKTESTABLE = 16;
  // The caller ran the most behaviour-example runs allowed per minute.
  // retry_after says when to try again.
  SCENARIO_RUN_LIMIT_REACHED = 17;
  // The caller started 200 backtests in the current UTC day, and retry_after
  // says when the day resets (00:00 UTC); or the caller has 3 backtests
  // queued or running, and retry_after is unset: one frees a slot when it
  // finishes. A request that returns an existing backtest, by the same key
  // or the same identity, never counts; starting a failed backtest again
  // under a new key counts as a new start.
  BACKTEST_LIMIT_REACHED = 18;
  // The caller's bots and backtests would read more distinct indicator
  // settings than allowed. Reuse an indicator setting another bot reads, or
  // stop a bot. Not returned until the limit is enforced.
  INDICATOR_SETTINGS_LIMIT_REACHED = 19;
  // The idempotency key was already used with a different request. The
  // original backtest, proposal, stop, strategy or saved draft stands.
  IDEMPOTENCY_CONFLICT = 20;
  // A required service is temporarily unavailable; retry the same request.
  // Every call of this API is safe to retry.
  SERVICE_UNAVAILABLE = 21;
  // The funding subaccount is not a subaccount of the caller's main account.
  FUNDING_SUBACCOUNT_NOT_FOUND = 22;
  // The bot has already stopped.
  BOT_NOT_RUNNING = 23;
  // The bot is already being stopped with the other stop mode. A bot is
  // stopped once; its orders can still be cancelled directly.
  BOT_ALREADY_STOPPING = 24;
  // No strategy of the caller has this ID. Another account's strategy is
  // reported the same way.
  STRATEGY_NOT_FOUND = 25;
  // The draft moved on since expected_revision: another save landed first.
  // revision_conflict gives the current revision and its version. Read the
  // strategy again, apply the change to its current draft, and save with
  // the new revision.
  DRAFT_REVISION_CONFLICT = 26;
  // The caller already has as many strategies as allowed. strategy_cap gives
  // the cap.
  STRATEGY_CAP_REACHED = 27;
  // No bot template has this ID. ListStrategyTemplates lists them.
  TEMPLATE_NOT_FOUND = 28;
  // The strategy is in use, so it can't be deleted: a bot deployed from it
  // hasn't stopped, or a deploy proposal of it is waiting to be deployed.
  // Stop the bot, or let the proposal expire, and delete it again.
  STRATEGY_IN_USE = 29;
  // The strategy has no revision with this number. Revisions are numbered
  // from 1, so zero is never one.
  REVISION_NOT_FOUND = 30;
  // The backtest hasn't finished, so it has no trades to list yet. Read its
  // status with GetBacktest.
  BACKTEST_NOT_DONE = 31;
  // Deploying a bot needs a recently MFA-elevated session (MFA_RECENT).
  // Complete MFA and deploy again; nothing was started.
  MFA_ELEVATION_REQUIRED = 32;
  // The deploy proposal expired before it was deployed. Propose the deploy
  // again.
  PROPOSAL_EXPIRED = 33;
  // The deploy needs a new subaccount, and the request carries no signed
  // authorization for it, or one that can no longer be used: a challenge
  // since replaced or expired. Request a new subaccount challenge, have the
  // user sign it, and deploy again with it. The deploy keeps its progress.
  SUBACCOUNT_AUTHORIZATION_REQUIRED = 34;
  // The strategy's notes were saved since expected_notes_revision: another
  // save landed first. notes_conflict gives the notes' current revision.
  // Read the notes again, apply the change to them, and save with the new
  // revision.
  NOTES_REVISION_CONFLICT = 35;
}

// BotCapDetail explains BOT_CAP_REACHED.
message BotCapDetail {
  // The caller's current VIP tier.
  uint32 vip_tier = 1;
  // The most bots the tier allows at once.
  uint32 bot_cap = 2;
  // Bots the caller runs now, deploying ones included.
  uint32 bots = 3;
  // The next VIP tier with a higher cap. Zero when no tier lifts it.
  uint32 next_vip_tier = 4;
  // The cap of next_vip_tier. Zero when no tier lifts it.
  uint32 next_bot_cap = 5;
}

// StrategyCapDetail explains STRATEGY_CAP_REACHED.
message StrategyCapDetail {
  // The most strategies an account may have.
  uint32 strategy_cap = 1;
  // Strategies the caller has now.
  uint32 strategies = 2;
}

// RevisionConflictDetail explains DRAFT_REVISION_CONFLICT: the strategy's
// current draft.
message RevisionConflictDetail {
  // The strategy's current revision. Zero when nothing was saved yet.
  uint64 revision = 1;
  // The version of the current revision. Empty when revision is zero. A
  // client that finds its own content's version here knows its save
  // already landed.
  string head_version_id = 2;
}

// ErrorDetail is attached to Strategies API errors as an error detail of type
// strategies.v1.ErrorDetail.
message ErrorDetail {
  // Stable error code.
  ErrorCode code = 1;
  // Request field the error is about, as a field path such as
  // settings[0].value or funding[1].asset. Set only with SETTINGS_INVALID,
  // FUNDING_INVALID and MANIFEST_TOO_LARGE.
  string field_path = 2;
  // When the same request may succeed. Set only with
  // SCENARIO_RUN_LIMIT_REACHED, and with BACKTEST_LIMIT_REACHED for the daily
  // limit.
  google.protobuf.Timestamp retry_after = 3;
  // Set only with BOT_CAP_REACHED.
  BotCapDetail bot_cap = 4;
  // Markets not open to bots, as the manifest names them. Set only with
  // MARKET_NOT_ALLOWED.
  repeated string markets = 5;
  // Amounts the funding account lacks, one per asset. Set only with
  // INSUFFICIENT_FUNDS.
  repeated Money shortfall = 6;
  // Set only with STRATEGY_CAP_REACHED.
  StrategyCapDetail strategy_cap = 7;
  // Set only with DRAFT_REVISION_CONFLICT.
  RevisionConflictDetail revision_conflict = 8;
  // Why the bot cannot be backtested. Set only with NOT_BACKTESTABLE.
  NotBacktestableReason not_backtestable_reason = 9;
  // The caller's backtest limits and use. Set only with
  // BACKTEST_LIMIT_REACHED.
  BacktestLimitDetail backtest_limit = 10;
  // Set only with NOTES_REVISION_CONFLICT.
  NotesConflictDetail notes_conflict = 11;
}

// NotesConflictDetail explains NOTES_REVISION_CONFLICT.
message NotesConflictDetail {
  // The notes' current revision. Zero when they were never saved.
  uint64 notes_revision = 1;
}

// BacktestLimitDetail is a caller's backtest limits and how much of them is
// used, as BACKTEST_LIMIT_REACHED reports them: daily_used reaching
// daily_limit is the daily limit, and retry_after says when the UTC day
// resets; active reaching active_limit is the limit at once, and a slot frees
// when one finishes.
message BacktestLimitDetail {
  // Backtests the caller may start per UTC day.
  uint32 daily_limit = 1;
  // Backtests the caller started in the current UTC day.
  uint32 daily_used = 2;
  // Backtests the caller may have queued or running at once.
  uint32 active_limit = 3;
  // Backtests the caller has queued or running.
  uint32 active = 4;
}

// NotBacktestableReason is why a bot cannot be backtested on candles. Such a
// bot can still be proposed and deployed without a backtest; the proposal
// says why.
enum NotBacktestableReason {
  // Not set. Never returned.
  NOT_BACKTESTABLE_REASON_UNSPECIFIED = 0;
  // It reacts to trades or to quotes, which candles do not carry.
  REACTS_TO_TRADES_OR_QUOTES = 1;
  // It reads social signals, which have no recorded history.
  READS_SOCIAL_SIGNALS = 2;
  // Its markets have different quote assets.
  MIXED_QUOTE_ASSETS = 3;
  // A market has no reference candles over the window.
  NO_REFERENCE_CANDLES = 4;
  // It places limit orders, which are not backtested yet.
  PLACES_LIMIT_ORDERS = 5;
  // It reads trading volume, such as a candle's volume or the VWAP
  // indicator, which the reference price history a backtest replays does
  // not include.
  READS_VOLUME = 6;
}

// Money is an exact amount of one asset.
message Money {
  // Asset symbol, for example USDT.
  string asset = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Exact, non-negative decimal amount in whole asset units, for example "50"
  // or "0.0125". Never a binary floating-point value.
  string amount = 2 [(buf.validate.field).string.pattern = "^[0-9]{1,30}(\\.[0-9]{1,18})?$"];
}

// OrderSide is the side of an order.
enum OrderSide {
  // Not set. Never returned.
  SIDE_UNSPECIFIED = 0;
  // Buy the market's base asset.
  BUY = 1;
  // Sell the market's base asset.
  SELL = 2;
}

// TimeWindow is a span of time: start_time inclusive, end_time exclusive.
message TimeWindow {
  // Start of the window, inclusive.
  google.protobuf.Timestamp start_time = 1;
  // End of the window, exclusive.
  google.protobuf.Timestamp end_time = 2;
}

// IndicatorLibrary names the indicator library a runtime version computes
// indicators with.
message IndicatorLibrary {
  // Library name.
  string name = 1;
  // Exact library version, pinned for every bot deployed on the runtime
  // version.
  string version = 2;
}

// IndicatorParameter is one parameter of an allowed indicator.
message IndicatorParameter {
  // Parameter name, as bot code passes it, for example period.
  string name = 1;
  // What the parameter sets.
  string description = 2;
  // Smallest allowed value, as an exact decimal.
  string minimum = 3;
  // Largest allowed value, as an exact decimal.
  string maximum = 4;
  // Value used when bot code omits the parameter, as an exact decimal.
  string default_value = 5;
  // True when only whole numbers are allowed.
  bool integer = 6;
}

// Indicator is one indicator bot code may read.
message Indicator {
  // Indicator name, as bot code calls it, for example rsi.
  string name = 1;
  // What the indicator measures.
  string description = 2;
  // Parameters, in the order bot code passes them.
  repeated IndicatorParameter parameters = 3;
  // Output names, as bot code reads them: value first, then any others, for
  // example value alone for RSI, or value (the middle band), upper and lower
  // for Bollinger bands.
  repeated string outputs = 4;
  // Closed candles needed before the indicator has a value, as a sum of its
  // parameter names and whole numbers joined by + and -, for example
  // "period + 1". Until then bot code reads no value.
  string warmup_bars = 5;
}

// StrategyLimits are the limits every bot of a runtime version runs under.
message StrategyLimits {
  // CPU time one handler call may use, in milliseconds.
  uint32 cpu_ms_per_call = 1;
  // Memory one handler call may use, in bytes.
  uint64 memory_bytes_per_call = 2;
  // Largest saved bot state, in bytes.
  uint64 state_bytes = 3;
  // Largest bot code, in bytes.
  uint64 code_bytes = 4;
  // Largest manifest, in bytes of compact JSON.
  uint64 manifest_bytes = 5;
  // Most RunScenarios calls the caller may make per minute.
  uint32 scenario_runs_per_minute = 8;
}

// GetStrategyReferenceRequest asks for what bot code is written against.
message GetStrategyReferenceRequest {
  // Runtime version to describe. Empty means the current one. One runtime
  // version is offered; any other value is RUNTIME_VERSION_UNSUPPORTED.
  string runtime_version = 1 [(buf.validate.field).string.max_len = 64];
}

// GetStrategyReferenceResponse is the bot format of one runtime version, and
// the skill pack for writing bots. Every field is always set.
message GetStrategyReferenceResponse {
  // The runtime version described, for example 2026-11.
  string runtime_version = 1;
  // The indicator library and its pinned version.
  IndicatorLibrary indicator_library = 2;
  // The bot API reference as Markdown: events and handlers, the manifest,
  // reads, actions, money rules, limits and language rules, with examples.
  string reference = 3;
  // JSON Schema (draft 2020-12) of the manifest: its fields, their types and
  // their bounds. The validation SaveDraftVersion runs is the authority, and
  // also checks rules across fields, such as a market listed in markets or
  // the markets' one quote asset, as the reference describes.
  google.protobuf.Struct manifest_schema = 4;
  // Every indicator bot code may read.
  repeated Indicator indicators = 5;
  // Limits every bot of this runtime version runs under.
  StrategyLimits limits = 6;
  // The skill pack: guidance for writing bots against the reference (the
  // workflow, the language subset, patterns and pitfalls), one Markdown
  // document per part, workflow first.
  repeated SkillDocument skill_pack = 7;
  // Version of the skill pack: "sha256:" followed by the lowercase hex
  // SHA-256 of, for each document in skill_pack order, the UTF-8 bytes of its
  // name and then of its Markdown, each preceded by its length in bytes as an
  // unsigned 64-bit big-endian integer. It changes exactly when a document's
  // name, content or position does.
  string skill_pack_version = 8;
}

// SkillDocument is one document of the skill pack.
message SkillDocument {
  // File name of the document, for example writing-bots.md. Links between
  // documents use these names.
  string name = 1;
  // The document, as Markdown.
  string markdown = 2;
}

// StrategyTemplate is a starting point for a bot.
message StrategyTemplate {
  // Stable template ID, for example weekly-dca.
  string template_id = 1;
  // Display name.
  string name = 2;
  // What the template's bot does.
  string description = 3;
  // The template's manifest, as SaveDraftVersion takes it.
  google.protobuf.Struct manifest = 4;
  // The template's bot code.
  string code = 5;
  // Runtime version the template is written for.
  string runtime_version = 6;
  // What the template's bot may do with money, the markets it trades and the
  // events it handles: the card a version saved from the template unchanged
  // shows.
  MoneyCard money_card = 7;
}

// ListStrategyTemplatesRequest lists the bot templates.
message ListStrategyTemplatesRequest {}

// ListStrategyTemplatesResponse returns every bot template.
message ListStrategyTemplatesResponse {
  // Every template, in display order. The list is short and complete; it is
  // not paginated.
  repeated StrategyTemplate templates = 1;
}

// ValidationIssue is one problem a version's check found.
message ValidationIssue {
  // Path of the manifest value at fault, for example limits.max_order.amount.
  // Empty when the issue is in the code.
  string manifest_path = 1;
  // Line of the code at fault, from 1. Zero when the issue is in the
  // manifest.
  uint32 line = 2;
  // Column of the code at fault, from 1. Zero when unknown or when the issue
  // is in the manifest.
  uint32 column = 3;
  // Stable rule identifier, for example UNSUPPORTED_SYNTAX, UNKNOWN_CALL,
  // MISSING_REASON, LIMIT_ABOVE_MAXIMUM or SCENARIO_UNPARSEABLE. A runtime
  // version may add rules.
  string rule = 4;
  // What is wrong.
  string message = 5;
  // What to change to fix it.
  string hint = 6;
}

// MoneyCard is what a bot may do with money, in the quote asset of its
// markets.
message MoneyCard {
  // Most the bot may spend in total. Unset until a total spending limit is
  // enforced; the funding a deploy moves bounds what the bot can spend.
  Money budget = 1;
  // Largest single order.
  Money max_order = 2;
  // Most good-till-cancelled orders the bot may have open at once.
  uint32 max_open_gtc_orders = 3;
  // Loss within one UTC day the manifest declares as the bot's threshold.
  // Declared only: nothing pauses or stops a bot on it yet. Unset when the
  // manifest declares none.
  Money daily_loss_threshold = 4;
  // Markets the bot trades, for example BTC/USDT.
  repeated string markets = 5;
  // Events the bot handles, as the manifest declares them, for example
  // "schedule mon 09:00 UTC" or "candles BTC/USDT 1h".
  repeated string events = 6;
}

// SettingField is one setting a user may change without editing code.
message SettingField {
  // Setting name, as bot code reads it.
  string name = 1;
  // What the setting controls.
  string description = 2;
  // Kind of value, as the manifest declares it, for example quote for an
  // amount of the quote asset.
  string kind = 3;
  // Asset of an amount setting. Empty for other kinds.
  string asset = 4;
  // Value used when none is given.
  string default_value = 5;
  // Smallest allowed value. Empty when unbounded.
  string minimum = 6;
  // Largest allowed value. Empty when unbounded.
  string maximum = 7;
}

// VersionValidation is a version's check result: whether the bot is valid,
// its errors and warnings, and what it may do with money.
message VersionValidation {
  // ID of the stored version, derived from the runtime version, manifest and
  // code: the same content always gets the same ID.
  string version_id = 1;
  // The runtime version validated against.
  string runtime_version = 2;
  // True when the bot has no errors.
  bool valid = 3;
  // Errors, in code and manifest order: at most 50. Further errors may show
  // once these are fixed.
  repeated ValidationIssue errors = 4;
  // Warnings, in the same order and shape: at most 50.
  repeated ValidationIssue warnings = 5;
  // What the bot may do with money. Set only when valid.
  MoneyCard money_card = 6;
  // The settings a user may change. Set only when valid.
  repeated SettingField settings_form = 7;
  // What wakes the bot, what it checks and what it may do, read from its
  // code and manifest. Set only when valid.
  StrategyFlow flow = 8;
}

// RunScenariosRequest runs a version's behaviour examples.
message RunScenariosRequest {
  // Version to run.
  string version_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// ScenarioResult is the outcome of one behaviour example.
message ScenarioResult {
  // The example's name, from the manifest.
  string name = 1;
  // True when the handler ran without an error, made exactly the expected
  // orders and cancels, in order, and watches every expected level.
  bool passed = 2;
  // The orders the example expects, as the manifest writes them.
  repeated google.protobuf.Struct expected = 3;
  // The orders the code made, in the same shape.
  repeated google.protobuf.Struct actual = 4;
  // The code's log lines, oldest first: at most 50.
  repeated string logs = 5;
  // The handler's error, when it failed. Empty otherwise.
  string error = 6;
}

// RunScenariosResponse is the outcome of every behaviour example of a
// version.
message RunScenariosResponse {
  // The version run.
  string version_id = 1;
  // Examples that passed.
  uint32 passed = 2;
  // Examples that failed.
  uint32 failed = 3;
  // One result per example, in manifest order.
  repeated ScenarioResult results = 4;
}

// BacktestMetrics are the results of a bot over one period.
message BacktestMetrics {
  // Return over the period, in percent, for example "4.2" or "-1.5".
  string return_percent = 1;
  // Largest fall from a peak, in percent.
  string max_drawdown_percent = 2;
  // Trades made.
  uint32 trades = 3;
  // Share of closed trades that made a profit, in percent.
  string win_rate_percent = 4;
  // Fees paid, in the quote asset.
  Money fees = 5;
  // Share of the period the bot held a position, in percent.
  string exposure_percent = 6;
  // Annualized Sharpe ratio of the daily returns, with a zero risk-free rate,
  // for example "1.4". Unset when undefined: with fewer than two daily
  // returns, or when they never vary.
  optional string sharpe_ratio = 7;
  // Profit and loss realized by the period's sells, in the quote asset, after
  // their fees. Signed base-10 decimal string, for example "12.5" or
  // "-3.25".
  string realized_pnl = 8;
  // When the largest fall started: its peak.
  google.protobuf.Timestamp max_drawdown_start = 9;
  // When the largest fall ended: its trough.
  google.protobuf.Timestamp max_drawdown_end = 10;
  // Equity at the period's start, exactly, as an exact decimal in the quote
  // asset: the equity curve is sampled, so read the bounds here. For the
  // tuning period (or the whole window without a split) it is the initial
  // balances, any base asset valued at the reference open of the window's
  // first bar. For the held-back period it is the equity at the split, the
  // open position marked at the last close before it.
  string start_equity = 11;
  // Equity at the period's end, exactly, as an exact decimal in the quote
  // asset: the equity at the period's last close, an open position marked at
  // that close.
  string end_equity = 12;
}

// EvidenceGrade is how much a backtest's result can be trusted: it follows
// from its closed trades, the days its market data fully covers, and its
// gaps, never from the calendar span alone.
enum EvidenceGrade {
  // Not set. Never returned on a finished backtest.
  EVIDENCE_GRADE_UNSPECIFIED = 0;
  // Too few trades or too little covered data to judge.
  NOT_ENOUGH = 1;
  // Some evidence.
  LOW = 2;
  // Fair evidence.
  MEDIUM = 3;
  // Strong evidence.
  HIGH = 4;
}

// BacktestScenario is a backtest's result under one cost scenario.
message BacktestScenario {
  // The scenario: low, base or high.
  string name = 1;
  // Slippage per side, in basis points.
  uint32 slippage_bps = 2;
  // Results over the report's period.
  BacktestMetrics metrics = 3;
  // Results over the report's held-back period. Unset without one.
  BacktestMetrics held_back_metrics = 4;
}

// EquityPoint is one point of a backtest's equity curve.
message EquityPoint {
  // The time, in simulated time.
  google.protobuf.Timestamp time = 1;
  // The bot's equity, as an exact decimal in the quote asset.
  string equity = 2;
  // Buy-and-hold's equity at the same time, from the same starting balance.
  string buy_and_hold_equity = 3;
}

// Baseline is a simple strategy a backtest is compared with.
message Baseline {
  // Baseline name: buy_and_hold or cash.
  string name = 1;
  // Its results over the same period.
  BacktestMetrics metrics = 2;
}

// BacktestTrade is one trade a backtest made.
message BacktestTrade {
  // When the trade happened, in simulated time.
  google.protobuf.Timestamp time = 1;
  // Market, for example BTC/USDT.
  string market = 2;
  // Side.
  OrderSide side = 3;
  // Price, as an exact decimal in the quote asset.
  string price = 4;
  // Quantity, as an exact decimal in the base asset.
  string quantity = 5;
  // Fee paid.
  Money fee = 6;
  // The reason the bot gave for the order.
  string reason = 7;
  // Profit and loss this trade realized, in the quote asset, after its fee.
  // Signed base-10 decimal string, for example "4.1" or "-0.75". Empty on a
  // buy, which only opens or adds to a position.
  string realized_pnl = 8;
  // The trade's position among the backtest's trades, numbered from 0 in
  // the order they filled. ListBacktestTrades pages in this order.
  uint64 trade_index = 9;
  // True when the market data the order would have filled on was missing,
  // so it filled at the first price after the gap.
  bool after_gap = 10;
}

// DataGap is a span with missing market data.
message DataGap {
  // Market, for example BTC/USDT.
  string market = 1;
  // Candle timeframe, for example 1h.
  string timeframe = 2;
  // The span without data.
  TimeWindow window = 3;
  // True when the bot was exposed across it: it held a position, watched a
  // price level or had an order waiting on that market. What happened inside
  // the gap is unknown, so the result is less certain.
  bool affected = 4;
}

// BacktestReport is the result of a finished backtest. Only bots that trade
// with market orders, including exits on watched price levels, are
// backtested. Every amount is in the bot's markets' one quote asset. The
// results below are for the base cost scenario; scenarios gives the range.
message BacktestReport {
  // What was simulated and how, as a short label naming every assumption:
  // the candles, the reference prices, the spread and slippage, when orders
  // fill, the fees and the starting balance.
  string fidelity = 1;
  // The period the bot was tuned on. With a window too short to hold months
  // back, it is the whole window.
  TimeWindow period = 3;
  // The most recent months, held back from tuning. Unset when the window is
  // too short to hold months back.
  TimeWindow held_back_period = 4;
  // Results over period.
  BacktestMetrics metrics = 5;
  // Results over held_back_period. Unset without one.
  BacktestMetrics held_back_metrics = 6;
  // The baselines over period: buy-and-hold and cash.
  repeated Baseline baselines = 7;
  // The first trades of the whole window, oldest first: at most 20.
  // ListBacktestTrades lists all of them.
  repeated BacktestTrade trades = 9;
  // Spans without market data, oldest first.
  repeated DataGap data_gaps = 10;
  // What to keep in mind when reading the result.
  repeated string warnings = 11;
  // How much the result can be trusted.
  EvidenceGrade evidence_grade = 13;
  // The baselines over held_back_period. Empty without one.
  repeated Baseline held_back_baselines = 14;
  // The result under each cost scenario, low, base and high: the range to
  // read, never one exact number.
  repeated BacktestScenario scenarios = 15;
  // The equity curve over the whole window, with buy-and-hold's, at most
  // 1,000 points, oldest first. It is sampled, but always holds the peaks and
  // troughs of every largest fall reported.
  repeated EquityPoint equity = 16;
  // Where held_back_period starts on the curve. Unset without one.
  google.protobuf.Timestamp held_back_start = 17;
  // The largest fall over the whole window, in percent.
  string window_max_drawdown_percent = 18;
  // When the whole window's largest fall started: its peak.
  google.protobuf.Timestamp window_max_drawdown_start = 19;
  // When the whole window's largest fall ended: its trough.
  google.protobuf.Timestamp window_max_drawdown_end = 20;
  // True when the caller's earlier backtests already showed part of
  // held_back_period, so it is no longer excluded from tuning.
  bool held_back_seen = 21;
}

// Backtest is one backtest of a version.
message Backtest {
  // Status is where a backtest is.
  enum Status {
    // Not set. Never returned.
    STATUS_UNSPECIFIED = 0;
    // Waiting for capacity.
    QUEUED = 1;
    // Simulating.
    RUNNING = 2;
    // Finished: report is set.
    DONE = 3;
    // Failed: failure says why.
    FAILED = 4;
    // Ended without a result because the bot cannot be backtested on
    // candles, for example at its first limit order: not_backtestable_reason
    // says why. It is not an error, and running it again gives the same
    // answer. Such a bot can still be proposed and deployed without a
    // backtest.
    NOT_BACKTESTABLE = 5;
  }

  // Public backtest ID.
  fixed64 backtest_id = 1;
  // The version backtested.
  string version_id = 2;
  // Current status.
  Status status = 3;
  // The simulated window.
  TimeWindow window = 4;
  // When the backtest was started.
  google.protobuf.Timestamp created_at = 5;
  // When it finished or failed. Omitted before.
  google.protobuf.Timestamp finished_at = 6;
  // The result. Set only when status is DONE.
  BacktestReport report = 7;
  // Why it failed. Empty unless status is FAILED.
  string failure = 8;
  // Backtests the caller ran so far of this bot's versions. Many attempts
  // make a good result more likely to be luck.
  uint32 attempts = 9;
  // Why the bot cannot be backtested. Set only when status is
  // NOT_BACKTESTABLE.
  NotBacktestableReason not_backtestable_reason = 10;
}

// StartBacktestRequest starts a backtest of a version.
//
// A retry is bound by idempotency_key: the same key and request return the
// backtest the first request started, even when an unset window bound would
// now resolve differently, and never count again against the backtest quota
// or the attempts.
//
// Across keys, a backtest's identity is its version, effective window,
// effective settings, effective initial balances, and what the platform
// resolves when the request arrives: the caller's fee rates, the platform's
// spread, slippage and fill assumptions, and the simulation's versions. A
// request whose identity matches an earlier backtest of the caller returns
// that backtest rather than running again, so a request that spells out a
// default refers to the same run, while a request that changes any of them,
// or arrives after the platform's part changed, starts a new one:
// - effective window: start_time and end_time, each floored to a whole
//   second; an unset end is the end of the longest window with data when
//   the request arrives, and an unset start is 365 days before the window's
//   end, or the start of that longest window when its data is shorter;
// - effective settings: every setting of the version's settings form, by
//   name, with its default value where the request leaves it out;
// - effective initial balances: initial_balances, or when it is empty,
//   1,000 of the bot's quote asset; one per asset, sorted by asset;
// - every decimal in its canonical form, without leading zeros or trailing
//   fractional zeros, so "50", "50.0" and "050" are the same amount.
message StartBacktestRequest {
  // Version to backtest.
  string version_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Start of the window, inclusive, floored to a whole second. Unset means
  // the most recent 365 days of data: 365 days before the window's end, or
  // the start of the longest window with data for the bot's markets and
  // timeframes when that is shorter.
  google.protobuf.Timestamp start_time = 2;
  // End of the window, exclusive, floored to a whole second. Unset means the
  // end of that longest window.
  google.protobuf.Timestamp end_time = 3;
  // Values for the version's settings form, at most 64, each setting once.
  // Settings left out take their default value.
  repeated SettingValue settings = 4 [(buf.validate.field).repeated.max_items = 64];
  // Starting balances of the simulated account, one per asset of the bot's
  // markets, each amount more than 0: a zero or negative amount is
  // FUNDING_INVALID. Empty, whether left out or sent as an empty list, means
  // 1,000 of the bot's quote asset, for example 1000 USDT, whatever its
  // settings, such as a budget that is the amount of each buy. Part of the
  // backtest's identity: the same run with other balances is another
  // backtest.
  repeated Money initial_balances = 5 [(buf.validate.field).repeated.max_items = 16];
  // Client-chosen key, unique per caller, that makes the call idempotent: the
  // same key and request return the backtest the first call started; another
  // request with the same key is IDEMPOTENCY_CONFLICT.
  string idempotency_key = 6 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$"];
}

// StartBacktestResponse is the started backtest.
message StartBacktestResponse {
  // Public backtest ID. A retry with the same idempotency_key and request
  // returns the same ID; across keys, so does a request with the same
  // identity (see StartBacktestRequest).
  fixed64 backtest_id = 1;
  // Status: QUEUED for a new backtest, or the current status of the same
  // backtest started before.
  Backtest.Status status = 2;
  // Estimated seconds until it finishes.
  uint32 estimated_seconds = 3;
}

// GetBacktestRequest reads one backtest of the caller.
message GetBacktestRequest {
  // Public backtest ID.
  fixed64 backtest_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetBacktestResponse returns the backtest.
message GetBacktestResponse {
  // The backtest.
  Backtest backtest = 1;
}

// ListBacktestTradesRequest reads one page of a finished backtest's trades.
message ListBacktestTradesRequest {
  // Public backtest ID.
  fixed64 backtest_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Page token from a previous response; empty for the first page. It is
  // opaque and exclusive: it carries the last trade_index returned, so the
  // next page starts after it, and it is bound to the caller and the
  // backtest it came from.
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
  // Most trades to return, at most 1,000. Zero means 100.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 1000];
}

// ListBacktestTradesResponse is one page of trades, in trade_index order.
message ListBacktestTradesResponse {
  // The trades.
  repeated BacktestTrade trades = 1;
  // Token for the next page, after the last trade returned; empty on the
  // last page. It is valid only for the same caller and backtest.
  string next_page_token = 2;
}

// ScenarioSummary is one behaviour example of a version and its last result.
message ScenarioSummary {
  // Outcome is a behaviour example's last result.
  enum Outcome {
    // Not set. Never returned.
    OUTCOME_UNSPECIFIED = 0;
    // The examples were never run.
    NOT_RUN = 1;
    // The code made exactly the expected orders.
    PASSED = 2;
    // The code made other orders, or failed.
    FAILED = 3;
  }

  // The example's name, from the manifest.
  string name = 1;
  // Its last result.
  Outcome outcome = 2;
}

// BacktestSummary is the headline of a version's latest backtest.
message BacktestSummary {
  // Public backtest ID.
  fixed64 backtest_id = 1;
  // Its status.
  Backtest.Status status = 2;
  // Results over the tuning period. Set only when status is DONE.
  BacktestMetrics metrics = 3;
  // Results over the held-back period. Set only when status is DONE.
  BacktestMetrics held_back_metrics = 4;
  // Backtests run so far for this bot's family of versions.
  uint32 attempts = 5;
}

// ExplainStrategyRequest asks for the review summary of a version.
message ExplainStrategyRequest {
  // Version to explain.
  string version_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// ExplainStrategyResponse is what a user reviews before deploying a version.
// It is built from the manifest and the recorded results alone, so it states
// exactly what the user approves.
message ExplainStrategyResponse {
  // The version explained.
  string version_id = 1;
  // What the bot may do with money, its markets and its events.
  MoneyCard money_card = 2;
  // The settings a user may change.
  repeated SettingField settings = 3;
  // Each behaviour example and its last result, in manifest order.
  repeated ScenarioSummary scenarios = 4;
  // The latest backtest. Omitted when there is none; backtest_absent_reason
  // then says why.
  BacktestSummary backtest = 5;
  // Why there is no backtest, for example that the bot cannot be backtested
  // on candles. Empty when backtest is set.
  string backtest_absent_reason = 6;
  // What to weigh before deploying, for example "never backtested" or "trades
  // a thin market".
  repeated string warnings = 7;
  // What the bot does not do, for example "stopping the bot does not sell its
  // holdings".
  repeated string limitations = 8;
}

// SettingValue is one setting and its value.
message SettingValue {
  // Setting name, from the settings form.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Its value, as a string: an amount or number as an exact decimal.
  string value = 2 [(buf.validate.field).string.max_len = 256];
  // What the setting controls, from the settings form. Set by GetBot;
  // leave it empty in requests.
  string description = 3;
  // Kind of value, from the settings form, for example quote for an amount
  // of the quote asset. Set by GetBot; leave it empty in requests.
  string kind = 4;
  // Asset of an amount setting, from the settings form. Empty for other
  // kinds. Set by GetBot; leave it empty in requests.
  string asset = 5;
}

// DeployProposalSummary is what a deploy proposal binds, for showing beside
// its link.
message DeployProposalSummary {
  // The version proposed.
  string version_id = 1;
  // The bot's name.
  string bot_name = 2;
  // What the bot may do with money.
  MoneyCard money_card = 3;
  // Every setting, with its value, in settings-form order.
  repeated SettingValue settings = 4;
  // The subaccount the funding comes from. Zero means the main account.
  fixed64 funding_subaccount_id = 8;
  // What moves into the bot's new subaccount from the funding account.
  repeated Money funding = 5;
  // Behaviour examples that passed.
  uint32 scenarios_passed = 6;
  // The version's latest backtest. Omitted when the bot cannot be
  // backtested; not_backtestable_reason then says why.
  BacktestSummary backtest = 7;
  // The strategy the proposal came from. Zero once the strategy is deleted.
  fixed64 strategy_id = 9;
  // The strategy's revision proposed, whose version is version_id. Zero once
  // the strategy is deleted.
  uint64 revision = 10;
  // Why the bot was not backtested, when it cannot be: the deploy page tells
  // the user before they approve. Unset when backtest is set.
  NotBacktestableReason not_backtestable_reason = 11;
}

// ProposeDeployRequest records a deploy proposal. It never deploys.
message ProposeDeployRequest {
  // Public ID of the caller's strategy to deploy.
  fixed64 strategy_id = 7 [(buf.validate.field).fixed64.gt = 0];
  // The strategy's revision to deploy, as SaveDraftVersion and GetStrategy
  // return it: its version is the one proposed. A revision the strategy
  // doesn't have, zero included, is REVISION_NOT_FOUND.
  uint64 revision = 8;
  // Name of the new bot.
  string bot_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Values for the version's settings form, at most 64, each setting once.
  // Settings left out take their default value.
  repeated SettingValue settings = 3 [(buf.validate.field).repeated.max_items = 64];
  // Assets and amounts to move from the funding account into the bot's new
  // subaccount when the user deploys it: one to 16 assets, each once.
  repeated Money funding = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
  }];
  // Client-chosen key, unique per caller, that makes the call idempotent: the
  // same key and request return the proposal the first call recorded; another
  // request with the same key is IDEMPOTENCY_CONFLICT.
  string idempotency_key = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$"];
  // The subaccount that funds the bot. Zero means the main account. It must
  // be an active subaccount of the caller's main account; any other,
  // including a disabled one, is FUNDING_SUBACCOUNT_NOT_FOUND.
  fixed64 funding_subaccount_id = 6;
}

// ProposeDeployResponse is the recorded proposal and where the user deploys
// it.
message ProposeDeployResponse {
  // Public proposal ID.
  fixed64 proposal_id = 1;
  // The website page where the user reviews the proposal and deploys it.
  // Its path names the proposal by its public ID in base58, as the website
  // shows every ID, for example https://…/bots/deploy/<base58 proposal ID>.
  string deploy_url = 2;
  // What the proposal binds.
  DeployProposalSummary summary = 3;
  // When the proposal expires if the user has not deployed it.
  google.protobuf.Timestamp expires_at = 4;
}

// DeployStatus is where a deploy proposal is.
message DeployStatus {
  // State is a deploy proposal's step.
  enum State {
    // Not set. Never returned.
    STATE_UNSPECIFIED = 0;
    // Recorded; waiting for the user to deploy it.
    PROPOSED = 1;
    // Checking the version, its behaviour examples and limits again.
    VALIDATING = 2;
    // Preparing the bot's subaccount.
    CREATING_SUBACCOUNT = 3;
    // Setting the bot's limits and its trading key. Comes after
    // CREATING_SUBACCOUNT and before FUNDING.
    SETTING_ACCESS = 9;
    // Moving the funding into the bot's subaccount.
    FUNDING = 4;
    // Starting the bot.
    DEPLOYING = 5;
    // The bot runs: bot_id is set.
    LIVE = 6;
    // The deploy stopped: failure says why.
    FAILED = 7;
    // The user did not deploy the proposal in time.
    EXPIRED = 8;
  }

  // Public proposal ID.
  fixed64 proposal_id = 1;
  // Current step.
  State state = 2;
  // The current step as the user sees it, for example "Funding the
  // account…".
  string step = 3;
  // Public ID of the bot. Zero until the bot exists.
  fixed64 bot_id = 4;
  // Public ID of the bot's subaccount. Zero until it exists.
  fixed64 subaccount_id = 5;
  // Why the deploy stopped and what the user can do. Empty unless state is
  // FAILED.
  string failure = 6;
  // When the proposal expires if not deployed.
  google.protobuf.Timestamp expires_at = 7;
  // When the state last changed.
  google.protobuf.Timestamp updated_at = 8;
  // The step the deploy failed in: VALIDATING, CREATING_SUBACCOUNT,
  // SETTING_ACCESS, FUNDING or DEPLOYING. Set when a deploy fails, by the deploy flow, beside
  // failure; unset in any other state.
  State failed_at = 9;
}

// GetDeployStatusRequest reads one deploy proposal of the caller.
message GetDeployStatusRequest {
  // Public proposal ID.
  fixed64 proposal_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetDeployStatusResponse returns the proposal's status.
message GetDeployStatusResponse {
  // The status.
  DeployStatus status = 1;
}

// SubaccountAuthorization is the user's signed authorization for the bot's
// new subaccount: what CreateSubaccountChallenge returned, signed through the
// returned smart account.
message SubaccountAuthorization {
  // The smart account address CreateSubaccountChallenge returned.
  string smart_account_address = 1 [(buf.validate.field).string = {
    len: 42
    pattern: "^0x[0-9a-fA-F]{40}$"
  }];
  // The exact message CreateSubaccountChallenge returned, unaltered. At most
  // 4096 bytes.
  string message = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
  // The smart account's signature over message, with EIP-191 personal_sign
  // semantics. At most 8192 characters.
  string signature = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
}

// DeployBotRequest deploys one deploy proposal of the caller.
message DeployBotRequest {
  // Public proposal ID.
  fixed64 proposal_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // The user's signed authorization for the bot's new subaccount. Needed
  // only when the deploy creates a subaccount: without it, such a deploy
  // answers SUBACCOUNT_AUTHORIZATION_REQUIRED. A deploy that reuses one of
  // the caller's closed bot subaccounts ignores it.
  SubaccountAuthorization subaccount_authorization = 2;
}

// DeployBotResponse is the proposal's status when the call returns.
message DeployBotResponse {
  // The status: DEPLOYING once the bot's start is recorded (the bot then
  // starts without the user), LIVE, or FAILED with failed_at and failure.
  DeployStatus status = 1;
}

// GetDeployProposalRequest reads one deploy proposal of the caller, as its
// deploy page shows it.
message GetDeployProposalRequest {
  // Public proposal ID.
  fixed64 proposal_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetDeployProposalResponse is a deploy proposal as the user approves it.
message GetDeployProposalResponse {
  // Public proposal ID.
  fixed64 proposal_id = 1;
  // What the user approves: the version, the bot's name, its limits, every
  // setting with its value, and the funding, as the proposal recorded them.
  DeployProposalSummary summary = 2;
  // Where the proposal is, and when it expires if not deployed.
  DeployStatus status = 3;
  // When the proposal was recorded.
  google.protobuf.Timestamp created_at = 4;
  // Current label of the subaccount the funding comes from, as its owner
  // named it. Empty when the funding comes from the main account or the
  // subaccount has no label.
  string funding_subaccount_label = 5;
}

// Bot is one bot of the caller.
message Bot {
  // Status is a bot's state.
  enum Status {
    // Not set. Never returned.
    STATUS_UNSPECIFIED = 0;
    // Being deployed.
    DEPLOYING = 1;
    // Handling its events.
    RUNNING = 2;
    // Being stopped: a stop was recorded, and the bot has not yet reported
    // it complete. A stopped bot reads STOPPING until its stop is reported
    // complete to the service.
    STOPPING = 3;
    // Stopped by the user. After KEEP_ORDERS, its open orders belong to its
    // subaccount and its in-flight orders are settled; after CANCEL_ORDERS,
    // every one of its orders has ended. Read only once the bot's stop has
    // been reported complete to the service; until then the bot reads
    // STOPPING.
    STOPPED = 4;
    // Paused, by itself, after an environment reset, after its calls
    // failed too many times in a row, or because it found one of its own
    // orders whose placement it hadn't recorded: status_reason says why.
    // Its orders stay.
    // Read only once the bot's pause has been reported to the service;
    // until then a paused bot reads RUNNING. A paused bot that is being
    // stopped reads STOPPING.
    PAUSED = 5;
  }

  // PauseReason is why a PAUSED bot paused, beside the status_reason text.
  enum PauseReason {
    // Not paused, or the reason is not known.
    PAUSE_REASON_UNSPECIFIED = 0;
    // The bot's own code paused it; status_reason carries the bot's message.
    BOT_DECIDED = 1;
    // Its calls failed too many times in a row.
    FAILURES_IN_A_ROW = 2;
    // The environment was reset, and every bot paused until its user starts
    // it again.
    ENVIRONMENT_RESET = 3;
    // The bot found one of its own orders whose placement it hadn't
    // recorded, for example after a restart, and paused so you can check its
    // state; status_reason says so.
    UNRECORDED_ORDER = 4;
  }

  // Public bot ID.
  fixed64 bot_id = 1;
  // The bot's name, as approved when the bot was deployed.
  string name = 2;
  // Public ID of the bot's own subaccount, which the caller's main account
  // owns.
  fixed64 subaccount_id = 3;
  // Current state.
  Status status = 4;
  // Why the bot paused, in words: the bot's own message when it decided
  // to pause, else a sentence for pause_reason. Set only with PAUSED.
  string status_reason = 5;
  // The version it runs.
  string version_id = 6;
  // When the bot last decided: the time of the event behind its newest
  // decision, over all its deployments. Omitted before its first decision.
  // Lags the bot by up to about a minute.
  google.protobuf.Timestamp last_decision_at = 8;
  // When the bot was deployed.
  google.protobuf.Timestamp created_at = 9;
  // Quote asset of the bot's markets, for example USDT.
  string quote_asset = 10;
  // Markets the bot trades, as its version's money card names them, for
  // example BTC/USDT.
  repeated string markets = 11;
  // Where the bot's initial funding came from, and how much. Absent until
  // the deploy flow records the deploy proposal the bot came from.
  BotFunding funding = 12;
  // Share of the time since the bot was first deployed during which it was
  // running, as an exact decimal from 0 to 1 rounded to 6 decimal places,
  // for example "0.9875". A bot runs from each start to the stop the user
  // recorded; time it spent paused counts as running. Empty before the bot
  // first starts.
  string uptime_ratio = 13;
  // When the bot last started running. Set only while it is RUNNING.
  google.protobuf.Timestamp running_since = 14;
  // Why the bot paused. Set only with PAUSED, which is read only once the
  // bot's pause has been reported to the service.
  PauseReason pause_reason = 15;
  // What the bot did in each of the last 24 hours, oldest first, ending with
  // the current UTC hour, which is still under way. An hour it did nothing
  // in is there with zero counts. A bot deployed again within the day counts
  // every one of its runs. Counts lag the bot by up to about a minute.
  repeated BotActivityHour activity = 16;
}

// BotActivityHour is what a bot did in one UTC hour, by when each event
// reached it.
message BotActivityHour {
  // The hour's start: a whole UTC hour.
  google.protobuf.Timestamp start = 1;
  // Its decisions: events the bot was called for, whether the call
  // succeeded, failed, or ended before the bot's code ran.
  uint32 decisions = 2;
  // Its fills, whether or not its code handles them.
  uint32 fills = 3;
  // Events it skipped because they were already too old when it could run,
  // for example while it was behind: never decisions.
  uint32 expired = 4;
}

// BotFunding is where a bot's initial funding came from, as its deploy
// proposal recorded it.
message BotFunding {
  // Public ID of the subaccount the funding came from. Zero means the main
  // account.
  fixed64 subaccount_id = 1;
  // Current label of that subaccount, as its owner named it. Empty for the
  // main account or a subaccount without a label.
  string subaccount_label = 2;
  // What moved into the bot's subaccount when it was deployed, one entry
  // per asset.
  repeated Money initial_funding = 3;
}

// BotStatusCount is how many of the caller's bots are in one status.
message BotStatusCount {
  // The status.
  Bot.Status status = 1;
  // How many of the caller's bots are in it.
  uint32 count = 2;
}

// ListBotsRequest lists the caller's bots.
message ListBotsRequest {
  // Maximum number of bots to return: default 50, max 200.
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 200];
  // Opaque, keyset-backed and exclusive cursor from a previous response's
  // next_page_token. It is bound to the caller.
  string page_token = 2 [(buf.validate.field).string.max_len = 256];
}

// ListBotsResponse returns one page of the caller's bots.
message ListBotsResponse {
  // Bots, newest deployed first, then by bot ID, descending.
  repeated Bot bots = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
  // How many of all the caller's bots, not only this page's, are in each
  // status: one entry per status that has a bot, in status order. Exact when
  // read, and the same shape on every page. Not a pagination total.
  repeated BotStatusCount status_counts = 3;
}

// BotDecision is one handler call of a bot.
message BotDecision {
  // When the event that woke the bot reached it.
  google.protobuf.Timestamp decided_at = 1;
  // The handler the event woke, for example on_timer or on_fill.
  string event = 2;
  // The orders the bot asked for, in the shape the manifest's behaviour
  // examples use, with what a live call adds; a key is left out when unset.
  // An order: {"buy" or "sell": market, "qty" or "quote", "limit", "tif",
  // "post_only", "max_slippage_bps", "stop_loss", "take_profit", "reason",
  // "client_order_id"}. A trigger (bot.buy_when, bot.sell_when): {"buy" or
  // "sell": market, "above" or "below": its price, "qty", "limit", "tif",
  // "price_source", "reason", "client_trigger_id"}. A cancel: {"cancel": the
  // order's or trigger's client ID, or the trigger's ID}. An order refused
  // before it was sent: {"refused": market, "client_order_id", "reason"}.
  // Amounts and prices are decimal strings. An order on a market the
  // service doesn't know names it "market #<id>", shows its amounts and
  // prices as unscaled integers, and carries "unscaled": true. Empty when
  // it decided to do nothing.
  repeated google.protobuf.Struct orders = 3;
  // The bot's log lines from the call, oldest first: at most 20, each at
  // most 256 bytes of UTF-8 and 1 KiB in all. A shortened line ends with
  // "…", and a last line of "…" stands for the lines left out.
  repeated string logs = 4;
}

// BotError is one failed handler call of a bot.
message BotError {
  // When the event whose call failed reached the bot.
  google.protobuf.Timestamp time = 1;
  // The handler the event woke, for example on_timer or on_fill.
  string event = 2;
  // What failed, at most 512 bytes of UTF-8, ending with "…" when
  // shortened: the bot's own error when its code raised, the rule its result
  // broke, or a sentence saying the call ran out of its time or memory or
  // could not finish.
  string message = 3;
}

// GetBotRequest reads one bot of the caller.
message GetBotRequest {
  // Public bot ID.
  fixed64 bot_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// StopMode is what a stop does with the bot's orders. Its holdings stay in
// its subaccount either way.
enum StopMode {
  // Not set. Always refused.
  STOP_UNSPECIFIED = 0;
  // The bot's open orders, protective stop-losses included, stay in the book
  // and pass to its subaccount as the subaccount's own orders, which the bot
  // no longer manages.
  KEEP_ORDERS = 1;
  // All the bot's orders are cancelled.
  CANCEL_ORDERS = 2;
}

// StopBotRequest stops one bot.
message StopBotRequest {
  // Public bot ID.
  fixed64 bot_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // What happens to the bot's orders. Required.
  StopMode mode = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Client-chosen key, unique per caller, that makes the call idempotent: the
  // same key and request return the same stop, of the bot's run the first
  // call stopped, with its status as it stands now (STOPPED once the stop is
  // reported complete), even after the bot has been deployed again, and
  // never stop the bot a second time; another request with the same key is
  // IDEMPOTENCY_CONFLICT. Required.
  string idempotency_key = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$"];
}

// StopBotResponse is the stopped bot.
message StopBotResponse {
  // The stopped bot: its ID, name, subaccount, version, creation time and
  // status. It reads STOPPING until the bot's stop, which has no deadline,
  // has been reported complete to the service, and STOPPED after. GetBot
  // reads the rest of the bot.
  Bot bot = 1;
  // The stop mode the bot is being stopped with.
  StopMode mode = 2;
}

// GetBotResponse is a bot with its money rules, settings and recent
// decisions. The bot's subaccount is read like any other, by its
// subaccount_id: its balances with LedgerReadService.GetBalances, its open
// orders with OrdersReadService.GetOpenOrders, and its profit and loss with
// ProfitAndLossService.
message GetBotResponse {
  // The bot.
  Bot bot = 1;
  // What the bot may do with money, from the version it runs.
  MoneyCard money_card = 2;
  // Its settings, with their values, in settings-form order, each with its
  // description, kind and asset from the version's settings form. Empty
  // until the deploy flow records the deploy proposal the bot came from.
  repeated SettingValue settings = 3;
  // Its last decisions, newest first, from the run it is on now: at most 20,
  // fewer when they are large. Empty until its run's first decision reaches
  // the service, up to about a minute after the bot made it.
  repeated BotDecision decisions = 6;
  // Its last errors, newest first, from the run it is on now: at most 20.
  repeated BotError errors = 7;
}

// ListBotVersionsRequest lists the versions one bot of the caller ran.
message ListBotVersionsRequest {
  // Public bot ID.
  fixed64 bot_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Maximum number of entries to return: default 50, max 200.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 200];
  // Opaque, keyset-backed and exclusive cursor from a previous response's
  // next_page_token. It is bound to the caller and bot_id; reuse it only
  // with the same bot_id.
  string page_token = 3 [(buf.validate.field).string.max_len = 256];
}

// BotVersion is one run of a bot on one version.
message BotVersion {
  // The version the bot ran. GetStrategyVersion reads it.
  string version_id = 1;
  // The version's strategy name.
  string name = 2;
  // Runtime version the version was validated against.
  string runtime_version = 3;
  // When the bot started running this version.
  google.protobuf.Timestamp started_at = 4;
  // When the stop of this run was recorded. Omitted while the run has no
  // stop.
  google.protobuf.Timestamp stopped_at = 5;
}

// ListBotVersionsResponse returns one page of a bot's versions.
message ListBotVersionsResponse {
  // One entry per run of the bot, newest started first: a version deployed
  // again appears again.
  repeated BotVersion versions = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// GetStrategyVersionRequest reads one strategy version of the caller.
message GetStrategyVersionRequest {
  // Version to read.
  string version_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// GetStrategyVersionResponse is a stored strategy version: what a new
// strategy can start from.
message GetStrategyVersionResponse {
  // The version's ID.
  string version_id = 1;
  // Name of the strategy.
  string name = 2;
  // The runtime version it was validated against.
  string runtime_version = 3;
  // The manifest, as it was saved.
  google.protobuf.Struct manifest = 4;
  // The bot code.
  string code = 5;
  // The settings a user may change. Empty when the version did not
  // validate.
  repeated SettingField settings_form = 6;
  // True when the version validated without errors.
  bool valid = 7;
  // When the version was first stored.
  google.protobuf.Timestamp created_at = 8;
  // The version's flow: what wakes the bot, what it checks and what it may
  // do. Not set for a version that did not validate, or that was stored
  // before flows existed.
  StrategyFlow flow = 9;
  // The version's check result as it was stored, the same one saving the
  // version answered: its errors and warnings, and, for a valid version, its
  // money card, settings form and flow. Reading never checks the version
  // again. Not set for a version stored without its check result.
  VersionValidation validation = 10;
}

// StrategyFlow is the flow of a version: what wakes the bot (triggers), what
// it checks (conditions) and what it may do (actions), as a graph read from
// its code and manifest. The same version always has the same flow.
message StrategyFlow {
  // Every trigger, condition and action.
  repeated FlowNode nodes = 1;
  // Every edge between them.
  repeated FlowEdge edges = 2;
  // Parts of the code the flow could not place, for example a loop or a
  // helper function. Empty when complete is true.
  repeated string notes = 3;
  // Whether every path of every handler is in the graph. When false, the
  // graph shows only what was placed and notes say what was not.
  bool complete = 4;
}

// FlowNode is one trigger, condition or action of a flow.
message FlowNode {
  // Kind is what a node is.
  enum Kind {
    // Not set. Never returned.
    KIND_UNSPECIFIED = 0;
    // An event that wakes the bot, and the handler it wakes.
    TRIGGER = 1;
    // A test in a handler, with its true and false branches.
    CONDITION = 2;
    // Something the bot may do: an order, a cancel, a log line, a notice, a
    // pause, or a price level watched or no longer watched.
    ACTION = 3;
  }

  // Stable within the version, for example "t0", "c3" or "a1".
  string node_id = 1;
  // What it is.
  Kind kind = 2;
  // What the node shows: a plain description of the code, for example
  // "RSI(BTC/USDT, 1d, 14) > 75" or "Buy BTC/USDT for budget". For a
  // trigger: a schedule in words, for example "Every Monday 09:00 UTC";
  // another manifest event as the money card names it (the same text as
  // event); otherwise what wakes the bot, for example "An order fills".
  string label = 3;
  // Where it is in the code. Not set for a trigger.
  SourceSpan span = 4;
  // For a trigger woken by a manifest event: the event, as the money card
  // names it, for example "schedule mon 09:00 UTC". Empty otherwise.
  string event = 5;
  // For an action: BUY, SELL, CANCEL, LOG, NOTIFY, PAUSE, WATCH, UNWATCH or
  // TRIGGER. Empty otherwise.
  string action = 6;
  // The settings the node reads, by name.
  repeated string settings = 7;
}

// FlowEdge is one edge of a flow.
message FlowEdge {
  // The node it starts from.
  string from_node_id = 1;
  // The node it leads to.
  string to_node_id = 2;
  // "true" or "false" out of a condition; empty otherwise.
  string branch = 3;
}

// SourceSpan is a range of lines of a version's code, 1-based and
// inclusive.
message SourceSpan {
  // The first line.
  uint32 start_line = 1;
  // The last line.
  uint32 end_line = 2;
}

// Strategy is one of the caller's strategies: a named bot and the ordered
// history of its saved drafts. Its head is the draft of its current
// revision.
message Strategy {
  // Public strategy ID.
  fixed64 strategy_id = 1;
  // Name of the strategy.
  string name = 2;
  // The current revision: one per save that changed the draft, from 1. Zero
  // when nothing was saved yet.
  uint64 revision = 3;
  // The version of the current revision. GetStrategyVersion reads it. Empty
  // when revision is zero.
  string head_version_id = 4;
  // True when the current revision's version validated without errors.
  // False when revision is zero.
  bool valid = 5;
  // What the strategy started from.
  StrategyOrigin origin = 6;
  // When the strategy was created.
  google.protobuf.Timestamp created_at = 7;
  // When the strategy was last saved or renamed.
  google.protobuf.Timestamp updated_at = 8;
  // The newest bot deployed from one of the strategy's deploy proposals that
  // hasn't stopped. Unset when there is none. A bot deployed from another
  // strategy's proposal is never this strategy's, even when it runs the same
  // version. Set only for a caller who may read the bot with GetBot: a
  // session, an API key with READ_STRATEGIES, or a connected app with the
  // account:read scope. Every response that returns a strategy follows this
  // rule, RenameStrategy and CreateStrategy included.
  StrategyBot bot = 9;
  // The markets of the current revision's version, as its money card names
  // them, for example BTC/USDT. Empty for a strategy with no revision, or
  // whose current revision did not validate. Set only for a caller who may
  // read the strategy, under the same rule as bot.
  repeated string markets = 10;
  // The one-line summary of the strategy's notes. Empty before the notes'
  // first save. Set only for a caller who may read the strategy, under the
  // same rule as bot.
  string summary = 11;
}

// StrategyBot is a bot deployed from a strategy, as the strategy shows it.
message StrategyBot {
  // Public bot ID. GetBot reads the bot.
  fixed64 bot_id = 1;
  // The bot's state, as GetBot reads it: RUNNING, PAUSED or STOPPING.
  Bot.Status status = 2;
}

// StrategyOrigin is what a strategy started from. Unset means a blank
// strategy.
message StrategyOrigin {
  // The starting point.
  oneof source {
    // The bot template it started from.
    string template_id = 1;
    // The version of the caller's it was copied from.
    StrategyDuplicateOrigin duplicate = 2;
  }
}

// StrategyDuplicateOrigin is the version of the caller's a strategy was
// copied from. A copy depends on the version only, never on a strategy
// that saved it.
message StrategyDuplicateOrigin {
  // The version copied, which is the strategy's revision 1.
  string source_version_id = 2;
}

// StrategyRevision is one saved draft of a strategy.
message StrategyRevision {
  // SavedBy is how the caller that saved a draft signed in.
  enum SavedBy {
    // Not set. Never returned.
    SAVED_BY_UNSPECIFIED = 0;
    // A signed-in user, on the website.
    SESSION = 1;
    // An API key of the main account.
    API_KEY = 2;
    // An application the user connected to their account.
    CONNECTED_APP = 3;
  }

  // The revision number, from 1.
  uint64 revision = 1;
  // The version saved. GetStrategyVersion reads it.
  string version_id = 2;
  // True when the version validated without errors.
  bool valid = 3;
  // When the draft was saved.
  google.protobuf.Timestamp saved_at = 4;
  // How the caller that saved it signed in.
  SavedBy saved_by = 5;
}

// CreateStrategyRequest creates one strategy of the caller.
message CreateStrategyRequest {
  // Name of the strategy.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // What the strategy starts from. Unset creates a blank strategy, with no
  // revision until its first save.
  oneof source {
    // A bot template, from ListStrategyTemplates: its manifest and code are
    // checked and saved as revision 1.
    string template_id = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }];
    // One of the caller's own versions, saved as revision 1 of the new
    // strategy.
    string version_id = 3 [(buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }];
  }
  // Client-chosen key, unique per caller, that makes the call idempotent: the
  // same key and request return the strategy the first call created, as it
  // stands now, and never create a second one; another request with the same
  // key, a SaveDraftVersion's included, is IDEMPOTENCY_CONFLICT. Required.
  string idempotency_key = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$"];
}

// CreateStrategyResponse is the created strategy.
message CreateStrategyResponse {
  // The strategy, as it stands now.
  Strategy strategy = 1;
  // The check result of revision 1's version. Unset for a blank strategy.
  VersionValidation version = 2;
}

// SaveDraftVersionRequest checks a bot and saves it as the next revision of
// one of the caller's strategies.
message SaveDraftVersionRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // The revision this draft was made from: the strategy's current revision,
  // zero for its first save. Any other value is DRAFT_REVISION_CONFLICT.
  uint64 expected_revision = 2;
  // Name of the strategy. The save renames the strategy to it.
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // The manifest: settings, events, limits and behaviour examples, as a JSON
  // object whose shape the reference's manifest section describes. Write
  // amounts as decimal strings. At most 65536 bytes (64 KiB) as compact JSON.
  google.protobuf.Struct manifest = 4 [(buf.validate.field).required = true];
  // The bot code: at most 65536 bytes (64 KiB) of UTF-8.
  string code = 5 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  // Runtime version to check against. Empty means the current one.
  string runtime_version = 6 [(buf.validate.field).string.max_len = 64];
  // Client-chosen key, unique per caller, that makes the call idempotent: the
  // same key and request return the revision the first call saved, even
  // after later saves moved the strategy past it; another request with the
  // same key, a CreateStrategy's included, is IDEMPOTENCY_CONFLICT.
  // Optional: without it, a retry after a save that landed is
  // DRAFT_REVISION_CONFLICT.
  string idempotency_key = 7 [
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Optional: the notes revision this draft was written against, zero for
  // notes never saved. When set, any other current notes revision is
  // NOTES_REVISION_CONFLICT, checked together with expected_revision, so a
  // writer that measured the draft and the notes together saves them as it
  // measured them.
  optional uint64 expected_notes_revision = 8;
}

// SaveDraftVersionResponse is the saved draft.
message SaveDraftVersionResponse {
  // The revision the draft was saved as. When the draft's content is the
  // current revision's, no revision is added and this is the current
  // revision; a new name still renames the strategy.
  uint64 revision = 1;
  // The check result of the saved version. A bot with mistakes is saved
  // too, with valid false and its errors.
  VersionValidation version = 2;
}

// GetStrategyRequest reads one strategy of the caller.
message GetStrategyRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetStrategyResponse is a strategy and its current draft.
message GetStrategyResponse {
  // The strategy.
  Strategy strategy = 1;
  // The version of the current revision, as GetStrategyVersion reads it.
  // Unset when revision is zero.
  GetStrategyVersionResponse head = 2;
  // The strategy's notes, as GetStrategyNotes reads them: notes_revision is
  // zero when they were never saved.
  StrategyNotes notes = 3;
}

// ListStrategiesRequest lists the caller's strategies.
message ListStrategiesRequest {
  // Maximum number of strategies to return: default 50, max 200.
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 200];
  // Opaque, keyset-backed and exclusive cursor from a previous response's
  // next_page_token. It is bound to the caller.
  string page_token = 2 [(buf.validate.field).string.max_len = 256];
}

// ListStrategiesResponse returns one page of the caller's strategies.
message ListStrategiesResponse {
  // Strategies, most recently saved or renamed first, then by strategy ID,
  // descending.
  repeated Strategy strategies = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// ListStrategyRevisionsRequest lists the saved drafts of one strategy of
// the caller.
message ListStrategyRevisionsRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Maximum number of revisions to return: default 50, max 200.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 200];
  // Opaque, keyset-backed and exclusive cursor from a previous response's
  // next_page_token. It is bound to the caller and strategy_id; reuse it
  // only with the same strategy_id.
  string page_token = 3 [(buf.validate.field).string.max_len = 256];
}

// ListStrategyRevisionsResponse returns one page of a strategy's revisions.
message ListStrategyRevisionsResponse {
  // Revisions, newest first. Every revision is kept.
  repeated StrategyRevision revisions = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// RenameStrategyRequest renames one strategy of the caller.
message RenameStrategyRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // The new name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// RenameStrategyResponse is the renamed strategy.
message RenameStrategyResponse {
  // The strategy, as it stands now.
  Strategy strategy = 1;
}

// DeleteStrategyRequest deletes one strategy of the caller.
message DeleteStrategyRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// DeleteStrategyResponse confirms the strategy is deleted.
message DeleteStrategyResponse {}

// StrategyNotes is the caller's notes about one strategy: what it is meant
// to do, what was decided and why, and what was tried and dropped. The user
// writes them, and so do assistants acting for the user. They are never
// shown in a community listing, and a copied or forked strategy starts with
// none.
message StrategyNotes {
  // Public strategy ID.
  fixed64 strategy_id = 1;
  // The notes' revision: one per save that changed them, from 1. Zero when
  // the notes were never saved. It counts apart from the strategy's
  // revision.
  uint64 notes_revision = 2;
  // What the strategy is, in one line, with no line break: at most 120
  // characters.
  string summary = 3;
  // The notes, as Markdown. At most 8192 bytes of UTF-8.
  string body = 4;
  // When this revision was saved. Omitted when notes_revision is zero.
  google.protobuf.Timestamp saved_at = 5;
  // How the caller that saved this revision signed in. Unspecified when
  // notes_revision is zero.
  StrategyRevision.SavedBy saved_by = 6;
}

// GetStrategyNotesRequest reads the notes of one strategy of the caller.
message GetStrategyNotesRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetStrategyNotesResponse is a strategy's current notes.
message GetStrategyNotesResponse {
  // The notes: notes_revision is zero when they were never saved.
  StrategyNotes notes = 1;
}

// SaveStrategyNotesRequest saves the notes of one strategy of the caller as
// their next revision.
message SaveStrategyNotesRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // The notes revision this text was made from: the current one, zero for
  // the first save. Any other value is NOTES_REVISION_CONFLICT.
  uint64 expected_notes_revision = 2;
  // What the strategy is, in one line: at most 120 characters, with no line
  // break of any kind.
  string summary = 3 [(buf.validate.field).string = {
    max_len: 120
    pattern: "^[^\\r\\n\\v\\f\\x{85}\\x{2028}\\x{2029}]*$"
  }];
  // The notes, as Markdown: at most 8192 bytes of UTF-8.
  string body = 4 [(buf.validate.field).string.max_bytes = 8192];
  // Client-chosen key, unique per caller, that makes the call idempotent: the
  // same key and request return the notes revision the first call saved,
  // even after later saves moved the notes past it; another request with the
  // same key, of any strategies write that takes a key, is
  // IDEMPOTENCY_CONFLICT. Optional: without it, a retry after a save that
  // landed is NOTES_REVISION_CONFLICT.
  string idempotency_key = 5 [
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Optional: the strategy's revision this text was written against, zero
  // for a strategy never saved. When set, any other current revision is
  // DRAFT_REVISION_CONFLICT, checked together with expected_notes_revision,
  // so a writer that measured the draft and the notes together saves them as
  // it measured them.
  optional uint64 expected_revision = 6;
}

// SaveStrategyNotesResponse is the saved notes.
message SaveStrategyNotesResponse {
  // The notes as saved. When the summary and body are the current ones, no
  // revision is added, and this is the current revision.
  StrategyNotes notes = 1;
}

// ListStrategyNotesRevisionsRequest lists the saved notes of one strategy of
// the caller.
message ListStrategyNotesRevisionsRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Maximum number of revisions to return: default 10, max 20.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 20];
  // Opaque, keyset-backed and exclusive cursor from a previous response's
  // next_page_token. It is bound to the caller and strategy_id; reuse it
  // only with the same strategy_id.
  string page_token = 3 [(buf.validate.field).string.max_len = 256];
}

// ListStrategyNotesRevisionsResponse returns one page of a strategy's notes
// revisions.
message ListStrategyNotesRevisionsResponse {
  // Revisions, newest first. Every revision is kept.
  repeated StrategyNotes revisions = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// ListBacktestsRequest lists the backtests of one strategy of the caller:
// the backtests of the versions its revisions saved.
message ListBacktestsRequest {
  // Public strategy ID.
  fixed64 strategy_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Maximum number of backtests to return: default 10, max 50.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 50];
  // Opaque, keyset-backed and exclusive cursor from a previous response's
  // next_page_token. It is bound to the caller and strategy_id; reuse it
  // only with the same strategy_id.
  string page_token = 3 [(buf.validate.field).string.max_len = 256];
}

// StrategyBacktest is one backtest of a strategy's versions, as a list shows
// it: its headline, not its trades. GetBacktest reads the whole report.
message StrategyBacktest {
  // The backtest's headline.
  BacktestSummary summary = 1;
  // The version backtested.
  string version_id = 2;
  // The newest revision of the strategy that saved that version.
  uint64 revision = 3;
  // The simulated window.
  TimeWindow window = 4;
  // When the backtest was started.
  google.protobuf.Timestamp created_at = 5;
  // When it finished or failed. Omitted before.
  google.protobuf.Timestamp finished_at = 6;
}

// ListBacktestsResponse returns one page of a strategy's backtests.
message ListBacktestsResponse {
  // Backtests, newest first. A backtest is kept 30 days after it finished.
  repeated StrategyBacktest backtests = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// BotLogEntry is one entry of a bot's recent activity: a decision, a line its
// call wrote, or a failed call.
message BotLogEntry {
  // Kind is what a log entry records.
  enum Kind {
    // Not set. Never returned.
    KIND_UNSPECIFIED = 0;
    // A line the bot wrote.
    LOG = 1;
    // A decision: the orders it asked for, or that it did nothing.
    DECISION = 2;
    // A failed handler call.
    ERROR = 3;
  }

  // Position in the log of the bot's current deployment, increasing within
  // that deployment. A new deployment starts a new log, whose positions start
  // low again. A decision comes first, then the lines its call wrote, then
  // its error if the call failed.
  uint64 sequence = 1;
  // When the event behind it was observed: a decision's lines and its error
  // have the decision's time. Two decisions can have the same time, for
  // example two markets' candles of one minute.
  google.protobuf.Timestamp time = 2;
  // What it records.
  Kind kind = 3;
  // The line.
  string message = 4;
}

// ListBotLogsRequest reads a bot's recent activity.
message ListBotLogsRequest {
  // Public bot ID.
  fixed64 bot_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Earliest entry time, inclusive. Unset reads from the oldest entry kept.
  // It filters by the time of the event behind each entry, which doesn't
  // follow the order of the log: to read what is written later, use
  // follow_token, never a later start_time.
  google.protobuf.Timestamp start_time = 2;
  // Maximum number of entries to return: default 100, max 200.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 200];
  // Opaque, keyset-backed and exclusive cursor from a previous response's
  // next_page_token, or follow_token. It is bound to the caller, bot_id,
  // start_time and the deployment whose log the first page read; reuse it
  // only with the same values. Its pages read that deployment's log even
  // after the bot is deployed again.
  string page_token = 4 [(buf.validate.field).string.max_len = 256];
}

// ListBotLogsResponse returns one page of a bot's recent activity.
message ListBotLogsResponse {
  // Entries, oldest first: in increasing sequence.
  repeated BotLogEntry entries = 1;
  // Cursor for the next page. Empty when no more results exist now.
  string next_page_token = 2;
  // Cursor for what is written later: pass it as page_token, now or later,
  // to read the entries after the last one this response read, by sequence,
  // in the same deployment's log. Set on the last page. An entry that left
  // the window before it was read is not returned.
  string follow_token = 3;
  // The bot was deployed again after the deployment whose log this response
  // read: a new run started, whose entries are in a new log, read by listing
  // again without page_token. It doesn't end this log: entries of this
  // deployment can still arrive after it, with no set time limit, and
  // follow_token keeps reading them for as long as they are kept.
  bool deployed_again = 4;
}

// StrategiesService writes, tests and proposes the caller's trading bots and
// reads them. Bots belong to the caller's main account, and each runs on its
// own subaccount, created when the user deploys it. No call moves money,
// creates a subaccount or deploys a bot: deploying takes the user's MFA and
// wallet signature on the deploy page ProposeDeploy links. StopBot stops a
// bot, which only ever reduces what it does.
//
// Requests name no account, except the funding subaccount of ProposeDeploy:
// every call acts for the caller's main account, and StopBot also for a
// member of a bot's subaccount whose role may stop it. An
// API key must be scoped to the main account, and its policy must grant the
// call's permission: READ_STRATEGIES for reads, DRAFT_STRATEGIES to create,
// save, rename and delete strategies and test versions, PROPOSE_STRATEGY_DEPLOY to
// propose deploys, STOP_STRATEGIES to stop bots. An API key scoped to a subaccount is refused
// (PERMISSION_DENIED, AUTH_API_KEY_ACCESS_DENIED) even when its policy grants
// the permission. GetStrategyReference and ListStrategyTemplates need no
// credentials. A session a connected app holds on the user's behalf makes
// the reads with the account:read scope, and creates, saves, renames and
// deletes strategies, tests versions, proposes deploys and stops bots with
// strategies:manage; a call outside the session's scopes refuses it
// (PERMISSION_DENIED, AUTH_SESSION_KIND_NOT_ALLOWED). No connected app
// deploys a bot: deploying takes the user's MFA and wallet signature.
// Every call is safe to retry.
service StrategiesService {
  option (polyester.api.docs_group) = "trading";

  // GetStrategyReference returns what bot code is written against for one
  // runtime version: the bot API reference and the skill pack, then the
  // manifest's JSON Schema, the allowed indicators and the limits once the
  // runtime catalog is available.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request, or RUNTIME_VERSION_UNSUPPORTED.
  // - UNAVAILABLE: SERVICE_UNAVAILABLE; retry.
  rpc GetStrategyReference(GetStrategyReferenceRequest) returns (GetStrategyReferenceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Strategy Reference"
      description: "Get the bot API reference and the skill pack for writing bots, and the manifest's JSON Schema, the allowed indicators and the limits of one runtime version once they are available."
      tags: "Strategies Service"
      security: [{}]
    };
  }

  // ListStrategyTemplates lists the bot templates: starting points with a
  // manifest and code.
  //
  // Errors:
  // - UNAVAILABLE: SERVICE_UNAVAILABLE; retry.
  rpc ListStrategyTemplates(ListStrategyTemplatesRequest) returns (ListStrategyTemplatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (gnostic.openapi.v3.operation) = {
      summary: "List Strategy Templates"
      description: "List the bot templates: starting points with a manifest and code."
      tags: "Strategies Service"
      security: [{}]
    };
  }

  // CreateStrategy creates a strategy of the caller: blank, from a bot
  // template, or as a copy of one of the caller's own versions. A template
  // is checked and saved as revision 1, valid or not; a copied version is
  // saved as revision 1 as it is. A blank strategy has no revision until its
  // first SaveDraftVersion. An account has at most 100 strategies.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request, or MANIFEST_TOO_LARGE for a
  //   template.
  // - NOT_FOUND: TEMPLATE_NOT_FOUND, or VERSION_NOT_FOUND, for another
  //   account's version as for an unknown or expired one.
  // - FAILED_PRECONDITION: STRATEGY_CAP_REACHED; strategy_cap gives the cap.
  // - ALREADY_EXISTS: IDEMPOTENCY_CONFLICT; the original strategy stands.
  // - UNAVAILABLE: SERVICE_UNAVAILABLE; retry the same request.
  // - PERMISSION_DENIED: AUTH_API_KEY_ACCESS_DENIED when the API key's policy
  //   does not grant DRAFT_STRATEGIES or the key is scoped to a subaccount.
  // - UNAUTHENTICATED: missing or invalid credentials.
  rpc CreateStrategy(CreateStrategyRequest) returns (CreateStrategyResponse) {
    option idempotency_level = IDEMPOTENT;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Strategy"
      description: "Create a strategy: blank, from a bot template, or as a copy of one of the caller's versions. An API key needs DRAFT_STRATEGIES and must be scoped to the main account."
      tags: "Strategies Service"
    };
  }

  // SaveDraftVersion checks a bot and saves it as the next revision of one of
  // the caller's strategies, which it also renames. The same runtime
  // version, manifest and code are always the same version. A bot with
  // mistakes is saved too, with valid false and its errors, so it can be
  // fixed and saved again. expected_revision must be the strategy's current
  // revision, so two writers never overwrite each other. A save whose
  // content is the current revision's adds no revision and returns the
  // current revision, renaming the strategy if its name is new. Saving a
  // version the strategy already keeps never checks it again.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request, RUNTIME_VERSION_UNSUPPORTED or
  //   MANIFEST_TOO_LARGE.
  // - NOT_FOUND: STRATEGY_NOT_FOUND, for another account's strategy as for
  //   an unknown one.
  // - FAILED_PRECONDITION: DRAFT_REVISION_CONFLICT; revision_conflict gives
  //   the current revision and its version. NOTES_REVISION_CONFLICT when
  //   expected_notes_revision is set and the notes moved past it;
  //   notes_conflict gives their current revision.
  // - ALREADY_EXISTS: IDEMPOTENCY_CONFLICT; the original save stands.
  // - UNAVAILABLE: SERVICE_UNAVAILABLE; retry the same request.
  // - PERMISSION_DENIED: AUTH_API_KEY_ACCESS_DENIED when the API key's policy
  //   does not grant DRAFT_STRATEGIES or the key is scoped to a subaccount.
  // - UNAUTHENTICATED: missing or invalid credentials.
  rpc SaveDraftVersion(SaveDraftVersionRequest) returns (SaveDraftVersionResponse) {
    option idempotency_level = IDEMPOTENT;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Save Draft Version"
      description: "Check a bot and save it as the next revision of a strategy, valid or not. expected_revision must be the current revision. An API key needs DRAFT_STRATEGIES and must be scoped to the main account."
      tags: "Strategies Service"
    };
  }

  // GetStrategy reads one strategy of the caller and the version of its
  // current revision. Only the main account that owns it reads it.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request.
  // - NOT_FOUND: STRATEGY_NOT_FOUND, for another account's strategy as for
  //   an unknown one.
  // - UNAVAILABLE: SERVICE_UNAVAILABLE; retry.
  // - PERMISSION_DENIED: AUTH_API_KEY_ACCESS_DENIED when the API key's policy
