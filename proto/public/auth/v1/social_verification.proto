syntax = "proto3";

package auth.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/auth/v1;authv1";

// Social account provider used for account ownership verification.
enum SocialProvider {
  // No social provider was specified.
  PROVIDER_UNSPECIFIED = 0;
  // X/Twitter account verification.
  TWITTER = 1;
  // Discord account verification.
  DISCORD = 2;
}

// Current state of a social account verification attempt.
enum SocialVerificationStatus {
  // No verification status was specified.
  STATUS_UNSPECIFIED = 0;
  // Code issued; waiting for the user to complete the provider-specific action.
  STATUS_PENDING_USER_ACTION = 1;
  // User marked the code as placed and the verification check is waiting to run.
  STATUS_QUEUED = 2;
  // Verification check is currently running.
  STATUS_IN_PROGRESS = 3;
  // Provider account ownership was verified successfully.
  STATUS_VERIFIED = 4;
  // Verification failed. Start a new verification to receive a new challenge code.
  STATUS_FAILED = 5;
  // Challenge code expired before verification completed.
  STATUS_EXPIRED = 6;
  // Verification was cancelled.
  STATUS_CANCELLED = 7;
}

// How the user proves control of the provider account.
enum SocialVerificationMethod {
  // No method was specified. The provider default is used.
  METHOD_UNSPECIFIED = 0;
  // User places the challenge code in their public provider profile.
  METHOD_PROFILE = 1;
  // User posts the challenge code in a provider channel.
  METHOD_CHANNEL = 2;
  // User sends the challenge code in a direct message.
  METHOD_DM = 3;
}

// SocialVerification describes the caller's current verification state for one
// social provider.
message SocialVerification {
  // Verification identifier.
  int64 id = 12;
  // Provider account being verified.
  SocialProvider provider = 1;
  // Method used for this verification. If unspecified at start time, profile
  // verification is used.
  SocialVerificationMethod method = 11;
  // Provider handle being verified. Handles are returned lowercase and without
  // a leading "@".
  string handle = 2;
  // Stable provider-side user identifier. Empty until verification succeeds.
  string provider_user_id = 3;
  // Challenge code the user must place according to the verification method.
  // Codes start with "poly_" and expire after 15 minutes.
  string challenge_code = 13;
  // Current verification status.
  SocialVerificationStatus status = 4;
  // Time in UTC when the current challenge code was issued.
  google.protobuf.Timestamp requested_at = 5;
  // Time in UTC when the current challenge code expires.
  google.protobuf.Timestamp expires_at = 6;
  // Time in UTC when verification succeeded. Empty until status is STATUS_VERIFIED.
  google.protobuf.Timestamp verified_at = 7;
  // Number of recorded provider-check attempts for this challenge.
  int32 attempts = 9;
  // Last verification error, if the most recent check failed. Empty when there
  // is no recorded error.
  string last_error = 10;
  // Time in UTC when this verification state last changed.
  google.protobuf.Timestamp updated_at = 15;
}

// StartSocialVerificationRequest starts or restarts social account verification.
// Starting again for the same provider replaces the previous challenge.
message StartSocialVerificationRequest {
  option (buf.validate.message).cel = {
    id: "twitter_handle_format"
    message: "twitter handle must be 1-15 chars [A-Za-z0-9_], without '@'"
    expression: "this.provider != 1 ? true : this.handle.matches('^[A-Za-z0-9_]{1,15}$')"
  };

  // Provider account to verify.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
  // Verification method. If unspecified, profile verification is used.
  SocialVerificationMethod method = 3 [
    // Allow METHOD_UNSPECIFIED so the provider default can apply, but reject
    // unknown numeric values.
    (buf.validate.field).enum = {defined_only: true}
  ];
  // Provider handle the user claims. A leading "@" is accepted and removed.
  // X/Twitter handles must be 1 to 15 letters, digits, or underscores.
  // Other provider handles can be up to 64 characters.
  string handle = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    },
    (buf.validate.field).cel = {
      id: "handle.no_angle_brackets"
      message: "handle must not contain '<' or '>'"
      expression: "!this.contains('<') && !this.contains('>')"
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// Response returned after starting social account verification.
message StartSocialVerificationResponse {
  // Challenge code the user must place according to the verification method.
  string challenge_code = 1;
  // Time in UTC when the challenge code expires. Social verification challenges
  // expire after 15 minutes.
  google.protobuf.Timestamp expires_at = 2;
  // Current verification state after issuing the challenge.
  SocialVerification verification = 3;
}

// SocialVerificationReadyRequest tells the API that the challenge code has been
// placed and the provider account is ready to check.
message SocialVerificationReadyRequest {
  // Provider account to check.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// SocialVerificationReadyResponse returns the verification after it has been
// queued for a provider check.
message SocialVerificationReadyResponse {
  // Current verification state after the provider check was requested.
  SocialVerification verification = 1;
}

// GetSocialVerificationRequest fetches the caller's current social verification
// state for one provider.
message GetSocialVerificationRequest {
  // Provider account to inspect.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// GetSocialVerificationResponse contains the caller's current social
// verification state for one provider.
message GetSocialVerificationResponse {
  // Current verification state for the requested provider.
  SocialVerification verification = 1;
}

// SocialVerificationService verifies ownership of external social accounts.
service SocialVerificationService {
  // Start or restart social verification by issuing a new challenge code.
  rpc StartSocialVerification(StartSocialVerificationRequest) returns (StartSocialVerificationResponse) {
    option (google.api.http) = {
      post: "/v1/auth/social/verification:start"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Start Social Verification"
      description: "Issue a challenge code for the caller to place in the provider account."
      tags: "Auth Service"
    };
  }

  // Mark a verification as ready after the challenge code has been placed.
  rpc SocialVerificationReady(SocialVerificationReadyRequest) returns (SocialVerificationReadyResponse) {
    option (google.api.http) = {
      post: "/v1/auth/social/verification:ready"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Mark Social Verification Ready"
      description: "Mark verification as ready and request a provider account check."
      tags: "Auth Service"
    };
  }

  // Get current verification status for the caller.
  rpc GetSocialVerification(GetSocialVerificationRequest) returns (GetSocialVerificationResponse) {
    option (google.api.http) = {get: "/v1/auth/social/verification"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Social Verification"
      description: "Retrieve current social verification status for the caller."
      tags: "Auth Service"
    };
  }
}
