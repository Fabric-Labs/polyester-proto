syntax = "proto3";

package polyester.ratelimit.v1;

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/polyester/ratelimit/v1;polyesterratelimitv1";

// FailureReason identifies why rate-limit evaluation rejected a request.
enum FailureReason {
  // No rate-limit failure reason was provided.
  REASON_UNSPECIFIED = 0;
  // The active weighted quota did not have enough capacity.
  QUOTA_EXCEEDED = 1;
  // The required rate-limit authority could not make a safe decision.
  AUTHORITY_UNAVAILABLE = 2;
}

// PolicyClass identifies the mutable quota family used for a decision.
enum PolicyClass {
  // No policy class was provided.
  CLASS_UNSPECIFIED = 0;
  // Public authentication operations.
  AUTH_PUBLIC = 1;
  // Trading order and trigger placement operations.
  TRADING_PLACE = 2;
  // Trading order and trigger cancellation operations.
  TRADING_CANCEL = 3;
  // Authenticated trading read operations.
  TRADING_READ = 4;
  // General account and subaccount administration operations.
  ACCOUNT_ADMIN = 5;
  // Public market-data and realtime read operations.
  PUBLIC_READ = 6;
  // MFA, recovery, API-key, policy, and security-control mutations.
  ACCOUNT_SECURITY = 7;
  // Deposit-address creation that may call an upstream provider.
  DEPOSIT_CREATE = 8;
  // Off-chain internal ledger transfer admission.
  INTERNAL_TRANSFER = 9;
  // Chain or lifecycle withdraw submission.
  WITHDRAW_SUBMIT = 10;
  // Withdraw destination validation.
  WITHDRAW_VALIDATE = 11;
  // Guard-signer wallet and protected-action operations.
  GUARD_SIGN = 12;
  // External social-provider work.
  SOCIAL_PROVIDER = 13;
}

// LimiterScope identifies the caller dimension that owns exhausted capacity.
// It never contains the caller's actual identifier.
enum LimiterScope {
  // No limiter scope was provided.
  SCOPE_UNSPECIFIED = 0;
  // The normalized client network address owns the capacity.
  CLIENT_IP = 1;
  // The authenticated API key owns the capacity.
  API_KEY = 2;
  // The authenticated account owns the capacity.
  ACCOUNT = 3;
  // The selected subaccount owns the capacity.
  SUBACCOUNT = 4;
  // The active realtime connection owns the capacity.
  CONNECTION = 5;
  // The calling service owns the capacity.
  SERVICE = 6;
  // The serving region owns the capacity.
  REGION = 7;
  // The trading or market-data symbol owns the capacity.
  SYMBOL = 8;
  // A privacy-preserving normalized public authentication subject owns capacity.
  AUTH_SUBJECT = 9;
}

// RefillModel describes how exhausted capacity becomes available again.
enum RefillModel {
  // No refill model was provided.
  REFILL_UNSPECIFIED = 0;
  // Capacity refills continuously over the configured policy period.
  CONTINUOUS = 1;
  // Capacity resets at fixed window boundaries.
  FIXED_WINDOW = 2;
  // Capacity is measured over a rolling time window.
  ROLLING_WINDOW = 3;
}

// RateLimitDetail contains bounded, client-safe quota state for one rejected
// operation. Weight values use the operation registry's weighted request units.
message RateLimitDetail {
  // Machine-readable failure reason.
  FailureReason reason = 1;
  // Active weighted quota. Present for quota-exhaustion responses.
  optional uint64 limit = 2;
  // Weighted capacity remaining when the request was rejected.
  optional uint64 remaining = 3;
  // Minimum relative delay before retrying, in milliseconds.
  optional uint64 retry_after_ms = 4;
  // Policy version used for the decision, when available.
  optional uint64 policy_version = 5;
  // Stable operation identifier shared by all aliases of the same action.
  string operation_id = 6;
  // Mutable quota family used for the decision.
  PolicyClass policy_class = 7;
  // Caller dimension that owns the exhausted capacity.
  LimiterScope scope = 8;
  // Refill behavior used by the active limiter.
  RefillModel refill_model = 9;
}
