version: v2
modules:
  - path: proto/common
  - path: proto/public
deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
  - buf.build/gnostic/gnostic
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
  ignore_only:
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/public/auth/v1/policies.proto
    PACKAGE_VERSION_SUFFIX:
      - proto/common/polyester/api/options.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/public/auth/v1/mfa.proto
      - proto/public/auth/v1/profile.proto
    RPC_REQUEST_STANDARD_NAME:
      - proto/public/auth/v1/profile.proto
      - proto/public/auth/v1/subaccounts.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/public/chain/lifecycle/v1/lifecycle_read.proto
      - proto/public/auth/v1/mfa.proto
      - proto/public/auth/v1/profile.proto
      - proto/public/auth/v1/subaccounts.proto
breaking:
  use:
    - FILE
