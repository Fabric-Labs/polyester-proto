syntax = "proto2";

package polyester.api.validation.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/polyester/api/validation/v1;validationv1";

extend buf.validate.StringRules {
  // Validates an external network destination address accepted by the address book.
  optional bool external_chain_address_text = 50000 [(buf.validate.predefined).cel = {
    id: "string.external_chain_address_text"
    expression:
      "(this.size() > 0 && this.size() <= 256 && this.matches('^[^\\\\s<>]+$'))"
      "? ''"
      ": 'address must be 1-256 characters and must not contain whitespace or angle brackets'"
  }];

  // Validates a 0x-prefixed account address used for internal exchange transfers.
  optional bool evm_address = 50001 [(buf.validate.predefined).cel = {
    id: "string.evm_address"
    message: "address must be a valid 0x-prefixed account address"
    expression: "this.size() == 42 && this.matches('^0x[0-9a-fA-F]{40}$')"
  }];

  // Validates a transaction identifier from any supported chain.
  optional bool chain_tx_identifier = 50002 [(buf.validate.predefined).cel = {
    id: "string.chain_tx_identifier"
    message: "transaction identifier must be a valid EVM hash or chain-native printable id"
    expression:
      "(this.size() == 66 && this.matches('^0x[0-9a-fA-F]{64}$'))"
      "|| (this.size() > 0 && this.size() <= 256 && !this.startsWith('0x') && !this.startsWith('0X') && this.matches('^[\\\\x21-\\\\x7e]+$'))"
  }];
}
