syntax = "proto3";

package ledger.v1;

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/ledger/v1;ledgerv1";

// AccountCode identifies the ledger account bucket affected by a transfer.
enum AccountCode {
  // Account bucket was not specified.
  ACCOUNT_CODE_UNSPECIFIED = 0;
  // User funding bucket.
  FUNDING = 300;
  // User trading bucket.
  TRADING = 301;
}

// TransferCode identifies the product reason for a transfer.
enum TransferCode {
  // Transfer reason was not specified.
  TRANSFER_CODE_UNSPECIFIED = 0;
  // External deposit into a funding account.
  DEPOSIT = 1000;
  // External withdrawal from a funding account.
  WITHDRAW = 1001;
  // Maker fee charged for a trade.
  MAKER_FEE = 1010;
  // Taker fee charged for a trade.
  TAKER_FEE = 1011;
  // Internal account transfer.
  INTERNAL_TRANSFER = 1030;
  // Spot trade base-asset leg.
  TRADE_BASE = 1031;
  // Spot trade quote-asset leg.
  TRADE_QUOTE = 1032;
  // Rebate transfer.
  REBATE = 1041;
  // Funding-to-trading user bucket transfer.
  FUNDING_TO_TRADING = 1060;
  // Trading-to-funding user bucket transfer.
  TRADING_TO_FUNDING = 1061;
  // Reserve leg for a trading withdrawal.
  TRADING_WITHDRAW_RESERVE = 1062;
  // Funding user-to-user transfer.
  FUNDING_USER_TRANSFER = 1063;
  // Non-refundable on-chain request fee retained when a submitted trading withdrawal fails.
  TRADING_WITHDRAW_REQUEST_FEE = 1065;
  // Fee paid to a fee recipient when a trading withdrawal completes.
  TRADING_WITHDRAW_FEE_LEG = 1066;
  // QuickSwap fee paid to Polyester in the received asset.
  QUICKSWAP_POLYESTER_FEE = 1067;
  // QuickSwap fee paid to a broker in the received asset.
  QUICKSWAP_BROKER_FEE = 1068;
  // QuickSwap fee paid to an affiliate in the received asset.
  QUICKSWAP_AFFILIATE_FEE = 1069;
  // Collected fees transferred to the fee treasury's trading account.
  FEE_SWEEP = 1072;
  // Funds transferred from the fee treasury's trading account to replenish fee funds.
  FEE_REFILL = 1073;
  // Balance adjustment with a system account, including account seeding credits or corrections.
  // May credit or debit the user's account; the transfer direction identifies which.
  SYSTEM_ADJUSTMENT = 1074;
}
