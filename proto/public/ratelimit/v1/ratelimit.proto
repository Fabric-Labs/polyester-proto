syntax = "proto3";

package ratelimit.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/ratelimit/v1;ratelimitv1";
// Document-level OpenAPI metadata for the rate-limit API.
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Rate Limit Service"
      description:
        "Public trading quota reference data and authenticated effective "
        "trading limits."
    }
  ]
};

// TradingRateLimitClass identifies a public trading operation family.
enum TradingRateLimitClass {
  // No trading operation family was provided.
  TRADING_RATE_LIMIT_CLASS_UNSPECIFIED = 0;
  // New-order placement and order modification.
  TRADING_RATE_LIMIT_CLASS_PLACE = 1;
  // Order and trigger cancellation.
  TRADING_RATE_LIMIT_CLASS_CANCEL = 2;
  // Order, fill, trigger, trading-limit and fee reads, and order previews.
  // Each account has its own read limit: the root account and each
  // subaccount separately, shared by every API key and session that reads
  // for that account.
  TRADING_RATE_LIMIT_CLASS_READ = 3;
}

// TradingRateLimitRule describes one weighted placement, cancellation or read
// quota for one VIP tier.
message TradingRateLimitRule {
  // Trading operation family governed by this rule. Public responses contain
  // TRADING_RATE_LIMIT_CLASS_PLACE, TRADING_RATE_LIMIT_CLASS_CANCEL or
  // TRADING_RATE_LIMIT_CLASS_READ.
  TradingRateLimitClass policy_class = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // VIP tier for this rule, in the inclusive range 0 through 10.
  uint32 vip_tier = 2 [(buf.validate.field).uint32.lte = 10];

  // Weighted request capacity available during each policy period. One
  // operation consumes the weight assigned to that operation.
  uint64 quota_weight = 3 [(buf.validate.field).uint64.gt = 0];

  // Policy period duration in milliseconds.
  uint64 period_ms = 4 [(buf.validate.field).uint64.gt = 0];

  // Maximum weighted capacity that may be consumed in a burst.
  uint64 burst_weight = 5 [(buf.validate.field).uint64.gt = 0];
}

// GetRateLimitConfigRequest requests the complete active public trading
// rate-limit catalog.
message GetRateLimitConfigRequest {}

// GetRateLimitConfigResponse contains all placement, cancellation and read
// rules for one complete policy version.
message GetRateLimitConfigResponse {
  // Positive identifier of the returned rate-limit policy version.
  uint64 policy_version = 1 [(buf.validate.field).uint64.gt = 0];

  // UTC time at which this policy version became effective.
  google.protobuf.Timestamp effective_from = 2 [(buf.validate.field).required = true];

  // Complete placement, cancellation and read catalog. Rules are ordered by
  // policy class (cancellation, placement, read), then by tier ascending. The
  // list contains one rule per class for each VIP0 through VIP10 tier and is
  // not paginated.
  repeated TradingRateLimitRule rules = 3 [(buf.validate.field).repeated = {
    min_items: 33
    max_items: 33
  }];
}

// GetTradingRateLimitsRequest requests the effective trading limits for one
// account target.
message GetTradingRateLimitsRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetTradingRateLimitsResponse contains the placement, cancellation and read
// limits enforced for the selected account target. All three limits apply per
// account: the root account and each subaccount have their own limits, and
// every API key and session that trades or reads for an account shares that
// account's limits.
message GetTradingRateLimitsResponse {
  // Positive identifier of the rate-limit policy version used for the
  // returned rules.
  uint64 policy_version = 1 [(buf.validate.field).uint64.gt = 0];

  // UTC time at which this policy version became effective.
  google.protobuf.Timestamp effective_from = 2 [(buf.validate.field).required = true];

  // Placement, cancellation and read rules enforced for the selected
  // account, ordered placement, cancellation, read. All of the account's API
  // keys and sessions draw on these limits together.
  repeated TradingRateLimitRule rules = 3 [(buf.validate.field).repeated = {
    min_items: 3
    max_items: 3
  }];

  // Placement, cancellation and read rules resolved for the calling API key,
  // ordered placement, cancellation, read. Present only when the caller
  // authenticated with an API key. The read rule is enforced per API key on
  // top of the account's read limit: a read or preview is refused when either
  // is exhausted. The placement and cancellation rules are informational:
  // orders are limited per account only, by the account rules in `rules`.
  repeated TradingRateLimitRule api_key_rules = 4 [(buf.validate.field).repeated = {
    max_items: 3
  }];
}

// RateLimitService serves public trading quota reference data and authenticated
// effective trading limits. A trading read costs units of the read limit of
// the account it reads: one unit per call, or for a list, one unit per 100
// rows its limit asks for, rounded up (two for order history, fills and
// trigger events). A read over the limit is refused RESOURCE_EXHAUSTED (REST 429
// RATE_LIMIT_EXCEEDED) with its RateLimitDetail.
service RateLimitService {
  option (polyester.api.docs_group) = "trading";

  // Get the complete active placement, cancellation and read quota catalog
  // for VIP0 through VIP10.
  // This public, caller-independent catalog supports cacheable ConnectRPC GET.
  rpc GetRateLimitConfig(GetRateLimitConfigRequest) returns (GetRateLimitConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/rate-limits"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Rate Limit Config"
      description:
        "Get the complete active placement, cancellation and read quota "
        "catalog for VIP0 through VIP10."
      tags: "Rate Limit Service"
      security: [{}]
    };
  }

  // Get the effective placement, cancellation and read limits for the
  // authenticated caller's root account or selected subaccount. Costs one
  // unit of the account's read limit.
  rpc GetTradingRateLimits(GetTradingRateLimitsRequest) returns (GetTradingRateLimitsResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/trading/rate-limits"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Trading Rate Limits"
      description:
        "Get the effective placement, cancellation and read limits for the "
        "authenticated account target. Costs one unit of the "
        "account's read limit."
      tags: "Rate Limit Service"
    };
  }
}
