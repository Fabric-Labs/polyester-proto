    option (gnostic.openapi.v3.operation) = {
      summary: "List API Key Policies"
      description: "List API key policy templates available to the caller. An API key needs READ_API_POLICIES; a key scoped to a sub-account sees only the policies attached to that sub-account's keys."
      tags: "Auth Service"
    };
  }

  // Get an API key policy template by id. An API key needs
  // READ_API_POLICIES; a key scoped to a sub-account reads only the policies
  // attached to that sub-account's keys.
  rpc GetApiPolicy(GetApiPolicyRequest) returns (GetApiPolicyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/policies/api-keys/{policy_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get API Key Policy"
      description: "Retrieve a single API key policy template by policy ID. An API key needs READ_API_POLICIES; a key scoped to a sub-account reads only the policies attached to that sub-account's keys."
      tags: "Auth Service"
    };
  }

