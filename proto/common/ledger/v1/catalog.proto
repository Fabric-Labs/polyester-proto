syntax = "proto3";

package ledger.v1;

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/ledger/v1;ledgerv1";

// AccountCode identifies the ledger account bucket affected by a transfer.
enum AccountCode {
  // Account bucket was not specified.
  ACCOUNT_CODE_UNSPECIFIED = 0;
  // User funding bucket.
  FUNDING = 300;
  // User trading bucket.
  TRADING = 301;
}

// TransferCode identifies the product reason for a transfer.
enum TransferCode {
  // Transfer reason was not specified.
  TRANSFER_CODE_UNSPECIFIED = 0;
  // External deposit into a funding account.
  DEPOSIT = 1000;
  // External withdrawal from a funding account.
  WITHDRAW = 1001;
  // Maker fee charged for a trade.
  MAKER_FEE = 1010;
  // Taker fee charged for a trade.
  TAKER_FEE = 1011;
  // Internal account transfer.
  INTERNAL_TRANSFER = 1030;
  // Spot trade base-asset leg.
  TRADE_BASE = 1031;
  // Spot trade quote-asset leg.
  TRADE_QUOTE = 1032;
  // Rebate transfer.
  REBATE = 1041;
  // Funding-to-trading user bucket transfer.
  FUNDING_TO_TRADING = 1060;
  // Trading-to-funding user bucket transfer.
  TRADING_TO_FUNDING = 1061;
  // Reserve leg for a trading withdrawal.
  TRADING_WITHDRAW_RESERVE = 1062;
  // Funding user-to-user transfer.
  FUNDING_USER_TRANSFER = 1063;
  // Non-refundable on-chain request fee retained when a submitted trading withdrawal fails.
  TRADING_WITHDRAW_REQUEST_FEE = 1065;
}
