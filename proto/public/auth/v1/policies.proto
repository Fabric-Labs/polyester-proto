      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create API Key Policy"
      description: "Create a new API key policy template for the caller account or workspace."
      tags: "Auth Service"
    };
  }

  // Change selected fields on an existing API key policy template. Adding a
  // money-out action to a policy attached to an assistant API key returns
  // FailedPrecondition with AUTH_ASSISTANT_KEY_ACTION_NOT_ALLOWED.
  rpc UpdateApiPolicy(UpdateApiPolicyRequest) returns (UpdateApiPolicyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
