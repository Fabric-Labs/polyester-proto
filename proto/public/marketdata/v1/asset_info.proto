syntax = "proto3";

package marketdata.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/marketdata/v1;marketdatav1";

// AssetIssuePrice is a known launch price in US dollars, including zero.
message AssetIssuePrice {
  // Nonnegative decimal string, at most 64 characters; no exponent or sign.
  string amount = 1;
  // Always USD.
  string currency = 2;
}

// AssetEditorialInfo contains team-maintained plain text and official links.
// Empty strings and collections mean unknown and may be hidden by clients.
message AssetEditorialInfo {
  // Plain text description, at most 10000 characters. Render as text.
  string description = 1;
  // Official HTTPS website, at most 2048 bytes.
  string website_url = 2;
  // HTTPS whitepaper URL, at most 2048 bytes.
  string whitepaper_url = 3;
  // Up to 10 HTTPS block explorer URLs, each at most 2048 bytes; editorial order.
  repeated string explorer_urls = 4;
  // Official HTTPS X profile URL, at most 2048 bytes.
  string x_url = 5;
  // Official HTTPS Telegram URL, at most 2048 bytes.
  string telegram_url = 6;
  // Official HTTPS Discord URL, at most 2048 bytes.
  string discord_url = 7;
  // Official HTTPS GitHub URL, at most 2048 bytes.
  string github_url = 8;
  // Launch calendar date as YYYY-MM-DD, or empty when unknown.
  string issue_date = 9;
  // Launch price; absent when unknown.
  AssetIssuePrice issue_price = 10;
}

// AssetInfo is independently loaded asset information.
message AssetInfo {
  // Numeric asset ID, matching AssetConfig.ledger_id.
  uint32 asset_id = 1;
  // Team-maintained asset information.
  AssetEditorialInfo editorial = 2;
  // Time of the last effective editorial change, in UTC.
  google.protobuf.Timestamp editorial_updated_at = 3;
}

// ListAssetInfoRequest selects a finite asset information snapshot.
message ListAssetInfoRequest {
  // Optional numeric asset IDs, matching AssetConfig.ledger_id; empty means all.
  // At most 1000 IDs. Duplicate and unknown IDs are ignored.
  repeated uint32 asset_ids = 1 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      uint32: {
        gt: 0
        lte: 2147483647
      }
    }
  }];
}

// ListAssetInfoResponse contains assets with saved editorial information.
// Assets never edited are omitted. Cleared information retains an empty entry.
message ListAssetInfoResponse {
  // Complete finite result, ordered by ascending asset_id. No pagination.
  repeated AssetInfo asset_info = 1;
}
