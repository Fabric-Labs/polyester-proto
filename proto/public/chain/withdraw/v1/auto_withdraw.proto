syntax = "proto3";

package chain.withdraw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";
import "polyester/type/v1/u128.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/chain/withdraw/v1;chainwithdrawv1";

// AutoWithdrawCadence is how often an auto-withdraw rule runs. Every slot
// is a UTC time, with no daylight-saving shift.
enum AutoWithdrawCadence {
  // Not set; rejected.
  CADENCE_UNSPECIFIED = 0;
  // Once a day at minute_of_day UTC.
  DAILY = 1;
  // Once a week on weekday at minute_of_day UTC.
  WEEKLY = 2;
  // Checked every hour at minute_of_hour UTC; pays only an asset whose
  // payable amount has reached its minimums, so a payout follows within the
  // hour of the balance reaching them. An hour with nothing to pay records
  // no run.
  HOURLY = 3;
  // Every two weeks on weekday at minute_of_day UTC: in the week of
  // anchor_date and every second week before or after it.
  BIWEEKLY = 4;
  // Once a month on day_of_month at minute_of_day UTC. A month without that
  // day runs on its last day: day 31 runs on April 30 and on February 28 or
  // 29, and days 29 and 30 run on the last day of February.
  MONTHLY = 5;
}

// AutoWithdrawWeekday is the run day of a weekly or biweekly rule.
enum AutoWithdrawWeekday {
  // Not set; required for a weekly or biweekly rule and must be unset for
  // any other cadence.
  WEEKDAY_UNSPECIFIED = 0;
  // Monday.
  MONDAY = 1;
  // Tuesday.
  TUESDAY = 2;
  // Wednesday.
  WEDNESDAY = 3;
  // Thursday.
  THURSDAY = 4;
  // Friday.
  FRIDAY = 5;
  // Saturday.
  SATURDAY = 6;
  // Sunday.
  SUNDAY = 7;
}

// AutoWithdrawSchedule is a rule's UTC run slot. Only the fields of its
// cadence may be set; the others must be zero or empty.
message AutoWithdrawSchedule {
  // How often the rule runs.
  AutoWithdrawCadence cadence = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Run day of a weekly or biweekly rule.
  AutoWithdrawWeekday weekday = 2 [(buf.validate.field).enum.defined_only = true];
  // Minute after 00:00 UTC the run starts, 0 to 1439, for every cadence but
  // HOURLY; must be 0 for an hourly rule.
  uint32 minute_of_day = 3 [(buf.validate.field).uint32.lte = 1439];
  // Minute past every hour an HOURLY rule is checked, 0 to 59.
  uint32 minute_of_hour = 4 [(buf.validate.field).uint32.lte = 59];
  // Run day of a MONTHLY rule, 1 to 31; see MONTHLY for shorter months.
  uint32 day_of_month = 5 [(buf.validate.field).uint32.lte = 31];
  // A UTC date (YYYY-MM-DD) in a week a BIWEEKLY rule runs; weeks start on
  // Monday. Responses return the Monday that starts that week.
  string anchor_date = 6 [(buf.validate.field).string = {
    max_len: 10
    pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"
  }];
}

// AutoWithdrawDestination pays one asset, in kind, to one external-chain
// address.
message AutoWithdrawDestination {
  // Ledger asset paid. At most one destination per asset.
  uint32 asset_id = 1 [(buf.validate.field).uint32.gt = 0];
  // External destination chain identifier.
  uint64 destination_chain_id = 2 [(buf.validate.field).uint64.gt = 0];
  // Destination address on destination_chain_id. It must be on the
  // account's external withdraw whitelist when the rule is written and
  // whenever a run pays it. Responses carry its canonical form.
  string destination_address = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 385
  }];
  // A run pays this asset only when the payable amount reaches this
  // minimum, in 18-decimal asset units, and the rule's min_usd_value_e18;
  // otherwise the balance stays on the account for a later run. Must be at
  // least the route's withdrawal minimum.
  polyester.type.v1.U128 min_amount_e18 = 4 [(buf.validate.field).required = true];
  // The most one run pays this asset, in 18-decimal asset units; at least
  // min_amount_e18. A larger balance pays this ceiling and the rest stays on
  // the account.
  polyester.type.v1.U128 max_amount_e18 = 5 [(buf.validate.field).required = true];
}

// AutoWithdrawPause reports why a rule stopped running on its own.
message AutoWithdrawPause {
  // Asset whose payout paused the rule.
  uint32 asset_id = 1;
  // Machine-readable reason: destination_not_whitelisted when the
  // destination left the account's external withdraw whitelist,
  // destination_invalid when it is no longer a valid destination, or
  // authority_revoked when the person who set the rule may no longer change
  // it or withdraw from the account.
  string reason = 2;
  // When the rule was paused.
  google.protobuf.Timestamp paused_at = 3;
}

// AutoWithdrawRule is one version of an account's auto-withdraw rule. Each
// change or disable creates the next version; only the latest version runs,
// and a run in progress keeps the version it started with but pays nothing
// further once that version is no longer the latest.
message AutoWithdrawRule {
  // Public subaccount ID the rule belongs to; zero for the root account.
  fixed64 subaccount_id = 1;
  // Rule version, starting at 1.
  uint32 version = 2;
  // Whether the rule runs. A disabled version has no destinations.
  bool enabled = 3;
  // When the rule runs.
  AutoWithdrawSchedule schedule = 4;
  // One destination per paid asset, ordered by asset_id.
  repeated AutoWithdrawDestination destinations = 5;
  // When this version was created.
  google.protobuf.Timestamp created_at = 6;
  // Set when the rule paused itself; a new version resumes it.
  AutoWithdrawPause pause = 7;
  // Least USD value one payout of the rule pays, in 18-decimal USD units;
  // zero means no USD minimum.
  polyester.type.v1.U128 min_usd_value_e18 = 8;
}

// SetAutoWithdrawRuleRequest creates or replaces the rule of the root
// account or one subaccount.
message SetAutoWithdrawRuleRequest {
  // Public subaccount ID; omit for the root account.
  fixed64 subaccount_id = 1;
  // The version the change replaces: 0 when the account has no rule yet,
  // otherwise its latest version. A mismatch is rejected so concurrent
  // changes never overwrite each other.
  uint32 expected_version = 2;
  // When the rule runs.
  AutoWithdrawSchedule schedule = 3 [(buf.validate.field).required = true];
  // Destinations, one per asset, 1 to 32.
  repeated AutoWithdrawDestination destinations = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  // Least USD value one payout pays, in 18-decimal USD units; unset or zero
  // for no USD minimum. Each run values each asset's payable amount at the
  // current index price. A smaller amount stays on the account for a later
  // run, and the asset is skipped with reason price_unavailable when no
  // current price is available. A payout never goes below its destination's
  // min_amount_e18 or the route's withdrawal minimum.
  polyester.type.v1.U128 min_usd_value_e18 = 5;
}

// SetAutoWithdrawRuleResponse returns the new rule version.
message SetAutoWithdrawRuleResponse {
  // The created version.
  AutoWithdrawRule rule = 1;
}

// DisableAutoWithdrawRuleRequest stops the rule of the root account or one
// subaccount.
message DisableAutoWithdrawRuleRequest {
  // Public subaccount ID; omit for the root account.
  fixed64 subaccount_id = 1;
  // The account's latest rule version.
  uint32 expected_version = 2 [(buf.validate.field).uint32.gt = 0];
}

// DisableAutoWithdrawRuleResponse returns the disabled version.
message DisableAutoWithdrawRuleResponse {
  // The created, disabled version.
  AutoWithdrawRule rule = 1;
}

// GetAutoWithdrawRuleRequest reads the latest rule version.
message GetAutoWithdrawRuleRequest {
  // Public subaccount ID; omit for the root account.
  fixed64 subaccount_id = 1;
}

// GetAutoWithdrawRuleResponse returns the latest rule version.
message GetAutoWithdrawRuleResponse {
  // The latest version; unset when the account never had a rule.
  AutoWithdrawRule rule = 1;
}

// AutoWithdrawRunState is where one auto-withdraw run stands.
enum AutoWithdrawRunState {
  // Never returned.
  RUN_STATE_UNSPECIFIED = 0;
  // The run is reading the account's balances.
  RUN_PLANNED = 1;
  // The run's payouts are in progress.
  RUN_PAYING = 2;
  // Every payout completed or was skipped, and at least one paid.
  RUN_COMPLETED = 3;
  // Some payouts failed; their funds are back on the account.
  RUN_PARTIALLY_FAILED = 4;
  // Every attempted payout failed; the funds are back on the account.
  RUN_FAILED = 5;
  // Nothing was paid: every asset was below its minimum, no current price
  // valued it, or the rule was no longer current.
  RUN_SKIPPED = 6;
}

// AutoWithdrawStepState is where one asset's payout of a run stands.
enum AutoWithdrawStepState {
  // Never returned.
  STEP_STATE_UNSPECIFIED = 0;
  // Planned; not yet requested.
  STEP_PENDING = 1;
  // Being requested.
  STEP_SUBMITTING = 2;
  // Withdrawal accepted; waiting for it to complete on chain.
  STEP_SUBMITTED = 3;
  // The withdrawal completed on chain.
  STEP_COMPLETED = 4;
  // The withdrawal failed; its funds are back on the account.
  STEP_FAILED = 5;
  // Nothing was paid for this asset in this run.
  STEP_SKIPPED = 6;
}

// AutoWithdrawStep is one asset's payout in a run.
message AutoWithdrawStep {
  // Ledger asset paid.
  uint32 asset_id = 1;
  // External destination chain identifier.
  uint64 destination_chain_id = 2;
  // Canonical destination address.
  string destination_address = 3;
  // The account's available balance of the asset when the run started, in
  // 18-decimal asset units.
  polyester.type.v1.U128 available_e18 = 4;
  // What the step pays, in 18-decimal asset units: the available balance
  // up to the ceiling, rounded down to whole on-chain units. Zero when
  // skipped. The remainder stays on the account.
  polyester.type.v1.U128 amount_e18 = 5;
  // Where the payout stands.
  AutoWithdrawStepState state = 6;
  // Machine-readable reason for a skipped or failed step, such as
  // below_minimum, price_unavailable (the rule has a USD minimum and no
  // current price valued the asset; the funds stay for a later run),
  // rule_superseded, destination_not_whitelisted, authority_revoked,
  // gateway_capacity_insufficient (the funds stay for a later run),
  // withdrawal_released or withdrawal_failed; empty otherwise.
  string reason = 7;
  // Withdraw intent identifier once the withdrawal is accepted; follows the
  // same lifecycle as a user withdrawal.
  string intent_id = 8;
  // Destination-network transaction hash once the withdrawal completed.
  string tx_hash = 9;
  // USD value of the payable amount when the run started, in 18-decimal USD
  // units, checked against the rule's min_usd_value_e18. Unset when the rule
  // has no USD minimum or no current price was available.
  polyester.type.v1.U128 value_usd_e18 = 10;
}

// AutoWithdrawRun is one scheduled run of an account's rule.
message AutoWithdrawRun {
  // The account's run number, increasing by one per run.
  uint64 run_seq = 1;
  // The rule version the run executes.
  uint32 rule_version = 2;
  // The scheduled slot the run belongs to.
  google.protobuf.Timestamp scheduled_for = 3;
  // Where the run stands.
  AutoWithdrawRunState state = 4;
  // Machine-readable reason for a skipped run: nothing_to_pay,
  // price_unavailable (an asset was not paid because no current price valued
  // it) or rule_superseded; empty otherwise.
  string reason = 5;
  // One step per destination of the rule version, ordered by asset_id.
  // Empty while the run is planned.
  repeated AutoWithdrawStep steps = 6;
  // When the run started.
  google.protobuf.Timestamp created_at = 7;
  // When the run ended; unset while it is in progress.
  google.protobuf.Timestamp finished_at = 8;
}

// ListAutoWithdrawRunsRequest pages through an account's runs, newest first.
message ListAutoWithdrawRunsRequest {
  // Public subaccount ID; omit for the root account.
  fixed64 subaccount_id = 1;
  // Maximum number of runs to return: 0 means 20, at most 100.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 100];
  // Opaque, exclusive, keyset-backed cursor from a previous response,
  // bound to the caller's account or subaccount and the newest-first
  // run_seq order. Empty for the first page.
  string page_token = 3 [(buf.validate.field).string.max_len = 256];
}

// ListAutoWithdrawRunsResponse returns one page of runs, newest first.
message ListAutoWithdrawRunsResponse {
  // Runs ordered by run_seq, newest first.
  repeated AutoWithdrawRun runs = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// AutoWithdrawService manages scheduled in-kind auto-withdraw rules for a
// root account or subaccount. A rule pays each asset's balance out on an
// hourly, daily, weekly, biweekly or monthly UTC slot, through the normal
// withdraw path, only to destinations on the account's external withdraw
// whitelist. Changing a
// rule requires a person with withdraw rights and a fresh single-use MFA
// step-up; API keys can read rules and runs but never change them.
service AutoWithdrawService {
  // Create the account's rule, or replace its latest version with a new
  // one. Requires a session login with withdraw rights on the account and
  // a fresh single-use step-up; every destination must be on the account's
  // external withdraw whitelist.
  rpc SetAutoWithdrawRule(SetAutoWithdrawRuleRequest) returns (SetAutoWithdrawRuleResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
  }

  // Disable the account's rule. Requires a session login with withdraw
  // rights on the account and a fresh single-use step-up.
  rpc DisableAutoWithdrawRule(DisableAutoWithdrawRuleRequest) returns (DisableAutoWithdrawRuleResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
  }

  // Read the account's latest rule version.
  rpc GetAutoWithdrawRule(GetAutoWithdrawRuleRequest) returns (GetAutoWithdrawRuleResponse);

  // List the account's auto-withdraw runs with their payouts, newest first.
  rpc ListAutoWithdrawRuns(ListAutoWithdrawRunsRequest) returns (ListAutoWithdrawRunsResponse);
}
