syntax = "proto3";

package chain.zipper.v1;

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/chain/zipper/v1;chainzipperv1";

// ZipperReasonCode identifies a specific Zipper request outcome. Numeric
// values are stable and may be used for client decisions, analytics, and
// support.
enum ZipperReasonCode {
  // No specific reason is available.
  REASON_UNSPECIFIED = 0;

  // Deposit confirmations were not reached before the wait expired.
  DEPOSIT_WAIT_EXPIRED = 1001;
  // Deposit amount is invalid.
  DEPOSIT_AMOUNT_INVALID = 1002;
  // Deposit amount is below the configured minimum.
  DEPOSIT_AMOUNT_BELOW_MINIMUM = 1003;
  // Deposit amount is not greater than the fee.
  DEPOSIT_AMOUNT_NOT_ABOVE_FEE = 1004;
  // Deposit amount after fees is below the configured minimum.
  DEPOSIT_NET_AMOUNT_BELOW_MINIMUM = 1005;

  // EVM deposit source transaction hash is invalid.
  EVM_DEPOSIT_SOURCE_TX_INVALID = 1101;
  // EVM deposit source transaction hash is zero.
  EVM_DEPOSIT_SOURCE_TX_ZERO = 1102;
  // EVM deposit source transaction was not found.
  EVM_DEPOSIT_SOURCE_TX_NOT_FOUND = 1103;
  // EVM deposit source transaction reverted.
  EVM_DEPOSIT_SOURCE_TX_REVERTED = 1104;
  // EVM deposit transfer does not match the request.
  EVM_DEPOSIT_TRANSFER_MISMATCH = 1105;

  // UTXO deposit transaction does not match the request.
  UTXO_DEPOSIT_TRANSACTION_MISMATCH = 1201;
  // Bitcoin deposit transaction does not match the request.
  BTC_DEPOSIT_TRANSACTION_MISMATCH = 1202;
  // Bitcoin Cash deposit transaction does not match the request.
  BCH_DEPOSIT_TRANSACTION_MISMATCH = 1203;
  // Dogecoin deposit transaction does not match the request.
  DOGE_DEPOSIT_TRANSACTION_MISMATCH = 1204;
  // Litecoin deposit transaction does not match the request.
  LTC_DEPOSIT_TRANSACTION_MISMATCH = 1205;
  // UTXO deposit source is a registered deposit address.
  UTXO_DEPOSIT_SOURCE_IS_DEPOSIT_ADDRESS = 1206;

  // Solana deposit signature is invalid.
  SOLANA_DEPOSIT_SIGNATURE_INVALID = 1301;
  // Solana deposit transaction failed.
  SOLANA_DEPOSIT_TRANSACTION_FAILED = 1302;
  // Solana deposit transfer does not match the request.
  SOLANA_DEPOSIT_TRANSFER_MISMATCH = 1303;

  // XRP deposit source hash index is invalid.
  XRP_DEPOSIT_SOURCE_HASH_INDEX_INVALID = 1401;
  // XRP deposit source address is invalid.
  XRP_DEPOSIT_SOURCE_ADDRESS_INVALID = 1402;
  // XRP deposit address is invalid.
  XRP_DEPOSIT_ADDRESS_INVALID = 1403;
  // XRP deposit payment does not match the request.
  XRP_DEPOSIT_PAYMENT_MISMATCH = 1404;

  // The request was rejected without a more specific mapped reason.
  REJECTION_UNMAPPED = 1999;

  // Withdrawal amount is invalid.
  WITHDRAWAL_AMOUNT_INVALID = 2001;
  // Withdrawal amount is below the configured minimum.
  WITHDRAWAL_AMOUNT_BELOW_MINIMUM = 2002;
  // Withdrawal asset address is invalid.
  WITHDRAWAL_ASSET_INVALID = 2003;
  // Withdrawal sender account is invalid.
  WITHDRAWAL_SENDER_INVALID = 2004;
  // Withdrawal destination address is invalid.
  WITHDRAWAL_DESTINATION_INVALID = 2005;
  // Withdrawal asset is unavailable on the destination network.
  WITHDRAWAL_ASSET_UNAVAILABLE = 2006;

  // EVM withdrawal destination address is invalid.
  EVM_WITHDRAWAL_DESTINATION_INVALID = 2101;

  // Bitcoin withdrawal destination address is invalid.
  BTC_WITHDRAWAL_DESTINATION_INVALID = 2201;
  // Bitcoin Cash withdrawal destination address is invalid.
  BCH_WITHDRAWAL_DESTINATION_INVALID = 2202;
  // Dogecoin withdrawal destination address is invalid.
  DOGE_WITHDRAWAL_DESTINATION_INVALID = 2203;
  // Litecoin withdrawal destination address is invalid.
  LTC_WITHDRAWAL_DESTINATION_INVALID = 2204;

  // Solana withdrawal destination address is invalid.
  SOLANA_WITHDRAWAL_DESTINATION_INVALID = 2301;

  // XRP withdrawal classic address is invalid.
  XRP_WITHDRAWAL_CLASSIC_ADDRESS_INVALID = 2401;
  // XRP withdrawal destination tag is invalid.
  XRP_WITHDRAWAL_DESTINATION_TAG_INVALID = 2402;

  // Available liquidity is insufficient for the withdrawal.
  WITHDRAWAL_LIQUIDITY_INSUFFICIENT = 3001;
  // Request address was classified as high risk.
  COMPLIANCE_HIGH_RISK_ADDRESS = 3002;
  // Request verification was rejected without a more specific reason.
  REQUEST_VERIFICATION_REJECTED = 3901;
  // Request processing completed with a rejected result.
  REJECTED = 3902;

  // Request processing failed with an unmapped error.
  ERROR_UNMAPPED = 9000;
  // Selected network is unsupported.
  ERROR_NETWORK_UNSUPPORTED = 9001;
  // Request processing failed.
  ERROR_REQUEST_PROCESSING_FAILED = 9002;
  // Request verification failed.
  ERROR_REQUEST_VERIFICATION_FAILED = 9003;
  // Request result submission failed.
  ERROR_RESULT_SUBMISSION_FAILED = 9004;
  // Request status could not be determined.
  ERROR_STATUS_UNKNOWN = 9005;
}

// ZipperReasonDetails provides an exact Zipper reason and display metadata.
message ZipperReasonDetails {
  // Stable code assigned to the specific outcome.
  ZipperReasonCode code = 1;

  // Stable reason identifier suitable for localization lookup.
  string reason_id = 2;

  // User-displayable English explanation of the outcome.
  string message = 3;
}
