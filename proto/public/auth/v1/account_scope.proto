syntax = "proto3";

package auth.v1;

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/auth/v1;authv1";

// AccountScopeType identifies whether address-book data or an API key belongs to the root account or a subaccount.
enum AccountScopeType {
  // Scope is not specified.
  SCOPE_UNSPECIFIED = 0;
  // Root account scope.
  SCOPE_ROOT = 1;
  // Subaccount scope.
  SCOPE_SUBACCOUNT = 2;
}
