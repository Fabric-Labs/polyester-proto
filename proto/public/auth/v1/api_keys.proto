syntax = "proto3";

package auth.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";
import "polyester/api/validation/v1/predefined_string_rules.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/auth/v1;authv1";

// Status of an API key.
enum ApiKeyStatus {
  // No API key status specified.
  API_KEY_STATUS_UNSPECIFIED = 0;
  // Key can authenticate requests.
  ACTIVE = 1;
  // Key has been permanently revoked and cannot be used again.
  REVOKED = 2;
  // Key is temporarily disabled and cannot authenticate requests until re-enabled.
  DISABLED = 3;
}

// Purpose of an API key.
enum ApiKeyPurpose {
  // No purpose specified.
  PURPOSE_UNSPECIFIED = 0;
  // A key the account holder created for their own programs.
  STANDARD = 1;
  // A key the account holder created for the Polyester AI assistant through
  // SetAssistantKeys. Its policy can never allow actions that move value out
  // of the account or manage where it goes, such as external withdrawals or
  // internal transfers. Only its creator's assistant uses it, so a sub-account
  // assistant key is revoked when its creator loses the role that manages the
  // sub-account's API keys or leaves the sub-account.
  ASSISTANT = 2;
}

// ApiKey is public API key metadata. It never includes the private key or seed.
message ApiKey {
  // Stable opaque identifier used to refer to this key, formatted as "ak_"
  // followed by 32 lowercase hex characters.
  string key_id = 2 [(buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$"];
  // Human-readable label for the key. Maximum length is 64 characters.
  string label = 3;
  // Optional user-chosen icon/emoji for UI display.
  string icon = 9 [(buf.validate.field).string.max_len = 32];
  // Optional user-chosen color token for UI display.
  string color = 10 [(buf.validate.field).string.max_len = 32];
  // Optional CIDR whitelist. Empty means no IP restriction. Maximum 32 unique
  // entries.
  repeated string ip_whitelist = 4 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 32
    },
    (buf.validate.field).repeated.items.string.ip_with_prefixlen = true
  ];
  // Current key status.
  ApiKeyStatus status = 6;
  // Optional sub-account this key is scoped to (opaque ID; empty = root-level).
  optional fixed64 subaccount_id = 7;
  // Optional API policy attached to this key (opaque ID).
  // Empty means no policy is attached and the key has no permissions.
  optional fixed64 policy_id = 8;
  // Time in UTC when this key was created.
  google.protobuf.Timestamp created_at = 20;
  // Approximate last time in UTC when this key authenticated a request,
  // recorded at most about once a minute; it may lag recent use by a few
  // minutes. Omitted when no use has been recorded.
  google.protobuf.Timestamp last_used_at = 21;
  // Ed25519 public key bytes associated with this API key. The private key or
  // seed is never returned by the API.
  bytes public_key_ed25519 = 22;
  // Optional expiry time in UTC. When set, the key cannot authenticate requests
  // after this time, regardless of status.
  google.protobuf.Timestamp expires_at = 23;
  // Read-only actor label describing who created this key, such as a username
  // or account label.
  string created_by_actor = 24;
  // Time in UTC when this key's configuration was last changed. For the same
  // key, later is fresher, equal is an idempotent replay, and earlier is stale.
  // Equal timestamps with different configuration indicate an invariant failure.
  // This is independent of last_used_at, which tracks authentication activity.
  google.protobuf.Timestamp updated_at = 25;
  // Monotonic resource revision used for conditional updates.
  uint64 revision = 26;
  // What the key is for. ASSISTANT keys are managed with SetAssistantKeys and
  // are otherwise listed, updated and revoked like any key.
  ApiKeyPurpose purpose = 27;
}

// CreateApiKeyRequest creates a new API key. Clients generate the Ed25519 key
// pair locally and submit only the public key.
message CreateApiKeyRequest {
  // Human-readable label for the key. Required; 1 to 64 characters, and must
  // not contain '<' or '>'.
  string label = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.(polyester.api.validation.v1.display_label) = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Optional sub-account to scope this key to (opaque ID). If unset, the key is
  // root-level.
  optional fixed64 subaccount_id = 3;
  // Optional user-chosen icon/emoji for UI display.
  string icon = 6 [(buf.validate.field).string.max_len = 32];
  // Optional user-chosen color token for UI display.
  string color = 7 [(buf.validate.field).string.max_len = 32];
  // Optional CIDR whitelist. Empty means no IP restriction. Maximum 32 unique
  // entries.
  repeated string ip_whitelist = 4 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 32
    },
    (buf.validate.field).repeated.items.string.ip_with_prefixlen = true
  ];
  // Ed25519 public key bytes. Must be exactly 32 bytes. The private key or seed
  // must never be sent to the API.
  bytes public_key_ed25519 = 5 [
    (buf.validate.field).bytes.len = 32,
    (google.api.field_behavior) = REQUIRED
  ];
}

// CreateApiKeyResponse returns the created API key metadata.
message CreateApiKeyResponse {
  // Created API key metadata. The private key or seed is never returned.
  ApiKey api_key = 1;
}

// ListApiKeysRequest lists non-revoked API keys visible to the caller.
message ListApiKeysRequest {
  // Optional filter: only keys scoped to this sub-account (opaque ID). The
  // caller must own or administer the sub-account. If unset, only non-revoked
  // keys owned by the caller are returned.
  optional fixed64 subaccount_id = 1;
}

// ListApiKeysResponse contains matching API keys, newest first by creation time.
message ListApiKeysResponse {
  // Matching API keys, newest first. Revoked keys are excluded.
  repeated ApiKey api_keys = 1;
}

// DeleteApiKeyRequest permanently revokes an API key.
message DeleteApiKeyRequest {
  // Opaque API key identifier (e.g. "ak_<hex>"). This is the stable public
  // handle for a key.
  string key_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$",
    (google.api.field_behavior) = REQUIRED
  ];
}

// DeleteApiKeyResponse is empty when revocation succeeds.
message DeleteApiKeyResponse {}

// GetApiKeyRequest returns one API key visible to its owner or a sub-account admin.
message GetApiKeyRequest {
  // Opaque API key identifier, formatted as "ak_" followed by 32 lowercase hex
  // characters.
  string key_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$",
    (google.api.field_behavior) = REQUIRED
  ];
}

// GetApiKeyResponse returns one API key visible to the caller.
message GetApiKeyResponse {
  // Matching API key metadata.
  ApiKey api_key = 1;
}

// ApiKeyUpdateSpec contains mutable API key configuration.
message ApiKeyUpdateSpec {
  option (buf.validate.message).cel = {
    id: "expires_at_future_or_zero"
    message: "expires_at must be in the future or zero"
    expression: "!has(this.expires_at) ? true : this.expires_at == timestamp('1970-01-01T00:00:00Z') ? true : this.expires_at > now"
  };

  // Human-friendly label for the key. Empty clears the label when selected.
  // Must not contain '<' or '>'.
  string label = 1 [
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.(polyester.api.validation.v1.display_label) = true
  ];
  // User-chosen icon/emoji for UI display. Empty clears the icon when selected.
  string icon = 2 [(buf.validate.field).string.max_len = 32];
  // User-chosen color token for UI display. Empty clears the color when selected.
  string color = 3 [(buf.validate.field).string.max_len = 32];
  // New status. ACTIVE and DISABLED are allowed; revocation uses DeleteApiKey.
  ApiKeyStatus status = 4 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [
        2
      ]
    }
  ];
  // Complete replacement IP whitelist. Empty clears the restriction when selected.
  repeated string ip_whitelist = 5 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 32
    },
    (buf.validate.field).repeated.items.string.ip_with_prefixlen = true
  ];
  // Expiry time in UTC. When selected, omission or the epoch clears expiry.
  google.protobuf.Timestamp expires_at = 6;
}

// UpdateApiKeyRequest changes selected mutable fields on an existing API key.
message UpdateApiKeyRequest {
  // Opaque API key identifier to update.
  string key_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$",
    (google.api.field_behavior) = REQUIRED
  ];
  // Candidate values for fields selected by update_mask.
  ApiKeyUpdateSpec api_key = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Mutable fields to apply. Paths are relative to api_key. The mask is required,
  // must be non-empty, and cannot contain "*".
  google.protobuf.FieldMask update_mask = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Revision returned by the latest successful read.
  uint64 expected_revision = 4 [
    (buf.validate.field).uint64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

// UpdateApiKeyResponse returns the API key after applying the update.
message UpdateApiKeyResponse {
  // Updated API key metadata.
  ApiKey api_key = 1;
}

// AssistantKeyPreset is a fixed permission set for a Polyester AI assistant
// key. SetAssistantKeys turns it into an API policy of the key's main account,
// named after the preset, so the policy and the key need only the set's one
// step-up proof. No preset ever allows a money-out action (EXTERNAL_WITHDRAW,
// INTERNAL_TRANSFER, MANAGE_ADDRESS_BOOK, MANAGE_AUTO_WITHDRAW), API-key or
// policy management, or any action that weakens account security.
enum AssistantKeyPreset {
  // No preset selected.
  PRESET_UNSPECIFIED = 0;
  // Read actions only: READ_BALANCES, READ_SPOT, READ_INTERNAL_TRANSFERS,
  // READ_AUTO_WITHDRAW, READ_API_KEYS, READ_SUBACCOUNTS and
  // READ_DEPOSIT_ADDRESSES. On the main account, also READ_PRICE_ALERTS, a
  // main-account permission. Policy name "Polyester AI - Read only (main
  // account)" on the main account, "Polyester AI - Read only (sub-account)"
  // on a sub-account.
  READ_ONLY = 1;
  // READ_ONLY plus TRADE_SPOT, SWAP and CREATE_DEPOSIT_ADDRESS: the assistant
  // also places, changes and cancels orders and triggers, and swaps, each only
  // after the user approves that change, and creates deposit addresses, which
  // move no funds out. On the main account, also MANAGE_PRICE_ALERTS: price
  // alerts move no funds. Policy name "Polyester AI - Trade with
  // approval (main account)" on the main account, "Polyester AI - Trade with
  // approval (sub-account)" on a sub-account.
  TRADE_WITH_APPROVAL = 2;
}

// AssistantKeySpec is one account's key in the caller's assistant key set.
message AssistantKeySpec {
  // Exactly one of policy_id and preset: a zero value counts as unset.
  option (buf.validate.message).oneof = {
    fields: [
      "policy_id",
      "preset"
    ]
    required: true
  };

  // Sub-account the key acts for (opaque ID). Unset means the caller's main
  // account. A key acts for exactly one account.
  optional fixed64 subaccount_id = 1;
  // Ed25519 public key bytes the Polyester AI assistant signs with. Must be
  // exactly 32 bytes, and distinct within the set.
  bytes public_key_ed25519 = 2 [
    (buf.validate.field).bytes.len = 32,
    (google.api.field_behavior) = REQUIRED
  ];
  // API policy that bounds the key (opaque ID). It must belong to the same
  // main account as the key, and must not allow EXTERNAL_WITHDRAW,
  // INTERNAL_TRANSFER, MANAGE_ADDRESS_BOOK or MANAGE_AUTO_WITHDRAW. Set
  // exactly one of policy_id and preset.
  fixed64 policy_id = 3;
  // Time until which the key may be registered, as the Polyester AI assistant
  // issued it with the key (PrepareAssistantKeys), in whole milliseconds.
  // Required for a new key: it must still be ahead, and at most 15 minutes
  // ahead. Not needed when the account's current assistant key already has
  // this public key.
  google.protobuf.Timestamp registration_deadline = 4;
  // The key's own Ed25519 signature over the caller's account, the key's
  // account, its public key and registration_deadline, as the assistant
  // issued it with the key (64 bytes). Required for a new key; not needed
  // when the account's current assistant key already has this public key.
  bytes registration_proof = 5;
  // Permission preset that bounds the key, instead of policy_id. The key is
  // bound to the preset's policy in the key's main account: the existing one
  // with the preset's name and exactly its actions over all markets, else one
  // created in the same change. The response's policy_id names it. Set
  // exactly one of policy_id and preset.
  AssistantKeyPreset preset = 6 [(buf.validate.field).enum.defined_only = true];
}

// SetAssistantKeysRequest replaces the caller's assistant key set.
message SetAssistantKeysRequest {
  // The complete set, at most one key per account and at most 64 keys. An
  // account left out loses its assistant key.
  repeated AssistantKeySpec keys = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 64
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// SetAssistantKeysResponse returns the caller's assistant key set.
message SetAssistantKeysResponse {
  // The assistant keys now in the set, in request order.
  repeated ApiKey api_keys = 1;
}

// ListAssistantKeysRequest lists the caller's assistant key set.
message ListAssistantKeysRequest {}

// ListAssistantKeysResponse contains the caller's assistant keys.
message ListAssistantKeysResponse {
  // Non-revoked assistant keys the caller set up, newest first.
  repeated ApiKey api_keys = 1;
}

// DeleteAssistantKeysRequest revokes the caller's whole assistant key set.
message DeleteAssistantKeysRequest {}

// DeleteAssistantKeysResponse lists the keys that were revoked.
message DeleteAssistantKeysResponse {
  // Opaque identifiers of the keys revoked by this request. Empty when the set
  // was already empty.
  repeated string revoked_key_ids = 1;
}

// ApiKeyService manages API keys for authenticated callers.
service ApiKeyService {
  option (polyester.api.docs_group) = "account";

  // Create a new API key for the caller. Account security settings may require
  // MFA enrollment or a fresh step-up proof. The acting caller's root account
  // must have accepted the current terms, including when targeting a shared
  // subaccount; otherwise FailedPrecondition with AUTH_TERMS_NOT_ACCEPTED is returned.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
      post: "/v1/auth/api-keys"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create API Key"
      description: "Create a new API key for the caller account, including public key material and metadata. Requires the acting caller to have accepted the current terms."
      tags: "Auth Service"
    };
  }

  // List non-revoked API keys visible to the caller, newest first. An API key
  // needs READ_API_KEYS; a key scoped to a sub-account sees only that
  // sub-account's keys.
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/api-keys"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List API Keys"
      description: "List non-revoked API keys for the caller account, or for a sub-account the caller owns or administers, newest first. An API key needs READ_API_KEYS; a key scoped to a sub-account sees only that sub-account's keys."
      tags: "Auth Service"
    };
  }

  // Get a single API key owned by the caller or scoped to a sub-account the caller administers.
  // An API key needs READ_API_KEYS; a key scoped to a sub-account reads only
  // that sub-account's keys.
  rpc GetApiKey(GetApiKeyRequest) returns (GetApiKeyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/api-keys/{key_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get API Key"
      description: "Retrieve a single API key owned by the caller account or scoped to a sub-account the caller administers. An API key needs READ_API_KEYS; a key scoped to a sub-account reads only that sub-account's keys."
      tags: "Auth Service"
    };
  }

  // Revoke an API key permanently.
  rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {delete: "/v1/auth/api-keys/{key_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Delete API Key"
      description: "Revoke an API key owned by the caller account. Revocation is permanent."
      tags: "Auth Service"
    };
  }

  // Update API key metadata and allowed status transitions. Revocation must use
  // DeleteApiKey.
  rpc UpdateApiKey(UpdateApiKeyRequest) returns (UpdateApiKeyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
      patch: "/v1/auth/api-keys/{key_id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Update API Key"
      description: "Update mutable API key fields, including label, status, whitelist, and expiry."
      tags: "Auth Service"
    };
  }

  // Create or replace the caller's Polyester AI assistant key set: one
  // ASSISTANT key per enabled account, each bounded by its API policy or by a
  // permission preset. One fresh step-up proof covers the whole set,
  // including the policies its presets create, and the change is all or
  // nothing. An entry whose account already has an assistant key with the same
  // public key keeps that key, with its status, and takes the requested
  // policy; any other entry replaces the account's key. Accounts left out of
  // the set have their assistant key revoked. A sub-account entry needs the
  // same access as CreateApiKey: owner, or a role that manages its API keys.
  // The acting caller's root account must have accepted the current terms;
  // otherwise FailedPrecondition with AUTH_TERMS_NOT_ACCEPTED is returned. A
  // policy that allows a money-out action returns FailedPrecondition with
  // AUTH_ASSISTANT_KEY_ACTION_NOT_ALLOWED. A new key is registered only with
  // the registration proof and deadline the assistant issued with it
  // (PrepareAssistantKeys), before that deadline: a missing or failing proof
  // returns InvalidArgument with AUTH_ASSISTANT_KEY_PROOF_INVALID, a passed
  // deadline FailedPrecondition with AUTH_ASSISTANT_KEY_REGISTRATION_EXPIRED,
  // and one more than 15 minutes ahead InvalidArgument with
  // AUTH_ASSISTANT_KEY_DEADLINE_TOO_FAR.
  rpc SetAssistantKeys(SetAssistantKeysRequest) returns (SetAssistantKeysResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
      put: "/v1/auth/assistant-keys"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Set Assistant Keys"
      description: "Create or replace the caller's Polyester AI assistant key set with one fresh step-up proof. All keys change or none do; accounts left out lose their assistant key."
      tags: "Auth Service"
    };
  }

  // List the caller's non-revoked Polyester AI assistant keys, newest first.
  rpc ListAssistantKeys(ListAssistantKeysRequest) returns (ListAssistantKeysResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {get: "/v1/auth/assistant-keys"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Assistant Keys"
      description: "List the caller's non-revoked Polyester AI assistant keys, newest first."
      tags: "Auth Service"
    };
  }

  // Revoke the caller's whole Polyester AI assistant key set. Revocation only
  // removes access, so it needs no step-up proof. Revocation is permanent. As
  // for DeleteApiKey, key management sees it at once, and requests signed with
  // a revoked key are refused within a few seconds of the response.
  rpc DeleteAssistantKeys(DeleteAssistantKeysRequest) returns (DeleteAssistantKeysResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {delete: "/v1/auth/assistant-keys"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Delete Assistant Keys"
      description: "Revoke every Polyester AI assistant key the caller set up. Needs no step-up proof."
      tags: "Auth Service"
    };
  }
}
