syntax = "proto3";

package system.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/system/v1;systemv1";
// Document-level OpenAPI metadata for the system API.
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "System Service"
      description: "The build an environment serves."
    }
  ]
};

// GetVersionRequest takes no parameters.
message GetVersionRequest {}

// GetVersionResponse identifies the exact build the environment serves.
message GetVersionResponse {
  // Version of the exact build. A release reports its version in
  // MAJOR.MINOR.PATCH form, such as "0.10.0". A build made after a release
  // appends the number of source revisions since that release and "g" with
  // the first 12 hexadecimal digits of its own revision, such as
  // "0.10.0-12-g4e21a2f09670": 12 revisions after release 0.10.0. Releases
  // before mainnet are 0.MINOR.PATCH; mainnet starts at 1.0.0.
  string version = 1 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,8})\\.(0|[1-9][0-9]{0,8})\\.(0|[1-9][0-9]{0,8})(-[1-9][0-9]{0,8}-g[0-9a-f]{12})?$"];

  // Full 40-character lowercase hexadecimal source revision of the build.
  string commit = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{40}$"];

  // Environment that answered: "devnet", "testnet" or "mainnet", or "local"
  // for a development stack.
  string environment = 3 [(buf.validate.field).string = {
    in: [
      "devnet",
      "testnet",
      "mainnet",
      "local"
    ]
  }];
}

// SystemService serves facts about the environment itself.
service SystemService {
  option (polyester.api.docs_group) = "changelog";

  // Get the version and source revision of the build the environment serves.
  // This public read supports cacheable ConnectRPC GET.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/system/version"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Version"
      description: "Get the version and source revision of the build the environment serves."
      tags: "System Service"
      security: [{}]
    };
  }
}
