syntax = "proto3";

package auth.v1;

import "auth/v1/auth.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/auth/v1;authv1";

// Social account provider used for account ownership verification.
enum SocialProvider {
  // No social provider was specified.
  PROVIDER_UNSPECIFIED = 0;
  // X/Twitter account verification.
  TWITTER = 1;
  // Discord account verification.
  DISCORD = 2;
  // Telegram account linking. The user sends the challenge code to the Polyester
  // Telegram bot, then confirms the Telegram account that sent it.
  TELEGRAM = 3;
}

// Current state of a social account verification attempt.
enum SocialVerificationStatus {
  // No verification status was specified.
  STATUS_UNSPECIFIED = 0;
  // Code issued; waiting for the user to complete the provider-specific action.
  STATUS_PENDING_USER_ACTION = 1;
  // User marked the code as placed and the verification check is waiting to run.
  STATUS_QUEUED = 2;
  // Verification check is currently running.
  STATUS_IN_PROGRESS = 3;
  // Provider account ownership was verified successfully.
  STATUS_VERIFIED = 4;
  // Verification failed. Start a new verification to receive a new challenge code.
  STATUS_FAILED = 5;
  // Challenge code expired before verification completed.
  STATUS_EXPIRED = 6;
  // Verification was cancelled, or the linked account was unlinked.
  STATUS_CANCELLED = 7;
  // A provider account submitted the challenge code. The user must confirm that
  // account with ConfirmSocialVerification before it is linked. Telegram only.
  STATUS_AWAITING_CONFIRMATION = 8;
}

// How the user proves control of the provider account.
enum SocialVerificationMethod {
  // No method was specified. The provider default is used.
  METHOD_UNSPECIFIED = 0;
  // User places the challenge code in their public provider profile.
  METHOD_PROFILE = 1;
  // User posts the challenge code in a provider channel.
  METHOD_CHANNEL = 2;
  // User sends the challenge code in a direct message.
  METHOD_DM = 3;
}

// SocialVerification describes the caller's current verification state for one
// social provider.
message SocialVerification {
  // Verification identifier.
  int64 id = 12;
  // Provider account being verified.
  SocialProvider provider = 1;
  // Method used for this verification. If unspecified at start time, the
  // provider default is used.
  SocialVerificationMethod method = 11;
  // Provider handle being verified. Handles are returned lowercase and without
  // a leading "@". For Telegram, the username of the account that submitted the
  // code; empty when that account has no username.
  string handle = 2;
  // Stable provider-side user identifier. Empty until verification succeeds,
  // except for Telegram: while the status is STATUS_AWAITING_CONFIRMATION, it is
  // the numeric user ID of the Telegram account that submitted the code, the
  // value ConfirmSocialVerification takes.
  string provider_user_id = 3;
  // Provider display name of the account being verified, for showing it to the
  // user. Telegram only: the account's name, set once the code is submitted.
  // Empty for other providers.
  string display_name = 17;
  // Challenge code the user must submit according to the verification method.
  // Discord and Telegram codes are returned only when a challenge is issued.
  // Codes expire after 15 minutes.
  string challenge_code = 13;
  // Current verification status.
  SocialVerificationStatus status = 4;
  // Time in UTC when the current challenge code was issued.
  google.protobuf.Timestamp requested_at = 5;
  // Time in UTC when the current challenge code expires.
  google.protobuf.Timestamp expires_at = 6;
  // Time in UTC when verification succeeded. Empty until status is STATUS_VERIFIED.
  google.protobuf.Timestamp verified_at = 7;
  // Number of recorded provider-check attempts for this challenge.
  int32 attempts = 9;
  // Last verification error, if the most recent check failed. Empty when there
  // is no recorded error.
  string last_error = 10;
  // Stable machine-readable error code for the current failed verification.
  // AUTH_UNSPECIFIED when no typed error applies.
  AuthErrorCode error_code = 16;
  // Time in UTC when this verification state last changed.
  google.protobuf.Timestamp updated_at = 15;
}

// StartSocialVerificationRequest starts or restarts social account verification.
// Starting again for the same provider replaces the previous challenge.
message StartSocialVerificationRequest {
  option (buf.validate.message).cel = {
    id: "twitter_handle_format"
    message: "twitter handle must be 1-15 chars [A-Za-z0-9_], optionally prefixed with '@'"
    expression: "this.provider != 1 ? true : this.handle.matches('^@?[A-Za-z0-9_]{1,15}$')"
  };
  option (buf.validate.message).cel = {
    id: "discord_handle_omitted"
    message: "discord verification does not accept a handle"
    expression: "this.provider != 2 ? true : this.handle == ''"
  };
  option (buf.validate.message).cel = {
    id: "discord_channel_method"
    message: "discord verification uses the channel method"
    expression: "this.provider != 2 ? true : this.method == 0 || this.method == 2"
  };
  option (buf.validate.message).cel = {
    id: "telegram_handle_omitted"
    message: "telegram linking does not accept a handle"
    expression: "this.provider != 3 ? true : this.handle == ''"
  };
  option (buf.validate.message).cel = {
    id: "telegram_dm_method"
    message: "telegram linking uses the direct message method"
    expression: "this.provider != 3 ? true : this.method == 0 || this.method == 3"
  };

  // Provider account to verify.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
  // Verification method. If unspecified, profile verification is used for
  // X/Twitter, channel verification for Discord and direct message
  // verification for Telegram.
  SocialVerificationMethod method = 3 [
    // Allow METHOD_UNSPECIFIED so the provider default can apply, but reject
    // unknown numeric values.
    (buf.validate.field).enum = {defined_only: true}
  ];
  // Provider handle the user claims. Required for X/Twitter and omitted for
  // Discord and Telegram, where the provider bot supplies the provider identity.
  // A leading "@" is accepted and removed from X/Twitter handles.
  string handle = 2 [
    (buf.validate.field).string = {
      max_len: 64
    },
    (buf.validate.field).cel = {
      id: "handle.no_angle_brackets"
      message: "handle must not contain '<' or '>'"
      expression: "!this.contains('<') && !this.contains('>')"
    }
  ];
}

// Response returned after starting social account verification.
message StartSocialVerificationResponse {
  // Newly issued challenge code the user must submit according to the
  // verification method.
  string challenge_code = 1;
  // Time in UTC when the challenge code expires. Social verification challenges
  // expire after 15 minutes.
  google.protobuf.Timestamp expires_at = 2;
  // Current verification state after issuing the challenge.
  SocialVerification verification = 3;
  // Link that completes the user action, when the provider has one. Telegram:
  // opening it starts a chat with the Polyester bot that submits the code.
  // Empty for other providers.
  string action_url = 4;
}

// SocialVerificationReadyRequest tells the API that the challenge code has been
// placed and the provider account is ready to check.
message SocialVerificationReadyRequest {
  // Provider account to check.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// SocialVerificationReadyResponse returns the verification after it has been
// queued for a provider check.
message SocialVerificationReadyResponse {
  // Current verification state after the provider check was requested.
  SocialVerification verification = 1;
}

// GetSocialVerificationRequest fetches the caller's current social verification
// state for one provider.
message GetSocialVerificationRequest {
  // Provider account to inspect.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// GetSocialVerificationResponse contains the caller's current social
// verification state for one provider. A successful response with verification
// absent means the caller has not started verification for that provider.
message GetSocialVerificationResponse {
  // Current verification state for the requested provider. Absent when no
  // verification has been started.
  SocialVerification verification = 1;
}

// ConfirmSocialVerificationRequest links the provider account that submitted
// the caller's challenge code.
message ConfirmSocialVerificationRequest {
  option (buf.validate.message).cel = {
    id: "confirm_telegram_only"
    message: "only telegram linking needs a confirmation"
    expression: "this.provider == 3"
  };

  // Provider account to confirm. Only TELEGRAM is accepted.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
  // Provider user ID the user confirms, as provider_user_id of the verification
  // in STATUS_AWAITING_CONFIRMATION. The request fails when it is not the
  // account that submitted the code, so the user links exactly the account
  // they were shown.
  string provider_user_id = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 20
      pattern: "^[1-9][0-9]*$"
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// ConfirmSocialVerificationResponse returns the verification after the
// provider account was linked.
message ConfirmSocialVerificationResponse {
  // Current verification state, STATUS_VERIFIED.
  SocialVerification verification = 1;
}

// UnlinkSocialAccountRequest removes the caller's linked provider account, or
// cancels a link in progress.
message UnlinkSocialAccountRequest {
  option (buf.validate.message).cel = {
    id: "unlink_telegram_only"
    message: "only a telegram account can be unlinked"
    expression: "this.provider == 3"
  };

  // Provider account to unlink. Only TELEGRAM is accepted.
  SocialProvider provider = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

// UnlinkSocialAccountResponse returns the verification after unlinking.
message UnlinkSocialAccountResponse {
  // Current verification state, STATUS_CANCELLED. Absent when no verification
  // was ever started for the provider.
  SocialVerification verification = 1;
}

// SocialVerificationService verifies ownership of external social accounts.
service SocialVerificationService {
  option (polyester.api.docs_group) = "account";

  // Start or restart social verification by issuing a new challenge code.
  // For Telegram, open action_url to send the code to the Polyester bot, then
  // confirm the account with ConfirmSocialVerification.
  // AUTH_SOCIAL_VERIFICATION_INVALID_STATE for Telegram means a Telegram account is already linked; unlink it first.
  rpc StartSocialVerification(StartSocialVerificationRequest) returns (StartSocialVerificationResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {
      post: "/v1/auth/social/verification:start"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Start Social Verification"
      description: "Issue a challenge code for the caller to submit through the provider-specific verification flow."
      tags: "Auth Service"
    };
  }

  // Mark a verification as ready after the challenge code has been placed.
  // AUTH_RESOURCE_NOT_FOUND means no verification exists; start one first.
  // AUTH_SOCIAL_VERIFICATION_EXPIRED means the challenge window passed; start a new verification, then mark it ready again.
  // AUTH_SOCIAL_VERIFICATION_INVALID_STATE means Ready is not valid in the current state; call GetSocialVerification for the current status.
  // Telegram linking does not use Ready and always answers AUTH_SOCIAL_VERIFICATION_INVALID_STATE.
  rpc SocialVerificationReady(SocialVerificationReadyRequest) returns (SocialVerificationReadyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {
      post: "/v1/auth/social/verification:ready"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Mark Social Verification Ready"
      description: "Mark verification as ready and request a provider account check. AUTH_SOCIAL_VERIFICATION_EXPIRED means start a new challenge. AUTH_SOCIAL_VERIFICATION_INVALID_STATE means Ready is not valid in the current state; use GetSocialVerification for status."
      tags: "Auth Service"
    };
  }

  // Link the Telegram account that submitted the caller's challenge code. A
  // linked Telegram account becomes a channel to the account, so the caller
  // needs enrolled MFA and a fresh, single-use step-up proof in the
  // X-Auth-Step-Up header, obtained by completing an MFA challenge for fresh
  // step-up. The link consumes the proof; a retried confirmation of an existing
  // link needs no new proof.
  // AUTH_RESOURCE_NOT_FOUND means no verification exists; start one first.
  // AUTH_SOCIAL_VERIFICATION_EXPIRED means the challenge window passed; start a new verification.
  // AUTH_SOCIAL_VERIFICATION_INVALID_STATE means no submitted account awaits confirmation, or provider_user_id is not the account that submitted the code.
  // AUTH_SOCIAL_ACCOUNT_ALREADY_LINKED means that Telegram account is linked to another Polyester account; the verification fails.
  // AUTH_MFA_NOT_ENROLLED means enroll MFA first; AUTH_STEP_UP_REQUIRED and AUTH_STEP_UP_PROOF_UNAVAILABLE mean complete a new fresh step-up and retry.
  rpc ConfirmSocialVerification(ConfirmSocialVerificationRequest) returns (ConfirmSocialVerificationResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
      post: "/v1/auth/social/verification:confirm"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Confirm Social Verification"
      description: "Link the Telegram account that submitted the caller's challenge code, after the user confirmed it. Requires enrolled MFA and a fresh step-up proof in the X-Auth-Step-Up header. AUTH_MFA_NOT_ENROLLED means enroll MFA first. AUTH_SOCIAL_VERIFICATION_EXPIRED means start a new challenge. AUTH_SOCIAL_VERIFICATION_INVALID_STATE means no matching account awaits confirmation. AUTH_SOCIAL_ACCOUNT_ALREADY_LINKED means the account is linked to another Polyester account."
      tags: "Auth Service"
    };
  }

  // Unlink the caller's Telegram account, or cancel a Telegram link in progress.
  // Unlinking again succeeds and changes nothing. To link again, start a new
  // verification.
  rpc UnlinkSocialAccount(UnlinkSocialAccountRequest) returns (UnlinkSocialAccountResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {
      post: "/v1/auth/social/verification:unlink"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Unlink Social Account"
      description: "Unlink the caller's Telegram account, or cancel a Telegram link in progress. Repeating it changes nothing."
      tags: "Auth Service"
    };
  }

  // Get current verification status for the caller.
  // A failed verification uses error_code for its machine-readable outcome.
  // An API key needs READ_SOCIAL_VERIFICATION and must be scoped to the main
  // account. It reads the status only: provider, method, handle, status, and
  // verification time, with every other field left empty.
  rpc GetSocialVerification(GetSocialVerificationRequest) returns (GetSocialVerificationResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/social/verification"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Social Verification"
      description: "Retrieve current social verification status and any typed failure code for the caller. An API key needs READ_SOCIAL_VERIFICATION and must be scoped to the main account; it reads the status only: provider, method, handle, status, and verification time."
      tags: "Auth Service"
    };
  }
}
