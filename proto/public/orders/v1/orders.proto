syntax = "proto3";

package orders.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";
import "polyester/ratelimit/v1/types.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/orders/v1;ordersv1";
// Document-level OpenAPI metadata for Orders API
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Orders Service"
      description: "Public write surface for placing and canceling orders."
    }
  ]
};

// =============================================================================
// Shared Enums (used by both REST and binary messages)
// =============================================================================

// Side identifies whether an order buys or sells the base asset.
enum Side {
  // Side was not provided.
  SIDE_UNSPECIFIED = 0;
  // Buy base asset using quote asset.
  BUY = 1;
  // Sell base asset for quote asset.
  SELL = 2;
}

// OrderType identifies whether an order uses limit-price or market execution.
enum OrderType {
  // Order type was not provided.
  ORDER_TYPE_UNSPECIFIED = 0;
  // Limit order with an explicit price.
  LIMIT = 1;
  // Market order executed against available liquidity.
  MARKET = 2;
}

// TimeInForce controls how long an order may remain active and whether it must
// fill completely.
enum TimeInForce {
  // Time-in-force was not provided. Create requests must select an execution
  // variant, which determines time-in-force.
  TIME_IN_FORCE_UNSPECIFIED = 0;
  // Good-til-canceled.
  GTC = 1;
  // Immediate-or-cancel.
  IOC = 2;
  // Fill-or-kill.
  FOK = 3;
  // Good-til-date; the order may remain active only before its exact expiry time.
  GTD = 4;
}

// FeeAsset identifies the asset in which an order fee is charged.
enum FeeAsset {
  // Fee asset was not provided; orders default to QUOTE.
  FEE_ASSET_UNSPECIFIED = 0;
  // Fees are charged in the quote asset. SELL fees always use quote asset.
  QUOTE = 1;
  // BUY-only option: fees are deducted from the received base asset. Only on
  // a pair whose allow_buy_fee_from_base is true in GetSpotConfig.
  BASE = 2;
}

// SelfTradePreventionMode controls what happens when an order would trade
// against another order of the same root account, including all its
// subaccounts: two subaccounts of one root never trade with each other. The
// incoming order's mode decides which orders expire or are reduced.
enum SelfTradePreventionMode {
  // Self-trade prevention mode was not provided; create requests default to EXPIRE_MAKER.
  SELF_TRADE_PREVENTION_MODE_UNSPECIFIED = 0;
  // Cancel the resting maker order on self-trade.
  EXPIRE_MAKER = 1;
  // Cancel the incoming taker order on self-trade.
  EXPIRE_TAKER = 2;
  // Cancel both maker and taker orders on self-trade.
  EXPIRE_BOTH = 3;
  // Reduce both orders by the quantity that would have traded, with no
  // trade. The order left with no quantity is canceled with
  // CANCEL_REASON_STP_DECREMENT, both when their quantities are equal; a
  // resting order that keeps a quantity keeps its place in the queue, and an
  // incoming order that keeps one goes on matching and may rest. A reduced
  // order's quantity is its original quantity less what self-trade
  // prevention removed. A fill-or-kill order that would meet such an order
  // before it is completely filled is rejected instead of reduced. Applies
  // to attached protective exits and trigger children too. Prevention does
  // not count as a fill of the parent position. A fully prevented attached
  // exit re-arms its unexecuted exposure and waits while the surviving self
  // maker heads the opposite book; it can fire again once that maker stops
  // leading.
  DECREMENT = 4;
}

// =============================================================================
// Connect/Proto-facing Messages (scaled ints, fixed64 IDs)
// =============================================================================

// MarketIoc configures a market order. Market orders always execute as
// immediate-or-cancel and therefore cannot rest or be post-only.
//
// The order fills only up to its protection price, a BUY at or below it and
// a SELL at or above it. The protection price is the reference price
// (client_ref_price_ticks, or the server's reference when it is omitted)
// moved by the maximum slippage, up for a BUY and down for a SELL, then put
// on the pair's tick grid toward the reference: a BUY's is rounded down and
// a SELL's up, so it never allows more than the slippage and can be up to
// one tick tighter. Neither client_ref_price_ticks nor max_slippage_ticks
// has to be a multiple of the pair's tick size; only the protection price
// is. For example, on a pair whose tick size is 0.01, a reference of
// 73840.125 and a slippage of 50.12 give a BUY protection price of 73890.24
// (73890.245 rounded down) and a SELL protection price of 73790.01
// (73790.005 rounded up). The order's price_ticks shows the protection
// price; market_client_ref_price_ticks and market_max_slippage_ticks show
// the values exactly as given.
message MarketIoc {
  // Optional max slippage override. If omitted, the pair default is used.
  oneof max_slippage {
    // Positive maximum absolute price delta in quote units scaled by 1e9. The
    // "ticks" in this name are 1e-9 quote units, not the pair's tick size,
    // and the value need not be a multiple of the pair's tick size: the
    // protection price derived from it is put on the tick grid toward the
    // reference, as MarketIoc describes.
    int64 max_slippage_ticks = 1 [(buf.validate.field).int64.gt = 0];
    // Maximum allowed slippage in basis points (1 bp = 0.01%), from 1 to 10000.
    // A SELL order accepts at most 9999: a 100% cap would leave it no
    // positive price to sell at, so 10000 is rejected with
    // ERROR_CODE_MAX_SLIPPAGE_INVALID.
    int32 max_slippage_bps = 2 [(buf.validate.field).int32 = {
      gt: 0
      lte: 10000
    }];
  }
  // Optional positive client reference price in quote units scaled by 1e9
  // (1e-9 quote units, not the pair's tick size). It need not be on the
  // pair's tick grid; only the protection price derived from it is, as
  // MarketIoc describes. When omitted, admission uses server-side reference
  // pricing. A reference too far from the server's is refused with
  // ERROR_CODE_STALE_QUOTE.
  int64 client_ref_price_ticks = 3 [
    (buf.validate.field).int64.gt = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// LimitGtc configures a good-til-canceled limit order.
message LimitGtc {
  // Positive limit price in quote units scaled by 1e9.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
  // Reject the order instead of taking liquidity. Post-only is available on
  // GTC and GTD limit orders; IOC, FOK and market orders cannot be post-only.
  bool post_only = 2;
  // Optional iceberg display quantity, scaled by the pair's
  // base_quantity_scale from GetSpotConfig. Zero places a plain order. When
  // positive, the order book shows at most this quantity of the order; once
  // that shown part is fully executed, the next part is shown at the same
  // price, behind the orders already resting there. It must be below
  // base_qty_scaled, a multiple of the pair's quantity step, at least the
  // pair's minimum quantity, and at least base_qty_scaled divided by 100,
  // rounded up, so the order splits into at most 100 parts: otherwise the
  // order is refused with ICEBERG_DISPLAY_TOO_SMALL or
  // ICEBERG_DISPLAY_INVALID. An iceberg order cannot carry attached_risk
  // (ICEBERG_NOT_ALLOWED). The display cannot be modified. Lowering the
  // order's quantity in place to the display or below is allowed: the order
  // then shows all of its remaining quantity. A replace keeps the display
  // while the new quantity is above it; otherwise the new order is a plain
  // order with no display.
  int64 display_qty_scaled = 3 [(buf.validate.field).int64.gte = 0];
}

// LimitGtd configures a limit order that may remain active only before an
// exact expiry time.
message LimitGtd {
  option (buf.validate.message).cel = {
    id: "limit_gtd.expire_at_window"
    message: "expire_at must be between 1 second and 30 days after validation time"
    expression: "!has(this.expire_at) || (this.expire_at >= now + duration('1s') && this.expire_at <= now + duration('2592000s'))"
  };

  // Positive limit price in quote units scaled by 1e9.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
  // Reject the order instead of taking liquidity.
  bool post_only = 2;
  // Required exact expiry time in UTC. It must be at least 1 second and at
  // most 30 days after validation time. The order cannot execute when the
  // current time equals this value.
  google.protobuf.Timestamp expire_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = {
      gt_now: true
      lte: {
        seconds: 9223372036
        nanos: 854775807
      }
    },
    (google.api.field_behavior) = REQUIRED
  ];
  // Optional iceberg display quantity, scaled by the pair's
  // base_quantity_scale from GetSpotConfig. Zero places a plain order. When
  // positive, the order book shows at most this quantity of the order; once
  // that shown part is fully executed, the next part is shown at the same
  // price, behind the orders already resting there. It must be below
  // base_qty_scaled, a multiple of the pair's quantity step, at least the
  // pair's minimum quantity, and at least base_qty_scaled divided by 100,
  // rounded up, so the order splits into at most 100 parts: otherwise the
  // order is refused with ICEBERG_DISPLAY_TOO_SMALL or
  // ICEBERG_DISPLAY_INVALID. An iceberg order cannot carry attached_risk
  // (ICEBERG_NOT_ALLOWED). The display cannot be modified. Lowering the
  // order's quantity in place to the display or below is allowed: the order
  // then shows all of its remaining quantity. A replace keeps the display
  // while the new quantity is above it; otherwise the new order is a plain
  // order with no display.
  int64 display_qty_scaled = 4 [(buf.validate.field).int64.gte = 0];
}

// LimitIoc configures an immediate-or-cancel limit order.
message LimitIoc {
  // Positive limit price in quote units scaled by 1e9.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
}

// LimitFok configures a fill-or-kill limit order.
message LimitFok {
  // Positive limit price in quote units scaled by 1e9.
  int64 price_ticks = 1 [(buf.validate.field).int64.gt = 0];
}

// The displayed book side used for a static entry peg.
enum PegReference {
  // No reference selected.
  PEG_REFERENCE_UNSPECIFIED = 0;
  // Highest live bid at entry.
  BEST_BID = 1;
  // Lowest live ask at entry.
  BEST_ASK = 2;
}

// Derives a limit price once at entry. Available only with base quantity and
// limit execution, without attached risk. The limit execution's price_ticks is
// required: a BUY maximum price or SELL minimum price. A derived price beyond
// that bound is rejected. The order never follows later book changes.
message StaticPeg {
  // Required public book side. An empty selected side rejects the order.
  PegReference reference = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Signed number of configured price increments added to the reference.
  // One increment is the pair’s configured price increment in quote units; this count
  // is not Q9 and does not select occupied price levels. Defaults to zero.
  int64 offset_ticks = 2;
}

// OrderIntent contains one order's complete, transport-independent placement
// intent. Single and batch create use this same message.
message OrderIntent {
  option (buf.validate.message).cel = {
    id: "order_intent.max_quote_debit_eligibility"
    message: "max_quote_debit_scaled is valid only for BUY market IOC or BUY limit IOC orders"
    expression: "!has(this.max_quote_debit_scaled) || (this.side == 1 && (has(this.market_ioc) || has(this.limit_ioc)))"
  };
  option (buf.validate.message).cel = {
    id: "order_intent.quote_proceeds_eligibility"
    message: "quote_proceeds_scaled is valid only for SELL market IOC or SELL limit IOC orders"
    expression: "!has(this.quote_proceeds_scaled) || (this.side == 2 && (has(this.market_ioc) || has(this.limit_ioc)))"
  };
  option (buf.validate.message).cel = {
    id: "order_intent.sell_fee_asset"
    message: "SELL orders must use the QUOTE fee asset"
    expression: "this.side != 2 || this.fee_asset == 0 || this.fee_asset == 1"
  };

  // Stable numeric pair ID from GetSpotConfig.
  uint32 symbol_id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  // Order side. Required.
  Side side = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Required order sizing intent. Exactly one sizing method must be supplied.
  oneof sizing {
    option (buf.validate.oneof).required = true;
    // Exact positive gross base quantity scaled by the pair's
    // base_quantity_scale from GetSpotConfig.
    int64 base_qty_scaled = 3 [(buf.validate.field).int64.gt = 0];
    // Hard all-in quote debit limit scaled by the pair's quote_quantity_scale
    // from GetSpotConfig. Valid only for BUY market IOC and BUY limit IOC.
    // The order spends up to this amount at the prices it fills at. Once what
    // is left buys no further quantity step, it ends FILLED; if the book or
    // its price limit stops it first, its remainder is canceled. It can carry
    // attached_risk: the legs protect the quantity it actually buys. Must be
    // positive.
    int64 max_quote_debit_scaled = 4 [(buf.validate.field).int64.gt = 0];
    // Quote proceeds target scaled by the pair's quote_quantity_scale from
    // GetSpotConfig. Valid only for SELL market IOC and SELL limit IOC. The
    // order sells whole quantity steps until its proceeds, the sum of each
    // fill's price times quantity before fees, reach this amount, and never
    // receives more. The fee is charged in quote on those proceeds. The order
    // holds the base this amount sells at its limit price, or a market
    // order's maximum slippage price, and is rejected INSUFFICIENT_FUNDS when
    // that base is not available. Once what is left sells no further quantity
    // step, it ends FILLED; if the book or its price limit stops it first,
    // its remainder is canceled. It cannot carry attached_risk. Must be
    // positive.
    int64 quote_proceeds_scaled = 5 [(buf.validate.field).int64.gt = 0];
  }
  // Required execution behavior. The selected variant exposes only fields that
  // can be honored together.
  oneof execution {
    option (buf.validate.oneof).required = true;
    // Market order with implicit IOC behavior.
    MarketIoc market_ioc = 10;
    // Resting GTC limit order, optionally post-only.
    LimitGtc limit_gtc = 11;
    // Immediate-or-cancel limit order.
    LimitIoc limit_ioc = 12;
    // Fill-or-kill limit order.
    LimitFok limit_fok = 13;
    // Limit order with an exact expiry time.
    LimitGtd limit_gtd = 14;
  }
  // Optional account-scoped identifier for correlation, lookup, and cancellation.
  // While this identifier is retained, reuse returns
  // CONFLICT_DUPLICATE_CLIENT_ORDER_ID for every new submission, even with the
  // same payload. This identifier enables GetOrder reconciliation after a
  // timeout; it does not provide exact replay. At most 36 ASCII characters
  // using letters, digits, period, underscore, colon, slash, or hyphen.
  string client_order_id = 20 [
    (buf.validate.field).string.max_len = 36,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]*$"
  ];
  // Asset charged for fees. Defaults to QUOTE. BASE is available only for BUY
  // orders on a pair whose allow_buy_fee_from_base is true in GetSpotConfig;
  // SELL orders must use QUOTE. Otherwise the order is refused with
  // ERROR_CODE_FEE_ASSET_NOT_ALLOWED.
  FeeAsset fee_asset = 21 [(buf.validate.field).enum.defined_only = true];
  // Self-trade prevention mode against orders of the same root account,
  // including all its subaccounts. Defaults to EXPIRE_MAKER if unspecified.
  SelfTradePreventionMode self_trade_prevention_mode = 22 [(buf.validate.field).enum.defined_only = true];
  // Optional attached risk controls that arm after the parent order fills.
  RiskPolicy attached_risk = 30;
  // Optional static peg. The selected limit execution still requires its price
  // bound. Quote sizing, market execution and attached risk are invalid.
  StaticPeg peg = 31;
}

// CreateOrderRequest submits one independent order intent for admission.
// Single creates do not provide exact replay and are not automatically retried
// after an ambiguous transport timeout. Supply client_order_id to reconcile
// through GetOrder; without it, a lost acknowledgement may leave the outcome
// unknown. An immediate lookup miss does not prove that admission failed.
// A create sent but not confirmed in time fails with
// ORDER_CREATE_OUTCOME_UNKNOWN: the order may have been accepted, so read it
// back before retrying. UNAVAILABLE means the order was not accepted.
message CreateOrderRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Order to admit. Required.
  OrderIntent order = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

}

// CreateOrderResponse acknowledges admission only. It does not report whether
// the order is working, filled, canceled, or rejected after admission; use
// order reads or realtime streams for execution state.
message CreateOrderResponse {
  // Assigned order ID.
  fixed64 order_id = 1;
  // Echoed client order ID when one was supplied.
  string client_order_id = 2;
  // Time admission completed.
  google.protobuf.Timestamp accepted_at = 3;
  // Admission completion time as epoch nanoseconds (UTC).
  uint64 accepted_at_ts_ns = 4;
  // Gross base quantity admission resolved, scaled by the pair's
  // base_quantity_scale from GetSpotConfig. For base_qty_scaled sizing, the
  // order's quantity. For quote sizing (max_quote_debit_scaled BUY or
  // quote_proceeds_scaled SELL), the quantity the quote amount buys or sells at
  // the order's limit price, or a market order's protection price: a BUY can
  // fill more at better prices, or less when the book runs out, and a SELL sells
  // at most this. The executed quantity is the order's cumulative filled
  // quantity (cum_qty_scaled in GetOrder) or the sum of its fills
  // (GetUserTrades, or the fills of its private order events).
  int64 resolved_base_qty_scaled = 5;
  // Submitted hard all-in quote debit limit, scaled by the pair's
  // quote_quantity_scale from GetSpotConfig. Present only when that sizing
  // method was submitted.
  optional int64 submitted_max_quote_debit_scaled = 6;
  // Submitted quote proceeds target, scaled by the pair's
  // quote_quantity_scale from GetSpotConfig. Present only when that sizing
  // method was submitted.
  optional int64 submitted_quote_proceeds_scaled = 7;
  // Trigger ID for attached take-profit.
  optional uint64 take_profit_trigger_id = 20;
  // Trigger ID for attached stop-loss.
  optional uint64 stop_loss_trigger_id = 21;
  // Trigger ID for attached trailing stop.
  optional uint64 trailing_stop_trigger_id = 22;
}

// PreviewOrderRequest asks whether one complete order intent is currently
// admissible. It uses the same order contract as CreateOrderRequest. Previewing
// creates no order, hold, reservation, or client-order-ID claim.
message PreviewOrderRequest {
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 1;
  // Order intent to evaluate without submitting it. Required.
  OrderIntent order = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// PreviewOrderResponse reports whether an order is currently admissible and
// returns any sizing and price-protection values resolved during evaluation.
// Quote debit and fees are not returned.
// The result is advisory: account, market, and policy inputs may change, and
// CreateOrder always evaluates the intent again.
message PreviewOrderResponse {
  // Whether the order passed the current validation, policy, risk, and
  // available-balance checks.
  optional bool admissible = 1;
  // Typed reason the order is not currently admissible. Omitted when
  // admissible is true.
  ErrorDetail rejection = 2;
  // Gross base quantity admission resolved. REST returns resolvedBaseQty as a
  // decimal string in base asset units, for example "0.005". Protobuf uses the
  // pair's base_quantity_scale from GetSpotConfig. Present when sizing was
  // resolved. For base_qty_scaled sizing, the order's quantity. For quote sizing
  // (max_quote_debit_scaled BUY or quote_proceeds_scaled SELL), the quantity the
  // quote amount buys or sells at the order's limit price, or at the market
  // protection price at preview time (protected_price_bound_ticks). CreateOrder
  // resolves the protection price and the order's quantity again at submission,
  // so the submitted order can buy or sell more or less than this. The executed
  // quantity is the order's cumulative filled quantity (cum_qty_scaled in
  // GetOrder) or the sum of its fills (GetUserTrades, or the fills of its
  // private order events).
  optional int64 resolved_base_qty_scaled = 3;
  // Protective execution boundary. REST returns protectedPriceBound as a decimal
  // string in quote asset units per base asset unit, for example "2751.6".
  // Protobuf uses quote units scaled by 1e9. This is not an expected fill price.
  // Present when price protection was resolved.
  optional int64 protected_price_bound_ticks = 4;
  // Time at which this admission evaluation completed.
  google.protobuf.Timestamp evaluated_at = 5;
}

// CancelOrderRequest is the binary (protobuf) request for canceling orders.
message CancelOrderRequest {
  // Exactly one of order_id or client_order_id must be set.
  option (buf.validate.message).cel = {
    id: "cancel_order.key_required"
    message: "exactly one of order_id or client_order_id must be set"
    expression: "(this.order_id > 0u) != (this.client_order_id != \"\")"
  };

  oneof key {
    // Public order ID. Exactly one of order_id or client_order_id.
    fixed64 order_id = 1 [(buf.validate.field).fixed64.gt = 0];
    // Client order ID: 1 to 36 ASCII characters using letters, digits,
    // period, underscore, colon, slash, or hyphen. Exactly one of order_id or
    // client_order_id.
    string client_order_id = 2 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 36,
      (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
    ];
  }
  // Optional trading symbol numeric identifier. When set, it must match the
  // order's symbol, or the order is reported unknown (ERROR_CODE_ORDER_UNKNOWN)
  // and nothing is canceled. An order that ended a while ago may instead be
  // reported ended (ERROR_CODE_ORDER_ALREADY_TERMINAL). When omitted, the
  // order's own symbol is used.
  uint32 symbol_id = 3;
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account.
  optional fixed64 subaccount_id = 4;
}

// CancelOrderResponse is the binary (protobuf) response after canceling an order.
message CancelOrderResponse {
  // Cancellation submission outcome.
  enum Status {
    // Cancellation status was not provided.
    STATUS_UNSPECIFIED = 0;
    // The cancellation request was accepted for processing.
    ACCEPTED = 1;
  }

  // Cancellation submission outcome.
  Status status = 1 [(buf.validate.field).enum.defined_only = true];
  // Public order ID.
  fixed64 order_id = 2;
  // Server timestamp.
  google.protobuf.Timestamp ts = 3;
  // Server timestamp as epoch nanoseconds (for bots).
  uint64 ts_ns = 4;
}

// ErrorCode enumerates stable machine-readable error codes for the Orders API.
// These mirror the REST problem+json "code" field for parity between REST and
// ConnectRPC clients.
enum ErrorCode {
  // Error code was not provided.
  ERROR_CODE_UNSPECIFIED = 0;
  // Request could not be parsed or was structurally invalid.
  ERROR_CODE_BAD_REQUEST = 1;
  // Request fields failed validation.
  ERROR_CODE_INVALID_ARGUMENT = 2;
  // Account does not have enough available balance for the order.
  ERROR_CODE_INSUFFICIENT_FUNDS = 3;
  // Requested trading symbol is unknown.
  ERROR_CODE_UNKNOWN_SYMBOL = 4;
  // Price is invalid for the requested order.
  ERROR_CODE_BAD_PRICE = 5;
  // Quantity is invalid for the requested order.
  ERROR_CODE_BAD_QTY = 6;
  // Order notional is below the pair minimum.
  ERROR_CODE_MIN_NOTIONAL = 7;
  // Quantity does not align with the pair step size.
  ERROR_CODE_QTY_STEP_SIZE = 8;
  // Client order ID is already in use on this account, by an open order or by
  // an order that ended recently; an ended order keeps its client order ID
  // reserved for at least 60 seconds. Reuse returns this code even with the
  // same payload. Use GetOrder to reconcile, then retry with a new client
  // order ID.
  ERROR_CODE_CONFLICT_DUPLICATE_CLIENT_ORDER_ID = 9;
  // Service is temporarily unavailable.
  ERROR_CODE_UNAVAILABLE = 10;
  // Caller is not authenticated.
  ERROR_CODE_UNAUTHENTICATED = 11;
  // Caller is authenticated but not allowed to perform this action.
  ERROR_CODE_PERMISSION_DENIED = 12;
  // Requested order or resource was not found.
  ERROR_CODE_NOT_FOUND = 13;
  // A temporary server-side failure stopped the request. Retry later.
  ERROR_CODE_UPSTREAM_ERROR = 14;
  // Requested fee asset is not allowed for this order or trigger: BASE on a
  // SELL, or BASE on a BUY where the pair's allow_buy_fee_from_base is false.
  ERROR_CODE_FEE_ASSET_NOT_ALLOWED = 15;
  // Pair is disabled and does not accept orders.
  ERROR_CODE_PAIR_DISABLED = 16;
  // Referenced order could not be resolved: no order of the account has that
  // order ID or client order ID, or an ended order can no longer be
  // confirmed under it (see OrdersService.CancelOrder). Read the order to
  // tell an ended order from one that was never placed.
  ERROR_CODE_ORDER_UNKNOWN = 17;
  // Order processing failed because of an unexpected error.
  ERROR_CODE_INTERNAL_ERROR = 18;
  // Sub-account is present but not in an active state (disabled, deleted,
  // etc.).
