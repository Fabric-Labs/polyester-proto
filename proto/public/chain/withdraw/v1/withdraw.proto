syntax = "proto3";

package chain.withdraw.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "polyester/api/options.proto";
import "polyester/type/v1/u128.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/chain/withdraw/v1;chainwithdrawv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Trading Withdraws"
      description:
        "Request withdrawals from Trading for a Polyester account or "
        "subaccount."
    }
  ]
};

// CreateTradingWithdrawResponse returns the accepted durable intent identifier
// for the withdraw lifecycle.
message CreateTradingWithdrawResponse {
  // Stable server-owned intent identifier for the accepted withdraw lifecycle.
  // Clients use this id to follow later progress for the same withdraw flow.
  string intent_id = 1;
}

// CreateWalletTradingWithdrawResponse returns the accepted durable intent
// identifier for a wallet-authorized withdraw lifecycle.
message CreateWalletTradingWithdrawResponse {
  // Stable server-owned intent identifier for the accepted withdraw lifecycle.
  // Clients use this id to follow later progress for the same withdraw flow.
  string intent_id = 1;
}

// ErrorCode identifies stable, machine-readable Withdraw API errors.
// Values mirror the REST problem+json code field.
enum ErrorCode {
  // No domain error code was provided.
  ERROR_CODE_UNSPECIFIED = 0;

  // The source account does not have enough available Trading balance.
  ERROR_CODE_INSUFFICIENT_FUNDS = 1;
  // Request payload or one of its fields is invalid.
  ERROR_CODE_INVALID_REQUEST = 2;
  // Caller is not authenticated.
  ERROR_CODE_UNAUTHENTICATED = 3;
  // Caller is not permitted to perform the withdraw operation.
  ERROR_CODE_PERMISSION_DENIED = 4;
  // Request exceeded the applicable admission rate limit.
  ERROR_CODE_RATE_LIMIT_EXCEEDED = 5;
  // A required dependency is temporarily unavailable.
  ERROR_CODE_SERVICE_UNAVAILABLE = 6;
  // The request failed because of an unexpected server error.
  ERROR_CODE_INTERNAL_ERROR = 7;
  // The selected subaccount identifier is invalid.
  ERROR_CODE_INVALID_SUBACCOUNT_ID = 8;
  // The selected subaccount does not exist.
  ERROR_CODE_SUBACCOUNT_NOT_FOUND = 9;
  // The requested withdraw action is invalid for this endpoint.
  ERROR_CODE_INVALID_ACTION = 10;
  // The requested ledger is not supported for withdrawals.
  ERROR_CODE_UNSUPPORTED_LEDGER = 11;
  // The requested asset or withdraw route is not supported.
  ERROR_CODE_UNSUPPORTED_ASSET = 12;
  // The withdraw amount is invalid.
  ERROR_CODE_INVALID_AMOUNT = 13;
  // The destination chain is invalid.
  ERROR_CODE_INVALID_DESTINATION_CHAIN = 14;
  // The destination address is invalid.
  ERROR_CODE_INVALID_DESTINATION_ADDRESS = 15;
  // The external destination is not whitelisted.
  ERROR_CODE_EXTERNAL_DESTINATION_NOT_WHITELISTED = 16;
  // The internal funding recipient is not whitelisted.
  ERROR_CODE_INTERNAL_RECIPIENT_NOT_WHITELISTED = 17;
  // The withdraw amount is below the configured minimum including fees.
  ERROR_CODE_AMOUNT_BELOW_MINIMUM = 18;
  // The withdraw amount exceeds the available zipped-asset supply.
  ERROR_CODE_AMOUNT_EXCEEDS_SUPPLY = 19;
  // The source smart-account address is unavailable.
  ERROR_CODE_SOURCE_SMART_ACCOUNT_UNAVAILABLE = 20;
  // The required payload signature is missing.
  ERROR_CODE_SIGNATURE_REQUIRED = 21;
  // The requested signature scheme is unsupported.
  ERROR_CODE_SIGNATURE_SCHEME_UNSUPPORTED = 22;
  // The wallet supplied as signer is invalid.
  ERROR_CODE_SIGNER_WALLET_INVALID = 23;
  // Wallet authorization binding verification failed.
  ERROR_CODE_WALLET_BINDING_INVALID = 24;
  // Wallet authorization binding does not cover the requested scope.
  ERROR_CODE_WALLET_BINDING_SCOPE_MISMATCH = 25;
  // Wallet authorization binding does not match the signer.
  ERROR_CODE_WALLET_BINDING_SIGNER_MISMATCH = 26;
  // The API key could not be resolved.
  ERROR_CODE_API_KEY_NOT_FOUND = 27;
  // API-key authorization binding verification failed.
  ERROR_CODE_API_KEY_BINDING_INVALID = 28;
  // API-key authorization binding does not cover the requested scope.
  ERROR_CODE_API_KEY_BINDING_SCOPE_MISMATCH = 29;
  // API-key authorization binding does not match the configured public key.
  ERROR_CODE_API_KEY_BINDING_PUBLIC_KEY_MISMATCH = 30;
  // The idempotency key was reused with different request data.
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 31;
  // The funds lock conflicts with an existing or finalized reservation.
  ERROR_CODE_FUNDS_LOCK_CONFLICT = 32;
  // The authoritative capital view is not ready or is stale.
  ERROR_CODE_CAPITAL_VIEW_UNAVAILABLE = 33;
  // Required chain or contract metadata is unavailable.
  ERROR_CODE_CHAIN_METADATA_UNAVAILABLE = 34;
  // Required network fee data is unavailable.
  ERROR_CODE_FEE_UNAVAILABLE = 35;
  // Required zipped-asset supply data is unavailable.
  ERROR_CODE_SUPPLY_UNAVAILABLE = 36;
  // Fresh step-up verification is temporarily unavailable.
  ERROR_CODE_STEP_UP_UNAVAILABLE = 37;
  // Destination validation is temporarily unavailable.
  ERROR_CODE_DESTINATION_VALIDATION_UNAVAILABLE = 38;
  // The account shard cannot currently accept fund movement.
  ERROR_CODE_ACCOUNT_SHARD_UNAVAILABLE = 39;
  // A required precondition was not satisfied.
  ERROR_CODE_FAILED_PRECONDITION = 40;
  // The requested resource was not found.
  ERROR_CODE_NOT_FOUND = 41;
  // The request conflicts with existing state.
  ERROR_CODE_CONFLICT = 42;
}

// ErrorDetail is attached to ConnectRPC errors for structured error handling.
message ErrorDetail {
  // Stable error code matching the REST problem+json code field.
  ErrorCode code = 1;
}

// TradingWithdrawAction identifies where funds should move from Trading.
enum TradingWithdrawAction {
  ACTION_UNSPECIFIED = 0;
  TO_FUNDING = 1;
  TO_EXTERNAL_CHAIN = 2;
}

// TradingWithdrawIntentPayload is the client-signed typed withdraw request.
// Account scope and backend intent ids are derived server-side.
message TradingWithdrawIntentPayload {
  // Destination for funds leaving Trading.
  TradingWithdrawAction action = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Unified asset identifier from Polyester asset metadata. amount_e18 is
  // denominated in this asset at canonical 18-decimal scale.
  uint32 asset_id = 2 [(buf.validate.field).uint32.gt = 0];

  // External network id for TO_EXTERNAL_CHAIN. Omit for TO_FUNDING.
  uint64 destination_chain_id = 3;

  // Withdraw amount in canonical 18-decimal unified asset units.
  // For example, 0.5 is encoded as 500000000000000000.
  polyester.type.v1.U128 amount_e18 = 4 [(buf.validate.field).required = true];

  // Unix timestamp in seconds after which this signed user authorization is no
  // longer accepted by the API. This is separate from the server-owned
  // execution deadline used later for on-chain submission.
  uint64 deadline_ts_sec = 5 [(buf.validate.field).uint64.gt = 0];

  // Client-generated unsigned 128-bit nonce bound to the signed request. This
  // is an identifier, not a decimal amount.
  polyester.type.v1.U128 nonce = 6 [(buf.validate.field).required = true];

  // Destination address. For TO_EXTERNAL_CHAIN this is an address on
  // destination_chain_id and is validated according to that network. For
  // TO_FUNDING, omit it to move funds to the selected account's Funding account
  // or provide another Polyester funding address for a Trading-to-Funding
  // transfer.
  string destination_address = 7;

  // Client-chosen idempotency key. Reusing the same key with the same payload
  // returns the existing withdraw; reusing it with different payload fails.
  string idempotency_key = 8 [(buf.validate.field).string.min_len = 1];
}

// CreateTradingWithdrawRequest creates or returns one durable backend-authorized
// Trading withdraw intent from typed protobuf fields and an API-key signature.
message CreateTradingWithdrawRequest {
  // Client-signed withdraw details.
  TradingWithdrawIntentPayload payload = 1 [(buf.validate.field).required = true];

  // User/API signature over deterministic TradingWithdrawIntentPayload bytes.
  bytes payload_signature = 2 [(buf.validate.field).bytes.min_len = 1];
}

// CreateWalletTradingWithdrawRequest creates or returns one durable Trading
// withdraw intent from typed frontend fields plus a wallet EIP-712 signature.
message CreateWalletTradingWithdrawRequest {
  // Client-signed withdraw details.
  TradingWithdrawIntentPayload payload = 1 [(buf.validate.field).required = true];

  // Optional public subaccount id. Omit to withdraw from the JWT root account.
  uint64 subaccount_id = 2;

  // Wallet address that produced payload_signature.
  string signer_wallet = 3 [(buf.validate.field).string.pattern = "^0x[0-9a-fA-F]{40}$"];

  // Wallet EIP-712 signature over the typed withdraw payload.
  bytes payload_signature = 4 [(buf.validate.field).bytes.min_len = 1];
}

// WithdrawDestinationValidationCode identifies the public outcome of an
// external-chain destination validation.
enum WithdrawDestinationValidationCode {
  // No validation outcome was produced.
  RESULT_UNSPECIFIED = 0;

  // The destination is valid and may be used for a withdraw.
  VALID = 1;

  // The address is not valid for the selected destination chain.
  INVALID_ADDRESS = 2;

  // The selected destination chain is not supported for withdraws.
  UNSUPPORTED_CHAIN = 3;

  // The destination is a Polyester smart account and cannot be used for an
  // external-chain withdraw.
  POLYESTER_SMART_ACCOUNT = 4;

  // The destination is a token contract and cannot receive withdrawals.
  TOKEN_CONTRACT = 5;

  // The destination is blocked by Polyester's user-safety denylist.
  DENYLISTED_ADDRESS = 6;
}

// ValidateWithdrawDestinationRequest checks one external-chain
// destination for an authenticated caller without creating a withdraw.
message ValidateWithdrawDestinationRequest {
  // External destination chain identifier.
  uint64 destination_chain_id = 1 [(buf.validate.field).uint64.gt = 0];

  // Destination address to validate for destination_chain_id.
  string destination_address = 2 [(buf.validate.field).string.min_len = 1];
}

// ValidateWithdrawDestinationResponse returns a user-safe validation
// result without exposing internal denylist details.
message ValidateWithdrawDestinationResponse {
  // Whether the destination may be used for a withdraw.
  bool valid = 1;

  // Public validation outcome code.
  WithdrawDestinationValidationCode code = 2;

  // User-safe explanation of the validation outcome.
  string message = 3;

  // Canonical destination address when valid. Empty when valid is false.
  string canonical_destination_address = 4;
}

// WithdrawService manages authenticated chain-facing withdraw request intake.
service WithdrawService {
  // Validate an external-chain withdraw destination for an authenticated
  // caller without creating, signing, or reserving a withdraw.
  rpc ValidateWithdrawDestination(ValidateWithdrawDestinationRequest) returns (ValidateWithdrawDestinationResponse) {
    option (google.api.http) = {
      post: "/v1/chain/withdraws:validate-destination"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Validate Withdraw Destination"
      description:
        "Validate an external-chain withdraw destination for "
        "an authenticated caller without creating a withdraw."
      tags: "Withdrawals"
    };
  }

  // Create or return one durable withdraw from Trading.
  rpc CreateTradingWithdraw(CreateTradingWithdrawRequest) returns (CreateTradingWithdrawResponse) {
    option (google.api.http) = {
      post: "/v1/chain/trading-withdraws"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Trading Withdraw"
      description:
        "Create or return one durable withdraw from Trading to "
        "Funding or to an external chain for the selected account "
        "target."
      tags: "Trading Withdraws"
    };
  }

  // Create or return one wallet/JWT withdraw from Trading.
  // Root-owner Trading to Funding and root-owner withdrawals to explicitly
  // whitelisted external destinations accept recent MFA. Other external,
  // cross-owner, and delegated movements require a fresh single-use step-up.
  rpc CreateWalletTradingWithdraw(CreateWalletTradingWithdrawRequest) returns (CreateWalletTradingWithdrawResponse) {
    option (polyester.api.mfa_requirement) = MFA_CONDITIONAL;
    option (google.api.http) = {
      post: "/v1/chain/trading-withdraws:wallet"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Wallet Trading Withdraw"
      description:
        "Create or return one durable Trading withdraw intent from "
        "typed frontend fields and a wallet EIP-712 signature. "
        "Root-owner Trading to Funding and root-owner withdrawals to "
        "explicitly whitelisted external destinations accept recent MFA; "
        "other interactive movements require a fresh single-use step-up."
      tags: "Trading Withdraws"
    };
  }
}
