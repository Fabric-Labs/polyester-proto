  // were.
  ActivityItem item = 13;
  // What the event changed. Absent when the event records no change, such
  // as a deletion, or was recorded before details were.
  ActivityDetails details = 14;
}

// Request to list sub-account activity.
message ListSubaccountEventsRequest {
  // Target sub-account (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];

  // Maximum number of events to return. Defaults to 50 when omitted; maximum is
  // 200.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 200];

  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to the authenticated account and requested sub-account.
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
}

// Response containing sub-account activity events.
message ListSubaccountEventsResponse {
  // Activity events ordered newest first.
  repeated ActivityEvent events = 1;
  // Opaque cursor for the next page. Empty when no more results exist.
  string next_page_token = 3 [(buf.validate.field).string.max_len = 512];
}

// Read service for aggregated sub-account pages.
service SubaccountViewService {
  option (polyester.api.docs_group) = "account";

  // Aggregate commonly-needed read data for a sub-account dashboard page. An
  // API key needs READ_SUBACCOUNTS within its scope; it gets the members and
  // invites expansions only with READ_SUBACCOUNT_MEMBERS and
  // READ_SUBACCOUNT_INVITES, and never the API-key or policy expansions.
  rpc GetSubaccount(GetSubaccountRequest) returns (GetSubaccountResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/subaccounts/{subaccount_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Subaccount View"
      description:
        "Return a single payload containing the sub-account and "
        "requested related read models, such as members, API keys, "
        "invites, policy, and balances. An API key needs READ_SUBACCOUNTS "
        "within its scope; it gets the members and invites expansions only "
        "with READ_SUBACCOUNT_MEMBERS and READ_SUBACCOUNT_INVITES, and never "
        "the API-key or policy expansions."
      tags: "Auth Service"
    };
  }

  // List audit and activity events for a sub-account. An API key needs
  // READ_SUBACCOUNT_ACTIVITY within its scope.
  rpc ListSubaccountActivity(ListSubaccountEventsRequest) returns (ListSubaccountEventsResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/subaccounts/{subaccount_id}/events"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Subaccount Activity"
      description: "List audit and activity events for a sub-account, newest first. An API key needs READ_SUBACCOUNT_ACTIVITY within its scope."
      tags: "Auth Service"
    };
  }
}

// Service for creating, updating, sharing, and listing sub-accounts.
service SubaccountService {
  option (polyester.api.docs_group) = "account";

  // List sub-accounts owned by or shared with the caller. An API key needs
  // READ_SUBACCOUNTS and lists only the sub-accounts within its scope.
  rpc ListSubaccounts(ListSubaccountsRequest) returns (ListSubaccountsResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/subaccounts"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Subaccounts"
      description: "List sub-accounts owned by or shared with the caller, including role and label. An API key needs READ_SUBACCOUNTS and lists only the sub-accounts within its scope."
      tags: "Auth Service"
    };
  }

  // Request the canonical next smart account and a short-lived account-control
  // authorization bound to the authenticated root and selected owner wallet.
  rpc CreateSubaccountChallenge(CreateSubaccountChallengeRequest) returns (CreateSubaccountChallengeResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {
      post: "/v1/auth/subaccounts/challenge"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Subaccount Challenge"
      description: "Request the next smart account and an EIP-191 authorization. Requires current terms acceptance."
      tags: "Auth Service"
    };
  }

  // Create a new sub-account under the caller's root account. Requires current
  // terms acceptance; otherwise FailedPrecondition with AUTH_TERMS_NOT_ACCEPTED
  // is returned.
  rpc CreateSubaccount(CreateSubaccountRequest) returns (CreateSubaccountResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {
      post: "/v1/auth/subaccounts"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Subaccount"
      description: "Create a new sub-account under the caller's root account. Requires the caller to have accepted the current terms."
      tags: "Auth Service"
    };
  }

  // Update mutable sub-account fields (label/status/icon/color).
  rpc UpdateSubaccount(UpdateSubaccountRequest) returns (UpdateSubaccountResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {
      patch: "/v1/auth/subaccounts/{subaccount_id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Update Subaccount"
      description: "Update mutable sub-account fields such as label, icon, color, and status."
      tags: "Auth Service"
    };
  }

  // Toggle the delegated member MFA requirement for one sub-account (owner only).
  rpc SetSubaccountMemberMFARequirement(SetSubaccountMemberMFARequirementRequest) returns (SetSubaccountMemberMFARequirementResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_CONDITIONAL;
    option (google.api.http) = {
      patch: "/v1/auth/subaccounts/{subaccount_id}/member-mfa"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Set Subaccount Member MFA Requirement"
      description: "Enable or disable the owner-controlled MFA requirement for protected delegated-member actions."
      tags: "Auth Service"
    };
  }

  // List current members for a sub-account visible to any current member. An
  // API key needs READ_SUBACCOUNT_MEMBERS within its scope.
  rpc ListSubaccountMembers(ListSubaccountMembersRequest) returns (ListSubaccountMembersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/subaccounts/{subaccount_id}/members"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Subaccount Members"
      description: "List all members and roles for a sub-account, including the owner. An API key needs READ_SUBACCOUNT_MEMBERS within its scope."
      tags: "Auth Service"
    };
  }

  // Remove a member from a sub-account (owner/admin only). The member's
  // assistant API keys on the sub-account are revoked with the removal.
  rpc RemoveSubaccountMember(RemoveSubaccountMemberRequest) returns (RemoveSubaccountMemberResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_CONDITIONAL;
    option (google.api.http) = {delete:
        "/v1/auth/subaccounts/{subaccount_id}/members/"
        "{grantee_account_id}"
};
    option (gnostic.openapi.v3.operation) = {
      summary: "Remove Subaccount Member"
      description: "Remove a member from a sub-account."
      tags: "Auth Service"
    };
  }

  // Update an existing sub-account member's role (owner/admin only). A role
  // that cannot manage API keys revokes the member's assistant API keys on the
  // sub-account with the change.
  rpc UpdateSubaccountMemberRole(UpdateSubaccountMemberRoleRequest) returns (UpdateSubaccountMemberRoleResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
      patch:
        "/v1/auth/subaccounts/{subaccount_id}/members/"
        "{grantee_account_id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Update Subaccount Member Role"
      description: "Update the role of an existing sub-account member."
      tags: "Auth Service"
    };
  }

  // Invite a member to a sub-account.
  rpc InviteSubaccountMember(InviteSubaccountMemberRequest) returns (InviteSubaccountMemberResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_FRESH_STEP_UP;
    option (google.api.http) = {
      post: "/v1/auth/subaccounts/{subaccount_id}/invites"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Invite Subaccount Member"
      description: "Create a pending invitation to grant a role on a sub-account."
      tags: "Auth Service"
    };
  }

  // List incoming invitations and invitations for administered sub-accounts.
  // An API key needs READ_SUBACCOUNT_INVITES and lists only the outgoing
  // invitations of the sub-accounts within its scope.
  rpc ListSubaccountInvites(ListSubaccountInvitesRequest) returns (ListSubaccountInvitesResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/subaccounts:invites"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Subaccount Invites"
      description: "List incoming invitations and all invitations for sub-accounts the caller owns or administers. An API key needs READ_SUBACCOUNT_INVITES and lists only the outgoing invitations of the sub-accounts within its scope."
      tags: "Auth Service"
    };
  }

  // Accept or decline an invite as the grantee, or cancel it as a current owner or admin.
  // Acceptance requires an enrolled factor and a recently MFA-elevated session when the subaccount requires member MFA.
  rpc RespondSubaccountInvite(RespondSubaccountInviteRequest) returns (RespondSubaccountInviteResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.mfa_requirement) = MFA_CONDITIONAL;
    option (google.api.http) = {
      post: "/v1/auth/subaccounts/invites/{invite_id}:respond"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Respond Subaccount Invite"
      description: "Accept or decline an invite as grantee, or cancel it as an authorized owner or admin. Acceptance requires an enrolled factor and a recently MFA-elevated session when the subaccount requires member MFA."
      tags: "Auth Service"
    };
  }
}

// Read-only discovery of built-in role capabilities and caller-effective permissions.
service SubaccountRoleService {
  option (polyester.api.docs_group) = "account";

  // List the authoritative built-in role and permission catalog. This metadata is public.
  rpc ListSubaccountRoles(ListSubaccountRolesRequest) returns (ListSubaccountRolesResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/auth/subaccount-roles"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Subaccount Roles"
      description: "List every built-in sub-account role and the exact permission definitions used by backend authorization."
      tags: "Auth Service"
    };
  }

  // Return the authenticated caller's effective permissions for one sub-account.
  // An API key needs READ_SUBACCOUNT_PERMISSIONS and gets what the key itself
  // may do on a sub-account within its scope.
  rpc GetEffectiveSubaccountPermissions(GetEffectiveSubaccountPermissionsRequest) returns (GetEffectiveSubaccountPermissionsResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/auth/subaccounts/{subaccount_id}/permissions"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Effective Subaccount Permissions"
      description: "Return permissions granted by the caller's current role after applying the attached sub-account policy. An API key needs READ_SUBACCOUNT_PERMISSIONS and gets what the key itself may do on a sub-account within its scope. Contextual checks such as MFA and resource state still apply."
      tags: "Auth Service"
    };
  }
}
