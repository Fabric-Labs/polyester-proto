name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  proto:
    name: Proto checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protobuf contracts
        run: buf lint
