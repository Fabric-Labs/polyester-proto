syntax = "proto3";

package auth.v1;

import "auth/v1/api_keys.proto";
import "auth/v1/mfa.proto";
import "auth/v1/policies.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "ledger/read/v1/ledger_read.proto";
import "polyester/api/options.proto";
import "polyester/api/validation/v1/predefined_string_rules.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/auth/v1;authv1";

// Public lifecycle status of a sub-account.
enum SubaccountStatus {
  // No sub-account status was specified.
  SUBACCOUNT_STATUS_UNSPECIFIED = 0;
  // The sub-account can be used normally.
  SUBACCOUNT_STATUS_ACTIVE = 1;
  // The sub-account is disabled and cannot be used until re-enabled.
  SUBACCOUNT_STATUS_DISABLED = 2;
}

// Role granted to a root account on a sub-account.
enum SubaccountRole {
  // No sub-account role was specified.
  SUBACCOUNT_ROLE_UNSPECIFIED = 0;
  // Can view permitted sub-account data.
  VIEWER = 1;
  // Can place and manage spot orders where policy allows.
  TRADER = 2;
  // Can place and manage spot and leverage-enabled orders where policy allows.
  LEVERAGED_TRADER = 3;
  // Can manage permitted funding and treasury actions where policy allows.
  TREASURY = 4;
  // Can administer delegated members and settings, except owner-only controls.
  ADMIN = 5;
  // Owns the sub-account and can administer all sub-account settings.
  OWNER = 6;
}

// A stable capability granted by a sub-account role. These values describe
// role authorization only; resource state, MFA, limits, and other request
// context may still deny an operation.
enum SubaccountPermission {
  // No permission selected.
  SUBACCOUNT_PERMISSION_UNSPECIFIED = 0;
  // Read the sub-account and its non-sensitive metadata.
  SUBACCOUNT_PERMISSION_READ_SUBACCOUNT = 1;
  // Update sub-account metadata or lifecycle status.
  SUBACCOUNT_PERMISSION_UPDATE_SUBACCOUNT = 2;
  // Read balances and equity.
  SUBACCOUNT_PERMISSION_READ_BALANCES = 3;
  // Read spot orders and trades.
  SUBACCOUNT_PERMISSION_READ_SPOT = 4;
  // Place and manage spot orders and triggers.
  SUBACCOUNT_PERMISSION_TRADE_SPOT = 5;
  // Read internal-transfer history.
  SUBACCOUNT_PERMISSION_READ_INTERNAL_TRANSFERS = 6;
  // Create internal transfers.
  SUBACCOUNT_PERMISSION_INTERNAL_TRANSFER = 7;
  // Withdraw value from Trading to an external destination.
  SUBACCOUNT_PERMISSION_EXTERNAL_WITHDRAW = 8;
  // Read saved, recent, and whitelisted destinations.
  SUBACCOUNT_PERMISSION_READ_ADDRESS_BOOK = 9;
  // Create, update, delete, and copy saved destinations.
  SUBACCOUNT_PERMISSION_MANAGE_ADDRESS_BOOK = 10;
  // Read the current member roster.
  SUBACCOUNT_PERMISSION_READ_MEMBERS = 11;
  // Invite, remove, and change delegated members.
  SUBACCOUNT_PERMISSION_MANAGE_MEMBERS = 12;
  // Read pending and historical invitations for the sub-account.
  SUBACCOUNT_PERMISSION_READ_INVITES = 13;
  // Cancel invitations for the sub-account.
  SUBACCOUNT_PERMISSION_MANAGE_INVITES = 14;
  // Read API keys and their attached policies for the sub-account.
  SUBACCOUNT_PERMISSION_READ_API_KEYS = 15;
  // Create, update, and delete API keys for the sub-account.
  SUBACCOUNT_PERMISSION_MANAGE_API_KEYS = 16;
  // Read the policy attached to the sub-account.
  SUBACCOUNT_PERMISSION_READ_SUBACCOUNT_POLICY = 17;
  // Create, update, attach, or replace policies for the sub-account, subject to owner-only policy safeguards.
  SUBACCOUNT_PERMISSION_MANAGE_SUBACCOUNT_POLICY = 18;
  // Read sub-account activity with role-appropriate redaction.
  SUBACCOUNT_PERMISSION_READ_ACTIVITY = 19;
  // Read unmasked security details in sub-account activity.
  SUBACCOUNT_PERMISSION_READ_ACTIVITY_SECURITY_DETAILS = 20;
  // Change the delegated-member MFA requirement.
  SUBACCOUNT_PERMISSION_MANAGE_MEMBER_MFA_REQUIREMENT = 21;
  // Create or retrieve a deposit address for the sub-account.
  SUBACCOUNT_PERMISSION_CREATE_DEPOSIT_ADDRESS = 22;
  // List deposit addresses for the sub-account.
  SUBACCOUNT_PERMISSION_READ_DEPOSIT_ADDRESSES = 23;
  // Read Guard Signer wallet and on-chain status for the sub-account.
  SUBACCOUNT_PERMISSION_READ_GUARD_SIGNER_STATUS = 24;
  // Create, sign with, rotate, or export the sub-account Guard Signer wallet.
  SUBACCOUNT_PERMISSION_MANAGE_GUARD_SIGNER = 25;
  // View the sub-account's auto-withdraw rule and its runs.
  SUBACCOUNT_PERMISSION_READ_AUTO_WITHDRAW = 26;
  // Create, change, or disable the sub-account's auto-withdraw rule; requires
  // fresh MFA and is never available to API keys.
  SUBACCOUNT_PERMISSION_MANAGE_AUTO_WITHDRAW = 27;
  // Quote, create, view and cancel Swaps of the sub-account's Trading
  // balance.
  SUBACCOUNT_PERMISSION_SWAP = 28;
  // Export account statements of the sub-account.
  SUBACCOUNT_PERMISSION_READ_STATEMENTS = 29;
  // Quote, convert, and view conversions of the sub-account's dust: small
  // Trading balances converted into a target asset.
  SUBACCOUNT_PERMISSION_CONVERT_DUST = 30;
  // View the sub-account's deposit, withdrawal, and transfer flows, including
  // those without a public chain transaction.
  SUBACCOUNT_PERMISSION_READ_FUNDING_FLOWS = 31;
  // View the sub-account's profit and loss: realized and unrealized PnL,
  // holdings with their entry price, trading statistics and the daily series.
  SUBACCOUNT_PERMISSION_READ_PNL = 32;
  // Stop the bot that runs on the sub-account, keeping or cancelling its
  // orders.
  SUBACCOUNT_PERMISSION_STOP_STRATEGIES = 33;
}

// User-facing metadata for one stable sub-account permission.
message SubaccountPermissionDefinition {
  // Stable permission identifier used by authorization and clients.
  SubaccountPermission permission = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Human-readable permission name.
  string display_name = 2;
  // Human-readable explanation of the capability and its important boundaries.
  string description = 3;
  // Policy action that can further restrict this permission. Unspecified means
  // the permission is controlled by role and request context only.
  PolicyAction policy_action = 4 [(buf.validate.field).enum = {defined_only: true}];
}

// Authoritative definition of one built-in sub-account role.
message SubaccountRoleDefinition {
  // Stable built-in role identifier.
  SubaccountRole role = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Human-readable role name.
  string display_name = 2;
  // Human-readable summary of the role.
  string description = 3;
  // Whether this role can be assigned to a delegated member.
  bool assignable = 4;
  // Complete role-granted permission set in canonical permission order.
  repeated SubaccountPermission permissions = 5 [(buf.validate.field).repeated = {
    unique: true
    max_items: 64
  }];
}

// Request for the public built-in sub-account role and permission catalog.
message ListSubaccountRolesRequest {}

// Public built-in sub-account role and permission catalog.
message ListSubaccountRolesResponse {
  // Stable permission metadata in canonical permission order.
  repeated SubaccountPermissionDefinition permissions = 1;
  // Built-in roles in display order from Owner through Viewer.
  repeated SubaccountRoleDefinition roles = 2;
}

// Request for the authenticated caller's effective permissions on one sub-account.
message GetEffectiveSubaccountPermissionsRequest {
  // Target sub-account (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

// Effective role-granted permissions for the caller on one sub-account.
message GetEffectiveSubaccountPermissionsResponse {
  // Current role of the caller on the sub-account. For an API key this is
  // OWNER: keys belong to the main account that owns the sub-account.
  SubaccountRole role = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Permissions allowed by the role and current sub-account policy. For an API
  // key, only those its API-key policy also grants and that API keys can use.
  // Resource state, MFA, limits, and other request context may still deny an
  // operation.
  repeated SubaccountPermission permissions = 2 [(buf.validate.field).repeated = {
    unique: true
    max_items: 64
  }];
  // Attached sub-account policy identifier, or zero when no policy is attached.
  fixed64 subaccount_policy_id = 3;
}

// Role summary for one sub-account visible to the caller.
message SubaccountRoleView {
  // Sub-account identifier (opaque ID).
  fixed64 subaccount_id = 1;
  // Effective role of the caller on this sub-account.
  SubaccountRole role = 2 [(buf.validate.field).enum = {defined_only: true}];
}

// Sub-account summary visible to the caller.
message Subaccount {
  // Sub-account identifier (opaque ID).
  fixed64 id = 1;
  // Role of the current caller on this sub-account. SUBACCOUNT_ROLE_UNSPECIFIED
  // when removed is true.
  SubaccountRole role = 2 [(buf.validate.field).enum = {defined_only: true}];
  // Optional human-readable label for this sub-account.
  string label = 3 [(buf.validate.field).string.max_len = 64];
  // Optional user-chosen icon/emoji for UI display.
  string icon = 10 [(buf.validate.field).string.max_len = 32];
  // Optional user-chosen color token for UI display. Tokens use lowercase letters, numbers, underscores, or hyphens.
  string color = 11 [(buf.validate.field).string.max_len = 32];
  // Current public lifecycle status of the sub-account.
  SubaccountStatus status = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Smart Account EVM address backing this sub-account.
  string smart_account_address = 5;
  // Owner (root account) public username, if set. Useful for shared views.
  string owner_username = 6;
  // Owner (root account) avatar URL, if set.
  string owner_avatar_url = 7;
  // Owner (root account) primary Smart Account address, when available. Allows
  // clients to display a stable identity even when no username is set.
  string owner_root_smart_account_address = 8;
  // Optional sub-account policy identifier (opaque ID). 0 means no
  // explicit policy attached.
  fixed64 subaccount_policy_id = 9;
  // Owner-controlled security baseline for delegated interactive members on
  // protected sub-account actions. This does not apply to read-only real-time
  // subscriptions.
  bool require_member_mfa = 12;
  // Smart-account derivation salt nonce assigned when this sub-account was
  // created. Present only when the caller owns the sub-account and can use it
  // for direct chain signing.
  optional uint32 smart_account_salt_nonce = 13;
  // Time in UTC when this sub-account's configuration was last changed. For the
  // same sub-account, later is fresher, equal is an idempotent replay, and
  // earlier is stale. Equal timestamps with different configuration, other
  // than role and removed, indicate an invariant failure.
  google.protobuf.Timestamp updated_at = 14;
  // Monotonic resource revision used for conditional updates.
  uint64 revision = 15;
  // True when the caller no longer has access to this sub-account, for
  // example after its owner removed the caller as a member: remove the
  // sub-account from the caller's list. Only real-time updates set it;
  // responses list only sub-accounts the caller can access. A change of the
  // caller's role or access does not change revision or updated_at, so
  // real-time updates deliver such changes in order and each one applies as
  // it arrives. Ending access also ends the caller's subscriptions to this
  // sub-account's real-time channels, and can, rarely, also end a
  // subscription made after access was granted again. When the server ends a
  // subscription to one of this sub-account's channels while the latest
  // update lists this sub-account with a role and removed false, subscribe
  // again: access is checked again on subscribe.
  bool removed = 16;
  // The idempotency_key of the request that created this sub-account, so a
  // caller that lost CreateSubaccount's response can find it. Present only
  // when the caller owns the sub-account on an interactive session, the only
  // kind of caller that can create one; real-time updates omit it. Empty when
  // none was given.
  string idempotency_key = 17;
  // True once a strategy bot has held this sub-account; never cleared, also
  // after the bot's access ends or the sub-account's policy is cleared. Use it
  // to keep bot sub-accounts out of funding-source choices. Real-time updates
  // carry it too.
  bool strategy_bot = 18;
}

// Request to list sub-accounts owned by or shared with the caller.
message ListSubaccountsRequest {}

// Response containing sub-accounts visible to the caller.
message ListSubaccountsResponse {
  // Sub-accounts owned by or shared with the caller, ordered by sub-account ID ascending.
  repeated Subaccount subaccounts = 1;
  // Total number of sub-accounts that have ever been created for this root,
  // including soft-deleted ones. Request CreateSubaccountChallenge to obtain
  // the canonical next smart-account address and salt.
  uint32 total_created = 2;
}

// Request an authorization for the canonical next sub-account. Requires a
// session token for the root account and current terms acceptance.
message CreateSubaccountChallengeRequest {
  // Selected EOA bound to the authenticated root account.
  string owner_address = 1 [
    (buf.validate.field).string = {pattern: "^0x[0-9a-fA-F]{40}$"},
    (google.api.field_behavior) = REQUIRED
  ];
  // Requesting browser origin including scheme and optional port, without path,
  // query, fragment, or user information. Must match the HTTP Origin when present.
  string uri = 2 [
    (buf.validate.field).string = {min_len: 1, max_len: 2048},
    (google.api.field_behavior) = REQUIRED
  ];
}

// Canonical sub-account authorization. Issuing a new challenge replaces the
// previous challenge for this root. A stale challenge requires reissue.
message CreateSubaccountChallengeResponse {
  // Exact UTF-8 EIP-191 personal_sign message. This is an account-control
  // authorization, not an EIP-4361 sign-in message. Sign through the returned
  // smart account; do not hash, alter, or reconstruct the message.
  string message = 1;
  // Canonical address of the next smart account, derived by the server.
  string smart_account_address = 2;
  // Canonical derivation salt nonce for the returned smart account.
  uint32 smart_account_salt_nonce = 3;
  // Expiration in UTC, five minutes after issuance.
  google.protobuf.Timestamp expires_at = 4;
  // Polyester EIP-155 chain ID used for smart-account derivation and verification.
  // It differs per environment, so read it from this response rather than
  // assuming a fixed value.
  uint64 polyester_chain_id = 5;
}

// Request to create a new sub-account under the caller's root account.
message CreateSubaccountRequest {
  // Optional human label for display in UI.
  string label = 1 [
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.(polyester.api.validation.v1.display_label) = true,
    (buf.validate.field).string.example = "Treasury"
  ];

  // Optional user-chosen icon/emoji for UI display.
  string icon = 7 [(buf.validate.field).string.max_len = 32];
  // Optional user-chosen color token for UI display. Tokens use lowercase letters, numbers, underscores, or hyphens.
  string color = 8 [(buf.validate.field).string.max_len = 32];

  // Smart Account EVM address for the new sub-account.
  string smart_account_address = 2 [
    (buf.validate.field).string = {
      len: 42
      pattern: "^0x[0-9a-fA-F]{40}$"
    },
    (buf.validate.field).string.example = "0x0000000000000000000000000000000000000000",
    (google.api.field_behavior) = REQUIRED
  ];
  // Exact EIP-191 authorization returned by CreateSubaccountChallenge. Maximum
  // length is 4096 UTF-8 bytes.
  string message = 3 [
    (buf.validate.field).string = {min_len: 1, max_bytes: 4096},
    (google.api.field_behavior) = REQUIRED
  ];
  // Smart-account signature over message using EIP-191 personal_sign semantics.
  // Deployed ERC-1271 and counterfactual ERC-6492 signatures are supported.
  string signature = 4 [
    (buf.validate.field).string = {min_len: 1, max_len: 8192},
    (google.api.field_behavior) = REQUIRED
  ];
  // Optional caller-chosen key that makes this request safe to retry: 1 to
  // 128 letters, digits, '.', '_', ':' or '-'. It is unique within the root
  // account and never reused, even after its sub-account is deleted. Every
  // request is authenticated first, its signature included. Sending the
  // identical request again (the same message, label, icon and color, for the
  // same smart account address) under the same key returns the sub-account it
  // created, with replayed set, and consumes no challenge; once that
  // sub-account is deleted, it fails with NotFound and
  // AUTH_RESOURCE_NOT_FOUND instead. Any other request under that key fails
  // with AUTH_SUBACCOUNT_IDEMPOTENCY_CONFLICT. Neither creates anything, so a
  // resent or stale signed challenge never creates a second sub-account. After a lost response, a new challenge names the next smart
  // account address, so a request carrying it conflicts when the first
  // request did create the sub-account: find that sub-account in
  // ListSubaccounts by its idempotency_key. Empty when none.
  string idempotency_key = 9 [
    (buf.validate.field).string.pattern = "^([A-Za-z0-9._:-]{1,128})?$",
    (buf.validate.field).string.example = "deploy-1842"
  ];
}

// Response returned after creating a sub-account.
message CreateSubaccountResponse {
  // Identifier for the created sub-account (opaque ID).
  fixed64 subaccount_id = 1;
  // Total number of sub-accounts that have ever been created for this root,
  // including soft-deleted ones. Request a new challenge for the next account.
  uint32 total_created = 2;
  // Smart-account derivation salt nonce assigned to the created sub-account.
  // Today this equals total_created for a successful create.
  uint32 smart_account_salt_nonce = 3;
  // Initial monotonic resource revision. Clients can pass this value directly
  // as expected_revision on the next revision-gated mutation. A replayed
  // request returns the sub-account's current revision.
  uint64 revision = 4;
  // True when idempotency_key matched an earlier identical request: the
  // response describes the sub-account that request created, and this call
  // created nothing and consumed no challenge.
  bool replayed = 5;
}

// SubaccountUpdateSpec contains mutable display and status configuration.
message SubaccountUpdateSpec {
  // Label for the sub-account. Empty clears the label when selected.
  string label = 1 [
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.(polyester.api.validation.v1.display_label) = true,
    (buf.validate.field).string.example = "Treasury"
  ];
  // User-chosen icon/emoji for UI display. Empty clears the icon when selected.
  string icon = 2 [(buf.validate.field).string.max_len = 32];
  // User-chosen color token for UI display. Empty clears the color when selected.
  string color = 3 [(buf.validate.field).string.max_len = 32];
  // New lifecycle status. ACTIVE and DISABLED are accepted when selected by update_mask.
  SubaccountStatus status = 4 [(buf.validate.field).enum = {defined_only: true}];
}

// Request to change selected mutable fields for a sub-account.
message UpdateSubaccountRequest {
  // Sub-account to update (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  // Candidate values for fields selected by update_mask.
  SubaccountUpdateSpec subaccount = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Mutable fields to apply. Paths are relative to subaccount. The mask is
  // required, must be non-empty, and cannot contain "*".
  google.protobuf.FieldMask update_mask = 3 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];
  // Revision returned by the latest successful read.
  uint64 expected_revision = 4 [
    (buf.validate.field).uint64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

// Response returned after updating a sub-account.
message UpdateSubaccountResponse {
  // Sub-account after applying the update.
  Subaccount subaccount = 1;
}

// Request to update the delegated-member MFA requirement for a sub-account.
message SetSubaccountMemberMFARequirementRequest {
  // Sub-account whose delegated-member MFA requirement should be updated (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  // When true, delegated interactive members must satisfy MFA requirements for
  // protected sub-account actions. This does not apply to read-only real-time
  // subscriptions.
  bool require_member_mfa = 2;
}

// Empty response returned after updating the delegated-member MFA requirement.
message SetSubaccountMemberMFARequirementResponse {}

// Member summary for a root account with access to a sub-account.
message SubaccountMemberView {
  // Identifier for the member's root account (opaque ID).
  fixed64 account_id = 1;
  // Effective role on this sub-account.
  SubaccountRole role = 2 [(buf.validate.field).enum = {defined_only: true}];
  // Optional username for the member's root account.
  string username = 3;
  // Smart Account address for the member's root account, if any.
  string smart_account_address = 4;
  // Optional avatar URL for the member's root account.
  string avatar_url = 5;
  // True when the member has at least one MFA factor enrolled on their root account.
  bool mfa_enrolled = 6;
}

// Request to list members for a sub-account.
message ListSubaccountMembersRequest {
  // Sub-account to inspect (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

// Response containing the members of a sub-account.
message ListSubaccountMembersResponse {
  // Members for the sub-account. The owner is first, followed by delegated members oldest first.
  repeated SubaccountMemberView members = 1;
}

// Request to remove a delegated member from a sub-account.
message RemoveSubaccountMemberRequest {
  // Sub-account to modify (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  // Root account ID of the member to revoke (opaque ID).
  fixed64 grantee_account_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// Empty response returned after removing a sub-account member.
message RemoveSubaccountMemberResponse {}

// Request to change the role of an existing sub-account member without sending a new invitation.
message UpdateSubaccountMemberRoleRequest {
  // Sub-account to modify (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];

  // Root account ID of the member whose role should be updated (opaque ID).
  fixed64 grantee_account_id = 2 [(buf.validate.field).fixed64.gt = 0];

  // New role to assign.
  SubaccountRole role = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

// Empty response returned after updating a member role.
message UpdateSubaccountMemberRoleResponse {}

// Status of an invitation to join a sub-account.
enum SubaccountInviteStatus {
  // No invitation status was specified.
  SUBACCOUNT_INVITE_STATUS_UNSPECIFIED = 0;
  // Invitation is waiting for the grantee to respond.
  SUBACCOUNT_INVITE_STATUS_PENDING = 1;
  // Invitation was accepted and access was granted.
  SUBACCOUNT_INVITE_STATUS_ACCEPTED = 2;
  // Invitation was declined by the grantee.
  SUBACCOUNT_INVITE_STATUS_DECLINED = 3;
  // Invitation was cancelled by the inviter.
  SUBACCOUNT_INVITE_STATUS_CANCELLED = 4;
}

// View of a pending or historical invitation to a sub-account.
message SubaccountInvite {
  // Invite identifier (opaque ID).
  fixed64 id = 1;

  // Target sub-account (opaque ID).
  fixed64 subaccount_id = 2;

  // Grantee root account ID the invite is for (opaque ID).
  fixed64 grantee_account_id = 3;

  // Inviter root account ID (opaque ID).
  fixed64 inviter_account_id = 4;

  // Requested role for the grantee.
  SubaccountRole role = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Current invitation status.
  SubaccountInviteStatus status = 6;

  // Time when the invitation was created.
  google.protobuf.Timestamp created_at = 7;
  // Time when the invitation was accepted, declined, or cancelled. Empty while pending.
  google.protobuf.Timestamp responded_at = 8;

  // Optional usernames for better UX in invite lists.
  string grantee_username = 9;
  // Username of the account that sent the invitation, when available.
  string inviter_username = 10;

  // Optional label for the target sub-account, for display in invite lists.
  string subaccount_label = 11;

  // Inviter (root account) primary Smart Account address, when available.
  // Useful for displaying a stable identity when no username is set.
  string inviter_root_smart_account_address = 12;

  // Grantee (root account) primary Smart Account address, when available.
  // Useful for displaying a stable identity when no username is set.
  string grantee_root_smart_account_address = 13;

  // Current delegated-member MFA requirement on the target sub-account. If true, accepting the invite requires an enrolled MFA factor and a recently MFA-elevated session.
  bool require_member_mfa = 14;
}

// Request to invite another root account to a sub-account.
message InviteSubaccountMemberRequest {
  // Sub-account to share (opaque ID).
  fixed64 subaccount_id = 1 [
    (buf.validate.field).fixed64.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];

  // Root account ID of the grantee (opaque ID).
  fixed64 grantee_account_id = 2 [(buf.validate.field).fixed64.gt = 0];

  // Role to grant if the invite is accepted.
  SubaccountRole role = 3 [
    (buf.validate.field).required = true,
