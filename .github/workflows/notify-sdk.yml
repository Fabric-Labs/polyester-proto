name: Notify SDK

on:
  push:
    branches:
      - testnet
      - mainnet

permissions: {}

jobs:
  notify:
    name: Sync SDK environment tags
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch SDK tag sync
        run: gh workflow run sync-environment-tags.yml -R Fabric-Labs/polyester-sdk-typescript
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
