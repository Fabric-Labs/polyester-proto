syntax = "proto3";

package polychart.events.v1;

import "polychart/v1/polychart.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/polychart/events/v1;polychart_eventsv1";

// PolychartEventEnvelope is the payload published to WebSocket channels.
//
// - Layer channels: polychart.layer.{owner_id}.{layer_id}:proto
// - Viewer channels: polychart.viewer.{viewer_id}:proto
message PolychartEventEnvelope {
  fixed64 server_ts_ms = 1;

  oneof event {
    DrawingCommitted drawing_committed = 10;
    DrawingDeleted drawing_deleted = 11;

    LayerUpdated layer_updated = 20;
    LayerDeleted layer_deleted = 21;

    // Published on viewer channels.
    LayerAccessGranted layer_access_granted = 30;
    LayerAccessRevoked layer_access_revoked = 31;
  }
}

message DrawingCommitted {
  polychart.v1.Drawing drawing = 1;
  fixed64 layer_revision = 2; // revision after applying this change
}

message DrawingDeleted {
  polychart.v1.DrawingRef drawing = 1;
  polychart.v1.LayerRef layer = 2;
  fixed64 layer_revision = 3;
}

message LayerUpdated {
  polychart.v1.Layer layer = 1;
}

message LayerDeleted {
  // LayerDeleted implies all drawings in that layer are gone.
  polychart.v1.LayerRef layer = 1;
  fixed64 layer_revision = 2; // final revision after delete
}

message LayerAccessGranted {
  // Layer was explicitly shared to the viewer (FOLLOWERS/GROUP/USER) and is now accessible.
  // This does not auto-subscribe; it is an inbox/discovery signal.
  polychart.v1.Layer layer = 1;
}

message LayerAccessRevoked {
  // Viewer no longer has access; client should remove subscription + unsubscribe WS.
  polychart.v1.LayerRef layer = 1;
  uint32 engine_symbol_id = 2;
}
