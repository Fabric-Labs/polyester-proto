// GetUnifiedAssetBalancesResponse returns unified asset balance chart columns.
message GetUnifiedAssetBalancesResponse {
  // Unified asset identifier.
  uint32 asset_id = 1;

  // Resolved history window.
  ChainAnalyticsRange range = 2;

  // Resolved bucket duration.
  string bucket = 3;

  // First bucket timestamp in seconds since Unix epoch.
  fixed32 start_ts_sec = 4;

  // Last bucket timestamp in seconds since Unix epoch.
  fixed32 end_ts_sec = 5;

  // Number of buckets represented by each value column.
  uint32 points = 6;

  // Total unified balance per bucket across public account surfaces in asset units scaled by the asset quantity scale.
  // Resolve the scale from Spot Config for this asset.
  repeated uint64 total_balance_q = 7;
}

// ChainAnalyticsService serves public chain analytics chart series.
service ChainAnalyticsService {
  // Get route-scoped zipped asset supply chart columns.
  rpc GetZippedAssetSupply(GetZippedAssetSupplyRequest) returns (GetZippedAssetSupplyResponse) {
    option (google.api.http) = {get: "/v1/chain/analytics/zipped-asset-supply"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Zipped Asset Supply"
      description: "Get route-scoped zipped asset supply chart columns."
      tags: "Chain Analytics"
    };
  }

  // Get grouped zipped asset supply chart columns.
  rpc GetZippedAssetSupplyGroup(GetZippedAssetSupplyGroupRequest) returns (GetZippedAssetSupplyGroupResponse) {
    option (google.api.http) = {get: "/v1/chain/analytics/zipped-asset-supply/group"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Zipped Asset Supply Group"
      description: "Get grouped zipped asset supply chart columns."
      tags: "Chain Analytics"
    };
  }

  // Get unified asset total balance chart columns.
  rpc GetUnifiedAssetBalances(GetUnifiedAssetBalancesRequest) returns (GetUnifiedAssetBalancesResponse) {
    option (google.api.http) = {get: "/v1/chain/analytics/unified-asset-balances"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Unified Asset Balances"
      description: "Get unified asset total balance chart columns."
      tags: "Chain Analytics"
    };
  }
}
