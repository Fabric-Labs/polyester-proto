syntax = "proto3";

package auth.v1;

import "auth/v1/mfa.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/auth/v1;authv1";
// Auth and account APIs for wallet login and caller identity.
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Auth Service"
      description: "Authentication, accounts, sub-accounts, and API key management."
    }
  ]
};

// Purpose for a server-issued wallet challenge.
enum WalletChallengePurpose {
  // No wallet challenge purpose was specified.
  WALLET_PROOF_UNSPECIFIED = 0;
  // Authenticate the wallet and create a Polyester session.
  LOGIN = 1;
  reserved 2;
  reserved "CREATE_SUBACCOUNT";
}

// CreateWalletChallengeRequest requests a short-lived EIP-4361 message whose
// exact UTF-8 bytes must be signed by the wallet.
message CreateWalletChallengeRequest {
  // Smart-account EVM address being authenticated, formatted as 0x plus 40 hex characters.
  string smart_account_address = 1 [
    (buf.validate.field).string = {pattern: "^0x[0-9a-fA-F]{40}$"},
    (google.api.field_behavior) = REQUIRED
  ];
  // Address whose signature authorizes the challenge and that is written into
  // the EIP-4361 message. This must be an EOA that controls the target smart account.
  string signer_address = 2 [
    (buf.validate.field).string = {pattern: "^0x[0-9a-fA-F]{40}$"},
    (google.api.field_behavior) = REQUIRED
  ];
  // Browser origin URI requesting the signature, including scheme and optional
  // port but no path, query, fragment, or user information.
  string uri = 3 [
    (buf.validate.field).string = {min_len: 1, max_len: 2048},
    (google.api.field_behavior) = REQUIRED
  ];
  // Operation for which the challenge may be consumed. Must be LOGIN.
  WalletChallengePurpose purpose = 4 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]},
    (google.api.field_behavior) = REQUIRED
  ];
}

// CreateWalletChallengeResponse contains the canonical EIP-4361 message.
message CreateWalletChallengeResponse {
  // Canonical EIP-4361 message. Sign these UTF-8 bytes exactly once with
  // personal_sign; do not hash, alter, or reconstruct the message.
  string message = 1;
  // Time in UTC when the challenge expires. Wallet challenges expire after 5 minutes.
  google.protobuf.Timestamp expires_at = 2;
}

// LoginWithWalletRequest completes smart-account wallet login using the exact
// server-issued EIP-4361 message and its signature.
message LoginWithWalletRequest {
  // Smart-account EVM address bound into the challenge resource, formatted as
  // 0x plus 40 hex characters.
  string smart_account_address = 1 [
    (buf.validate.field).string = {pattern: "^0x[0-9a-fA-F]{40}$"},
    (google.api.field_behavior) = REQUIRED
  ];
  // EOA signature over message using EIP-191 personal_sign semantics. A valid
  // value is 65 bytes of hexadecimal with an optional 0x prefix. Requests are
  // limited to 8192 characters.
  string signature = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 8192,
    (google.api.field_behavior) = REQUIRED
  ];
  // Optional user-agent string for account security and audit displays. Maximum
  // length is 512 characters.
  string user_agent = 4 [(buf.validate.field).string.max_len = 512];
  // Optional caller IP address for account security and audit displays. Maximum
  // length is 64 characters.
  string ip = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 64
  ];

  // Optional provider hint for the signing wallet. Maximum length is 32 characters.
  string wallet_provider = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 32
  ];
  // Exact EIP-4361 message returned by CreateWalletChallenge. Maximum length is
  // 4096 UTF-8 bytes.
  string message = 8 [
    (buf.validate.field).string = {min_len: 1, max_bytes: 4096},
    (google.api.field_behavior) = REQUIRED
  ];
}

// LoginWithWalletResponse returns a session token for the authenticated root
// account.
message LoginWithWalletResponse {
  // Bearer access token for authenticated API calls.
  string access_token = 1;
  // Time in UTC when access_token expires.
  google.protobuf.Timestamp expires_at = 2;

  // Root account the token is bound to (opaque ID).
  fixed64 account_id = 10;
  // Optional current username for the root account (empty if not set).
  string username = 13;
  // Session assurance details for the issued access token.
  SessionInfo session = 20;
}

// MeRequest introspects the authenticated caller from the presented access
// token or API key.
message MeRequest {}

// MeResponse describes the authenticated caller and current session context.
message MeResponse {
  // Root account identifier (opaque ID).
  fixed64 account_id = 1;
  // Stable public identifier of the API key that authenticated this request,
  // formatted as "ak_" followed by 32 lowercase hexadecimal characters.
  // Absent when the request was not authenticated with an API key.
  optional string api_key_id = 10 [(buf.validate.field).string.pattern = "^ak_[a-f0-9]{32}$"];
  // Optional current username for the root account (empty if not set).
  string username = 11;
  // Root smart-account EVM address, formatted as 0x plus 40 hex characters.
  // Empty if not set.
  string root_smart_account_address = 12;
  // Session assurance details for the presented access token, if any.
  SessionInfo session = 20;
}

// High-level error codes for authentication and account-domain failures.
enum AuthErrorCode {
  // No auth error code specified.
  AUTH_UNSPECIFIED = 0;
  // Username format or characters are invalid.
  AUTH_USERNAME_INVALID = 1;
  // Username is already used by another account.
  AUTH_USERNAME_TAKEN = 2;
  // Username was changed too recently.
  AUTH_USERNAME_COOLDOWN = 3;
  // Account is not currently eligible to claim or change a username.
  AUTH_USERNAME_FEATURE_LOCKED = 4;
  // Username is reserved and cannot be claimed by this account.
  AUTH_USERNAME_RESERVED = 5;
  // Request is malformed or missing required input.
  AUTH_INVALID_REQUEST = 6;
  // Authentication is required for this operation.
  AUTH_AUTHENTICATION_REQUIRED = 7;
  // Presented session type is not allowed for this operation.
  AUTH_SESSION_KIND_NOT_ALLOWED = 8;
  // Wallet login failed because the nonce or signature could not be verified.
  AUTH_WALLET_LOGIN_FAILED = 9;
  // Requested resource was not found.
  AUTH_RESOURCE_NOT_FOUND = 10;
  // Caller does not have access to the requested sub-account.
  AUTH_SUBACCOUNT_ACCESS_DENIED = 11;
  // Caller does not have access to the requested API key.
  AUTH_API_KEY_ACCESS_DENIED = 12;
  // Requested API key status transition is not allowed.
  AUTH_API_KEY_INVALID_STATUS_TRANSITION = 14;
  // Policy definition or binding is invalid.
  AUTH_POLICY_INVALID = 15;
  // Smart-account address is already linked to another account.
  AUTH_SMART_ACCOUNT_ALREADY_LINKED = 16;
  // Caller does not have access to the requested invite.
  AUTH_INVITE_ACCESS_DENIED = 17;
  // Invite cannot be used in its current state.
  AUTH_INVITE_INVALID_STATE = 18;
  // MFA is not available for this account.
  AUTH_MFA_DISABLED = 19;
  // Required MFA factor is not enrolled.
  AUTH_MFA_NOT_ENROLLED = 20;
  // MFA session is missing, expired, or invalid.
  AUTH_MFA_SESSION_INVALID = 21;
  // MFA challenge was not found.
  AUTH_MFA_CHALLENGE_NOT_FOUND = 22;
  // MFA challenge payload is invalid.
  AUTH_MFA_CHALLENGE_INVALID = 23;
  // MFA challenge is locked after too many failed attempts.
  AUTH_MFA_CHALLENGE_LOCKED = 24;
  // One-time password is invalid.
  AUTH_MFA_OTP_INVALID = 25;
  // Recovery code is invalid.
  AUTH_MFA_RECOVERY_INVALID = 26;
  // Passkey verification is not available for this challenge.
  AUTH_MFA_PASSKEY_NOT_AVAILABLE = 27;
  // Passkey credential is invalid for this account or challenge.
  AUTH_MFA_PASSKEY_CREDENTIAL_INVALID = 28;
  // Passkey verification failed.
  AUTH_MFA_PASSKEY_VERIFY_FAILED = 29;
  // MFA enrollment binding is invalid or expired.
  AUTH_MFA_ENROLLMENT_BINDING_INVALID = 30;
  // A fresh step-up proof is required for this protected operation.
  AUTH_STEP_UP_REQUIRED = 31;
  // A requested step-up proof is unavailable.
  AUTH_STEP_UP_PROOF_UNAVAILABLE = 32;
  // The step-up proof has already been claimed.
  AUTH_STEP_UP_ALREADY_CLAIMED = 33;
  // The requested policy cannot be removed because it is still in use.
  AUTH_POLICY_IN_USE = 34;
  // The requested policy is locked against this mutation.
  AUTH_POLICY_LOCKED = 35;
  // The requested policy does not belong to the target account scope.
  AUTH_POLICY_SCOPE_MISMATCH = 36;
  // The resource changed after the caller read it.
  AUTH_REVISION_CONFLICT = 37;
  // A recently MFA-elevated interactive session is required.
  AUTH_MFA_ELEVATION_REQUIRED = 38;
  // At least one active MFA factor must remain enrolled.
  AUTH_MFA_LAST_FACTOR_REQUIRED = 39;
  // An unexpected internal failure prevented the auth mutation from completing.
  AUTH_INTERNAL_ERROR = 40;
  // The caller has not accepted the terms required for this action.
  AUTH_TERMS_NOT_ACCEPTED = 41;
  // Social verification challenge expired. Start a new verification, then mark it ready again.
  AUTH_SOCIAL_VERIFICATION_EXPIRED = 42;
  // Social verification cannot accept a ready mark in its current state.
  AUTH_SOCIAL_VERIFICATION_INVALID_STATE = 43;
  // Sub-account authorization is expired, replaced, replayed, or invalid.
  AUTH_SUBACCOUNT_CHALLENGE_INVALID = 44;
  // Social account is already linked to another Polyester account.
  AUTH_SOCIAL_ACCOUNT_ALREADY_LINKED = 45;
}

// AuthErrorDetail describes an authentication or account-domain failure.
message AuthErrorDetail {
  // Stable machine-readable auth error code.
  AuthErrorCode code = 1;
  // Human-readable error message.
  string message = 2;
}

// AcceptTermsRequest records explicit consent to the terms that apply to the caller's root account.
message AcceptTermsRequest {}

// AcceptTermsResponse confirms acceptance. Repeated requests succeed and
// preserve the first acceptance time.
message AcceptTermsResponse {}

// AuthService manages wallet login, explicit terms consent, and caller authentication context.
service AuthService {
  // Create a short-lived EIP-4361 wallet challenge.
  rpc CreateWalletChallenge(CreateWalletChallengeRequest) returns (CreateWalletChallengeResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {
      post: "/v1/auth/wallet-challenge"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Wallet Challenge"
      description: "Create a short-lived EIP-4361 message for wallet login."
      tags: "Auth Service"
    };
  }

  // Verify a signed EIP-4361 message and issue an access token. Login and account creation
  // do not accept terms; explicit consent is recorded only by AcceptTerms.
  rpc LoginWithWallet(LoginWithWalletRequest) returns (LoginWithWalletResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {
      post: "/v1/auth/login/wallet"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Login With Wallet"
      description: "Verify a server-issued EIP-4361 wallet message and issue an access token for the caller account. This does not accept terms."
      tags: "Auth Service"
    };
  }

  // Explicitly accept the terms that apply to the caller's root account.
  // Requires an interactive JWT session; API keys are not allowed. Login, trading,
  // reads, and use of existing resources remain available without acceptance.
  // Acceptance is required before creating a subaccount, API key, or deposit address.
  rpc AcceptTerms(AcceptTermsRequest) returns (AcceptTermsResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/v1/auth/terms/accept"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Accept Terms"
      description: "Explicitly accept the terms that apply to the caller's root account. Requires an interactive JWT. Repeated requests succeed."
      tags: "Auth Service"
    };
  }

  // Return the caller's current auth context.
  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {get: "/v1/auth/me"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Auth Context"
      description: "Retrieve the caller auth context, including account identity, API key identity, and session assurance details."
      tags: "Auth Service"
    };
  }
}
