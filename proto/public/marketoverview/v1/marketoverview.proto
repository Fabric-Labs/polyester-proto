syntax = "proto3";

package marketoverview.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "marketdata/v1/marketdata.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/marketoverview/v1;marketoverviewv1";
// Document-level OpenAPI metadata for Market Overview API.
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Market Overview Service"
      description:
        "Public read surface for per-market overview (ticker-like) "
        "stats and optional sparklines."
    }
  ]
};

// SparklineInterval identifies the time range and sampling resolution for a
// sparkline.
enum SparklineInterval {
  // Unspecified interval. When requested, server may default to 24H.
  SPARKLINE_INTERVAL_UNSPECIFIED = 0;
  // 1 hour sparkline. Typically returns up to 60 points (1-minute buckets).
  SPARKLINE_1H = 1;
  // 24 hour sparkline. Typically returns up to 96 points (15-minute buckets).
  SPARKLINE_24H = 2;
  // 1 week sparkline. Typically returns up to 168 points (1-hour buckets).
  SPARKLINE_1W = 3;
  // 1 month sparkline. Typically returns up to 180 points (4-hour buckets).
  SPARKLINE_1M = 4;
}

enum MarketOrderBy {
  MARKET_ORDER_BY_UNSPECIFIED = 0;
  // Sort by absolute 24h change (basis points).
  ORDER_BY_CHANGE_24H_BPS = 1;
  // Sort by canonical USD 24h volume. Unvalued markets sort last in either direction.
  ORDER_BY_VOLUME_24H_USD = 2;
  // Sort by last price in quote units scaled by 1e9.
  ORDER_BY_LAST_PRICE = 3;
  // Sort by listing time (new listings first).
  ORDER_BY_DATE_ADDED = 4;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  // Ascending (oldest/lowest first).
  SORT_ASC = 1;
  // Descending (newest/highest first).
  SORT_DESC = 2;
}

// ErrorCode is a stable domain error code enum for Market Overview.
// It is used for consistent error surfaces across ConnectRPC and REST.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_REQUEST = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_UNAVAILABLE = 4;
  ERROR_CODE_UPSTREAM_ERROR = 5;
}

// ErrorDetail carries a typed domain error code for machine-readable handling.
message ErrorDetail {
  // Stable error code for programmatic matching.
  ErrorCode code = 1;
}

// Sparkline contains newest-first close prices for one time range.
message Sparkline {
  // Time range and sampling resolution represented by these close prices.
  SparklineInterval interval = 1 [(buf.validate.field).enum.defined_only = true];
  // Newest-first close prices in quote units scaled by 1e9.
  repeated int64 close_ticks = 2;
}

// RollingWindowStats summarizes executed trade prices over one rolling window
// that ends now. Like the rolling 24h stats, a window has minute granularity:
// it starts at the start of the minute that contains the time one window
// length ago. All prices are in quote units scaled by 1e9 and come from
// executed trades, never from the index price.
message RollingWindowStats {
  // Price at the start of the window: the last trade price before the
  // window's first minute or, for a market that first traded later, its
  // first trade.
  int64 open_ticks = 1;
  // Highest price in the window, counting the open and every trade.
  int64 high_ticks = 2;
  // Lowest price in the window, counting the open and every trade.
  int64 low_ticks = 3;
  // Change from the open to the last price in basis points (bp), truncated
  // toward zero. Example: +123 = +1.23%.
  int32 change_bps = 4;
}

message MarketOverview {
  // Numeric spot market identifier.
  uint32 symbol_id = 1;

  // Last traded price in quote units scaled by 1e9.
  int64 last_price_ticks = 3;
  // Last trade timestamp in nanoseconds since epoch.
  uint64 last_trade_ts_ns = 4;

  // Rolling 24h change expressed in basis points (bp). Example: +123 = +1.23%.
  // Measured from the 24h open to the last price, at minute granularity: the
  // 24h open is the price at the start of the minute that contains the time
  // 24h ago or, for a market that first traded later, its first trade. 0 while
  // the 24h open is unavailable (open_24h_ticks is 0 then): the market has no
  // trade yet (its last trade timestamp is 0 too), its first trade is a few
  // seconds old, or its trade history is temporarily unavailable.
  int32 change_24h_bps = 5;

  // Rolling 24h stats. The 24h window starts at the start of the minute that
  // contains the time 24h ago and ends now; its prices, volumes and trade
  // count cover the same window.
  // Highest price in the 24h window, counting its open and every trade, in
  // quote units scaled by 1e9.
  int64 high_24h_ticks = 6;
  // Lowest price in the 24h window, counting its open and every trade, in
  // quote units scaled by 1e9.
  int64 low_24h_ticks = 7;
  // The 24h open that change_24h_bps is measured from, in quote units scaled
  // by 1e9. 0 while the open is unavailable, including when history is
  // temporarily unavailable: the market has no trade yet, its first trade is a
  // few seconds old, or its trade history cannot be read for a while.
  int64 open_24h_ticks = 22;
  // Number of trades executed in the 24h window.
  uint64 trade_count_24h = 24;
  // 24h volume-weighted average trade price in quote units scaled by 1e9,
  // rounded down: the exact 24h quote notional divided by the 24h base volume.
  // The notional is not rounded to the quote scale, so dividing the displayed
  // volume_24h_quote_scaled by volume_24h_base_scaled can differ slightly;
  // clients cannot reproduce this value from the displayed volumes. The base
  // volume is exact when the base asset's market_data_volume_scale equals its
  // quantity_scale in GetSpotConfig. Otherwise each second with trades rounds
  // its base volume to the volume scale, by at most half of one volume unit,
  // so the base volume can be off by that much per second with trades and the
  // price error shrinks as the total base volume grows. Omitted when the
  // window has no base volume or the 24h base volume is omitted.
  optional int64 vwap_24h_ticks = 25;

  // Price at the start of the current UTC day (00:00 UTC), in quote units
  // scaled by 1e9: the last trade price before the day's first minute or, for
  // a market that first traded later that day, its first trade. Change since
  // the day open is last_price_ticks against this price. 0 while the open is
  // unavailable, including when history is temporarily unavailable: the
  // market has no trade yet, a new day's first price is still being recorded
  // (a few seconds after 00:00 UTC), or its trade history cannot be read for a
  // while.
  int64 open_utc_day_ticks = 23;

  // Rolling 1h stats, over the same minute-granular window as the 24h stats.
  // Absent while the window's open is unavailable, including when history is
  // temporarily unavailable: the market has no trade yet, its first trade is
  // a few seconds old, or the window's trade history cannot be read for a
  // while. Later fields may add volumes per window.
  RollingWindowStats stats_1h = 19;
  // Rolling 4h stats. Absent under the same conditions as stats_1h.
  RollingWindowStats stats_4h = 20;
  // Rolling 7-day stats. Absent under the same conditions as stats_1h.
  RollingWindowStats stats_7d = 21;
  // Rolling 24h base volume scaled by the base asset's
  // market_data_volume_scale from GetSpotConfig. Omitted if the amount exceeds
  // the signed 64-bit range.
  optional int64 volume_24h_base_scaled = 8;
  // Rolling 24h quote volume scaled by the pair's quote_quantity_scale from
  // GetSpotConfig. Omitted if the amount exceeds the signed 64-bit range.
  optional int64 volume_24h_quote_scaled = 14;

  // Rolling 24h USD volume, scaled by 1e6 (one unit is 0.000001 USD).
  // Applies the current quote/USD conversion to the rolling quote volume.
  // When conversion is unavailable, USDT and USDC are valued at USD parity.
  // Omitted for other quote assets when a current conversion is unavailable.
  optional int64 volume_24h_usd_scaled = 17;

  // Listing timestamp in nanoseconds since epoch. 0 when the pair has no
  // listing time.
  uint64 listed_ts_ns = 15;

  // Current best bid price in quote units scaled by 1e9.
  int64 best_bid_ticks = 9;
  // Best bid quantity scaled by the pair's base_quantity_scale from
  // GetSpotConfig.
  int64 best_bid_qty_scaled = 10;
  // Current best ask price in quote units scaled by 1e9.
  int64 best_ask_ticks = 11;
  // Best ask quantity scaled by the pair's base_quantity_scale from
  // GetSpotConfig.
  int64 best_ask_qty_scaled = 12;

  // Optional sparklines (requested explicitly).
  repeated Sparkline sparklines = 13;

  // Current multi-venue index price in quote units scaled by 1e9.
  // Zero when no fresh, valid index price is available.
  int64 index_price_ticks = 16;

  // The pair's live price band, as GetPriceBand returns it, present only
  // while a band was confirmed current within the last 5 seconds. Absent
  // means no fresh band is known, not that the pair has no band. This is a
  // convenience copy: the market overview stream sends a row again when its
  // band changes, appears or lapses, not on each confirmation, so a copy whose
  // valid_until_ts_ns has passed is unknown. Check order prices against
  // GetPriceBand or the price band stream.
  marketdata.v1.LivePriceBand price_band = 18;
}

// PriceTicksRange bounds a price in quote units scaled by 1e9. Both bounds
// are inclusive; an omitted bound leaves that side unbounded.
message PriceTicksRange {
  // The minimum may not exceed the maximum.
  option (buf.validate.message).cel = {
    id: "price_ticks_range.ordered"
    message: "min_ticks must not exceed max_ticks"
    expression: "!has(this.min_ticks) || !has(this.max_ticks) || this.min_ticks <= this.max_ticks"
  };
  // Lowest matching price, inclusive, in quote units scaled by 1e9; at least
  // 0. Omit for no lower bound.
  optional int64 min_ticks = 1 [(buf.validate.field).int64.gte = 0];
  // Highest matching price, inclusive, in quote units scaled by 1e9; at least
  // 0. Omit for no upper bound.
  optional int64 max_ticks = 2 [(buf.validate.field).int64.gte = 0];
}

// BpsRange bounds a signed change in basis points (bp). Both bounds are
// inclusive; an omitted bound leaves that side unbounded.
message BpsRange {
  // The minimum may not exceed the maximum.
  option (buf.validate.message).cel = {
    id: "bps_range.ordered"
    message: "min_bps must not exceed max_bps"
    expression: "!has(this.min_bps) || !has(this.max_bps) || this.min_bps <= this.max_bps"
  };
  // Lowest matching change, inclusive, in basis points; may be negative.
  // Example: -500 = -5%. Omit for no lower bound.
  optional int32 min_bps = 1;
  // Highest matching change, inclusive, in basis points; may be negative.
  // Example: 1000 = +10%. Omit for no upper bound.
  optional int32 max_bps = 2;
}

// UsdVolumeRange bounds a USD volume scaled by 1e6 (one unit is 0.000001
// USD). Both bounds are inclusive; an omitted bound leaves that side
// unbounded.
message UsdVolumeRange {
  // The minimum may not exceed the maximum.
  option (buf.validate.message).cel = {
    id: "usd_volume_range.ordered"
    message: "min_usd_scaled must not exceed max_usd_scaled"
    expression: "!has(this.min_usd_scaled) || !has(this.max_usd_scaled) || this.min_usd_scaled <= this.max_usd_scaled"
  };
  // Lowest matching USD volume, inclusive, scaled by 1e6; at least 0. Omit
  // for no lower bound.
  optional int64 min_usd_scaled = 1 [(buf.validate.field).int64.gte = 0];
  // Highest matching USD volume, inclusive, scaled by 1e6; at least 0. Omit
  // for no upper bound.
  optional int64 max_usd_scaled = 2 [(buf.validate.field).int64.gte = 0];
}

// ListMarketOverviewRequest lists market overview rows. The symbol_id
// filter and the range filters combine: a market is returned only when it
// matches every filter given. Filters apply before sorting and paging.
// A range whose minimum exceeds its maximum is refused as invalid, with a
// violation on the range field (last_price, change_24h or volume_24h); a
// negative price or volume bound is refused with a violation on the bound
// itself, such as last_price.max_ticks.
message ListMarketOverviewRequest {
  // Filter by stable numeric pair IDs from GetSpotConfig. When empty, returns
  // every configured market, including disabled ones. An ID that names no
  // configured market is rejected as invalid. Markets whose delisting time has
  // passed are never returned.
  repeated uint32 symbol_id = 1 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 2000
    },
    (buf.validate.field).repeated.items.uint32.gt = 0
  ];

  // Maximum number of markets to return. Defaults to 50 when omitted; maximum
  // is 2000.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 2000];
  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to symbol IDs, the range filters, sort key, and sort direction:
  // reuse it with the same filters. A cursor reused with other filters or
  // another sort is refused as invalid; request the first page again.
  // Sparkline options affect only response enrichment and may change between
  // pages. Each page is cut from current values, so a market whose sort value
  // or range membership changes between pages can appear twice or not at all
  // across them. For a consistent list, request a single page with the
  // maximum limit.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];

  // Sort key. When unset/UNSPECIFIED, defaults to descending 24h USD volume.
  MarketOrderBy order_by = 4 [(buf.validate.field).enum.defined_only = true];
  // Sort direction (DESC=newest/highest first).
  SortDirection sort = 5 [(buf.validate.field).enum.defined_only = true];

  // When true, include sparklines in each MarketOverview.
  bool include_sparklines = 6;
  // Which sparklines to include. If empty and include_sparklines is true,
  // server defaults to 24h.
  repeated SparklineInterval sparkline_intervals = 7 [(buf.validate.field).repeated.items.enum.defined_only = true];

  // Only markets whose last_price_ticks is within this range. When a bound is
  // set, a market with no trade yet never matches. Omit for no price filter.
  PriceTicksRange last_price = 8;
  // Only markets whose signed change_24h_bps is within this range; sorting by
  // ORDER_BY_CHANGE_24H_BPS still uses the absolute change. When a bound is
  // set, a market whose 24h change has no open (open_24h_ticks is 0) never
  // matches. Omit for no change filter.
  BpsRange change_24h = 9;
  // Only markets whose volume_24h_usd_scaled is within this range. When a
  // bound is set, a market whose USD volume is omitted never matches. Omit
  // for no volume filter.
  UsdVolumeRange volume_24h = 10;
}

message ListMarketOverviewResponse {
  // Market overview rows for the requested page.
  repeated MarketOverview markets = 1;
  // Opaque cursor for the next page. Empty when no more results exist.
  string next_page_token = 2 [(buf.validate.field).string.max_len = 512];
}

// MarketOverviewBatch is a websocket payload carrying batched market overview
// updates. It is published to a single all-markets channel at a fixed cadence.
message MarketOverviewBatch {
  // Market overviews included in this batch.
  repeated MarketOverview markets = 1;
  // Batch publish timestamp in nanoseconds since epoch.
  uint64 ts_ns = 2;
}

// A finite spot-volume chart request; no pagination or arbitrary time range.
message GetSpotVolumeHistoryRequest {
  // Pair IDs from GetSpotConfig; empty selects every configured pair separately.
  // At most 2000 distinct positive IDs. Unknown IDs are rejected. If the full
  // universe exceeds 2000 pairs, specify a filter; results are never truncated.
  repeated uint32 symbol_id = 1 [
    (buf.validate.field).repeated = {unique: true, max_items: 2000},
    (buf.validate.field).repeated.items.uint32.gt = 0
  ];
}

// One pair appears exactly once, regardless of its base and quote assets.
// REST renders the scaled amounts as decimal strings in volumeUsd.
message SpotPairVolumeSeries {
  // Stable numeric pair ID; clients may group these series by base asset.
  uint32 symbol_id = 1;
  // Trailing-24h USD amounts scaled by 1e6, oldest first. Exactly points values,
  // aligned with the shared response grid. Zero means no executed trades in
  // the window. USD values round down once per contributing 15-minute bucket.
  repeated sint64 volume_usd_scaled = 2;
}

// Aligned columnar trailing-24h USD series over the most recent 24 hours.
// The grid always contains 97 samples ending at the latest completed UTC
// quarter-hour. Index i maps to start_ts_sec + i * 900 seconds. Each sample
// covers [sample time - 24h, sample time); only the preceding 48 hours contribute.
// USD conversion uses historical quote/USD prices at each completed bucket
// boundary. When conversion is unavailable, USDT and USDC are valued at USD parity.
// If any contributing trade cannot be valued, or a USD amount overflows,
// the RPC fails as unavailable; partial or zero-filled valuations are not returned.
// Intervals without executed trades are zero. Results may be reused for 15 seconds.
message GetSpotVolumeHistoryResponse {
  // Sampling interval between points; currently always "15m".
  string bucket = 1;
  // First sample timestamp in seconds since Unix epoch (UTC), inclusive.
  fixed32 start_ts_sec = 2;
  // Last sample timestamp in seconds since Unix epoch (UTC), inclusive.
  fixed32 end_ts_sec = 3;
  // Number of aligned values in every pair array and the total array; always 97.
  uint32 points = 4;
  // Pairs ordered by ascending symbol_id; at most 2000, each included once.
  repeated SpotPairVolumeSeries pairs = 5;
  // Sum across selected pairs, USD scaled by 1e6. Exactly points values,
  // oldest first. REST renders decimal strings in totalVolumeUsd.
  // Do not sum overlapping trailing-24h samples to obtain period traded volume.
  repeated sint64 total_volume_usd_scaled = 6;
}

// CurrencyMetadata supplies stable defaults for display conversion. Clients may
// localize names, symbols, and number formatting for the user's locale.
message CurrencyMetadata {
  // Uppercase currency or stablecoin code, such as EUR or USDT.
  string code = 1;
  // Default English display name.
  string default_english_name = 2;
  // Representative local display symbol; multiple currencies may share a symbol.
  // Uses the code when the selected local display data has no distinct visible symbol.
  string symbol = 3;
  // Default display fraction digits, including zero for currencies such as JPY.
  // This is a formatting default, not rate precision, token decimals, or cash rounding.
  // Stablecoins use two display fraction digits.
  uint32 fraction_digits = 4;
}

// GetCurrencyConversionConfigRequest has no parameters.
message GetCurrencyConversionConfigRequest {}

// GetCurrencyConversionConfigResponse contains finite, cacheable display metadata.
// It remains available before any rates have been observed.
message GetCurrencyConversionConfigResponse {
  // Supported fiat currencies, including USD, ordered by code.
  repeated CurrencyMetadata fiat = 1;
  // Supported stablecoins (USDC and USDT), ordered by code.
  repeated CurrencyMetadata stablecoins = 2;
}

// FiatConversionRate states the fiat currency units equal to one US dollar.
message FiatConversionRate {
  // Supported fiat currency code.
  string code = 1;
  // Fiat currency units per 1 USD, scaled by 1e8. USD has the identity value 1e8.
  int64 units_per_usd_e8 = 2;
}

// FiatConversionSnapshot contains all supported fiat rates from one observation.
message FiatConversionSnapshot {
  // Complete fiat rates, including USD, ordered by code.
  repeated FiatConversionRate rates = 1;
  // Shared source observation time in seconds since the Unix epoch (UTC).
  uint64 source_ts_sec = 2;
  // True once the source observation is at least two hours old.
  bool stale = 3;
}

// StablecoinConversionRate states the observed USD value of one stablecoin unit.
message StablecoinConversionRate {
  // Supported stablecoin code (USDC or USDT).
  string code = 1;
  // USD per 1 stablecoin unit, scaled by 1e8. This is an observed price, not a fixed peg.
  int64 usd_per_unit_e8 = 2;
  // This stablecoin's source observation time in seconds since the Unix epoch (UTC).
  uint64 source_ts_sec = 3;
  // True once this stablecoin's source observation is at least five seconds old.
  bool stale = 4;
}

// GetCurrencyConversionRatesRequest has no parameters.
message GetCurrencyConversionRatesRequest {}

// GetCurrencyConversionRatesResponse groups rates by their USD conversion direction.
// Last-known observations remain available with staleness indicated. Before any
// observation is available, the request fails with unavailable (HTTP 503).
message GetCurrencyConversionRatesResponse {
  // Complete fiat snapshot; absent until a complete snapshot has been observed.
  FiatConversionSnapshot fiat = 1;
  // Observed stablecoin rates ordered by code. Unobserved stablecoins are omitted.
  repeated StablecoinConversionRate stablecoins = 2;
  // Response construction time in seconds since the Unix epoch (UTC).
  uint64 snapshot_ts_sec = 3;
}

// List ticker-style market overview rows with optional sparklines.
// Supports symbol filtering, sorting, and pagination controls.
service MarketOverviewService {
  option (polyester.api.docs_group) = "marketdata";

  // Get supported fiat and stablecoin display metadata with default English names,
  // symbols, and fraction digits. Clients may localize presentation.
  rpc GetCurrencyConversionConfig(GetCurrencyConversionConfigRequest) returns (GetCurrencyConversionConfigResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/market/currency-conversion/config"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Currency Conversion Config"
      description: "Get supported fiat and stablecoin display metadata with default English names, symbols, and fraction digits. Clients may localize presentation."
      tags: "Market Overview Service"
    };
  }

  // Get fiat units per USD and USD per stablecoin unit, grouped with source freshness.
  rpc GetCurrencyConversionRates(GetCurrencyConversionRatesRequest) returns (GetCurrencyConversionRatesResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/market/currency-conversion/rates"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Currency Conversion Rates"
      description: "Get fiat units per USD and USD per stablecoin unit, grouped with source freshness."
      tags: "Market Overview Service"
    };
  }

  // Get aligned pair-level and total trailing-24h USD volume, sampled every
  // 15 minutes over the latest day. Unavailable valuations fail the request.
  rpc GetSpotVolumeHistory(GetSpotVolumeHistoryRequest) returns (GetSpotVolumeHistoryResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/spot/markets/volume-history"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Spot Volume History"
      description: "Get aligned columnar pair-level and total trailing-24h USD volume at 15-minute intervals over the latest day. Unavailable valuations fail the request."
      tags: "Market Overview Service"
    };
  }

  rpc ListMarketOverview(ListMarketOverviewRequest) returns (ListMarketOverviewResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/spot/markets/overview"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Market Overviews"
      description:
        "List ticker-style market overview rows with optional sparklines. "
        "Supports symbol filtering, last price, 24h change and 24h USD "
        "volume range filters, sorting, and pagination controls."
      tags: "Market Overview Service"
    };
  }
}
