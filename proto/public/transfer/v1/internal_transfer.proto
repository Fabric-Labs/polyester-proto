syntax = "proto3";

package transfer.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "polyester/api/options.proto";
import "polyester/type/v1/u128.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/transfer/v1;transferv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Internal Transfers"
      description: "Authenticated Trading to Trading internal transfer intake."
    }
  ]
};

// CreateInternalTransferRequest creates or returns one accepted Trading
// to Trading internal transfer for the authenticated source account.
message CreateInternalTransferRequest {
  // Optional source subaccount public id. When omitted, the authenticated
  // caller's root account is used as the source account.
  fixed64 subaccount_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed64.gt = 0
  ];

  oneof destination {
    option (buf.validate.oneof).required = true;

    // Destination root account public id.
    fixed64 destination_account_id = 2 [(buf.validate.field).fixed64.gt = 0];
    // Destination subaccount public id.
    fixed64 destination_subaccount_id = 3 [(buf.validate.field).fixed64.gt = 0];
    // Destination smart-account address.
    string destination_smart_account_address = 4 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 128
    ];
  }

  // Canonical public unified asset id for the asset being transferred.
  uint32 asset_id = 5 [(buf.validate.field).uint32.gt = 0];

  // Transfer amount in canonical 18-decimal unified asset units.
  // For example, 0.5 is encoded as 500000000000000000.
  polyester.type.v1.U128 amount_e18 = 6 [(buf.validate.field).required = true];

  // Stable client-supplied idempotency key used to collapse safe retries.
  string idempotency_key = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

// ResolvedDestination describes the normalized transfer destination selected by
// the server after public-id / smart-account resolution.
message ResolvedDestination {
  // Destination root account public id.
  string root_account_public_id = 1;
  // Destination subaccount public id when the destination targets a subaccount.
  string subaccount_public_id = 2;
  // Destination smart-account address resolved by the server.
  string smart_account_address = 3;
}

// ErrorCode identifies stable, machine-readable Internal Transfer API errors.
// Values mirror the REST problem+json code field.
enum ErrorCode {
  // No domain error code was provided.
  ERROR_CODE_UNSPECIFIED = 0;

  // The source account does not have enough available Trading balance.
  ERROR_CODE_INSUFFICIENT_FUNDS = 1;
  // Request payload or one of its fields is invalid.
  ERROR_CODE_INVALID_REQUEST = 2;
  // Caller is not authenticated.
  ERROR_CODE_UNAUTHENTICATED = 3;
  // Caller is not permitted to create the transfer.
  ERROR_CODE_PERMISSION_DENIED = 4;
  // Request exceeded the applicable admission rate limit.
  ERROR_CODE_RATE_LIMIT_EXCEEDED = 5;
  // A required dependency is temporarily unavailable.
  ERROR_CODE_SERVICE_UNAVAILABLE = 6;
  // The request failed because of an unexpected server error.
  ERROR_CODE_INTERNAL_ERROR = 7;
  // The selected subaccount identifier is invalid.
  ERROR_CODE_INVALID_SUBACCOUNT_ID = 8;
  // The selected subaccount does not exist.
  ERROR_CODE_SUBACCOUNT_NOT_FOUND = 9;
  // The source subaccount is not active.
  ERROR_CODE_SOURCE_ACCOUNT_INACTIVE = 10;
  // The requested asset is not supported for internal transfers.
  ERROR_CODE_UNSUPPORTED_ASSET = 11;
  // The transfer amount is invalid.
  ERROR_CODE_INVALID_AMOUNT = 12;
  // The destination identifier is invalid.
  ERROR_CODE_INVALID_DESTINATION = 13;
  // The destination account or smart account could not be found.
  ERROR_CODE_DESTINATION_NOT_FOUND = 14;
  // The destination subaccount is not active.
  ERROR_CODE_DESTINATION_INACTIVE = 15;
  // Source and destination resolve to the same account.
  ERROR_CODE_SAME_SOURCE_DESTINATION = 16;
  // The destination is not present on the caller's internal whitelist.
  ERROR_CODE_DESTINATION_NOT_WHITELISTED = 17;
  // A required source or destination smart-account address is unavailable.
  ERROR_CODE_SMART_ACCOUNT_UNAVAILABLE = 18;
  // Fresh step-up verification is temporarily unavailable.
  ERROR_CODE_STEP_UP_UNAVAILABLE = 19;
  // The idempotency key was reused with different request data.
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 20;
  // The funds lock conflicts with an existing or finalized reservation.
  ERROR_CODE_FUNDS_LOCK_CONFLICT = 21;
  // The authoritative capital view is not ready or is stale.
  ERROR_CODE_CAPITAL_VIEW_UNAVAILABLE = 22;
  // The account shard cannot currently accept fund movement.
  ERROR_CODE_ACCOUNT_SHARD_UNAVAILABLE = 23;
  // A required account or API-key policy rejected the transfer.
  ERROR_CODE_POLICY_DENIED = 24;
  // A required precondition was not satisfied.
  ERROR_CODE_FAILED_PRECONDITION = 25;
  // The requested resource was not found.
  ERROR_CODE_NOT_FOUND = 26;
  // The request conflicts with existing state.
  ERROR_CODE_CONFLICT = 27;
}

// ErrorDetail is attached to ConnectRPC errors for structured error handling.
message ErrorDetail {
  // Stable error code matching the REST problem+json code field.
  ErrorCode code = 1;
}

// InternalTransferStatus is the public user-facing status for an internal
// transfer request.
enum InternalTransferStatus {
  // Status was not specified.
  INTERNAL_TRANSFER_STATUS_UNSPECIFIED = 0;

  // The transfer request was accepted and has a durable transfer identifier.
  INTERNAL_TRANSFER_STATUS_ACCEPTED = 1;

  // The transfer request was rejected before durable acceptance.
  INTERNAL_TRANSFER_STATUS_REJECTED = 2;

  // The transfer request failed terminally before durable acceptance.
  INTERNAL_TRANSFER_STATUS_FAILED = 3;
}

// CreateInternalTransferResponse returns the accepted request and transfer
// identifiers for later correlation.
message CreateInternalTransferResponse {
  // Stable server-owned request identifier for this intake.
  string request_id = 1;
  // Stable transfer identifier for the settled internal transfer.
  string transfer_id = 2;
  // Acceptance timestamp in nanoseconds since epoch (server time).
  uint64 accepted_at_ts_ns = 3;
  // Echoed canonical public unified asset id.
  uint32 asset_id = 4;
  // Resolved asset code for convenience.
  string asset_code = 5;
  // Resolved unified asset id used by downstream settlement.
  string u_asset_id = 6;
  // Echoed transfer amount in canonical 18-decimal unified asset units.
  polyester.type.v1.U128 amount_e18 = 7;
  // Server-resolved destination summary.
  ResolvedDestination destination = 8;
  // Public status for the transfer request.
  InternalTransferStatus status = 9;
}

// InternalTransferService manages authenticated Trading to Trading internal
// transfer intake.
service InternalTransferService {
  // Create or return one accepted Trading to Trading transfer.
  // Root-owner same-owner transfers and root-owner transfers to explicitly
  // whitelisted destinations accept recent MFA; delegated and other
  // interactive transfers require fresh step-up.
  rpc CreateInternalTransfer(CreateInternalTransferRequest) returns (CreateInternalTransferResponse) {
    option (polyester.api.mfa_requirement) = MFA_CONDITIONAL;
    option (google.api.http) = {
      post: "/v1/trading/internal-transfers"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Internal Transfer"
      description:
        "Create or return one authenticated Trading to "
        "Trading internal transfer. Root-owner same-owner transfers and "
        "root-owner transfers to explicitly whitelisted destinations "
        "accept recent MFA; delegated and other interactive transfers "
        "require fresh step-up."
      tags: "Internal Transfers"
    };
  }
}
