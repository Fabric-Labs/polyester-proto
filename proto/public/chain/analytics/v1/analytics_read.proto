      "(this.range == 2 && this.end_ts_sec - this.start_ts_sec <= 604800u) || "
      "(this.range == 3 && this.end_ts_sec - this.start_ts_sec <= 2592000u) || "
      "(this.range == 4 && this.end_ts_sec - this.start_ts_sec <= 7776000u) || "
      "(this.range == 5 && this.end_ts_sec - this.start_ts_sec <= 15552000u) || "
