syntax = "proto3";

package orders.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "ledger/v1/catalog.proto";
import "orders/v1/orders.proto";
import "polyester/api/options.proto";
import "polyester/type/v1/u128.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/orders/v1;ordersv1";

// Read-only Orders API (open orders and historical orders).
// Separate from write surface to allow independent evolution/versioning.
// Shared enums (Side, OrderType, TimeInForce, SelfTradePreventionMode,
// FeeAsset) are imported from orders.proto.

// OrderStatus is specific to the read API (write API uses simple "accepted" status string).
enum OrderStatus {
  // Order status was not provided.
  ORDER_STATUS_UNSPECIFIED = 0;
  // Accepted and submitted for execution, but not yet confirmed as working.
  PENDING = 1;
  // Cancel requested; may still be working until cancel is confirmed.
  PENDING_CANCEL = 2;
  // Accepted and actively working (resting and/or matching).
  WORKING = 3;
  // Fully filled (no remaining quantity). A buy sized by a quote amount
  // (max_quote_debit_scaled) is fully filled once it has spent that amount:
  // what is left of it buys no further quantity step at the next price the
  // order could fill at. Its quantity is then what it bought.
  FILLED = 4;
  // Canceled and no longer working.
  CANCELED = 5;
  // Rejected and never entered the working state.
  REJECTED = 6;
}

// CancelReason is why a CANCELED order ended. A cancel is no error: a
// refused order is REJECTED and names its refusal with an ErrorCode instead.
// Fills before the cancel stand, and the order's remaining reserved funds are
// released.
enum CancelReason {
  // The order is not canceled.
  CANCEL_REASON_UNSPECIFIED = 0;
  // A cancel the account sent: a cancel, a batch cancel or a cancel-all.
  CANCEL_REASON_USER_REQUEST = 1;
  // The unfilled remainder of an immediate-or-cancel order. A buy sized by a
  // quote amount (max_quote_debit_scaled) that spends that amount ends
  // FILLED instead.
  CANCEL_REASON_IOC_REMAINDER = 2;
  // The unfilled remainder of a market order: the book ran out, the next
  // price was past the order's protection price, or the order reached the
  // market's maximum order quantity. A market buy sized by a quote amount
  // (max_quote_debit_scaled) that spends that amount, so that what is left
  // buys no further quantity step, ends FILLED instead.
  CANCEL_REASON_MARKET_REMAINDER = 3;
  // Self-trade prevention canceled this resting order when an order of the
  // same account would have matched it.
  CANCEL_REASON_STP_EXPIRE_MAKER = 4;
  // Self-trade prevention canceled this incoming order instead of matching a
  // resting order of the same account.
  CANCEL_REASON_STP_EXPIRE_TAKER = 5;
  // Self-trade prevention canceled both this order and the order of the same
  // account it would have matched.
  CANCEL_REASON_STP_EXPIRE_BOTH = 6;
  // A replace ended this order and created its successor.
  CANCEL_REASON_REPLACED = 7;
  // A good-till-date order reached its expiry time.
  CANCEL_REASON_GTD_EXPIRED = 8;
  // An amend or replace set the order's total quantity at or below its filled
  // quantity, so the order ended at its filled quantity.
  CANCEL_REASON_QTY_AT_OR_BELOW_FILLED = 9;
  // The market was disabled: the exchange canceled its resting orders.
  CANCEL_REASON_PAIR_DRAIN = 10;
  // The market refused one of the order's attached take-profit, stop-loss or
  // trailing-stop legs, so the order's remainder and its other legs were
  // canceled.
  CANCEL_REASON_ATTACHED_RISK_REFUSED = 11;
  // The account's cancel-all-after timer reached its deadline without a
  // heartbeat.
  CANCEL_REASON_CANCEL_ALL_AFTER = 12;
  // Canceled by the exchange while it recovered the account. Place new orders
  // once the account trades again.
  CANCEL_REASON_ACCOUNT_REPAIR = 13;
  // A TWAP slice its TWAP canceled at the next slice's due time; its unfilled
  // remainder moves to the TWAP's later slices.
  CANCEL_REASON_TWAP_ROLLOVER = 14;
  // An order a trigger placed, such as a TWAP slice, a ladder level, a stop's
  // child or an attached leg's exit, canceled because its trigger ended or
  // another leg took over the exit.
  CANCEL_REASON_STRATEGY_CANCEL = 15;
  // The exchange canceled the order for a reason it does not name.
  CANCEL_REASON_SYSTEM = 16;
  // The market was halted: the exchange canceled every open order of the
  // market. Fills before the cancel stand. The market refuses new orders until
  // it trades again.
  CANCEL_REASON_MARKET_HALTED = 17;
  // The order's attached take-profit, stop-loss or trailing stop fired while
  // the order still rested: the exchange canceled the order's unfilled
  // remainder before placing the attached order, so the two never trade with
  // each other. Fills before the cancel stand.
  CANCEL_REASON_ATTACHED_EXIT_FIRED = 18;
}

// BatchReplacePhase is the recoverable execution phase for one replacement.
enum BatchReplacePhase {
  // Phase is unavailable.
  BATCH_REPLACE_PHASE_UNSPECIFIED = 0;
  // The operation was admitted and handed to execution, amended items included.
  BATCH_REPLACE_PHASE_ADMITTED = 1;
  // The successor order, or the amended order, is active.
  BATCH_REPLACE_PHASE_WORKING = 2;
  // The replacement was rejected.
  BATCH_REPLACE_PHASE_REJECTED = 3;
  // The successor, or the amended order, reached a terminal state.
  BATCH_REPLACE_PHASE_TERMINAL = 4;
}

// OrderOriginScope captures broad origin classes for an order.
enum OrderOriginScope {
  // Order origin scope was not provided.
  ORDER_ORIGIN_SCOPE_UNSPECIFIED = 0;
  // User/manual order (non-trigger path).
  DIRECT = 1;
  // Child generated by attached TP/SL/Trailing risk on a parent order.
  ATTACHED_RISK = 2;
  // Child generated by a standalone trigger (STOP/TWAP/LADDER...).
  STANDALONE_TRIGGER = 3;
  // System-managed automation, such as liquidation or account-protection actions.
  SYSTEM = 4;
}

// OrderTriggerType captures the trigger strategy that generated the order.
enum OrderTriggerType {
  // Trigger type was not provided or the order was not generated by a trigger.
  ORDER_TRIGGER_TYPE_UNSPECIFIED = 0;
  // Order was generated by a stop-loss trigger.
  STOP_LOSS = 1;
  // Order was generated by a take-profit trigger.
  TAKE_PROFIT = 2;
  // Order was generated by a trailing-stop trigger.
  TRAILING_STOP = 3;
  // Order was generated by a time-weighted execution trigger.
  TWAP = 4;
  // Order was generated by a ladder execution trigger.
  LADDER = 5;
}

// OrderOrigin explains why an order exists and where it came from.
//
// Population rules:
// - direct/manual orders: scope=DIRECT; trigger fields unset/unspecified.
// - attached children: scope=ATTACHED_RISK; parent_order_id is set.
// - standalone trigger children: scope=STANDALONE_TRIGGER.
// - child_seq is set for multi-child strategies (for example TWAP/LADDER).
message OrderOrigin {
  // Broad class describing how the order was created.
  OrderOriginScope scope = 1 [(buf.validate.field).enum.defined_only = true];
  // Trigger strategy that created this order. Not set for direct orders; JSON
  // and REST responses then omit it.
  OrderTriggerType trigger_type = 2 [(buf.validate.field).enum.defined_only = true];
  // Trigger identifier when the order was created by a trigger.
  optional fixed64 trigger_id = 3;
  // Parent order ID for attached-risk child orders.
  optional fixed64 parent_order_id = 4;
  // Child sequence number for multi-child trigger strategies. Zero when not applicable.
  uint32 child_seq = 5;
}

// AttachedRiskLegState provides runtime linkage/state for one attached-risk leg.
message AttachedRiskLegState {
  // Runtime lifecycle for an attached-risk trigger leg.
  enum Status {
    // Attached-risk leg status was not provided.
    STATUS_UNSPECIFIED = 0;
    // No leg configured on the parent order.
    NOT_CONFIGURED = 1;
    // Trigger persisted, waiting for admission/arming.
    CREATED = 2;
    // Trigger is actively armed.
    ARMED = 3;
    // Trigger is executing runtime work (for example multi-step workflows).
    RUNNING = 4;
    // Trigger finished successfully.
    COMPLETED = 5;
    // Trigger was canceled.
    CANCELED = 6;
    // Trigger failed.
    FAILED = 7;
    // Trigger is paused.
    PAUSED = 8;
  }

  // Current runtime lifecycle status for this attached-risk leg.
  Status status = 1 [(buf.validate.field).enum.defined_only = true];
  // Time the leg was armed, in nanoseconds since epoch (UTC). Zero if not armed.
  uint64 armed_ts_ns = 2;
  // Time the leg reached a terminal state, in nanoseconds since epoch (UTC). Zero if not terminal.
  uint64 terminal_ts_ns = 3;
  // Trigger identifier for this attached-risk leg.
  optional fixed64 trigger_id = 4;
  // Child order ID created by this leg after it fires.
  optional fixed64 child_order_id = 5;
}

// AttachedRiskTakeProfit carries both take-profit config and runtime state.
message AttachedRiskTakeProfit {
  // Take-profit policy configured on the parent order.
  TakeProfitPolicy policy = 1;
  // Runtime state for the take-profit leg.
  AttachedRiskLegState state = 2;
}

// AttachedRiskStopLoss carries both stop-loss config and runtime state.
message AttachedRiskStopLoss {
  // Stop-loss policy configured on the parent order.
  StopLossPolicy policy = 1;
  // Runtime state for the stop-loss leg.
  AttachedRiskLegState state = 2;
}

// AttachedRiskTrailingStop carries both trailing-stop config and runtime state.
message AttachedRiskTrailingStop {
  // Trailing-stop policy configured on the parent order.
  TrailingStopPolicy policy = 1;
  // Runtime state for the trailing-stop leg.
  AttachedRiskLegState state = 2;
}

// AttachedRisk is the single parent-side view for attached-risk configuration
// and runtime status.
message AttachedRisk {
  // Take-profit leg, if configured or if state exists.
  AttachedRiskTakeProfit take_profit = 1;
  // Stop-loss leg, if configured or if state exists.
  AttachedRiskStopLoss stop_loss = 2;
  // Trailing-stop leg, if configured or if state exists.
  AttachedRiskTrailingStop trailing_stop = 3;
  // True while the parent's legs were placed with oco and both the
  // take-profit and a stop leg (stop-loss or trailing stop) are present.
  // False once either leg is removed. A leg that ended, including one
  // canceled with TRIGGER_CANCEL_REASON_OCO, stays present.
  bool oco = 4;
}

// =============================================================================
// Connect/Proto-facing Messages (scaled ints, fixed64 IDs)
// =============================================================================

// OrderLineage identifies a logical order and one of its accepted generations.
message OrderLineage {
  // Stable logical-order ID: the first generation's public order ID.
  // Replace preserves this ID; an independent new order starts a new lineage.
  fixed64 id = 1 [(buf.validate.field).fixed64.gt = 0];
  // One-based replacement generation, distinct from per-order state version.
  uint32 generation = 2 [(buf.validate.field).uint32.gt = 0];
}

// OrderFeeTotal is the total fee of an order's fills, net of rebates, as
// settled. A fill's fee is recorded shortly after the fill executes, so the
// total can trail the fills the order shows: qty_scaled says which fills it
// covers.
message OrderFeeTotal {
  // Net fee magnitude in fixed 18-decimal units of the order's fee_asset:
  // the fees of the covered fills less their rebates. Zero when they charged
  // no fee.
  polyester.type.v1.U128 amount_e18 = 1;
  // True when the covered fills' rebates exceed their fees, so the amount
  // was credited to the account rather than charged.
  bool is_rebate = 2;
  // Executed quantity of the fills the total covers, scaled by the pair's
  // base_quantity_scale from GetSpotConfig. Equal to the order's
  // cum_qty_scaled once every fill's fee is recorded. While a fill is still
  // being recorded the two differ, and a later read of the order includes
  // it.
  int64 qty_scaled = 3;
}

// Order is the Connect-facing order view with compact binary fields.
message Order {
  // Public order identifier as fixed64.
  fixed64 order_id = 1;
  // Trading symbol numeric identifier.
  uint32 symbol_id = 3;
  // Client-provided, account-scoped identifier for correlation, lookup, and
  // cancellation. Empty when none was supplied.
  string client_order_id = 4 [
    (buf.validate.field).string.max_len = 36,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]*$"
  ];
  // Order side.
  Side side = 5 [(buf.validate.field).enum.defined_only = true];
  // Current order lifecycle status.
  OrderStatus status = 6;
  // Order type.
  OrderType order_type = 7;
  // Time-in-force policy.
  TimeInForce time_in_force = 8;
  // Self-trade prevention mode.
  SelfTradePreventionMode self_trade_prevention_mode = 9;
  // Fee asset selected for fills.
  FeeAsset fee_asset = 10;
  // True if the order was submitted as post-only (maker-only).
  bool post_only = 11;
  // Current accepted total order quantity, updated by successful modifies,
  // scaled by the pair's base_quantity_scale from GetSpotConfig for symbol_id.
  int64 orig_qty_scaled = 12;
  // Cumulative filled quantity across the lineage through this generation,
  // scaled by the pair's base_quantity_scale from GetSpotConfig for symbol_id.
  int64 cum_qty_scaled = 13;
  // Cumulative filled base quantity inherited from predecessors when this
  // replacement was accepted, scaled by the pair's base_quantity_scale from
  // GetSpotConfig for symbol_id. Zero for the original order and immutable
  // within a generation. cum_qty_scaled minus this value is the quantity
  // executed by this generation, not the quantity new to a client session.
  int64 inherited_cum_qty_scaled = 33;
  // Remaining working quantity scaled by the pair's base_quantity_scale from
  // GetSpotConfig for symbol_id. Zero for terminal orders.
  int64 leaves_qty_scaled = 20;
  // Average execution price across the lineage through this generation,
  // in quote units scaled by 1e9, rounded down. Zero if no fills.
  // avg_price_e18 carries the exact average.
  int64 avg_price_ticks = 14;
  // Average execution price across the lineage through this generation, in
  // quote units scaled by 1e18: the exact executed quote amount divided by
  // cum_qty_scaled, rounded half to even at the 18th decimal. Unset if no
  // fills.
  polyester.type.v1.U128 avg_price_e18 = 36;
  // Exact quote amount of the fills across the lineage through this
  // generation, before fees: the sum over the fills of their quantity,
  // scaled as cum_qty_scaled, times their price in quote units scaled by
  // 1e9. It is in quote units scaled by 10^(9 + base_quantity_scale), with
  // the pair's base_quantity_scale from GetSpotConfig for symbol_id; REST
  // shows it in quote units. avg_price_e18 is this amount over
  // cum_qty_scaled. Unset if no fills. A fill settles its quote rounded down
  // to 18 decimal places, which is this amount exactly unless
  // base_quantity_scale is above 9.
  //
  // For a BUY sized by a quote amount (submitted_max_quote_debit_scaled),
  // the quote the order used is this amount plus fee_total's amount_e18
  // when fee_asset is QUOTE, or minus it when fee_total's is_rebate is true,
  // since a rebate is credited; it is this amount alone when fee_asset is
  // BASE, whose fee is taken from the base received. What it left unspent is
  // submitted_max_quote_debit_scaled less the quote it used.
  polyester.type.v1.U128 cum_notional = 37;
  // Total fee of the fills across the lineage through this generation, net
  // of rebates, in the order's fee asset. Order history reads and
  // single-order reads that include execution history (the default) carry
  // it. It can trail the order's fills: its quantity shows which fills it
  // covers. Open-order reads, single-order reads without execution history
  // and private stream order updates leave it unset.
  OrderFeeTotal fee_total = 38;
  // Limit price in quote units scaled by 1e9. Zero for MARKET orders.
  int64 price_ticks = 15;
  // Creation timestamp in nanoseconds since epoch (UTC).
  uint64 created_ts_ns = 16;
  // Terminal timestamp in nanoseconds since epoch (UTC). Zero for open orders.
  uint64 terminal_ts_ns = 17;

  reserved 18, 19;
  reserved "terminal_reason_code", "terminal_reason";
  // For a REJECTED order, why it was refused: the same error code the Orders
  // API returns for the same refusal. Not set for every other status; JSON and
  // REST responses then omit it.
  ErrorCode reject_reason = 34;
  // For a CANCELED order, why it ended. Not set for every other status; JSON
  // and REST responses then omit it.
  CancelReason cancel_reason = 35;
  // Attached risk controls + runtime state on the parent order.
  // Empty when no attached risk exists. Order reads include it only when the
  // request asks for it (include_attached_risk, include_attached_risk_state):
  // an omission on request, never a removal. The private WebSocket always
  // carries it in full, as a read asking for both does.
  AttachedRisk attached_risk = 21;
  // Runtime lineage metadata (why the order exists and what generated it).
  OrderOrigin origin = 22;
  // Optional client-side reference price used for MARKET slippage protection,
  // in quote units scaled by 1e9.
  int64 market_client_ref_price_ticks = 23;
  // Non-negative MARKET maximum absolute price delta in Q9 execution-price ticks
  // (1 tick = 1e-9 quote units). Zero means no absolute cap is configured.
  int64 market_max_slippage_ticks = 24;
  // Optional MARKET max slippage in basis points (1 bp = 0.01%).
  int32 market_max_slippage_bps = 25;
  // Per-order state version: 0 while the order is accepted but not yet on
  // the book (status PENDING), then 1 from its first book state and higher
  // for every later published state change. A higher version is always
  // newer, and two copies of an order with the same version are identical,
  // so use this field to reconcile API and realtime updates.
  uint32 version = 26 [(buf.validate.field).uint32 = {
    gte: 0
    lte: 2147483647
  }];
  // Batch-replace identity that admitted this order. Zero for other origins.
  fixed64 batch_request_id = 27;
  // Submitted hard all-in quote debit limit, scaled by the pair's
  // quote_quantity_scale from GetSpotConfig. Present only when that sizing
  // method was submitted.
  optional int64 submitted_max_quote_debit_scaled = 28;
  reserved 29, 30;
  reserved "lineage_id", "generation";
  // Logical-order identity and requested generation. Always populated by order reads.
  OrderLineage lineage = 31;
  // Exact UTC expiry time for GTD orders, within the supported signed
  // Unix-nanosecond range from 1677-09-21T00:12:43.145224193Z through
  // 2262-04-11T23:47:16.854775807Z. Omitted for all other time-in-force policies.
  // The order cannot execute when the current time equals this value.
  google.protobuf.Timestamp expire_at = 32;
}

// UserTrade is the Connect-facing per-user trade fill view.
message UserTrade {
  // Trading symbol numeric identifier.
  uint32 symbol_id = 2;
  // Match identifier (monotonic per symbol).
  uint64 match_id = 3;
  // Order identifier as fixed64.
  fixed64 order_id = 4;
  // Fill side.
  Side side = 5 [(buf.validate.field).enum.defined_only = true];
  // True if this fill was maker-side.
  bool is_maker = 6;
  // Execution price in quote units scaled by 1e9.
  int64 price_ticks = 7;
  // Executed quantity scaled by the pair's base_quantity_scale from
  // GetSpotConfig for symbol_id.
  int64 qty_scaled = 8;
  // Exact fee magnitude in fixed 18-decimal units of fee_asset.
  polyester.type.v1.U128 fee_amount_e18 = 9;
  // Fee asset charged or credited for this fill.
  FeeAsset fee_asset = 10;
  // Exact referral share magnitude in fixed 18-decimal units of fee_asset.
  polyester.type.v1.U128 referral_share_amount_e18 = 12;
  // Execution timestamp in nanoseconds since epoch.
  uint64 ts_ns = 13;
  // Whether this fill earned a rebate instead of paying a fee.
  bool fee_is_rebate = 14;
  reserved 15, 16;
  reserved "lineage_id", "generation";
  // Logical-order identity and the generation that executed this fill.
  // Always populated by execution reads; order_id retains its original identity.
  OrderLineage lineage = 17;
}

// UserTradeBatch is one realtime publication on an account's trade stream:
// every fill queued for the stream when it was sent, at most 256 and at most
// 64 KiB. Fills of one trading symbol arrive in execution order; fills of
// different symbols have no defined order relative to each other.
//
// (match_id, order_id) identifies a fill; order_id tells apart the two fills
// of a trade between two orders of the same account. Apply fills in array
// order and in publication order; a fill whose identity was already received
// replaces the earlier copy. When the subscription reports that missed
// publications could not be recovered, reload recent fills over REST.
message UserTradeBatch {
  // Fills, oldest first per trading symbol. At least one fill.
  repeated UserTrade events = 1;
}

// OrderTransfer is the Connect-facing minimal per-leg transfer view.
message OrderTransfer {
  // Match identifier that linked this transfer to an execution, scoped by symbol_id.
  uint64 match_id = 1;
  // Market of the execution; together with match_id identifies its match.
  uint32 symbol_id = 10;
  // Asset identifier for the transferred asset.
  uint32 asset_id = 2;
  // Transfer amount at fixed 18-decimal ledger scale.
  polyester.type.v1.U128 amount_e18 = 3;
  // True when the transfer debits the account; false when it credits the account.
  bool is_debit = 5;
  // Product reason for this transfer leg.
  ledger.v1.TransferCode transfer_code = 6;
  // Account bucket affected by this transfer leg.
  ledger.v1.AccountCode account_code = 7;
  // Transfer timestamp in nanoseconds since epoch (UTC).
  uint64 ts_ns = 8;
  // Transfer transaction identifier.
  string tx_id = 9;
}

// GetOpenOrdersRequest lists currently non-terminal orders for an account.
message GetOpenOrdersRequest {
  // Target sub-account numeric ID. When omitted, uses caller's root account.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional filter by symbol_id values. Empty means all symbols.
  repeated uint32 symbol_id = 2 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 100
    },
    (buf.validate.field).repeated.items.uint32.gt = 0
  ];
  // Optional side filter.
  Side side = 3 [(buf.validate.field).enum.defined_only = true];
  // Max number of orders to return (1-1000, default 100).
  optional uint32 limit = 10 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to the authenticated account, sub-account scope, filters, and sort
  // order.
  string page_token = 11 [(buf.validate.field).string.max_len = 512];
  // Include attached-risk policy details in each order (defaults to false when unset).
  optional bool include_attached_risk = 12;
  // Include attached-risk state details in each order (defaults to false when unset).
  optional bool include_attached_risk_state = 13;
  // Optional trigger identifier. When set, returns only child orders created by
  // that trigger.
  optional fixed64 trigger_id = 14 [(buf.validate.field).fixed64.gt = 0];
}

// GetOpenOrdersResponse returns open orders and an optional next-page cursor.
message GetOpenOrdersResponse {
  // Open orders ordered newest-first.
  repeated Order orders = 1;
  // Opaque cursor for the next page. Empty when no more results exist.
  string next_page_token = 2 [(buf.validate.field).string.max_len = 512];
}

// GetOrderHistoryRequest lists terminal orders for an account.
message GetOrderHistoryRequest {
  // Time range must be ordered when both are set.
  option (buf.validate.message).cel = {
    id: "orders_history_bin.ordered_time_range"
    message: "start_ts_ns must be <= end_ts_ns when both are set"
    expression: "!has(this.start_ts_ns) || !has(this.end_ts_ns) || (this.start_ts_ns <= this.end_ts_ns)"
  };

  // Target sub-account numeric ID. When omitted, uses caller's root account.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional filter by symbol_id values. Empty means all symbols.
  repeated uint32 symbol_id = 2 [
    (buf.validate.field).repeated = {
      unique: true
      max_items: 100
    },
    (buf.validate.field).repeated.items.uint32.gt = 0
  ];
  // Optional side filter.
  Side side = 3 [(buf.validate.field).enum.defined_only = true];
  // Optional status filter.
  OrderStatus status = 4 [(buf.validate.field).enum.defined_only = true];
  // Inclusive start of the time range, in nanoseconds since epoch (UTC).
  optional uint64 start_ts_ns = 10;
  // Inclusive end of the time range, in nanoseconds since epoch (UTC).
  optional uint64 end_ts_ns = 11;
  // Max number of orders to return (1-1000, default 100).
  optional uint32 limit = 12 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to the authenticated account, sub-account scope, filters, time range,
  // and sort order.
  string page_token = 13 [(buf.validate.field).string.max_len = 512];
  // Include attached-risk policy details in each order (defaults to false when unset).
  optional bool include_attached_risk = 14;
  // Include attached-risk state details in each order (defaults to false when unset).
  optional bool include_attached_risk_state = 15;
  // Optional trigger identifier. When set, returns only child orders created by
  // that trigger.
  optional fixed64 trigger_id = 16 [(buf.validate.field).fixed64.gt = 0];
}

// GetOrderHistoryResponse returns historical orders and an optional next-page cursor.
message GetOrderHistoryResponse {
  // Historical orders ordered newest-first.
  repeated Order orders = 1;
  // Opaque cursor for the next page. A page may hold fewer orders than
  // requested, or none; continue while this token is non-empty. Empty when no
  // more results exist.
  string next_page_token = 2 [(buf.validate.field).string.max_len = 512];
}

// GetUserTradesRequest lists trade fills for an account.
message GetUserTradesRequest {
  // Time range must be ordered when both are set.
  option (buf.validate.message).cel = {
    id: "user_trades_bin.ordered_time_range"
    message: "start_ts_ns must be <= end_ts_ns when both are set"
    expression: "!has(this.start_ts_ns) || !has(this.end_ts_ns) || (this.start_ts_ns <= this.end_ts_ns)"
  };
  // Match cursors are scoped to one symbol because match IDs are monotonic per symbol.
  option (buf.validate.message).cel = {
    id: "user_trades_bin.after_match_requires_symbol"
    message: "symbol_id is required when after_match_id is set"
    expression: "!has(this.after_match_id) || this.symbol_id > 0"
  };
  // A generation cutoff only applies to a logical-order query.
  option (buf.validate.message).cel = {
    id: "user_trades_bin.generation_requires_lineage"
    message: "lineage_id is required with through_generation"
    expression: "!has(this.through_generation) || has(this.lineage_id)"
  };

  // Target sub-account numeric ID. When omitted, uses caller's root account.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Optional filter by symbol_id.
  uint32 symbol_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).uint32.gt = 0
  ];
  // Optional side filter.
  Side side = 3 [(buf.validate.field).enum.defined_only = true];
  // Inclusive start of the time range, in nanoseconds since epoch (UTC).
  optional uint64 start_ts_ns = 10;
  // Inclusive end of the time range, in nanoseconds since epoch (UTC).
  optional uint64 end_ts_ns = 11;
  // Max number of trades to return (1-1000, default 100).
  optional uint32 limit = 12 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to the authenticated account, sub-account scope, filters, time range,
  // and sort order.
  string page_token = 13 [(buf.validate.field).string.max_len = 512];
  // Return only durable fills whose per-symbol match ID is greater than this
  // value. Subscribe to the execution WebSocket before calling this method and
  // de-duplicate overlapping results by (symbol_id, match_id, order_id).
  optional uint64 after_match_id = 14 [(buf.validate.field).uint64.gt = 0];
  // Optional execution scope. Omitting it returns all matching account fills.
  // order_id and lineage_id are mutually exclusive.
  oneof execution_scope {
    // Exactly this physical order's executions; never includes predecessors.
    fixed64 order_id = 15 [(buf.validate.field).fixed64.gt = 0];
    // Executions across this logical order's accepted generations.
    fixed64 lineage_id = 16 [(buf.validate.field).fixed64.gt = 0];
  }
  // Inclusive generation ceiling; requires lineage_id.
  // Does not freeze an actively filling generation.
  optional uint32 through_generation = 17 [(buf.validate.field).uint32.gt = 0];
  // Include account settlement legs linked to matches on this page.
  // Legs may repeat across pages when two fills share a match; deduplicate by tx_id.
  bool include_transfers = 18;
}

// GetUserTradesResponse returns user trade fills and an optional next-page cursor.
message GetUserTradesResponse {
  // Trades ordered by timestamp, symbol, match and physical order, descending.
  // Projection is eventual: an empty page is not proof of order-state reconciliation.
  repeated UserTrade trades = 1;
  // Opaque cursor for the next page. Empty when no more results exist.
  string next_page_token = 2 [(buf.validate.field).string.max_len = 512];
  // Settlement legs for matches represented on this page, when requested.
  repeated OrderTransfer transfers = 3;
}

// GetOrderRequest retrieves one physical order and a bounded page of its lineage executions.
message GetOrderRequest {
  // Target sub-account numeric ID. When omitted, uses caller's root account.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Order lookup key. Exactly one identifier is required.
  oneof key {
    option (buf.validate.oneof).required = true;
    // Public order ID (base58-encoded fixed64 on REST).
    fixed64 order_id = 2 [(buf.validate.field).fixed64.gt = 0];
    // Client order ID. When provided, server resolves latest matching order for the account.
    string client_order_id = 3 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 36,
      (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
    ];
  }
  // Include attached-risk policy details in response.order (defaults to false when unset).
  optional bool include_attached_risk = 10;
  // Include attached-risk state details in response.order (defaults to false when unset).
  optional bool include_attached_risk_state = 11;
  // Include a page of lineage trades and their settlement transfers (default true).
  // Set false for state-only polling; limit and page_token must then be omitted.
  optional bool include_execution_history = 12;
  // Maximum executions to return (1-1000, default 100).
  optional uint32 limit = 13 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  // Execution cursor from this order's previous response. Use order_id rather
  // than a reused client_order_id to keep the requested generation stable.
  string page_token = 14 [(buf.validate.field).string.max_len = 512];
  option (buf.validate.message).cel = {
    id: "get_order.history_pagination"
    message: "execution history must be enabled for pagination"
    expression: "!has(this.include_execution_history) || this.include_execution_history || (!has(this.limit) && this.page_token == '')"
  };
}

// GetOrderResponse returns order details and a bounded execution page.
// The order shows a fill as soon as it executes; its trades are recorded
// shortly after. executions_complete says whether the trades already account
// for every execution the order shows. Transfers are eventually consistent and
// can trail the trades they settle.
message GetOrderResponse {
  // Requested order, if found.
  Order order = 1;
  // Lineage executions through the requested generation, newest first, retaining
  // original executing order IDs. Omitted when execution history is disabled.
  repeated UserTrade trades = 2;
  // Account settlement legs for matches on this page. Deduplicate by tx_id when
  // multiple execution pages contain legs of the same match.
  repeated OrderTransfer transfers = 3;
  // Cursor for the next execution page. Empty when no further rows are visible;
  // this is not a settlement or order-state reconciliation watermark.
  string next_page_token = 6 [(buf.validate.field).string.max_len = 512];
  // True when the order's trades through its generation, across every page,
  // add up exactly to its cum_qty_scaled. False while a recent execution is
  // still being recorded: trades then lists the executions recorded so far,
  // and a later read returns the rest. Always false when execution history is
  // not included.
  bool executions_complete = 7;
}

// GetBatchReplaceStatusRequest retrieves one admitted batch by server identity.
// Batch admission replay lasts 60 seconds from acceptance. If status is
// unavailable, reconcile the individual orders; absence does not prove rejection.
message GetBatchReplaceStatusRequest {
  // Target sub-account numeric ID. When omitted, uses caller's root account.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Server-issued batch identity from BatchReplaceOrders.
  fixed64 batch_request_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// BatchReplaceStatusItem is the index-stable execution status for one replacement.
message BatchReplaceStatusItem {
  // Zero-based item index from the write request.
  uint32 item_index = 1;
  // Current recoverable phase.
  BatchReplacePhase phase = 2;
  // Original order targeted by the replacement.
  fixed64 old_order_id = 3;
  // Assigned successor order ID. Zero for an amended item or rejection before assignment.
  fixed64 replacement_order_id = 4;
  // Current successor status, or the amended order's status, when available.
  OrderStatus order_status = 5;
  // Stable rejection or terminal error code. Empty when none.
  string code = 6;
  // Latest status timestamp in nanoseconds since epoch.
  uint64 updated_ts_ns = 7;
  // REPLACED admits a successor. AMENDED keeps the order under old_order_id with
  // no successor, and order_status describes it. Unspecified for rejected items.
  ModifyActionTaken action_taken = 8;
}

// GetBatchReplaceStatusResponse returns durable batch and per-item finality.
message GetBatchReplaceStatusResponse {
  // Server-issued batch identity.
  fixed64 batch_request_id = 1;
  // Aggregate admission status returned by the write receipt.
  BatchReplaceAdmissionStatus admission_status = 2;
  // Per-item statuses in request order.
  repeated BatchReplaceStatusItem items = 3;
  // Number of admitted items.
  uint32 accepted_count = 4;
  // Number of rejected items.
  uint32 rejected_count = 5;
  // Server acceptance timestamp in nanoseconds since epoch.
  uint64 accepted_ts_ns = 6;
  // Latest batch status timestamp in nanoseconds since epoch.
  uint64 updated_ts_ns = 7;
}

// =============================================================================
// Service Definition
// =============================================================================

service OrdersReadService {
  option (polyester.api.docs_group) = "trading";

  // Retrieve non-terminal orders for an account.
  // Supports optional subaccount, trigger, symbol, and side filters with cursor pagination.
  // While the current state of an order in scope is temporarily unavailable, the call
  // fails with a retryable UNAVAILABLE rather than omitting the order or returning a
  // stale state; retry the same request.
  rpc GetOpenOrders(GetOpenOrdersRequest) returns (GetOpenOrdersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
  }

  // Retrieve terminal order history for an account.
  // Supports optional subaccount, trigger, symbol, side, status, and time-range filters with cursor pagination.
  // While the current state of an order on the page is temporarily unavailable, the call
  // fails with a retryable UNAVAILABLE rather than returning a stale state; retry the
  // same request.
  rpc GetOrderHistory(GetOrderHistoryRequest) returns (GetOrderHistoryResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
  }

  // Retrieve per-user trade fills for an account.
  // Supports exact physical-order or logical-lineage scope, an inclusive generation
  // cutoff, and subaccount, symbol, side and time filters with cursor pagination.
  rpc GetUserTrades(GetUserTradesRequest) returns (GetUserTradesResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
  }

  // Retrieve order state and a bounded page of its lineage executions by order or client order ID.
  // Use GetUserTrades for paginated execution history and optional settlement legs.
  // Recent accepted orders may wait briefly for read availability; retry UNAVAILABLE with the same lookup key.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
  }

  // Retrieve durable execution status for one admitted batch replacement.
  rpc GetBatchReplaceStatus(GetBatchReplaceStatusRequest) returns (GetBatchReplaceStatusResponse) {}
}
