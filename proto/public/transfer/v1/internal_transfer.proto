syntax = "proto3";

package transfer.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "polyester/api/options.proto";
import "polyester/type/v1/u128.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/transfer/v1;transferv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Internal Transfers"
      description: "Authenticated Trading to Trading internal transfer intake."
    }
  ]
};

// CreateInternalTransferRequest creates or returns one accepted Trading
// to Trading internal transfer for the authenticated source account.
message CreateInternalTransferRequest {
  // Optional source public subaccount ID. When omitted, subaccount-scoped API
  // keys use their bound subaccount; other callers use their authenticated
  // root account.
  fixed64 subaccount_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed64.gt = 0
  ];

  oneof destination {
    option (buf.validate.oneof).required = true;

    // Destination root account public id.
    fixed64 destination_account_id = 2 [(buf.validate.field).fixed64.gt = 0];
    // Destination subaccount public id.
    fixed64 destination_subaccount_id = 3 [(buf.validate.field).fixed64.gt = 0];
    // Destination smart-account address.
    string destination_smart_account_address = 4 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 128
    ];
  }

  // Canonical public unified asset id for the asset being transferred.
  uint32 asset_id = 5 [
    (buf.validate.field).uint32.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];

  // Transfer amount in canonical 18-decimal unified asset units.
  // For example, 0.5 is encoded as 500000000000000000.
  polyester.type.v1.U128 amount_e18 = 6 [(buf.validate.field).required = true];

  // Stable client-supplied idempotency key used to collapse safe retries.
  string idempotency_key = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (google.api.field_behavior) = REQUIRED
  ];
}

// ResolvedDestination describes the normalized transfer destination selected by
// the server after public-id / smart-account resolution.
message ResolvedDestination {
  // Destination root account public id.
  string root_account_public_id = 1;
  // Destination subaccount public id when the destination targets a subaccount.
  string subaccount_public_id = 2;
  // Destination smart-account address resolved by the server.
  string smart_account_address = 3;
}

// ErrorCode identifies stable, machine-readable Internal Transfer API errors.
// Values mirror the REST problem+json code field, except for authentication
// refusals: an error that also carries an auth.v1.AuthErrorDetail, such as a
// missing fresh step-up, answers REST with that detail's auth.v1.AuthErrorCode
// name, for example AUTH_STEP_UP_REQUIRED.
enum ErrorCode {
  // No domain error code was provided.
  ERROR_CODE_UNSPECIFIED = 0;

  // The source account does not have enough available Trading balance.
  ERROR_CODE_INSUFFICIENT_FUNDS = 1;
  // Request payload or one of its fields is invalid.
  ERROR_CODE_INVALID_REQUEST = 2;
  // Caller is not authenticated.
  ERROR_CODE_UNAUTHENTICATED = 3;
  // Caller is not permitted to create the transfer.
  ERROR_CODE_PERMISSION_DENIED = 4;
  // Request exceeded the applicable admission rate limit.
  ERROR_CODE_RATE_LIMIT_EXCEEDED = 5;
  // A required dependency is temporarily unavailable.
  ERROR_CODE_SERVICE_UNAVAILABLE = 6;
  // The request failed because of an unexpected server error.
  ERROR_CODE_INTERNAL_ERROR = 7;
  // The selected subaccount identifier is invalid.
  ERROR_CODE_INVALID_SUBACCOUNT_ID = 8;
  // The selected subaccount does not exist.
  ERROR_CODE_SUBACCOUNT_NOT_FOUND = 9;
  // The source subaccount is not active.
  ERROR_CODE_SOURCE_ACCOUNT_INACTIVE = 10;
  // The requested asset is not supported for internal transfers.
  ERROR_CODE_UNSUPPORTED_ASSET = 11;
  // The transfer amount is invalid.
  ERROR_CODE_INVALID_AMOUNT = 12;
  // The destination identifier is invalid.
  ERROR_CODE_INVALID_DESTINATION = 13;
  // The destination account or smart account could not be found.
  ERROR_CODE_DESTINATION_NOT_FOUND = 14;
  // The destination subaccount is not active.
  ERROR_CODE_DESTINATION_INACTIVE = 15;
  // Source and destination resolve to the same account.
  ERROR_CODE_SAME_SOURCE_DESTINATION = 16;
  // The destination is not present on the caller's internal whitelist.
  ERROR_CODE_DESTINATION_NOT_WHITELISTED = 17;
  // A required source or destination smart-account address is unavailable.
  ERROR_CODE_SMART_ACCOUNT_UNAVAILABLE = 18;
  // Fresh step-up verification is temporarily unavailable.
  ERROR_CODE_STEP_UP_UNAVAILABLE = 19;
  // The idempotency key was reused with different request data.
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 20;
  // The funds lock conflicts with an existing or finalized reservation.
  ERROR_CODE_FUNDS_LOCK_CONFLICT = 21;
  // The account's available balance cannot be confirmed right now. Retry
  // later.
  ERROR_CODE_CAPITAL_VIEW_UNAVAILABLE = 22;
  // Funds movement for this account is temporarily unavailable. Retry later.
  ERROR_CODE_ACCOUNT_SHARD_UNAVAILABLE = 23;
  // A required account or API-key policy rejected the transfer.
  ERROR_CODE_POLICY_DENIED = 24;
  // A required precondition was not satisfied.
  ERROR_CODE_FAILED_PRECONDITION = 25;
  // The requested resource was not found.
  ERROR_CODE_NOT_FOUND = 26;
  // The request conflicts with existing state.
  ERROR_CODE_CONFLICT = 27;
  // The dust quote is older than 30 seconds, unknown, or another account's.
  ERROR_CODE_DUST_QUOTE_EXPIRED = 28;
  // The dust conversion's payout fell more than 1% below its quote.
  ERROR_CODE_DUST_PRICE_MOVED = 29;
  // A quoted balance no longer converts as dust, or the payout rounds to zero.
  ERROR_CODE_DUST_NOT_ELIGIBLE = 30;
  // The account converted dust within the last 6 hours, or a conversion is
  // still processing.
  ERROR_CODE_DUST_WINDOW_ACTIVE = 31;
  // The target asset's daily dust conversion limit is reached.
  ERROR_CODE_DUST_DAILY_LIMIT = 32;
  // Too many dust conversions are in progress. Retry shortly.
  ERROR_CODE_DUST_BUSY = 33;
  // The target asset cannot be paid now, or has no current price.
  ERROR_CODE_DUST_TARGET_UNAVAILABLE = 34;
  // A source balance moved since the quote: quote again.
  ERROR_CODE_DUST_BALANCE_CHANGED = 35;
  // The dust conversion could not complete. Nothing moved; quote again.
  ERROR_CODE_DUST_CONVERSION_FAILED = 36;
  // The batch debits more distinct source accounts than its limit of 10.
  ERROR_CODE_BATCH_TOO_MANY_SOURCES = 37;
}

// ErrorDetail is attached to ConnectRPC errors for structured error handling.
message ErrorDetail {
  // Stable error code matching the REST problem+json code field. An
  // authentication refusal answers REST with its auth.v1.AuthErrorDetail code
  // instead; see ErrorCode.
  ErrorCode code = 1;
}

// InternalTransferStatus is the public user-facing status for an internal
// transfer request.
enum InternalTransferStatus {
  // Status was not specified.
  INTERNAL_TRANSFER_STATUS_UNSPECIFIED = 0;

  // The transfer request was accepted and has a durable transfer identifier.
  INTERNAL_TRANSFER_STATUS_ACCEPTED = 1;

  // The transfer request was rejected before durable acceptance.
  INTERNAL_TRANSFER_STATUS_REJECTED = 2;

  // The transfer request failed terminally before durable acceptance.
  INTERNAL_TRANSFER_STATUS_FAILED = 3;
}

// CreateInternalTransferResponse returns the accepted request and transfer
// identifiers for later correlation.
message CreateInternalTransferResponse {
  // Stable server-owned request identifier for this intake.
  string request_id = 1;
  // Stable transfer identifier for the settled internal transfer.
  string transfer_id = 2;
  // Acceptance timestamp in nanoseconds since epoch (server time).
  uint64 accepted_at_ts_ns = 3;
  // Echoed canonical public unified asset id.
  uint32 asset_id = 4;
  // Resolved asset code for convenience.
  string asset_code = 5;
  // Resolved unified asset id used by downstream settlement.
  string u_asset_id = 6;
  // Echoed transfer amount in canonical 18-decimal unified asset units.
  polyester.type.v1.U128 amount_e18 = 7;
  // Server-resolved destination summary.
  ResolvedDestination destination = 8;
  // Public status for the transfer request.
  InternalTransferStatus status = 9;
  // Authoritative lifecycle flow identifier. Use GetFlowById to read the flow;
  // its ledger settlement step links back through milestone_tx_ref.
  string flow_id = 10;
}

// InternalTransferBatchLeg is one transfer of a batch. It takes the fields of
// CreateInternalTransferRequest except the idempotency key, which the batch
// carries for all of its legs.
message InternalTransferBatchLeg {
  // Optional source public subaccount ID. When omitted, subaccount-scoped API
  // keys use their bound subaccount; other callers use their authenticated
  // root account. Legs of one batch may debit different source accounts.
  fixed64 subaccount_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed64.gt = 0
  ];

  oneof destination {
    option (buf.validate.oneof).required = true;

    // Destination root account public id.
    fixed64 destination_account_id = 2 [(buf.validate.field).fixed64.gt = 0];
    // Destination subaccount public id.
    fixed64 destination_subaccount_id = 3 [(buf.validate.field).fixed64.gt = 0];
    // Destination smart-account address.
    string destination_smart_account_address = 4 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 128
    ];
  }

  // Canonical public unified asset id for the asset being transferred.
  uint32 asset_id = 5 [
    (buf.validate.field).uint32.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];

  // Transfer amount in canonical 18-decimal unified asset units.
  // For example, 0.5 is encoded as 500000000000000000.
  polyester.type.v1.U128 amount_e18 = 6 [(buf.validate.field).required = true];
}

// BatchCreateInternalTransfersRequest submits Trading to Trading transfers
// that move together or not at all, under one idempotency key and one MFA
// check.
message BatchCreateInternalTransfersRequest {
  // Transfers to move, in order. A batch holds at most 500 legs, debiting at
  // most 50 distinct source account and asset pairs from at most 10 distinct
  // source accounts. A source, destination and asset combination appears at
  // most once; legs may otherwise repeat an asset, a source or a destination.
  repeated InternalTransferBatchLeg legs = 1 [(buf.validate.field).repeated.min_items = 1];

  // Stable client-supplied idempotency key used to collapse safe retries of
  // the whole batch. It is scoped to the authenticated caller: the session's
  // account, or the API key. A retry must send the same legs in the same
  // order; different legs under the same key are refused.
  string idempotency_key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (google.api.field_behavior) = REQUIRED
  ];
}

// InternalTransferBatchStatus is the outcome of a batch request as a whole.
// No status claims more than is known: a batch is accepted only once every
// leg is credited, and refused only once it is certain nothing moved.
enum InternalTransferBatchStatus {
  // Status was not specified.
  BATCH_STATUS_UNSPECIFIED = 0;

  // Nothing moved, and nothing will under this idempotency key: a leg failed
  // its checks, a source could not cover its legs, or the batch could not
  // complete. Legs that caused it carry their reason; the others are
  // LEG_NOT_MOVED without one.
  BATCH_REFUSED = 2;

  // The outcome is not known yet: the batch completes without the caller,
  // ending accepted or refused. Retry with the same idempotency key to read
  // it.
  BATCH_PROCESSING = 3;

  // Every leg is credited to its destination.
  BATCH_ACCEPTED = 4;
}

// InternalTransferBatchLegStatus is the state of one leg of a batch.
enum InternalTransferBatchLegStatus {
  // Status was not specified.
  LEG_STATUS_UNSPECIFIED = 0;

  // The leg's outcome is the batch's, not known yet.
  LEG_PROCESSING = 5;

  // The leg is credited to its destination.
  LEG_CREDITED = 6;

  // The leg moved nothing: its batch was refused. error_code is set on the
  // legs that caused the refusal.
  LEG_NOT_MOVED = 7;
}

// InternalTransferBatchLegResult is the state of one leg, in request order.
message InternalTransferBatchLegResult {
  // Zero-based position of the leg in the request.
  uint32 leg_index = 1;
  // State of the leg.
  InternalTransferBatchLegStatus status = 2;
  // Stable transfer identifier of the leg, set once the batch is accepted
  // for processing.
  string transfer_id = 4;
  // Lifecycle flow of the leg, readable by its sender and its recipient
  // with GetAccountFlow. Set once the leg is credited.
  string flow_id = 5;
  // Credit timestamp in nanoseconds since epoch (server time), set once the
  // leg is credited.
  uint64 credited_at_ts_ns = 6;
  // Echoed canonical public unified asset id.
  uint32 asset_id = 7;
  // Resolved asset code, set once the leg passed its checks.
  string asset_code = 8;
  // Echoed transfer amount in canonical 18-decimal unified asset units.
  polyester.type.v1.U128 amount_e18 = 9;
  // Server-resolved destination summary, set once the leg passed its checks.
  ResolvedDestination destination = 10;
  // Why the leg caused its batch's refusal. Unset for every other leg.
  ErrorCode error_code = 11;
  // Human-readable description of error_code.
  string error_message = 12;
}

// BatchCreateInternalTransfersResponse returns the batch's outcome and the
// state of every leg.
message BatchCreateInternalTransfersResponse {
  // Stable server-owned identifier of the batch. Empty when the batch was
  // refused before it was accepted for processing.
  string request_id = 1;
  // Outcome of the batch as a whole.
  InternalTransferBatchStatus status = 2;
  // One result per requested leg, in request order.
  repeated InternalTransferBatchLegResult legs = 3;
}

// GetInternalTransferBatchRequest selects a batch by the request ID
// BatchCreateInternalTransfers returned, or by the idempotency key the caller
// sent it.
message GetInternalTransferBatchRequest {
  // Exactly one of request_id and idempotency_key selects the batch.
  option (buf.validate.message).oneof = {
    fields: [
      "request_id",
      "idempotency_key"
    ]
    required: true
  };

  // Batch request ID returned by BatchCreateInternalTransfers.
  string request_id = 1 [(buf.validate.field).string = {
    max_len: 39
    pattern: "^[1-9][0-9]*$"
  }];
  // Idempotency key the caller sent to BatchCreateInternalTransfers, scoped
  // to the authenticated caller as that request scoped it: the session's
  // account, or the API key. Reads the batch's stored outcome when its answer
  // was lost.
  string idempotency_key = 2 [(buf.validate.field).string.max_len = 128];
}

// GetInternalTransferBatchResponse returns the batch's current outcome and
// the state of every leg, as BatchCreateInternalTransfers answers them.
message GetInternalTransferBatchResponse {
  // Stable server-owned identifier of the batch.
  string request_id = 1;
  // Outcome of the batch as a whole.
  InternalTransferBatchStatus status = 2;
  // One result per leg, in request order.
  repeated InternalTransferBatchLegResult legs = 3;
}

// GetInternalTransferRequest selects an accepted transfer from the source account.
message GetInternalTransferRequest {
  // Optional source public subaccount ID. Omitted means the authenticated root
  // account. The caller must have access to the selected subaccount.
  fixed64 subaccount_id = 1;
  oneof identifier {
    option (buf.validate.oneof).required = true;
    // Exact server-owned request ID returned by CreateInternalTransfer.
    string request_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
    // Exact transfer ID returned by CreateInternalTransfer or ListTransfers.
    string transfer_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 39, pattern: "^[1-9][0-9]*$"}];
  }
}

// GetInternalTransferResponse links an accepted transfer to its lifecycle flow.
message GetInternalTransferResponse {
  // Stable server-owned intake request identifier.
  string request_id = 1;
  // Stable transfer identifier shared by its debit and credit ledger entries.
  string transfer_id = 2;
  // Authoritative lifecycle identifier for GetFlowById. The flow's ledger
  // settlement step links back through milestone_tx_ref.
  string flow_id = 3;
  // Acceptance timestamp in nanoseconds since epoch (UTC).
  uint64 accepted_at_ts_ns = 4;
}

// InternalTransferService manages authenticated Trading to Trading internal
// transfer intake.
service InternalTransferService {
  option (polyester.api.docs_group) = "account";

  // Read an accepted transfer by request ID or transfer ID, scoped to its source
  // account. JWT session authentication only; API keys are not supported.
  // Returns NotFound for unknown, pending, or inaccessible transfers. This read
  // does not submit or retry a transfer and requires no fresh MFA.
  rpc GetInternalTransfer(GetInternalTransferRequest) returns (GetInternalTransferResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (google.api.http) = {get: "/v1/trading/internal-transfers"};
    option (gnostic.openapi.v3.operation) = {
      tags: ["Internal Transfers"]
      summary: "Get Internal Transfer"
      description: "Read an accepted transfer by request ID or transfer ID for an authorized source account. JWT session authentication only."
    };
  }

  // Create or return one accepted Trading to Trading transfer.
  // Root-owner same-owner transfers and root-owner transfers to explicitly
  // whitelisted destinations accept an MFA-elevated session, one that
  // completed an MFA challenge in the last 30 minutes; delegated and other
  // interactive transfers require fresh step-up. Without them the transfer is
  // refused PERMISSION_DENIED with auth code AUTH_MFA_ELEVATION_REQUIRED or
  // AUTH_STEP_UP_REQUIRED; REST answers HTTP 403 with that auth code.
  rpc CreateInternalTransfer(CreateInternalTransferRequest) returns (CreateInternalTransferResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (polyester.api.mfa_requirement) = MFA_CONDITIONAL;
    option (google.api.http) = {
      post: "/v1/trading/internal-transfers"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Internal Transfer"
      description:
        "Create or return one authenticated Trading to "
        "Trading internal transfer. Root-owner same-owner transfers and "
        "root-owner transfers to explicitly whitelisted destinations "
        "accept an MFA-elevated session (MFA completed in the last 30 "
        "minutes); delegated and other interactive transfers "
        "require fresh step-up. Without them the transfer is refused "
        "HTTP 403 with code AUTH_MFA_ELEVATION_REQUIRED or "
        "AUTH_STEP_UP_REQUIRED."
      tags: "Internal Transfers"
    };
  }

  // Move up to 500 Trading to Trading transfers together, authorized by one
  // MFA check: every leg is credited, or none moves. Every leg passes the
  // same checks as CreateInternalTransfer first; if one fails, the batch is
  // refused, nothing moves and no step-up is used. The batch accepts an
  // MFA-elevated session, one that completed an MFA challenge in the last 30
  // minutes, when the root owner moves funds between its own accounts or to
  // explicitly whitelisted destinations; any other leg requires one fresh
  // step-up for the whole batch. Without them the batch is refused
  // PERMISSION_DENIED with auth code AUTH_MFA_ELEVATION_REQUIRED or
  // AUTH_STEP_UP_REQUIRED; REST answers HTTP 403 with that auth code. A batch
  // whose outcome is not known within the request answers BATCH_PROCESSING
  // and completes on its own; a retry with the same idempotency key returns
  // its current state.
  rpc BatchCreateInternalTransfers(BatchCreateInternalTransfersRequest) returns (BatchCreateInternalTransfersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (polyester.api.mfa_requirement) = MFA_CONDITIONAL;
    option (google.api.http) = {
      post: "/v1/trading/internal-transfers/batch"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Batch Create Internal Transfers"
      description:
        "Move up to 500 Trading to Trading transfers together, "
        "authorized by one MFA check: every leg is credited, or none "
        "moves. A batch debits at most 50 distinct source account and "
        "asset pairs from at most 10 source accounts. A batch without the "
        "MFA-elevated session or fresh step-up it needs is refused HTTP 403 "
        "with code "
        "AUTH_MFA_ELEVATION_REQUIRED or AUTH_STEP_UP_REQUIRED."
      tags: "Internal Transfers"
    };
  }

  // Read a batch's current outcome and the state of every leg, by the
  // request ID BatchCreateInternalTransfers returned: for example to follow
  // a batch that answered BATCH_PROCESSING. The caller must be allowed to
  // read the transfers of every source account of the batch; any other
  // batch is not found. An API key whose policy does not grant
  // READ_INTERNAL_TRANSFERS is refused PERMISSION_DENIED for any batch.
  //
  // By idempotency key instead, the read answers the batch the caller
  // submitted under that key as BatchCreateInternalTransfers stored its
  // outcome: accepted with its transfer IDs, still processing, or refused
  // with its reasons. It needs the read permission on every source account,
  // never the move permission, so a caller no longer allowed to move a
  // source still reads an answer it lost. The key is the caller's own, so
  // two answers differ from a read by request ID, which answers NOT_FOUND for
  // both: a batch its checks refused reads its refusal, and a caller who may
  // not read one of its sources is refused PERMISSION_DENIED, or UNAVAILABLE
  // while that permission cannot be decided yet (retry). NOT_FOUND means the
  // caller submitted no batch under that key.
  //
  // This read does not submit or retry the batch and requires no fresh MFA.
  rpc GetInternalTransferBatch(GetInternalTransferBatchRequest) returns (GetInternalTransferBatchResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/trading/internal-transfers/batch"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Internal Transfer Batch"
      description:
        "Read a batch's current outcome and the state of every leg by "
        "the request ID that Batch Create Internal Transfers returned, "
        "or by the idempotency key the caller sent it. The caller must be "
        "allowed to read the transfers of every source account of the "
        "batch."
      tags: "Internal Transfers"
    };
  }
}
