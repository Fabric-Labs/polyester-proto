syntax = "proto3";

package ledger.read.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/ledger/read/v1;ledgerrdv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Statement Exports"
      description: "Whole-period account statement, ledger and balances files produced in the background as one CSV file."
    }
  ]
};

// StatementExportType is the kind of file a statement export produces.
enum StatementExportType {
  // Never returned; refused in a request.
  STATEMENT_EXPORT_TYPE_UNSPECIFIED = 0;
  // Account statement: one row per entry, account bucket and asset, with the
  // entry's net amount, the fees paid and the balance after it.
  ACCOUNT_STATEMENT = 1;
  // Ledger: one row per ledger movement, each transfer leg on its own, with
  // its transfer reason, side, counterparty and the balance after it.
  LEDGER = 2;
  // Balances: one row per account bucket and asset, with its balance at the
  // start and at the end of the period and the period's credits and debits.
  // Its period must start inside the account history; see
  // StatementExport.history_available_from.
  BALANCES = 3;
}

// StatementExportStatus is where a statement export is.
enum StatementExportStatus {
  // Never returned.
  STATEMENT_EXPORT_STATUS_UNSPECIFIED = 0;
  // Accepted. The export waits until the account history covers its period
  // and no other export of the account is being produced.
  STATEMENT_EXPORT_STATUS_QUEUED = 1;
  // The file is being produced; movements and bytes count its progress.
  STATEMENT_EXPORT_STATUS_PROCESSING = 2;
  // The file is complete and can be downloaded until expires_at.
  STATEMENT_EXPORT_STATUS_READY = 3;
  // The file could not be produced; failure_reason says why.
  STATEMENT_EXPORT_STATUS_FAILED = 4;
  // The file was deleted at expires_at; create a new export for it.
  STATEMENT_EXPORT_STATUS_EXPIRED = 5;
  // Canceled with CancelStatementExport before it finished. It has no file
  // and no longer counts toward the root account's exports in progress.
  STATEMENT_EXPORT_STATUS_CANCELED = 6;
}

// StatementExportFailureReason is why a statement export failed.
enum StatementExportFailureReason {
  // Not failed.
  STATEMENT_EXPORT_FAILURE_REASON_UNSPECIFIED = 0;
  // The period holds more than 4,000,000 ledger movements of the account,
  // the most one export reads. Every asset's movements count, even for an
  // export limited to one asset: an entry is built from all of its ledger
  // operation's movements before the asset's rows are selected. Split the
  // period into shorter exports.
  STATEMENT_EXPORT_FAILURE_REASON_TOO_LARGE = 1;
  // The file could not be produced in time. Create a new export.
  STATEMENT_EXPORT_FAILURE_REASON_UNAVAILABLE = 2;
  // A BALANCES export's period starts before the earliest instant whose
  // balances the account history holds, which moved later after the export
  // was created. history_available_from is that instant: create a new
  // export that starts at or after it.
  STATEMENT_EXPORT_FAILURE_REASON_HISTORY_UNAVAILABLE = 3;
}

// StatementExport is a whole-period account statement, ledger or balances
// file produced in the background as one CSV file.
//
// The file is RFC 4180 CSV in UTF-8 with CRLF line endings: the header row,
// then the rows of the period up to complete_through. ACCOUNT_STATEMENT and
// LEDGER rows come oldest first, and a period without movements yields the
// header row alone. Every type reads the same ledger movements of the
// account; type sets the file's rows and columns.
//
// An ACCOUNT_STATEMENT row is the effect of one entry on one account bucket
// in one asset. An entry is one ledger operation, such as a trade with its
// fees, a deposit, a withdrawal step or an internal transfer.
//
// ACCOUNT_STATEMENT columns, in order:
// - `time`: entry time, RFC 3339 in UTC with microseconds, for example
//   `2026-11-12T19:52:07.734123Z`.
// - `entry_id`: entry identifier, an unsigned 128-bit integer as a decimal
//   string. It is the `transfer_id` of the entry's first transfer leg on the
//   account within the export's period, as LedgerReadService.ListTransfers
//   returns it, and is the same whichever asset the export is limited to. A
//   period boundary can fall between the legs of one entry: each export then
//   holds its own part of the entry, under the `transfer_id` of that part's
//   first leg, so do not join rows across periods on `entry_id` alone.
// - `type`: `trade` for a trade's settlement and its fees; otherwise the
//   entry's transfer reason, such as `deposit`, `withdraw`,
//   `internal_transfer`, `funding_to_trading` or `system_adjustment`.
// - `account`: account bucket, `funding` or `trading`.
// - `asset`: asset symbol.
// - `amount`: signed balance change of the entry in whole units of the
//   asset, excluding the fees in `fee`, for example `-5000` or `0.1`. Fees
//   the account receives are included here.
// - `fee`: fees the account paid in the asset for the entry, in whole units
//   of the asset; `0` when none.
// - `balance`: account bucket balance in the asset after the entry, in whole
//   units of the asset. For consecutive rows of the same bucket and asset,
//   each balance equals the previous balance plus `amount` minus `fee`.
// - `link_id`: correlation ID shared by related transfer legs, the trade's
//   match ID for trades; empty when unavailable.
// - `flow_id`: public lifecycle flow ID when the entry belongs to a chain
//   lifecycle flow, such as a deposit, a withdrawal or an internal transfer,
//   linked before the export was created; empty otherwise. A flow linked
//   later, which LedgerReadService.ListTransfers then shows, is not in the
//   file: a new export shows it.
//
// A LEDGER row is one ledger movement: one transfer leg on the account,
// as LedgerReadService.ListTransfers returns it. A trade's settlement is
// several rows, such as its base and quote legs and each fee.
//
// LEDGER columns, in order:
// - `time`: transfer time, RFC 3339 in UTC with microseconds.
// - `transfer_id`: transfer identifier, an unsigned 128-bit integer as a
//   decimal string, as LedgerReadService.ListTransfers returns it. With
//   `account` and `side` it identifies the row.
// - `account`: account bucket, `funding` or `trading`.
// - `asset`: asset symbol.
// - `type`: transfer reason, such as `trade_base`, `trade_quote`,
//   `maker_fee`, `taker_fee`, `rebate`, `deposit`, `withdraw`,
//   `internal_transfer` or `funding_to_trading`.
// - `side`: `debit` when the movement takes from the account bucket,
//   `credit` when it adds to it.
// - `amount`: signed balance change in whole units of the asset: negative
//   for a debit, positive for a credit.
// - `counterparty`: kind of the transfer's other side: `funding_account`,
//   `trading_account`, `external_address`, `private_counterparty`,
//   `fee_account` or `system_account`; empty when unknown.
// - `balance`: account bucket balance in the asset after the movement, in
//   whole units of the asset. For consecutive rows of the same bucket and
//   asset, each balance equals the previous balance plus `amount`.
// - `link_id`: correlation ID shared by related transfer legs, the trade's
//   match ID for trades; empty when unavailable.
// - `flow_id`: public lifecycle flow ID when the transfer belongs to a chain
//   lifecycle flow linked before the export was created; empty otherwise,
//   as for `flow_id` of an account statement.
//
// A BALANCES row is one account bucket in one asset over the period: its
// balance at start_time, the period's ledger movements on it, and its
// balance at complete_through. Rows come sorted by `account`, then `asset`.
// A bucket and asset with a zero balance at both ends and no movement has no
// row, so an account without any yields the header row alone. The period
// must start at or after the earliest instant whose balances the account
// history holds: an earlier start is refused when the export is created
// (CreateStatementExport) and fails the export if that instant moves later
// before the file is produced.
//
// BALANCES columns, in order:
// - `account`: account bucket, `funding` or `trading`.
// - `asset`: asset symbol.
// - `opening_balance`: balance of the bucket in the asset at start_time.
// - `credits`: total the period's movements added to the bucket, the sum of
//   the LEDGER file's credit rows of that bucket and asset; `0` when none.
// - `debits`: total the period's movements took from the bucket, the sum of
//   the LEDGER file's debit rows of that bucket and asset, as a positive
//   amount; `0` when none.
// - `closing_balance`: balance of the bucket in the asset at
//   complete_through. Every row reconciles: `closing_balance` equals
//   `opening_balance` plus `credits` minus `debits`.
// - `movements`: number of the period's ledger movements on the bucket in
//   the asset.
//
// Amounts are exact decimal strings with up to 18 fractional digits and no
// trailing zeros.
//
// A READY file downloads in one of two ways:
// - StatementExportService.GetStatementExportDownloadUrl returns a URL valid
//   for 60 seconds from signing that needs no credentials, so a browser can
//   save the file straight to disk.
// - An authenticated `GET /v1/statements/exports/{exportId}/file` returns the
//   file as `text/csv` and supports HTTP `Range` requests.
//
// Both save the file as `account-statement-<exportId>.csv`,
// `ledger-<exportId>.csv` or `balances-<exportId>.csv`, by type. Before the file is READY
// both answer FAILED_PRECONDITION with STATEMENT_EXPORT_NOT_READY, REST
// `409 Conflict`; a FAILED export answers STATEMENT_EXPORT_FAILED, REST `409`;
// an EXPIRED export, or a file already deleted, answers
// STATEMENT_EXPORT_EXPIRED, REST `410 Gone`, and so does a download URL
// request for a file with less than 5 seconds left; a CANCELED export
// answers STATEMENT_EXPORT_CANCELED, REST `409`. REST errors are
// `application/problem+json` whose `code` is the ErrorCode name, such as
// `STATEMENT_EXPORT_NOT_READY`: `401` without valid credentials, `403
// PERMISSION_DENIED` for an API key without READ_STATEMENTS, `404 NOT_FOUND`
// for an export the caller cannot read, and `503 UPSTREAM_ERROR`, with
// `Retry-After`, when the request can be retried.
//
// An export belongs to the root account whose session or API key created it.
// Any session or API key of that root that may read the export's account can
// read and download it, whichever of them created it. A member of a
// subaccount shared from another root sees only the exports its own root
// created, and the subaccount's owner does not see those: an export of
// another root, or of an account the caller can no longer read, answers
// NOT_FOUND, as one that does not exist.
message StatementExport {
  // Public ID of the export.
  fixed64 export_id = 1;
  // Public subaccount ID of the account the statement covers; unset for a
  // root account.
  optional fixed64 subaccount_id = 2;
  // Start of the statement period (UTC), inclusive.
  google.protobuf.Timestamp start_time = 3;
  // End of the requested statement period (UTC), exclusive.
  google.protobuf.Timestamp end_time = 4;
  // Public unified asset ID the statement is limited to; 0 for every asset.
  uint32 asset_id = 5;
  // Idempotency key of the request that created the export.
  string idempotency_key = 6;
  // Where the export is.
  StatementExportStatus status = 7;
  // End of what the file covers (UTC), exclusive: the earlier of end_time and
  // the instant the export was created. Every movement recorded before the
  // export was created and before complete_through is in the file.
  google.protobuf.Timestamp complete_through = 8;
  // Ledger movements written to the file so far; the file's total when
  // READY.
  uint64 movements = 9;
  // Bytes written to the file so far; the file's size when READY.
  uint64 bytes = 10;
  // When the export was created.
  google.protobuf.Timestamp created_at = 11;
  // When the file became READY; unset before.
  google.protobuf.Timestamp ready_at = 12;
  // When a READY file expires, 7 days after ready_at; unset before READY.
  google.protobuf.Timestamp expires_at = 13;
  // Why the export FAILED; unspecified otherwise.
  StatementExportFailureReason failure_reason = 14;
  // Kind of file the export produces, as requested.
  StatementExportType type = 15;
  // Earliest instant whose balances the account history holds, which a
  // BALANCES export's period must start at or after. Set only when
  // failure_reason is STATEMENT_EXPORT_FAILURE_REASON_HISTORY_UNAVAILABLE.
  google.protobuf.Timestamp history_available_from = 16;
}

// CreateStatementExportRequest asks for a whole-period account statement,
// ledger or balances file of one account. The period is at most 366 days long; a longer or empty
// period is INVALID_ARGUMENT.
message CreateStatementExportRequest {
  // The period must be non-empty and at most 366 days long.
  option (buf.validate.message).cel = {
    id: "create_statement_export.period_valid"
    message: "end_time must be after start_time and at most 366 days after it"
    expression: "this.end_time > this.start_time && this.end_time - this.start_time <= duration('8784h')"
  };
  // Optional public subaccount ID. When omitted, subaccount-scoped API keys
  // use their bound subaccount; other callers use their authenticated root
  // account. The statement covers that one account only.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Start of the statement period (UTC), inclusive: after
  // 1970-01-01T00:00:00Z and no later than the request.
  google.protobuf.Timestamp start_time = 2 [(buf.validate.field).required = true];
  // End of the statement period (UTC), exclusive, by
  // 2262-04-11T23:47:16Z. A period still open when the export is created
  // ends at that instant; see StatementExport.complete_through.
  google.protobuf.Timestamp end_time = 3 [(buf.validate.field).required = true];
  // Optional public unified asset ID. When unset/0, the statement covers
  // every asset; an ID that names no asset is refused.
  uint32 asset_id = 4;
  // Client-chosen key, 1 to 64 characters of letters, digits and `.`, `_`,
  // `:` or `-`, unique per root account. Repeating a request with the same
  // key returns the same export; the same key with different request fields
  // is refused.
  string idempotency_key = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
      pattern: "^[A-Za-z0-9._:-]+$"
    }
  ];
  // Kind of file to produce; required. Every type has the same period,
  // asset filter, limits and lifecycle; a BALANCES period must also start
  // inside the account history.
  StatementExportType type = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}

// CreateStatementExportResponse is the created or existing export.
message CreateStatementExportResponse {
  // The export.
  StatementExport export = 1;
}

// GetStatementExportRequest names one export.
message GetStatementExportRequest {
  // Public ID of the export.
  fixed64 export_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetStatementExportResponse is one export.
message GetStatementExportResponse {
  // The export.
  StatementExport export = 1;
}

// GetStatementExportDownloadUrlRequest names the export whose file to
// download.
message GetStatementExportDownloadUrlRequest {
  // Public ID of the export.
  fixed64 export_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// GetStatementExportDownloadUrlResponse is a short-lived link to a READY
// export's file.
message GetStatementExportDownloadUrlResponse {
  // URL of the file, valid until expires_at. It carries its own
  // authorization and needs no credentials, so a browser can open it to save
  // the file. Anyone who holds it can download the file until expires_at:
  // do not share, store or log it.
  string url = 1;
  // When the URL stops working: the exact end of its signature, 60 seconds
  // after it was signed for this request, or when the file expires if that
  // is sooner. Request a new URL after it.
  google.protobuf.Timestamp expires_at = 2;
  // Name the download saves the file as, `account-statement-<exportId>.csv`,
  // `ledger-<exportId>.csv` or `balances-<exportId>.csv`, by the export's
  // type.
  string filename = 3;
}

// CancelStatementExportRequest names the export to cancel.
message CancelStatementExportRequest {
  // Public ID of the export.
  fixed64 export_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// CancelStatementExportResponse is the canceled export.
message CancelStatementExportResponse {
  // The export, CANCELED.
  StatementExport export = 1;
}

// ListStatementExportsRequest selects one account's exports.
message ListStatementExportsRequest {
  // Optional public subaccount ID, selected as for
  // CreateStatementExportRequest.subaccount_id.
  optional fixed64 subaccount_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // Maximum exports to return; 0 means 20. At most 100.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 100];
  // Opaque keyset cursor from a previous response. The cursor is exclusive and
  // bound to the authenticated account and sub-account scope.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

// ListStatementExportsResponse is a page of exports, newest first.
message ListStatementExportsResponse {
  // Exports, newest first.
  repeated StatementExport exports = 1;
  // Opaque cursor for the next page. Empty when no more results exist.
  string next_page_token = 2 [(buf.validate.field).string.max_len = 512];
  // Exports QUEUED or PROCESSING across the whole root account, its
  // subaccounts included, whichever account the list selects: the number a
  // new CreateStatementExport counts against max_in_progress_exports.
  uint32 in_progress_exports = 3;
  // Most exports the root account may have QUEUED or PROCESSING at a time.
  // While in_progress_exports is at it, CreateStatementExport answers
  // RESOURCE_EXHAUSTED with STATEMENT_EXPORT_LIMIT_REACHED.
  uint32 max_in_progress_exports = 4;
}

// StatementExportService is the account statement API. A statement covers
// one account, optionally one asset, for a period of at most 366 days, and is
// produced in the background as one CSV file, an account statement, a ledger
// or the account's balances: create an export, poll it with
// GetStatementExport until it is READY, then download its file (see
// StatementExport). API keys need the READ_STATEMENTS policy action. A root
// account has at most 5 exports QUEUED or PROCESSING at a time, one account
// produces one export at a time, and a READY file can be downloaded for 7
// days. CancelStatementExport stops a QUEUED or PROCESSING export, which
// frees its place for the account's next export and under the root's 5.
service StatementExportService {
  option (polyester.api.docs_group) = "account";

  // Create a statement export, or return the existing one for the same
  // idempotency key.
  //
  // Errors:
  // - INVALID_ARGUMENT: the period, asset, type or idempotency key is
  //   invalid.
  // - FAILED_PRECONDITION (IDEMPOTENCY_KEY_REUSED): the key was used for a
  //   request with other fields.
  // - FAILED_PRECONDITION (STATEMENT_HISTORY_UNAVAILABLE): a BALANCES
  //   period starts before the earliest instant whose balances the account
  //   history holds. The error detail's history_available_from is that
  //   instant; REST answers `409` with it as `historyAvailableFrom`. Create
  //   the export again with a start at or after it.
  // - RESOURCE_EXHAUSTED (STATEMENT_EXPORT_LIMIT_REACHED): the root account
  //   has 5 exports QUEUED or PROCESSING.
  // - PERMISSION_DENIED, NOT_FOUND: the account cannot be read.
  // - UNAVAILABLE: retry the same request.
  rpc CreateStatementExport(CreateStatementExportRequest) returns (CreateStatementExportResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {
      post: "/v1/statements/exports"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Statement Export"
      description: "Create a whole-period account statement, ledger or balances file, produced in the background. Idempotent per idempotency key."
      tags: "Statement Exports"
    };
  }

  // Get one statement export.
  //
  // Errors:
  // - NOT_FOUND: no such export for the authenticated account.
  // - PERMISSION_DENIED: the export's account cannot be read.
  rpc GetStatementExport(GetStatementExportRequest) returns (GetStatementExportResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/statements/exports/{export_id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Statement Export"
      description: "Get a statement export's status, progress and expiry."
      tags: "Statement Exports"
    };
  }

  // Get a URL valid for 60 seconds from signing that downloads a READY
  // export's file without credentials, for a browser to save straight to
  // disk. Each call returns a new URL.
  //
  // Errors:
  // - NOT_FOUND: no such export for the authenticated account.
  // - PERMISSION_DENIED: the caller may not read statements.
  // - FAILED_PRECONDITION (STATEMENT_EXPORT_NOT_READY): the file is not ready
  //   yet; poll GetStatementExport until it is READY.
  // - FAILED_PRECONDITION (STATEMENT_EXPORT_FAILED): the export failed and has
  //   no file.
  // - FAILED_PRECONDITION (STATEMENT_EXPORT_CANCELED): the export was
  //   canceled and has no file.
  // - FAILED_PRECONDITION (STATEMENT_EXPORT_EXPIRED): the file expired, or
  //   has less than 5 seconds left; create a new export.
  // - UNAVAILABLE: retry the same request.
  rpc GetStatementExportDownloadUrl(GetStatementExportDownloadUrlRequest) returns (GetStatementExportDownloadUrlResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/statements/exports/{export_id}/download-url"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Statement Export Download URL"
      description: "Get a 60-second URL that downloads a ready statement file without credentials, for a browser to save it."
      tags: "Statement Exports"
    };
  }

  // Cancel a QUEUED or PROCESSING statement export. It ends CANCELED at
  // once: it no longer counts toward the root account's 5 exports in
  // progress, the account's next queued export can start, and any partial
  // file is deleted. Canceling a CANCELED export returns it as it is.
  //
  // Errors:
  // - NOT_FOUND: no such export for the authenticated account.
  // - PERMISSION_DENIED: the caller may not read statements.
  // - FAILED_PRECONDITION (STATEMENT_EXPORT_NOT_CANCELABLE): the export
  //   already finished, READY, FAILED or EXPIRED.
  // - UNAVAILABLE: retry the same request.
  rpc CancelStatementExport(CancelStatementExportRequest) returns (CancelStatementExportResponse) {
    option idempotency_level = IDEMPOTENT;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {
      post: "/v1/statements/exports/{export_id}/cancel"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Cancel Statement Export"
      description: "Cancel a queued or processing statement export, freeing its place under the root account's limit."
      tags: "Statement Exports"
    };
  }

  // List one account's statement exports, newest first.
  //
  // Errors:
  // - INVALID_ARGUMENT: the limit or page token is invalid.
  // - PERMISSION_DENIED, NOT_FOUND: the account cannot be read.
  rpc ListStatementExports(ListStatementExportsRequest) returns (ListStatementExportsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (google.api.http) = {get: "/v1/statements/exports"};
    option (gnostic.openapi.v3.operation) = {
      summary: "List Statement Exports"
      description: "List an account's statement exports, newest first."
      tags: "Statement Exports"
    };
  }
}
