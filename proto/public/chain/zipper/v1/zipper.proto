syntax = "proto3";

package chain.zipper.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "polyester/api/options.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/chain/zipper/v1;chainzipperv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Deposit & Withdraw"
      description:
        "Public Zipper-powered surface for deposit and withdraw chain "
        "configuration in Polyester."
    }
  ]
};

// ChainConfig describes one supported external chain for deposit and withdraw.
message ChainConfig {
  // PolyChain-registered chain id used across Zipper and lifecycle events.
  uint32 chain_id = 1;
  // Stable machine-friendly chain key (for example: "ethereum", "solana").
  string code = 2;
  // Human-friendly display name.
  string name = 3;
  // Native source-chain network identifier when useful for wallet or explorer
  // integrations. For EVM chains this is the EIP-155 chain id; non-EVM chains
  // may omit this and should be identified by `chain_id` and `code`.
  string native_chain_id = 4;
  // Native gas token symbol for this chain (for example: ETH, BTC, SOL).
  string native_currency_symbol = 5;
  // Optional block explorer base URL for links.
  string explorer_url = 6;
  // Optional icon reference for UI display.
  string icon = 7;
  // Default required source-chain confirmations when known.
  uint32 required_confirmations = 8;
  // Estimated average confirmation time in seconds when known.
  uint32 confirmation_time_seconds = 9;
  // True when source-chain addresses must preserve letter case.
  bool is_case_sensitive = 10;
  // Inclusive minimum source-chain address length for validation.
  uint32 min_address_length = 11;
  // Inclusive maximum source-chain address length for validation.
  uint32 max_address_length = 12;
}

// AssetChainVariant describes one chain route that can be used to deposit into
// or withdraw from a unified Polyester asset.
message AssetChainVariant {
  // Canonical zipped asset route id.
  uint32 zipped_asset_id = 1;
  // Chain that this asset belongs to.
  uint32 chain_id = 2;
  // True when the asset is the native gas/token of the source chain.
  bool is_native_asset = 3;
  // Latest known network fee for this chain asset variant as a human-readable
  // string in zToken units, with insignificant trailing zeroes trimmed.
  string network_fee = 4;
  // Polyester zToken contract address for this chain asset variant.
  string ztoken_address = 6;
  // Source-chain token contract, mint, or native sentinel address.
  string source_address = 7;
  // Source-chain token decimals.
  uint32 source_decimals = 8;
  // zToken decimals on Polyester chain.
  uint32 ztoken_decimals = 9;
  // Minimum deposit amount for this variant as a human-readable string in zToken units.
  string deposit_min_amount = 10;
  // Minimum withdraw amount for this variant as a human-readable string in zToken units.
  string withdraw_min_amount = 11;
  // Latest zToken supply for this chain asset variant, scaled by the parent
  // unified asset's quantity_scale. Decode: supply_q / 10^quantity_scale.
  uint64 supply_q = 12;
}

// ZippedAssetSupplyUpdate carries the latest route liquidity for one zipped
// asset. It is published on the Protobuf WebSocket channel.
message ZippedAssetSupplyUpdate {
  // Canonical zipped asset route ID.
  uint32 zipped_asset_id = 1;
  // Latest zToken supply for this route, scaled by the parent asset's
  // quantity_scale. Decode: supply_q / 10^quantity_scale.
  uint64 supply_q = 2;
}

// ZippedAssetSupplyBatch batches public zipped-asset supply updates.
message ZippedAssetSupplyBatch {
  // Supply updates included in this batch.
  repeated ZippedAssetSupplyUpdate updates = 1;
}

// AssetConfig describes one unified Polyester asset and all compatible
// chain-specific variants supported by Zipper.
message AssetConfig {
  // Unified Polyester asset code used inside Funding/Trading (for example: "USDT").
  string asset = 1;
  // Public unified asset id.
  uint32 ledger_id = 2;
  // Human-friendly unified asset display name.
  string name = 3;
  // Optional icon reference for the unified asset.
  string icon = 4;
  // Integer scale for unified-asset quantities (0..18). A scale of 8 means one
  // whole asset is represented as 100000000 in supply_q and other
  // quantity_scale-based fields.
  uint32 quantity_scale = 5;
  // UI display precision for the unified asset.
  uint32 quantity_display_decimals = 6;
  // Supported chain-specific deposit/withdraw variants for this unified asset.
  repeated AssetChainVariant variants = 7;
  // On-chain uAsset id for the unified asset.
  string u_asset_id = 8;
}

// ChainContractConfig describes an active Polyester-chain contract address
// clients may need for supported deposit and withdraw flows.
message ChainContractConfig {
  // Stable contract key for client lookups.
  string name = 1;
  // EVM contract address on Polyester chain.
  string address = 2;
  // Optional product-facing contract category, when known.
  string type = 3;
  // Optional human-readable description.
  string description = 4;
  // Active contract version for this name. Versions increase when the address
  // changes, allowing clients to identify the exact contract revision in use.
  uint32 version = 5;
}

message GetDepositWithdrawConfigRequest {}

message GetDepositWithdrawConfigResponse {
  // Supported chains ordered by chain code.
  repeated ChainConfig chains = 1;
  // Supported unified assets ordered by asset code, each with compatible chain routes.
  repeated AssetConfig assets = 2;
  // Snapshot generation timestamp (seconds since epoch, UTC).
  uint64 ts_sec = 3;
  // Polyester chain id used by all zToken addresses in `assets.variants`.
  uint32 polyester_chain_id = 4;
  // Active Polyester-chain contracts ordered by contract name.
  repeated ChainContractConfig contracts = 5;
}

// ZipperService exposes deposit and withdraw chain configuration.
service ZipperService {
  // Retrieve the supported chains and unified assets used by deposit/withdraw UI flows.
  rpc GetDepositWithdrawConfig(GetDepositWithdrawConfigRequest) returns (GetDepositWithdrawConfigResponse) {
    option (polyester.api.public) = true;
    option (google.api.http) = {get: "/v1/chain/deposit-withdraw/config"};
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Deposit & Withdraw Config"
      description:
        "Retrieve the supported chains and unified assets for "
        "Zipper-powered deposit and withdraw flows."
      tags: "Deposit & Withdraw"
    };
  }
}
