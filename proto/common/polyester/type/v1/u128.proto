syntax = "proto3";

package polyester.type.v1;

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/polyester/type/v1;polyestertypev1";

// U128 represents an unsigned 128-bit integer as two fixed64 parts.
message U128 {
  // Most significant 64 bits.
  fixed64 hi = 1;

  // Least significant 64 bits.
  fixed64 lo = 2;
}
