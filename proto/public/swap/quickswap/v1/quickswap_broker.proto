syntax = "proto3";

package swap.quickswap.v1;

import "buf/validate/validate.proto";
import "chain/withdraw/v1/auto_withdraw.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";
import "swap/quickswap/v1/quickswap.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/swap/quickswap/v1;quickswapv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "QuickSwap Broker"
      description: "Self-service administration of a QuickSwap broker org: affiliate vaults, API keys and members, reporting on its QuickSwaps and fees, and its vaults' payouts."
    }
  ]
};

// BrokerRole is a person's role in a broker org. A broker has exactly one
// Owner.
enum BrokerRole {
  // No role; rejected in requests and never returned.
  BROKER_ROLE_UNSPECIFIED = 0;
  // Everything, including withdrawals, payout settings and transferring
  // ownership. Exactly one per broker.
  OWNER = 1;
  // Everything except withdrawals, payout settings, changing the Owner and
  // transferring ownership: only the Owner and Finance withdraw or change
  // payout settings.
  ADMIN = 2;
  // Internal transfers, withdrawals and payout settings.
  FINANCE = 3;
  // Creates affiliate vaults and views balances.
  AFFILIATE_MANAGER = 4;
  // Read-only.
  VIEWER = 5;
}

// Broker is a broker org.
message Broker {
  // Broker name: the immutable identifier used in every request.
  string name = 1;
  // Display name.
  string display_name = 2;
  // Whether the broker may quote and create QuickSwaps. A disabled broker
  // keeps reads, vaults, keys and members.
  bool enabled = 3;
  // Public account ID of the broker's root account.
  fixed64 root_account_id = 4;
  // Public sub-account ID of the default vault, credited with broker fees
  // that name no affiliate.
  fixed64 default_vault_account_id = 5;
  // Affiliate vaults the broker may create, active and disabled together.
  // At the limit, CreateAffiliateVault fails with RESOURCE_EXHAUSTED /
  // BROKER_LIMIT.
  uint32 max_affiliate_vaults = 6;
  // The caller's role; BROKER_ROLE_UNSPECIFIED for a broker API key.
  BrokerRole role = 7;
  // Quote requests per second allowed for each API key of the broker, which
  // is also the burst. Over the rate, QuoteQuickSwap fails with
  // RESOURCE_EXHAUSTED / BROKER_LIMIT and a Retry-After header.
  uint32 quote_rps = 8;
  // Create requests per second allowed for each API key of the broker, which
  // is also the burst. Over the rate, CreateQuickSwap fails with
  // RESOURCE_EXHAUSTED / BROKER_LIMIT and a Retry-After header.
  uint32 create_rps = 9;
  // Read requests per second allowed for each API key of the broker, which is
  // also the burst. GetQuickSwap and every QuickSwapBrokerService call by an
  // API key count as reads. Over the rate, the call fails with
  // RESOURCE_EXHAUSTED / BROKER_LIMIT and a Retry-After header.
  uint32 read_rps = 10;
  // Unfunded Quick Swaps the broker may hold at once: Quick Swaps whose
  // deposit address is being issued or is still awaiting a deposit within
  // its funding window. At the limit, CreateQuickSwap fails with
  // RESOURCE_EXHAUSTED / BROKER_LIMIT; a deposit or the end of a funding
  // window frees a slot.
  uint32 max_unfunded_addresses = 11;
  // Quick Swaps the broker may create in any rolling hour. At the limit,
  // CreateQuickSwap fails with RESOURCE_EXHAUSTED / BROKER_LIMIT until the
  // oldest create of the hour is more than an hour old.
  uint32 max_creates_per_hour = 12;
}

// BrokerUsage is the broker's current use of its limits, counted exactly as
// the limits are enforced: the next create is refused while a count is at or
// above its limit on Broker. A count can be above its limit after the limit
// is lowered. The counts are read when the request is served and can change
// right after with concurrent creates, deposits and expiring funding windows.
message BrokerUsage {
  // Unfunded Quick Swaps held now, counted against
  // Broker.max_unfunded_addresses.
  uint32 unfunded_addresses = 1;
  // Quick Swaps created in the last hour, counted against
  // Broker.max_creates_per_hour.
  uint32 creates_last_hour = 2;
  // Affiliate vaults created, active and disabled together, counted against
  // Broker.max_affiliate_vaults.
  uint32 affiliate_vaults = 3;
}

// VaultStatus says whether an affiliate vault can be named by new QuickSwaps.
enum VaultStatus {
  // No status; rejected in requests and never returned.
  VAULT_STATUS_UNSPECIFIED = 0;
  // New QuickSwaps can credit the vault.
  VAULT_ACTIVE = 1;
  // New QuickSwaps naming the vault are refused with AFFILIATE_VAULT_UNKNOWN.
  // QuickSwaps already created still credit it.
  VAULT_DISABLED = 2;
}

// AffiliateVault is a sub-account of the broker root, owned by the broker,
// credited with the fees of one affiliate. Affiliate vaults are never
// deleted.
message AffiliateVault {
  // Public sub-account ID of the vault; name it in AffiliateShare.account_id.
  fixed64 account_id = 1;
  // Broker-chosen label, unique per broker.
  string label = 2;
  // Whether new QuickSwaps can name the vault.
  VaultStatus status = 3;
  // When the vault was created.
  google.protobuf.Timestamp created_at = 4;
  // When the vault was last changed.
  google.protobuf.Timestamp updated_at = 5;
}

// BrokerKey is a broker API key, without its secret.
message BrokerKey {
  // Public key ID: the part of the token between "qsk_" and the second "_".
  string key_id = 1;
  // Label given at creation; empty for a key created by rotation.
  string label = 2;
  // When the key was created.
  google.protobuf.Timestamp created_at = 3;
  // Public account ID of the member who created the key; 0 for a key that a
  // key created by rotating itself.
  fixed64 created_by_account_id = 4;
  // Key this key replaced by rotation; empty otherwise.
  string rotated_from = 5;
  // End of the key's rotation overlap; the key stops working then. Unset
  // while the key works until revoked.
  google.protobuf.Timestamp expires_at = 6;
  // When the key was revoked; unset while not revoked.
  google.protobuf.Timestamp revoked_at = 7;
  // Whether the key works now: neither revoked nor past expires_at.
  bool active = 8;
}

// Member is a person with a role in the broker org.
message Member {
  // Public account ID of the person's own account.
  fixed64 account_id = 1;
  // Role.
  BrokerRole role = 2;
  // When the person got this role.
  google.protobuf.Timestamp since = 3;
}

// Invite is a pending invitation to join a broker org.
message Invite {
  // Public invite ID.
  fixed64 invite_id = 1;
  // Broker name.
  string broker = 2;
  // Broker display name.
  string broker_display_name = 3;
  // Public account ID of the invited person.
  fixed64 account_id = 4;
  // Role the person gets on accepting.
  BrokerRole role = 5;
  // Public account ID of the member who invited them.
  fixed64 invited_by_account_id = 6;
  // When the invite was sent.
  google.protobuf.Timestamp created_at = 7;
}

// Membership is the caller's role in one broker org.
message Membership {
  // Broker name.
  string broker = 1;
  // Broker display name.
  string broker_display_name = 2;
  // The caller's role.
  BrokerRole role = 3;
}

// GetBrokerRequest names a broker.
message GetBrokerRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
}

// GetBrokerResponse returns the broker, with its limits, and its current
// usage of them.
message GetBrokerResponse {
  // The broker, with its limits.
  Broker broker = 1;
  // Current usage of the broker's limits.
  BrokerUsage usage = 2;
}

// ListMyBrokersRequest lists the caller's broker memberships and invites.
message ListMyBrokersRequest {}

// ListMyBrokersResponse lists every membership and pending invite of the
// caller, by broker name. Both lists are naturally bounded.
message ListMyBrokersResponse {
  // Brokers the caller is a member of.
  repeated Membership memberships = 1;
  // Pending invites addressed to the caller.
  repeated Invite invites = 2;
}

// RespondToInviteRequest accepts or declines a pending invite addressed to
// the caller.
message RespondToInviteRequest {
  // Public invite ID.
  fixed64 invite_id = 1 [(buf.validate.field).fixed64.gt = 0];
  // True to accept, false to decline.
  bool accept = 2;
}

// RespondToInviteResponse returns the caller's new membership.
message RespondToInviteResponse {
  // The membership; unset when the invite was declined.
  Membership membership = 1;
}

// ListMembersRequest lists a broker's members.
message ListMembersRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
}

// ListMembersResponse lists every member and pending invite of the broker,
// Owner first, then by account ID. Both lists are naturally bounded.
message ListMembersResponse {
  // Members.
  repeated Member members = 1;
  // Pending invites, newest first.
  repeated Invite invites = 2;
}

// InviteMemberRequest invites a person to the broker.
message InviteMemberRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public account ID of the person's own account.
  fixed64 account_id = 2 [(buf.validate.field).fixed64.gt = 0];
  // Role the person gets on accepting; never OWNER.
  BrokerRole role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1
    ]
  }];
}

// InviteMemberResponse returns the pending invite.
message InviteMemberResponse {
  // The invite.
  Invite invite = 1;
}

// SetMemberRoleRequest changes a member's role.
message SetMemberRoleRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public account ID of the member.
  fixed64 account_id = 2 [(buf.validate.field).fixed64.gt = 0];
  // New role; never OWNER.
  BrokerRole role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1
    ]
  }];
}

// SetMemberRoleResponse is empty.
message SetMemberRoleResponse {}

// RemoveMemberRequest removes a member, or cancels the person's pending
// invite.
message RemoveMemberRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public account ID of the member or invited person.
  fixed64 account_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// RemoveMemberResponse is empty.
message RemoveMemberResponse {}

// TransferOwnershipRequest makes another member the Owner.
message TransferOwnershipRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public account ID of the member who becomes the Owner.
  fixed64 account_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// TransferOwnershipResponse is empty.
message TransferOwnershipResponse {}

// ListKeysRequest lists a broker's API keys, working and past.
message ListKeysRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Maximum number of keys to return; 0 means 100, at most 200.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 200];
  // Opaque keyset cursor from a previous next_page_token, exclusive, bound to
  // the broker and ordered newest first by creation time, then key ID. Empty
  // for the first page.
  string page_token = 3 [(buf.validate.field).string.max_len = 128];
}

// ListKeysResponse lists the broker's API keys newest first: by creation
// time, then key ID, both descending. A broker has at most two working keys;
// revoked and expired keys stay listed.
message ListKeysResponse {
  // Keys.
  repeated BrokerKey keys = 1;
  // Cursor of the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// CreateKeyRequest creates a broker API key.
message CreateKeyRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Label, 1 to 64 characters without leading or trailing whitespace.
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// CreateKeyResponse returns the key and its token. The token is shown only
// here and cannot be recovered.
message CreateKeyResponse {
  // The key.
  BrokerKey key = 1;
  // Bearer token qsk_<key id>_<secret>. Store it as a server secret.
  string token = 2;
}

// RotateKeyRequest replaces a key by a new one. The old key keeps working
// for the overlap, then stops.
message RotateKeyRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Key to rotate. A broker API key may rotate only itself.
  string key_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{32}$"];
  // How long the old key keeps working, in seconds, from 0 to 604800 (7
  // days). Default 86400 (24 hours). 0 revokes it immediately.
  optional uint32 overlap_seconds = 3 [(buf.validate.field).uint32.lte = 604800];
}

// RotateKeyResponse returns the new key, its token and the old key. The token
// is shown only here and cannot be recovered.
message RotateKeyResponse {
  // The new key.
  BrokerKey key = 1;
  // Bearer token qsk_<key id>_<secret> of the new key.
  string token = 2;
  // The old key, with the end of its overlap.
  BrokerKey previous_key = 3;
}

// RevokeKeyRequest revokes a key immediately.
message RevokeKeyRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Key to revoke.
  string key_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{32}$"];
}

// RevokeKeyResponse returns the revoked key.
message RevokeKeyResponse {
  // The key.
  BrokerKey key = 1;
}

// CreateAffiliateVaultRequest creates, or returns, the affiliate vault with a
// label.
message CreateAffiliateVaultRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Label, 1 to 64 characters without leading or trailing whitespace, unique
  // per broker. The same label always returns the same vault.
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// CreateAffiliateVaultResponse returns the vault.
message CreateAffiliateVaultResponse {
  // The vault.
  AffiliateVault vault = 1;
  // Whether this request created it.
  bool created = 2;
}

// ListVaultsRequest lists a broker's affiliate vaults.
message ListVaultsRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Maximum number of vaults to return; 0 means 100, at most 200.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 200];
  // Opaque keyset cursor from a previous next_page_token, exclusive, bound to
  // the broker and the list order. Empty for the first page.
  string page_token = 3 [(buf.validate.field).string.max_len = 64];
}

// ListVaultsResponse lists vaults in a stable server-defined order, the
// same on every page; it does not follow the public account_id values.
message ListVaultsResponse {
  // The vaults.
  repeated AffiliateVault vaults = 1;
  // Cursor of the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// GetVaultRequest names one affiliate vault.
message GetVaultRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public sub-account ID of the vault.
  fixed64 account_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// GetVaultResponse returns the vault.
message GetVaultResponse {
  // The vault.
  AffiliateVault vault = 1;
}

// SetVaultStatusRequest enables or disables an affiliate vault for new
// QuickSwaps.
message SetVaultStatusRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public sub-account ID of the vault.
  fixed64 account_id = 2 [(buf.validate.field).fixed64.gt = 0];
  // New status.
  VaultStatus status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// SetVaultStatusResponse returns the vault.
message SetVaultStatusResponse {
  // The vault.
  AffiliateVault vault = 1;
}

// QuickSwapSummary is one QuickSwap in a list: its state and fees. Get it
// with QuickSwapService.GetQuickSwap for its quote, deposit and withdrawals.
message QuickSwapSummary {
  // Public QuickSwap identifier.
  fixed64 swap_id = 1;
  // The broker's idempotency key that created it.
  string idempotency_key = 2;
  // Current status.
  QuickSwapStatus status = 3;
  // Why the status is notable; REASON_UNSPECIFIED otherwise.
  QuickSwapReason reason = 4;
  // True when status is terminal.
  bool is_terminal = 5;
  // Accepted economic terms.
  QuickSwapTerms terms = 6;
  // Broker and affiliate fees as requested, fixed at creation; unset when
  // the request set none.
  RequestedFees fees = 7;
  // Broker and affiliate fees charged so far, as settled, as on QuickSwap.
  repeated ChargedFee charged_fees = 8;
  // When the QuickSwap was created.
  google.protobuf.Timestamp created_at = 9;
  // When the QuickSwap last changed.
  google.protobuf.Timestamp updated_at = 10;
}

// QuickSwapBrokerServiceGetQuickSwapRequest reads one QuickSwap belonging to this broker.
message QuickSwapBrokerServiceGetQuickSwapRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public QuickSwap ID. Another broker's swap is indistinguishable from an
  // unknown ID.
  fixed64 swap_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// QuickSwapBrokerServiceGetQuickSwapResponse carries the broker's full swap detail.
message QuickSwapBrokerServiceGetQuickSwapResponse {
  // The broker-owned QuickSwap, including its quote, addresses, progress and fees.
  QuickSwap quick_swap = 1;
}

// ListQuickSwapsRequest lists the broker's QuickSwaps, newest first, with
// optional filters. Every filter narrows the list.
message ListQuickSwapsRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Only QuickSwaps whose fees credit this vault: an affiliate vault they
  // name, or the default vault when they set a broker fee. A referral
  // partner's commission credits no vault of the broker. Zero for every
  // QuickSwap.
  fixed64 vault_account_id = 2;
  // Only QuickSwaps in one of these statuses, at most 16; empty for every
  // status.
  repeated QuickSwapStatus statuses = 3 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Only QuickSwaps created at or after start_time; unset for no lower
  // bound.
  google.protobuf.Timestamp start_time = 4;
  // Only QuickSwaps created before end_time (exclusive); unset for no upper
  // bound.
  google.protobuf.Timestamp end_time = 5;
  // Maximum number of QuickSwaps to return; 0 means 100, at most 200.
  uint32 limit = 6 [(buf.validate.field).uint32.lte = 200];
  // Opaque keyset cursor from a previous next_page_token, exclusive, bound
  // to the broker, the filters and the list order. Reuse it with the same
  // filters. Empty for the first page.
  string page_token = 7 [(buf.validate.field).string.max_len = 256];
}

// ListQuickSwapsResponse lists QuickSwaps newest first by creation time.
// QuickSwaps created at the same time follow a stable server-defined order,
// the same on every page; it does not follow swap_id. A QuickSwap created
// after the first page was read is not listed by later pages; every earlier
// one is listed exactly once.
message ListQuickSwapsResponse {
  // The QuickSwaps.
  repeated QuickSwapSummary quick_swaps = 1;
  // Cursor of the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// FeeTotalsGrouping is how GetFeeTotals groups the fees.
enum FeeTotalsGrouping {
  // No grouping; rejected.
  GROUPING_UNSPECIFIED = 0;
  // By credited vault.
  BY_VAULT = 1;
  // By UTC day the fee was charged.
  BY_DAY = 2;
  // By UTC month the fee was charged.
  BY_MONTH = 3;
}

// GetFeeTotalsRequest totals the broker and affiliate fees charged to the
// broker's QuickSwaps in a time window: the fees credited to the broker's
// vaults, never a referral partner's commission.
message GetFeeTotalsRequest {
  option (buf.validate.message).cel = {
    id: "get_fee_totals_request.window"
    message: "end_time must be after start_time and at most 366 days later"
    expression: "this.end_time > this.start_time && this.end_time - this.start_time <= duration('8784h')"
  };

  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // How to group the totals.
  FeeTotalsGrouping group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Start of the window, inclusive: fees charged at or after it.
  google.protobuf.Timestamp start_time = 3 [(buf.validate.field).required = true];
  // End of the window, exclusive, at most 366 days after start_time.
  google.protobuf.Timestamp end_time = 4 [(buf.validate.field).required = true];
  // Only fees credited to this vault; zero for every vault.
  fixed64 vault_account_id = 5;
}

// FeeTotal is the fees charged in one group and asset.
message FeeTotal {
  // BY_VAULT: public sub-account ID of the credited vault; zero otherwise.
  fixed64 vault_account_id = 1;
  // BY_DAY or BY_MONTH: start of the UTC day or month; unset for BY_VAULT.
  google.protobuf.Timestamp period_start = 2;
  // Asset credited, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 3;
  // Total credited, in base units of 18 decimals.
  TokenAmount amount = 4;
  // QuickSwaps that were charged a fee in this group and asset.
  uint64 swap_count = 5;
}

// GetFeeTotalsResponse lists every group and asset with a fee in the window,
// complete (the window is bounded): by vault, then asset, for BY_VAULT; by
// period, then asset, for BY_DAY and BY_MONTH, oldest first.
message GetFeeTotalsResponse {
  // The totals.
  repeated FeeTotal totals = 1;
}

// StatsPeriod is the UTC calendar period GetBrokerStats groups by.
enum StatsPeriod {
  // No period; rejected.
  PERIOD_UNSPECIFIED = 0;
  // A UTC day.
  DAY = 1;
  // A UTC month.
  MONTH = 2;
}

// GetBrokerStatsRequest reads the broker's QuickSwap activity in a time
// window, per UTC day or month.
message GetBrokerStatsRequest {
  option (buf.validate.message).cel = {
    id: "get_broker_stats_request.window"
    message: "end_time must be after start_time and at most 366 days later"
    expression: "this.end_time > this.start_time && this.end_time - this.start_time <= duration('8784h')"
  };

  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // The period to group by.
  StatsPeriod group_by = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Start of the window, inclusive. A window that starts or ends inside a
  // period counts only the part of that period inside the window.
  google.protobuf.Timestamp start_time = 3 [(buf.validate.field).required = true];
  // End of the window, exclusive, at most 366 days after start_time.
  google.protobuf.Timestamp end_time = 4 [(buf.validate.field).required = true];
}

// StatusCount is how many QuickSwaps are in one status.
message StatusCount {
  // The status.
  QuickSwapStatus status = 1;
  // QuickSwaps in it.
  uint64 count = 2;
}

// AssetVolume is a total amount in one asset.
message AssetVolume {
  // Asset, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 1;
  // Total, in base units of 18 decimals.
  TokenAmount amount = 2;
}

// FeeSplit is the fees charged in one asset, by who they credit. Every
// amount is set, zero included.
message FeeSplit {
  // Asset charged, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 1;
  // Service fees, credited to Polyester, in base units of 18 decimals.
  TokenAmount service_fee = 2;
  // Broker fees, credited to the broker's default vault, in base units of
  // 18 decimals.
  TokenAmount broker_fee = 3;
  // Affiliate fees, credited to the broker's affiliate vaults, in base
  // units of 18 decimals.
  TokenAmount affiliate_fee = 4;
  // Referral commissions, credited to referral partners rather than to a
  // vault of the broker, in base units of 18 decimals.
  TokenAmount referral_fee = 5;
}

// BrokerStatsPeriod is a broker's QuickSwap activity in one UTC day or
// month. A QuickSwap counts in the period it was created in, with its
// current status, its credited deposit and its destination payout, so a
// period's numbers keep moving until its QuickSwaps end. A fee counts in the
// period it was charged in, as in GetFeeTotals, which can be later than the
// period its QuickSwap was created in.
message BrokerStatsPeriod {
  // Start of the UTC day or month.
  google.protobuf.Timestamp period_start = 1;
  // QuickSwaps created in the period, inside the window.
  uint64 created_count = 2;
  // Those QuickSwaps by current status, in QuickSwapStatus number order;
  // statuses with none are omitted. The counts total created_count.
  repeated StatusCount statuses = 3;
  // Deposits credited to those QuickSwaps and taken in for execution, per
  // asset, in asset_id order: including a deposit later found ineligible
  // and returned, excluding a deposit held for review before credit.
  repeated AssetVolume deposited = 4;
  // Paid to the destination of those QuickSwaps whose DESTINATION
  // withdrawal is FINALIZED, per asset, in asset_id order: after service,
  // broker and affiliate fees, before the destination network fee.
  repeated AssetVolume delivered = 5;
  // Fees charged to the broker's QuickSwaps in the period, per asset, in
  // asset_id order. broker_fee plus affiliate_fee equals the GetFeeTotals
  // total of the same window, period and asset.
  repeated FeeSplit fees = 6;
}

// GetBrokerStatsResponse lists every period of the window with a QuickSwap
// created or a fee charged, oldest first, complete (the window is bounded).
// Periods with neither are omitted.
message GetBrokerStatsResponse {
  // The periods.
  repeated BrokerStatsPeriod periods = 1;
}

// ListVaultBalancesRequest selects a broker's default and affiliate vaults.
message ListVaultBalancesRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public vault subaccount ID. Omit to include every vault, including disabled
  // affiliates. A root account or another broker's vault is NOT_FOUND.
  fixed64 vault_account_id = 2;
  // Maximum vaults, default 20, max 200.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 200];
  // Opaque exclusive keyset cursor, bound to the broker and vault filter.
  // Reuse with the same broker and vault_account_id; limit may change.
  string page_token = 4 [(buf.validate.field).string.max_len = 128];
}

// VaultAssetBalance is the current posted balance in one asset.
message VaultAssetBalance {
  // Unified asset ID, including assets no longer enabled for new swaps.
  uint32 asset_id = 1;
  // Settled balance of the vault's Funding and Trading accounts, at 18 decimals.
  // Pending credits are excluded. This is not a withdrawability guarantee.
  TokenAmount amount = 2;
  // Funds committed to pending outgoing transfers, at 18 decimals. amount
  // still counts these funds and has NOT been reduced by pending_outgoing.
  // amount minus pending_outgoing is the balance not yet committed to an
  // outgoing transfer. This excludes order holds and is not a withdrawability guarantee.
  TokenAmount pending_outgoing = 3;
}

// VaultBalance is one vault's current balance observation.
message VaultBalance {
  // Public vault subaccount ID.
  fixed64 vault_account_id = 1;
  // Asset balances in ascending asset_id order. Empty for an unfunded vault.
  repeated VaultAssetBalance assets = 2;
  // UTC time this vault's balance read completed. Vaults are read separately;
  // this does not describe an atomic snapshot across vaults or pages.
  google.protobuf.Timestamp as_of = 3;
}

// ListVaultBalancesResponse lists vaults in ascending account creation-ID
// order, independent of their encoded public IDs. A failed balance read fails
// the entire page; it is never represented as a zero balance.
message ListVaultBalancesResponse {
  // Default and affiliate vault balances, at most limit vaults.
  repeated VaultBalance vaults = 1;
  // Opaque exclusive keyset cursor. Empty when no more results exist.
  string next_page_token = 2;
}

// PayoutStatus is what one payout run of a broker vault came to, from the
// run and the outcome of each of its assets.
enum PayoutStatus {
  // Never returned; rejected in filters.
  PAYOUT_STATUS_UNSPECIFIED = 0;
  // The run paid: every asset with a payable amount was withdrawn and its
  // withdrawal completed on its destination network.
  PAYOUT_PAID = 1;
  // Some assets were paid and at least one failed; reason is the first
  // failed asset's, and each step shows its own outcome.
  PAYOUT_PARTIALLY_PAID = 2;
  // The run is under way; stage says where.
  PAYOUT_IN_PROGRESS = 3;
  // Nothing was paid, and the balance stays in the vault for the next run.
  // reason is nothing_to_pay (no asset reached its minimum), below_minimum
  // (an amount was below the least a withdrawal on its network pays),
  // price_unavailable (the rule has a USD minimum and no current price
  // valued an asset) or destination_cooling_down (the destination was added
  // to the vault's external withdraw whitelist less than 24 hours ago). Each
  // step carries the balance evaluated, its value and the minimum it was
  // held to.
  PAYOUT_ROLLED_OVER = 4;
  // Nothing was paid because the rule stopped paying, and the balance stays
  // in the vault. reason is rule_superseded (the rule was paused, changed or
  // replaced before the run paid), or destination_not_whitelisted,
  // destination_invalid or authority_revoked, with which the rule paused
  // itself (see VaultPayoutRule.pause); an Owner or Finance member resumes
  // it.
  PAYOUT_HELD = 5;
  // Nothing was paid, and at least one asset's payout failed; reason is the
  // first failure's: withdrawal_refused (refused before any funds left the
  // vault), gateway_capacity_insufficient (the funds stay for a later run),
  // withdrawal_released (released before it was sent; nothing left the
  // vault) or withdrawal_failed (the withdrawal ended without paying, before
  // or after it reached the destination network). Each step's close
  // (PayoutStep.close, as ListVaultLedger shows it) says where the funds of
  // a withdrawal that left the vault went; a withdrawal_failed step whose
  // close was not recorded reads CLOSE_UNKNOWN, never a guess. The step's
  // tx_hash, when set, is its destination-network transaction.
  PAYOUT_FAILED = 6;
}

// PayoutStage is where an in-progress payout run stands.
enum PayoutStage {
  // Not in progress.
  PAYOUT_STAGE_UNSPECIFIED = 0;
  // Reading the vault's balances to size the payouts.
  STAGE_PLANNING = 1;
  // A payout is waiting to be requested or being requested.
  STAGE_REQUESTING = 2;
  // Every payout due was accepted; no destination-network transaction is
  // known yet.
  STAGE_PROCESSING = 3;
  // A destination-network transaction is known (PayoutStep.tx_hash); the run
  // waits for its withdrawals to complete.
  STAGE_BROADCAST = 4;
}

// PayoutStepState is where one asset's payout in a run stands.
enum PayoutStepState {
  // Never returned.
  PAYOUT_STEP_STATE_UNSPECIFIED = 0;
  // Planned; not yet requested.
  PAYOUT_STEP_PENDING = 1;
  // Being requested.
  PAYOUT_STEP_REQUESTING = 2;
  // The withdrawal was accepted and waits to complete on its destination
  // network.
  PAYOUT_STEP_SUBMITTED = 3;
  // The withdrawal completed on its destination network.
  PAYOUT_STEP_COMPLETED = 4;
  // The payout failed; reason says why (see PAYOUT_FAILED).
  PAYOUT_STEP_FAILED = 5;
  // Nothing was paid for this asset in this run; reason says why, and the
  // balance stays in the vault.
  PAYOUT_STEP_SKIPPED = 6;
}

// PayoutStep is one asset's payout in a run. Amounts are in base units of 18
// decimals.
message PayoutStep {
  // Asset paid, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 1;
  // Destination chain identifier.
  uint64 destination_chain_id = 2;
  // Canonical destination address.
  string destination_address = 3;
  // Where the payout stands.
  PayoutStepState state = 4;
  // Machine-readable reason of a skipped or failed step: below_minimum,
  // price_unavailable, rule_superseded, destination_not_whitelisted,
  // destination_cooling_down (the destination was added to the vault's
  // external withdraw whitelist less than 24 hours ago; the balance stays
  // for a later run), destination_invalid, authority_revoked,
  // withdrawal_refused,
  // gateway_capacity_insufficient, withdrawal_released (the withdrawal was
  // released before it was sent; nothing left the vault) or
  // withdrawal_failed (the withdrawal ended without paying; close says
  // where its funds went, see PAYOUT_FAILED); empty otherwise.
  string reason = 5;
  // The vault's available balance of the asset when the run started.
  TokenAmount available = 6;
  // What the step pays: the available balance up to the rule's per-run
  // ceiling, rounded down to whole units of the destination network. Zero
  // when skipped. The network fee is taken out of it on the way.
  TokenAmount amount = 7;
  // The least amount the rule pays for the asset (the destination's minimum
  // in the rule version the run executed). A withdrawal on the network may
  // need more, as below_minimum says.
  TokenAmount minimum = 8;
  // USD value of the payable amount when the run started, checked against
  // Payout.min_usd_value; unset when the rule has no USD minimum or no
  // current price valued the asset.
  TokenAmount value_usd = 9;
  // Destination-network transaction hash, once known.
  string tx_hash = 10;
  // The network fee charged on the withdrawal. On a completed step it was
  // taken out of amount, so the destination received amount minus this fee.
  // On a failed step whose withdrawal the destination network's bridge
  // rejected or failed to execute, it is the fee kept, which is not
  // refunded. Unset until the step is final, on a skipped step or one that
  // failed before reaching that bridge, and when the fee was not reported;
  // never zero for unknown.
  TokenAmount charged_network_fee = 11;
  // How the step's withdrawal ended once it left the vault, the same close
  // as the step's PAYOUT_DEBIT entry in ListVaultLedger: CLOSE_PAID for a
  // completed step; for a failed one CLOSE_REFUNDED_TO_SMART_ACCOUNT,
  // CLOSE_SENT_TO_RECOVERY, or CLOSE_UNKNOWN when where its funds went is
  // not known. Unset (CLOSE_UNSPECIFIED) while the step is not final, and on
  // a step that never left the vault, such as a skipped, refused, held or
  // released one.
  PayoutClose close = 12;
  // The net the destination network's bridge refunded to the vault's own
  // smart account, the amount of the step's PAYOUT_REFUND entry; set only
  // with CLOSE_REFUNDED_TO_SMART_ACCOUNT, never zero for unknown.
  TokenAmount refunded_amount = 13;
}

// Payout is one scheduled payout run of a broker vault's payout rule.
message Payout {
  // Public payout run ID.
  fixed64 run_id = 1;
  // Public sub-account ID of the vault paid out: the default vault or an
  // affiliate vault.
  fixed64 vault_account_id = 2;
  // What the run came to.
  PayoutStatus status = 3;
  // Machine-readable reason of the status (see PayoutStatus); empty for
  // PAYOUT_PAID and PAYOUT_IN_PROGRESS.
  string reason = 4;
  // Where an in-progress run stands; PAYOUT_STAGE_UNSPECIFIED otherwise.
  PayoutStage stage = 5;
  // The rule version the run executed.
  uint32 rule_version = 6;
  // The scheduled UTC slot the run belongs to.
  google.protobuf.Timestamp scheduled_for = 7;
  // When the run started.
  google.protobuf.Timestamp started_at = 8;
  // When the run ended; unset while it is in progress.
  google.protobuf.Timestamp finished_at = 9;
  // The rule's least USD value of one payout, in base units of 18 decimals;
  // unset when the rule has no USD minimum.
  TokenAmount min_usd_value = 10;
  // One step per destination of the rule version, in asset_id order. Empty
  // while the run is planning.
  repeated PayoutStep steps = 11;
}

// ListPayoutsRequest lists the payout runs of the broker's vaults, newest
// first. Every filter narrows the list.
message ListPayoutsRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Only this vault's payouts: the default vault or an affiliate vault, as
  // a public sub-account ID. Zero for every vault of the broker.
  fixed64 vault_account_id = 2;
  // Only payouts in one of these statuses, at most 6; empty for every
  // status.
  repeated PayoutStatus statuses = 3 [(buf.validate.field).repeated = {
    max_items: 6
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Only runs scheduled at or after start_time; unset for no lower bound.
  google.protobuf.Timestamp start_time = 4;
  // Only runs scheduled before end_time (exclusive); unset for no upper
  // bound.
  google.protobuf.Timestamp end_time = 5;
  // Maximum number of payouts to return; 0 means 50, at most 100.
  uint32 limit = 6 [(buf.validate.field).uint32.lte = 100];
  // Opaque keyset cursor from a previous next_page_token, exclusive, bound
  // to the broker, the filters and the list order. Reuse it with the same
  // filters; limit may change. Empty for the first page.
  string page_token = 7 [(buf.validate.field).string.max_len = 256];
}

// ListPayoutsResponse lists payouts newest first by scheduled slot. Runs of
// the same slot follow a stable server-defined order, the same on every
// page; it does not follow run_id. Paging lists exactly once every run that
// sorts after the previous page's last run when the next page is read,
// including a run started meanwhile for an older slot. A run started
// meanwhile for a newer slot sorts before the cursor and appears only in a
// listing started again from the first page.
message ListPayoutsResponse {
  // The payouts.
  repeated Payout payouts = 1;
  // Cursor of the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// GetPayoutRequest reads one payout run of the broker's vaults.
message GetPayoutRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public payout run ID. A run of another broker's vault is
  // indistinguishable from an unknown ID.
  fixed64 run_id = 2 [(buf.validate.field).fixed64.gt = 0];
}

// GetPayoutResponse carries the payout.
message GetPayoutResponse {
  // The payout run.
  Payout payout = 1;
}

// UpcomingPayoutAsset is what a vault's next payout run would do with one
// asset, sized from the vault's balance now. Amounts are in base units of 18
// decimals.
message UpcomingPayoutAsset {
  // Asset, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 1;
  // Destination chain identifier; zero when the rule has no destination for
  // the asset.
  uint64 destination_chain_id = 2;
  // Canonical destination address; empty when the rule has no destination
  // for the asset.
  string destination_address = 3;
  // The vault's available balance of the asset now.
  TokenAmount available = 4;
  // What the run would pay: the available balance up to the rule's per-run
  // ceiling, rounded down to whole units of the destination network, or zero
  // when it holds.
  TokenAmount payable = 5;
  // What would stay in the vault: available minus payable.
  TokenAmount held_back = 6;
  // Why held_back stays, or why nothing pays: below_minimum,
  // price_unavailable, no_destination (the rule pays no destination for the
  // asset), destination_cooling_down (the destination was added to the
  // vault's external withdraw whitelist less than 24 hours ago; see
  // payable_from), above_max (the balance above the per-run ceiling stays)
  // or dust (less than one whole unit of the destination network stays);
  // empty when the whole balance pays.
  string hold_reason = 7;
  // The least one payout of the asset pays: the destination's minimum, or
  // the least a withdrawal on its network pays now when that is higher.
  // Unset when the rule has no destination for the asset.
  TokenAmount minimum = 8;
  // USD value of what the asset would pay before its minimums, at the
  // current price as of priced_at; unset when no current price values it or
  // the rule has no destination for it.
  TokenAmount value_usd = 9;
  // When the price behind value_usd was observed; unset with it.
  google.protobuf.Timestamp priced_at = 10;
  // The network fee a payout to the destination is expected to be charged,
  // from the network's latest sampled fee: an estimate, not the fee charged
  // (PayoutStep.charged_network_fee). It is taken out of the payout. Unset
  // when the rule has no destination for the asset or the fee is not known
  // now.
  TokenAmount estimated_network_fee = 11;
  // When estimated_network_fee was sampled; unset with it.
  google.protobuf.Timestamp estimated_network_fee_sampled_at = 12;
  // Set only while the destination is cooling down (hold_reason
  // destination_cooling_down): when it can be paid, 24 hours after it was
  // added to the vault's external withdraw whitelist. Unset with that hold
  // reason when the time is not known yet.
  google.protobuf.Timestamp payable_from = 13;
}

// UpcomingPayout previews one vault's next payout run from its balances now.
// It plans exactly as the run does; balances, prices and fees can change
// before the run starts.
message UpcomingPayout {
  // Public sub-account ID of the vault.
  fixed64 vault_account_id = 1;
  // Whether the next run would pay.
  chain.withdraw.v1.AutoWithdrawPreviewStatus status = 2;
  // When the next run starts: its UTC slot, or, while a due slot waits to
  // start, that slot. For an hourly rule, the next hourly check. Unset when
  // the vault has no rule or the rule is paused.
  google.protobuf.Timestamp next_run_at = 3;
  // The rule's latest version; zero when the vault has no rule.
  uint32 rule_version = 4;
  // Set when the rule paused itself; a rule paused by a member has none.
  chain.withdraw.v1.AutoWithdrawPause pause = 5;
  // The rule's least USD value of one payout, in base units of 18 decimals;
  // unset when the vault has no rule or the rule has no USD minimum.
  TokenAmount min_usd_value = 6;
  // One entry per destination of the rule, then per other asset with a
  // positive balance, in asset_id order. Empty when the vault has no rule or
  // the rule is paused.
  repeated UpcomingPayoutAsset assets = 7;
  // When the balances, prices and fees this preview used were read.
  google.protobuf.Timestamp computed_at = 8;
}

// ListUpcomingPayoutsRequest previews the next payout run of the broker's
// vaults.
message ListUpcomingPayoutsRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public vault sub-account ID. Omit to include every vault, including
  // disabled affiliates. A root account or another broker's vault is
  // NOT_FOUND.
  fixed64 vault_account_id = 2;
  // Maximum vaults, default 20, max 200.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 200];
  // Opaque exclusive keyset cursor, bound to the broker and vault filter.
  // Reuse with the same broker and vault_account_id; limit may change.
  string page_token = 4 [(buf.validate.field).string.max_len = 128];
}

// ListUpcomingPayoutsResponse lists vaults in ascending account creation-ID
// order, as ListVaultBalances does. A vault whose preview cannot be read
// fails the entire page; it is never shown as having nothing to pay.
message ListUpcomingPayoutsResponse {
  // One preview per vault, at most limit vaults, vaults without a rule
  // included.
  repeated UpcomingPayout upcoming_payouts = 1;
  // Opaque exclusive keyset cursor. Empty when no more results exist.
  string next_page_token = 2;
}

// PayoutRuleDestination pays one asset of a vault, in kind, to one address.
// Amounts are in base units of 18 decimals.
message PayoutRuleDestination {
  // Asset paid, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 1;
  // Destination chain identifier.
  uint64 destination_chain_id = 2;
  // Canonical destination address.
  string destination_address = 3;
  // A run pays the asset only when the payable amount reaches this minimum.
  TokenAmount min_amount = 4;
  // The most one run pays the asset; the rest stays in the vault.
  TokenAmount max_amount = 5;
  // The least one payout to this destination can pay now: the network's
  // withdrawal minimum, and more than its current network fee. It follows
  // the network fee. Unset when the network or its fee is not known now.
  TokenAmount min_floor = 6;
  // The network fee a payout to this destination is expected to be charged,
  // from the network's latest sampled fee: an estimate, not the fee charged
  // (PayoutStep.charged_network_fee). Unset when it is not known now.
  TokenAmount estimated_network_fee = 7;
  // When estimated_network_fee was sampled; unset with it.
  google.protobuf.Timestamp estimated_network_fee_sampled_at = 8;
}

// AssetWithoutDestination is an asset a vault holds or was ever credited
// in, which its rule pays no destination for, so no run pays it out.
message AssetWithoutDestination {
  // Asset, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 1;
  // The vault's settled balance of the asset now, as ListVaultBalances
  // reports it, in base units of 18 decimals; zero when everything it was
  // credited has left the vault.
  TokenAmount balance = 2;
}

// VaultPayoutRule is one broker vault's payout rule and the assets it leaves
// in the vault.
message VaultPayoutRule {
  // Public sub-account ID of the vault.
  fixed64 vault_account_id = 1;
  // The rule's latest version; zero when the vault has no rule, and every
  // other rule field is then unset.
  uint32 rule_version = 2;
  // Whether the rule runs: it runs only while enabled and without a pause.
  bool enabled = 3;
  // When the rule runs.
  chain.withdraw.v1.AutoWithdrawSchedule schedule = 4;
  // One destination per paid asset, in asset_id order.
  repeated PayoutRuleDestination destinations = 5;
  // Set when the rule paused itself; an Owner or Finance member resumes it.
  chain.withdraw.v1.AutoWithdrawPause pause = 6;
  // Least USD value one payout of the rule pays, in base units of 18
  // decimals; unset when the rule has no USD minimum.
  TokenAmount min_usd_value = 7;
  // When the rule's latest version was set.
  google.protobuf.Timestamp updated_at = 8;
  // Every asset the vault holds or was ever credited in that the rule pays
  // no destination for, in asset_id order; every such asset when the vault
  // has no rule.
  repeated AssetWithoutDestination assets_without_destination = 9;
}

// ListVaultPayoutRulesRequest reads the payout rules of the broker's vaults.
message ListVaultPayoutRulesRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public vault sub-account ID. Omit to include every vault, including
  // disabled affiliates. A root account or another broker's vault is
  // NOT_FOUND.
  fixed64 vault_account_id = 2;
  // Maximum vaults, default 20, max 200.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 200];
  // Opaque exclusive keyset cursor, bound to the broker and vault filter.
  // Reuse with the same broker and vault_account_id; limit may change.
  string page_token = 4 [(buf.validate.field).string.max_len = 128];
}

// ListVaultPayoutRulesResponse lists vaults in ascending account
// creation-ID order, as ListVaultBalances does. A failed read fails the
// entire page.
message ListVaultPayoutRulesResponse {
  // One entry per vault, at most limit vaults, vaults without a rule
  // included.
  repeated VaultPayoutRule rules = 1;
  // Opaque exclusive keyset cursor. Empty when no more results exist.
  string next_page_token = 2;
}

// VaultLedgerEntryKind is what moved in a vault ledger entry.
enum VaultLedgerEntryKind {
  // Never returned.
  LEDGER_ENTRY_KIND_UNSPECIFIED = 0;
  // A broker or affiliate fee a QuickSwap credited to the vault.
  FEE_CREDIT = 1;
  // An asset's payout in a payout run, debited from the vault.
  PAYOUT_DEBIT = 2;
  // The net of a payout the destination network's bridge rejected, refunded
  // to the vault's own smart account, less the network fee it kept. The
  // funds stay in that smart account: the refund is not part of the vault
  // balance ListVaultBalances reads, and no entry returns it to the vault.
  PAYOUT_REFUND = 3;
}

// PayoutClose is how a debited payout's withdrawal ended.
enum PayoutClose {
  // No close: the payout step is not final, or nothing left the vault. Never
  // returned on a ledger entry.
  CLOSE_UNSPECIFIED = 0;
  // The withdrawal completed on its destination network; the destination
  // received amount minus charged_network_fee.
  CLOSE_PAID = 1;
  // The destination network's bridge rejected the withdrawal and refunded
  // its net, less the network fee it kept, to the vault's own smart account;
  // a PAYOUT_REFUND entry and PayoutStep.refunded_amount show the refund.
  // The debit stands.
  CLOSE_REFUNDED_TO_SMART_ACCOUNT = 2;
  // The withdrawal's execution failed on its destination network: the net
  // went to the bridge's recovery address, which settles it with the
  // broker, and the network fee was kept. The debit stands.
  CLOSE_SENT_TO_RECOVERY = 3;
  // The withdrawal failed, and where its funds went is not known: the
  // payout ended before payouts recorded how a failed withdrawal closed, its
  // outcome was not known when it ended, or the records of its end disagree. The payout may have left the vault or
  // may have been returned to it; the vault's balance is authoritative.
  CLOSE_UNKNOWN = 4;
}

// VaultLedgerFeeCredit is the QuickSwap fee of a FEE_CREDIT entry.
message VaultLedgerFeeCredit {
  // Public ID of the credit, unique among the broker's fee credits.
  fixed64 credit_id = 1;
  // Public ID of the QuickSwap the fee was charged on. Read it with
  // GetQuickSwap for its full detail.
  fixed64 swap_id = 2;
  // BROKER (the broker fee, credited to the default vault) or AFFILIATE (an
  // affiliate fee, credited to that affiliate vault).
  FeeKind fee_kind = 3;
  // The fee's rate, in basis points of what each trading leg receives (of
  // the credited amount on a bridge); a two-leg route credits it once per
  // leg. Unset when the QuickSwap's fee terms are not known.
  optional uint32 fee_bps = 4;
  // Source asset and network, as an AssetChainVariant.zipped_asset_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 source_zipped_asset_id = 5;
  // Destination asset and network, as an AssetChainVariant.zipped_asset_id
  // from GET /v1/chain/deposit-withdraw/config.
  uint32 destination_zipped_asset_id = 6;
  // Source amount quoted at creation, in source token units; an estimate.
  TokenAmount quoted_source_amount = 7;
  // Destination amount expected at creation, in destination token units; an
  // estimate.
  TokenAmount quoted_destination_amount = 8;
  // Source amount received, in source token units; unset until a deposit is
  // detected.
  TokenAmount source_amount = 9;
  // Destination amount delivered, in destination token units; unset until a
  // destination payout completes.
  TokenAmount destination_amount = 10;
}

// VaultLedgerPayoutDebit is the payout of a PAYOUT_DEBIT entry: one asset's
// step of a payout run, listed once its withdrawal ended and only when it
// left the vault. A payout that paid nothing, or whose withdrawal was
// released before it left, has no entry.
message VaultLedgerPayoutDebit {
  // Public payout run ID; read the run with GetPayout.
  fixed64 run_id = 1;
  // What the run came to.
  PayoutStatus payout_status = 2;
  // Destination chain identifier.
  uint64 destination_chain_id = 3;
  // Canonical destination address.
  string destination_address = 4;
  // Destination-network transaction hash; empty when none is known.
  string tx_hash = 5;
  // The step's state: PAYOUT_STEP_COMPLETED or PAYOUT_STEP_FAILED.
  PayoutStepState state = 6;
  // Machine-readable reason of a failed step (see PayoutStep.reason); empty
  // otherwise.
  string reason = 7;
  // How the withdrawal ended.
  PayoutClose close = 8;
  // The network fee charged on the withdrawal, in base units of 18
  // decimals: taken out of a paid amount, or kept on a rejected or failed
  // one and not refunded. Unset when it was not reported; never zero for
  // unknown.
  TokenAmount charged_network_fee = 9;
}

// VaultLedgerPayoutRefund is the refund of a PAYOUT_REFUND entry.
message VaultLedgerPayoutRefund {
  // Public payout run ID of the refunded payout; its PAYOUT_DEBIT entry has
  // the same run_id and asset_id.
  fixed64 run_id = 1;
}

// VaultLedgerEntry is one movement of a broker vault's funds.
message VaultLedgerEntry {
  // What moved.
  VaultLedgerEntryKind kind = 1;
  // When it happened: when a fee credit was credited; a payout debit's and
  // refund's run's scheduled slot (Payout.scheduled_for).
  google.protobuf.Timestamp occurred_at = 2;
  // Public sub-account ID of the vault: the default vault or an affiliate
  // vault.
  fixed64 vault_account_id = 3;
  // Asset, as an AssetConfig.ledger_id from
  // GET /v1/chain/deposit-withdraw/config.
  uint32 asset_id = 4;
  // Amount moved, positive, in base units of 18 decimals: credited to the
  // vault (FEE_CREDIT), debited from it (PAYOUT_DEBIT), or refunded to its
  // smart account (PAYOUT_REFUND).
  TokenAmount amount = 5;
  // The detail of kind.
  oneof detail {
    // Set for FEE_CREDIT.
    VaultLedgerFeeCredit fee_credit = 6;
    // Set for PAYOUT_DEBIT.
    VaultLedgerPayoutDebit payout_debit = 7;
    // Set for PAYOUT_REFUND.
    VaultLedgerPayoutRefund payout_refund = 8;
  }
}

// ListVaultLedgerRequest lists the ledger entries of the broker's vaults,
// newest first.
message ListVaultLedgerRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Only this vault's entries: the default vault or an affiliate vault, as
  // a public sub-account ID. Zero for every vault of the broker.
  fixed64 vault_account_id = 2;
  // Only entries that occurred at or after start_time; unset for no lower
  // bound.
  google.protobuf.Timestamp start_time = 3;
  // Only entries that occurred before end_time (exclusive); unset for no
  // upper bound.
  google.protobuf.Timestamp end_time = 4;
  // Maximum number of entries to return; 0 means 25, at most 100.
  uint32 limit = 5 [(buf.validate.field).uint32.lte = 100];
  // Opaque keyset cursor from a previous next_page_token, exclusive, bound
  // to the broker, the vault filter, the time bounds and the list order.
  // Reuse it with the same filters; limit may change. Empty for the first
  // page.
  string page_token = 6 [(buf.validate.field).string.max_len = 256];
}

// ListVaultLedgerResponse lists vault ledger entries newest first by
// occurred_at. At one time, payouts come before fee credits and a refund
// before its debit; otherwise entries of the same time follow a stable
// server-defined order, the same on every page; it does not follow
// credit_id or run_id. Paging lists exactly once
// every entry that sorts after the previous page's last entry when the next
// page is read, including one that appeared meanwhile at an older time (a
// payout whose withdrawal ended meanwhile, at its run's slot). One that
// appears meanwhile at a newer time sorts before the cursor and appears only
// in a listing started again from the first page. A page may hold fewer
// than limit entries while next_page_token is set; continue until it is
// empty.
message ListVaultLedgerResponse {
  // The entries.
  repeated VaultLedgerEntry entries = 1;
  // Cursor of the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// AllowlistAction is what a payout address allowlist change does.
enum AllowlistAction {
  // Rejected in requests and never returned.
  ALLOWLIST_ACTION_UNSPECIFIED = 0;
  // Adds the destination to the vault's allowlist.
  ADD_DESTINATION = 1;
  // Removes the destination from the vault's allowlist.
  REMOVE_DESTINATION = 2;
}

// AllowlistChangeStatus is where a payout address allowlist change stands.
enum AllowlistChangeStatus {
  // Never returned.
  ALLOWLIST_CHANGE_STATUS_UNSPECIFIED = 0;
  // Accepted and being applied on chain. A vault has at most one pending
  // change.
  PENDING = 1;
  // Applied: the destination is on the vault's allowlist (ADD_DESTINATION)
  // or no longer on it (REMOVE_DESTINATION). An added destination is
  // payable from its VaultAllowlistEntry.payable_from.
  APPLIED = 2;
  // Not applied, and never will be; failure says why. Nothing changed on
  // the vault's allowlist. Request the change again to retry it.
  NOT_APPLIED = 3;
}

// AllowlistChangeFailure is why a change ended NOT_APPLIED.
enum AllowlistChangeFailure {
  // The change is not NOT_APPLIED.
  ALLOWLIST_CHANGE_FAILURE_UNSPECIFIED = 0;
  // The change could not be applied before its expires_at.
  TIMED_OUT = 1;
  // REMOVE_DESTINATION only: the destination was no longer on the
  // allowlist when the change was applied.
  NOT_LISTED_ON_CHAIN = 2;
  // ADD_DESTINATION only: the allowlist already held 50 destinations on the
  // destination's network when the change was applied.
  LIMIT_REACHED = 3;
  // The requesting member no longer held the Owner or Finance role, under
  // the same grant, when the change was applied.
  REQUESTER_NO_LONGER_ALLOWED = 4;
  // The change was refused for another reason.
  REFUSED = 5;
}

// VaultAllowlistEntry is one destination on a vault's payout address
// allowlist: an address on one network that the vault's payouts and
// withdrawals may pay.
message VaultAllowlistEntry {
  // Destination chain identifier, as in
  // PayoutRuleDestination.destination_chain_id.
  uint64 destination_chain_id = 1;
  // Canonical destination address, exactly as payout rules and withdrawals
  // must name it.
  string destination_address = 2;
  // The member's name for the destination. Empty when the destination was
  // not added with RequestVaultAllowlistChange or was added without one.
  string label = 3;
  // Public account ID of the member who added the destination; 0 when it
  // was not added with RequestVaultAllowlistChange.
  fixed64 created_by_account_id = 4;
  // When the destination was added to the allowlist.
  google.protobuf.Timestamp listed_at = 5;
  // When payouts and withdrawals to the destination become possible: 24
  // hours after listed_at. Until then payouts to it are held and
  // withdrawals to it are refused.
  google.protobuf.Timestamp payable_from = 6;
  // Whether payable_from is still in the future when the allowlist was
  // read.
  bool cooling_down = 7;
  // Whether the latest version of the vault's payout rule pays this
  // destination, enabled or paused. A destination a rule pays cannot be
  // removed: change the rule first.
  bool used_by_payout_rule = 8;
}

// VaultAllowlistChange is one request to add a destination to, or remove one
// from, a vault's payout address allowlist.
message VaultAllowlistChange {
  // Public ID of the change.
  fixed64 change_id = 1;
  // Public sub-account ID of the vault.
  fixed64 vault_account_id = 2;
  // What the change does.
  AllowlistAction action = 3;
  // Destination chain identifier.
  uint64 destination_chain_id = 4;
  // Canonical destination address.
  string destination_address = 5;
  // ADD_DESTINATION only: the member's name for the destination; may be
  // empty.
  string label = 6;
  // Public account ID of the member who requested the change.
  fixed64 requested_by_account_id = 7;
  // When the change was requested.
  google.protobuf.Timestamp requested_at = 8;
  // The end of the change's approval window: a change not applied by then
  // ends NOT_APPLIED / TIMED_OUT. A change can stay PENDING shortly past it
  // while its outcome is confirmed.
  google.protobuf.Timestamp expires_at = 9;
  // Where the change stands.
  AllowlistChangeStatus status = 10;
  // NOT_APPLIED only: why.
  AllowlistChangeFailure failure = 11;
  // When the change became APPLIED or NOT_APPLIED; unset while PENDING.
  google.protobuf.Timestamp closed_at = 12;
}

// ListVaultAllowlistRequest reads one vault's payout address allowlist.
message ListVaultAllowlistRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public sub-account ID of the vault: the default vault or an affiliate
  // vault.
  fixed64 vault_account_id = 2 [(buf.validate.field).fixed64.gt = 0];
  // Only destinations on this destination chain; 0 for every chain.
  uint64 destination_chain_id = 3 [(buf.validate.field).uint64.lte = 65535];
}

// ListVaultAllowlistResponse is the vault's whole allowlist, at most 50
// destinations per destination chain, ordered by destination_chain_id, then
// destination_address. It is not paginated. A change applied moments ago
// can take a few seconds to show.
message ListVaultAllowlistResponse {
  // The destinations.
  repeated VaultAllowlistEntry entries = 1;
}

// ListVaultAllowlistChangesRequest lists one vault's allowlist changes.
message ListVaultAllowlistChangesRequest {
  // Broker name. A broker API key may name only its own broker.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public sub-account ID of the vault: the default vault or an affiliate
  // vault.
  fixed64 vault_account_id = 2 [(buf.validate.field).fixed64.gt = 0];
  // Maximum changes, default 20, max 100.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 100];
  // Opaque exclusive keyset cursor, bound to the broker and vault. Reuse
  // with the same broker and vault_account_id; limit may change.
  string page_token = 4 [(buf.validate.field).string.max_len = 128];
}

// ListVaultAllowlistChangesResponse lists changes newest first.
message ListVaultAllowlistChangesResponse {
  // The changes.
  repeated VaultAllowlistChange changes = 1;
  // Cursor of the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// RequestVaultAllowlistChangeRequest asks to add one destination to, or
// remove one from, a vault's payout address allowlist.
message RequestVaultAllowlistChangeRequest {
  // Broker name.
  string broker = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];
  // Public sub-account ID of the vault: the default vault or an affiliate
  // vault.
  fixed64 vault_account_id = 2 [(buf.validate.field).fixed64.gt = 0];
  // What the change does.
  AllowlistAction action = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Destination chain identifier, as in
  // PayoutRuleDestination.destination_chain_id.
  uint64 destination_chain_id = 4 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 65535
  }];
  // Destination address, in any form the destination network accepts; it
  // is stored and returned in canonical form. For REMOVE_DESTINATION, name a
  // VaultAllowlistEntry.
  string destination_address = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 385
  }];
  // ADD_DESTINATION only: the member's name for the destination, at most 64
  // characters without leading or trailing whitespace. Optional; must be
  // empty for REMOVE_DESTINATION.
  string label = 6 [(buf.validate.field).string.max_len = 64];
}

// RequestVaultAllowlistChangeResponse returns the change, PENDING.
message RequestVaultAllowlistChangeResponse {
  // The change. Follow it with ListVaultAllowlistChanges.
  VaultAllowlistChange change = 1;
}

// QuickSwapBrokerService administers a broker org, over ConnectRPC and REST.
// Every request names its broker. The caller is either the broker's API key,
// sent as a bearer token (see QuickSwapService), or a member's interactive
// session token; a person who is not a member of the broker gets NOT_FOUND /
// BROKER_NOT_FOUND. Each RPC maps to one broker action:
//
// | Action | Owner | Admin | Finance | Affiliate manager | Viewer | API key |
// | --- | --- | --- | --- | --- | --- | --- |
// | Read (GetBroker, ListKeys, ListVaults, GetVault, ListMembers, ListQuickSwaps, GetQuickSwap, GetFeeTotals, GetBrokerStats, ListVaultBalances, ListPayouts, GetPayout, ListUpcomingPayouts, ListVaultPayoutRules, ListVaultAllowlist, ListVaultAllowlistChanges) | yes | yes | yes | yes | yes | yes, except ListMembers |
// | Create vaults (CreateAffiliateVault, SetVaultStatus) | yes | yes | no | yes | no | yes |
// | Manage keys (CreateKey, RotateKey, RevokeKey) | yes | yes | no | no | no | RotateKey of itself only |
// | Manage members (InviteMember, SetMemberRole, RemoveMember) | yes | yes, never the Owner | no | no | no | no |
// | Transfer ownership | yes | no | no | no | no | no |
// | Manage the payout address allowlist (RequestVaultAllowlistChange) | yes | no | yes | no | no | no |
//
// A member managing keys, members or the payout address allowlist must also
// send a fresh step-up proof in
// the X-Auth-Step-Up header, obtained by completing an MFA challenge for
// fresh step-up; each proof authorizes one change. Reads, vaults and a key
// rotating itself need none. A denied action fails with PERMISSION_DENIED /
// ACTION_DENIED, a missing or used proof with PERMISSION_DENIED /
// STEP_UP_REQUIRED.
//
// REST errors are application/problem+json (see ErrorDetail) with the HTTP
// statuses of QuickSwapService.
service QuickSwapBrokerService {
  option (polyester.api.docs_group) = "quickswap";

  // GetBroker returns the broker, its limits and current usage of them, and
  // the caller's role.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND.
  rpc GetBroker(GetBrokerRequest) returns (GetBrokerResponse) {
    option (polyester.api.authentication_methods) = BROKER_API_KEY;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get broker"
      description: "Get the broker, its limits and current usage, and the caller's role."
      tags: "QuickSwap Broker"
    };
  }

  // ListVaultBalances reads current balances for this broker's own vaults.
  // All broker roles and the broker's API keys can read, without step-up.
  // Errors: NOT_FOUND for an unknown broker or vault; UNAVAILABLE when a
  // balance cannot be read. No partial page is returned on a read failure.
  rpc ListVaultBalances(ListVaultBalancesRequest) returns (ListVaultBalancesResponse) {
    option (polyester.api.authentication_methods) = BROKER_API_KEY;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "List vault balances"
      description: "Read current balances of a broker's default and affiliate vaults."
      tags: "QuickSwap Broker"
    };
  }

  // ListMyBrokers lists the brokers the caller is a member of and the
  // invites addressed to the caller. Session token only.
  rpc ListMyBrokers(ListMyBrokersRequest) returns (ListMyBrokersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "List my brokers"
      description: "List the caller's broker memberships and pending invites."
      tags: "QuickSwap Broker"
    };
  }

  // RespondToInvite accepts or declines a pending invite addressed to the
  // caller. Session token only; no step-up proof is needed.
  //
  // Errors:
  // - NOT_FOUND: INVITE_NOT_FOUND.
  // - ALREADY_EXISTS: ALREADY_MEMBER.
  rpc RespondToInvite(RespondToInviteRequest) returns (RespondToInviteResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Respond to invite"
      description: "Accept or decline a pending broker invite addressed to the caller."
      tags: "QuickSwap Broker"
    };
  }

  // ListMembers lists the broker's members and pending invites. Session
  // token only.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "List members"
      description: "List the broker's members and pending invites."
      tags: "QuickSwap Broker"
    };
  }

  // InviteMember invites a person with any role but OWNER; the person
  // accepts with their own login. Inviting again replaces the pending invite.
  // Session token and step-up proof only.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND, or MEMBER_NOT_FOUND when the account does
  //   not exist.
  // - PERMISSION_DENIED: ACTION_DENIED or STEP_UP_REQUIRED.
  // - ALREADY_EXISTS: ALREADY_MEMBER.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Invite member"
      description: "Invite a person to the broker with a role other than Owner."
      tags: "QuickSwap Broker"
    };
  }

  // SetMemberRole changes a member's role to any role but OWNER. The Owner's
  // role cannot be changed; transfer ownership instead. Session token and
  // step-up proof only.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND or MEMBER_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED or STEP_UP_REQUIRED.
  // - FAILED_PRECONDITION: OWNER_IMMUTABLE.
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Set member role"
      description: "Change a member's role."
      tags: "QuickSwap Broker"
    };
  }

  // RemoveMember removes a member, ending their access immediately, or
  // cancels the person's pending invite. The Owner cannot be removed. Session
  // token and step-up proof only.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND or MEMBER_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED or STEP_UP_REQUIRED.
  // - FAILED_PRECONDITION: OWNER_IMMUTABLE.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Remove member"
      description: "Remove a member or cancel a pending invite."
      tags: "QuickSwap Broker"
    };
  }

  // TransferOwnership makes another member the Owner; the caller, the
  // current Owner, becomes an Admin in the same change. Session token and
  // step-up proof only.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND or MEMBER_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED or STEP_UP_REQUIRED.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Transfer ownership"
      description: "Make another member the Owner of the broker."
      tags: "QuickSwap Broker"
    };
  }

  // ListKeys lists the broker's API keys, without secrets, a page at a time.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND.
  // - INVALID_ARGUMENT: a page_token from another broker or malformed.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (polyester.api.authentication_methods) = BROKER_API_KEY;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "List API keys"
      description: "List the broker's API keys without secrets."
      tags: "QuickSwap Broker"
    };
  }

  // CreateKey creates an API key. A broker has at most two working keys.
  // Session token and step-up proof only.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED or STEP_UP_REQUIRED.
  // - FAILED_PRECONDITION: KEY_LIMIT.
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Create API key"
      description: "Create a broker API key; its token is shown once."
      tags: "QuickSwap Broker"
    };
  }

  // RotateKey replaces a working key by a new one. The old key keeps working
  // until the overlap ends, then only the new key does. A broker API key may
  // rotate itself without a step-up proof; a member needs a session token and
  // step-up proof.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND or KEY_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED or STEP_UP_REQUIRED.
  // - FAILED_PRECONDITION: KEY_LIMIT, when the broker would have more than
  //   two working keys during the overlap.
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse) {
    option (polyester.api.authentication_methods) = BROKER_API_KEY;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Rotate API key"
      description: "Replace a broker API key, keeping the old one working for an overlap."
      tags: "QuickSwap Broker"
    };
  }

  // RevokeKey revokes a key immediately. The broker's last key that works
  // without an expiry cannot be revoked. Session token and step-up proof
  // only.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND or KEY_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED or STEP_UP_REQUIRED.
  // - FAILED_PRECONDITION: LAST_KEY.
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Revoke API key"
      description: "Revoke a broker API key immediately."
      tags: "QuickSwap Broker"
    };
  }

  // CreateAffiliateVault creates, or returns, the affiliate vault with label.
  // Create a vault before the first QuickSwap that credits it: a QuickSwap
  // naming a vault that does not exist yet is refused. Concurrent and
  // repeated requests with the same label return the same vault. No step-up
  // proof is needed.
  //
  // Errors:
  // - NOT_FOUND: BROKER_NOT_FOUND.
  // - PERMISSION_DENIED: ACTION_DENIED.
  // - RESOURCE_EXHAUSTED: BROKER_LIMIT, the broker's vault limit.
  rpc CreateAffiliateVault(CreateAffiliateVaultRequest) returns (CreateAffiliateVaultResponse) {
    option (polyester.api.authentication_methods) = BROKER_API_KEY;
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (gnostic.openapi.v3.operation) = {
      summary: "Create affiliate vault"
      description: "Create or return the broker's affiliate vault for a label."
      tags: "QuickSwap Broker"
    };
  }

