syntax = "proto3";

package swap.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";
import "polyester/api/options.proto";
import "polyester/type/v1/u128.proto";

option go_package = "github.com/Fabric-Labs/polyester-sdk-go/gen/swap/v1;swapv1";
option (gnostic.openapi.v3.document) = {
  tags: [
    {
      name: "Swap"
      description: "Convert one asset of an account's Trading balance into another through the spot order books."
    }
  ]
};

// SwapTerms are the economic terms of one Swap: spend amount_e18 of the
// source asset from the account's Trading balance and receive the destination
// asset there, at market or over time. The same terms are quoted and created.
// A Swap executes as spot orders at the account's own spot taker fee on each
// market it trades; no other fee is charged.
message SwapTerms {
  option (buf.validate.message).cel = {
    id: "swap_terms.distinct_assets"
    message: "source and destination must differ"
    expression: "this.source_asset_id != this.destination_asset_id"
  };

  // Optional sub-account public ID whose Trading balance funds the Swap. When
  // omitted, the caller's root account funds it, or the sub-account an API key
  // is bound to.
  fixed64 subaccount_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed64.gt = 0
  ];
  // Asset spent: a unified asset ID, as used for balances and internal
  // transfers.
  uint32 source_asset_id = 2 [(buf.validate.field).uint32.gt = 0];
  // Asset received: a unified asset ID.
  uint32 destination_asset_id = 3 [(buf.validate.field).uint32.gt = 0];
  // How much to Swap. Exactly one; further ways to size a Swap may be added
  // to this choice.
  oneof amount {
    option (buf.validate.oneof).required = true;
    // Positive source amount to spend, in 18-decimal units (0.5 is
    // 500000000000000000). Only whole order steps of the market are traded;
    // the rest stays on the account.
    polyester.type.v1.U128 amount_e18 = 4;
  }
  // How the Swap executes; unset executes at market.
  Execution execution = 5;
}

// MarketExecution executes the Swap at once, in immediate orders.
message MarketExecution {}

// TwapExecution spreads the Swap evenly over a duration, one slice per slot.
// Slot k starts k slice intervals after execution starts. Each slice trades
// what is left of the amount over the slots left, and each slice nets at
// least the Swap's minimum rate (min_amount_out_e18 over amount_e18) on what
// it converts, judged slice by slice; slices whose intermediate one later
// second leg converts together (below) are judged together. Each order's
// price limit allows for the taker fee in force when the order can match
// within its window, the highest rate scheduled from when the order is
// prepared until it can last be accepted, some minutes after its sending
// window since a delayed order can still be accepted then. An order the
// exchange first accepts after that window (only under severe delay) may pay
// a later scheduled fee, and a slice it takes below the minimum fails the
// Swap closed (MINIMUM_NOT_MET). A slice's first order is sent only within
// its slot: a slot missed is skipped, never sent late. On a two-leg route, a
// slice's second leg is sent once its first leg has settled, at any time
// before the deadline, even after the slice's slot, and the next slice
// starts only once it is over. When no second-leg order can meet the
// protection or the second market's order limits, the slice's intermediate
// asset is added to the next slice's second leg. What a second-leg order
// leaves unfilled, and what is still unconverted when execution ends, stays
// on the account (intermediate_remainder_e18), and the Swap then ends
// PARTIALLY_COMPLETED; a rest smaller than one order step of the second
// market is ordinary residue and the Swap can still end COMPLETED. A TWAP
// needs a larger amount than a market execution, since every slice must be a
// valid order.
message TwapExecution {
  option (buf.validate.message).cel = {
    id: "twap_execution.interval_within_duration"
    message: "slice_interval_ms must not exceed duration_ms"
    expression: "this.slice_interval_ms <= this.duration_ms"
  };

  // Total execution duration in milliseconds, from 60000 (1 minute) to
  // 86400000 (24 hours). The duration starts when execution starts, not when
  // the Swap is created.
  uint64 duration_ms = 1 [(buf.validate.field).uint64 = {
    gte: 60000
    lte: 86400000
  }];
  // Interval between slices in milliseconds, from 10000 (10 seconds) up to
  // duration_ms. The slice count is duration_ms / slice_interval_ms, rounded
  // up.
  uint64 slice_interval_ms = 2 [(buf.validate.field).uint64.gte = 10000];
}

// Execution selects how a Swap is traded.
message Execution {
  // Exactly one strategy.
  oneof strategy {
    option (buf.validate.oneof).required = true;
    // Execute immediately.
    MarketExecution market = 1;
    // Execute in equal time slices.
    TwapExecution twap = 2;
  }
}

// Side is a spot order side.
enum Side {
  // No side.
  SIDE_UNSPECIFIED = 0;
  // Buy the market's base asset with its quote asset.
  BUY = 1;
  // Sell the market's base asset for its quote asset.
  SELL = 2;
}

// SwapQuoteLeg is one spot market a quote trades on. The first leg of a
// two-leg route receives the intermediate asset and the second spends it.
message SwapQuoteLeg {
  // Stable numeric pair ID from GetSpotConfig.
  uint32 symbol_id = 1;
  // Side of the order on the market.
  Side side = 2;
  // Estimated average fill price, quote asset per base asset, as a decimal
  // string; for display.
  string average_price = 3;
  // Distance of average_price from the best price of the book, in basis points,
  // rounded up: the cost of the order's size against current depth.
  uint32 price_impact_bps = 4;
  // The account's spot taker fee rate on the market, in percent (for example
  // "0.1" for 0.1%), as a decimal string.
  string taker_fee_rate_percent = 5;
  // Estimated fee, in 18-decimal units of the asset the leg receives
  // (fee_asset_id): the leg's received amount times its taker fee rate. A
  // second leg is priced on what the first leg receives after its fee.
  polyester.type.v1.U128 fee_e18 = 6;
  // Asset the fee is charged in: the asset the leg receives.
  uint32 fee_asset_id = 7;
}

// SwapQuote is an estimate from current order-book depth. Nothing is
// reserved: the prices are indicative, and only min_amount_out binds once the
// Swap is created.
message SwapQuote {
  // The quoted terms.
  SwapTerms terms = 1;
  // Markets the Swap would trade on, in order: the direct market between the
  // two assets when one exists, otherwise two markets through
  // intermediate_asset_id (USDT or USDC), the route with the largest
  // expected output.
  repeated SwapQuoteLeg legs = 2;
  // Estimated destination amount after fees, in 18-decimal units, at current
  // order-book depth. A buy spends the whole source amount at the prices
  // available up to its price limit; what the book cannot fill within the
  // limit stays in the account.
  polyester.type.v1.U128 expected_amount_out_e18 = 3;
  // Minimum destination amount after fees at the requested slippage, in
  // 18-decimal units. Create the Swap with this value (or another accepted
  // minimum) as min_amount_out_e18: whatever is executed then nets at least the
  // same rate, and what cannot be stays on the account.
  polyester.type.v1.U128 min_amount_out_e18 = 4;
  // When the quote was priced.
  google.protobuf.Timestamp quoted_at = 5;
  // Last moment the quote may be accepted, 30 seconds after quoted_at. Pass it
  // as quote_expires_at when creating the Swap.
  google.protobuf.Timestamp expires_at = 6;
  // Unified asset ID of a two-leg route's intermediate asset (for example
  // USDT for BTC to SOL); zero for a direct route.
  uint32 intermediate_asset_id = 7;
  // Distance of the whole amount's average execution from the best prices
  // of the books, across every leg, in basis points, rounded up:
  // 1 - (1 - impact of leg 1) x (1 - impact of leg 2).
  uint32 price_impact_bps = 8;
  // Slices the Swap executes in: 1 at market; for a TWAP, duration_ms over
  // slice_interval_ms, rounded up. A TWAP is quoted as the whole amount at
  // current depth, an estimate of every slice.
  uint32 total_slices = 9;
}

// SwapStatus is the state of a Swap.
enum SwapStatus {
  // No status.
  STATUS_UNSPECIFIED = 0;
  // The Swap is accepted and its orders are being placed, filled or settled.
  EXECUTING = 1;
  // The whole amount was traded and settled (a remainder smaller than one
  // order step stays on the account, unspent).
  COMPLETED = 2;
  // Part of the amount was traded and settled; the rest stays on the account,
  // unspent. reason says why.
  PARTIALLY_COMPLETED = 3;
  // Nothing was traded and the whole amount stays on the account, or, with
  // reason MINIMUM_NOT_MET, a fill netted less than the accepted minimum rate;
  // reason says why, and the amounts show what was traded.
  FAILED = 4;
  // An order's outcome is being established. Balances already reflect any
  // settled fill; the Swap stays here until the outcome is confirmed. A
  // canceled Swap shows RECONCILING too while it waits for such an outcome
  // (see CancelSwap).
  RECONCILING = 5;
  // The Swap's owner canceled it (CancelSwap) and the cancel is taking
  // effect: no new slice or first-leg order is sent. An order already sent
  // finishes, and a slice whose first leg traded still sends its second
  // leg. The Swap then becomes terminal: CANCELED, or the outcome it would
  // have had when the cancel came too late to stop anything. This usually
  // takes seconds. While an order's outcome is being confirmed the Swap is
  // RECONCILING instead, and CANCELING again once it is, until it ends.
  CANCELING = 6;
  // The Swap's owner canceled it (CancelSwap) before its whole amount
  // traded. The amounts show exactly what traded and settled; the unspent
  // amount and any intermediate_remainder_e18 stay on the account. reason is
  // USER_CANCELED.
  CANCELED = 7;
}

// SwapReason says why a Swap did not trade its whole amount.
enum SwapReason {
  // No reason.
  REASON_UNSPECIFIED = 0;
  // The Trading balance did not cover the amount when the order was placed.
  INSUFFICIENT_BALANCE = 1;
  // The order books could not fill the rest at a price that meets
  // min_amount_out.
  PRICE_PROTECTION = 2;
  // The market was closed, halted, restricted or without liquidity.
  MARKET_UNAVAILABLE = 3;
  // The order was outside the market's size limits.
  ORDER_SIZE_OUT_OF_RANGE = 4;
  // The account's order rate limit was reached.
  RATE_LIMITED = 5;
  // The order was refused, for example by the sub-account's trading policy.
  ORDER_REJECTED = 6;
  // The execution window ended before the order could be placed, or a
  // TWAP's deadline ended it with slots left untraded.
  EXPIRED = 7;
  // A fill netted less than the accepted minimum rate. The Swap failed closed:
  // the amounts show exactly what was traded and received.
  MINIMUM_NOT_MET = 8;
  // The order bought the market's maximum order quantity and stopped there;
  // the rest of the amount stays on the account, unspent. The market's depth
  // or maximum changed after the quote, which never quotes past it.
  MAX_ORDER_QUANTITY = 9;
  // On a two-leg route, intermediate asset below the second market's minimum
  // order, with later slices' intermediate added where a TWAP had slices
  // left, stays on the account, unconverted (intermediate_remainder_e18).
  INTERMEDIATE_BELOW_MINIMUM = 10;
  // The Swap's owner canceled it (CancelSwap) before its whole amount
  // traded.
  USER_CANCELED = 11;
}

// SwapOrderStatus is the state of a Swap's spot order.
enum SwapOrderStatus {
  // No order status.
  ORDER_STATUS_UNSPECIFIED = 0;
  // The order is being placed.
  PLACING = 1;
  // The order was accepted by the market.
  PLACED = 2;
  // The order was refused before it reached the market.
  REFUSED = 3;
  // The order was not placed before the execution window ended.
  NOT_PLACED = 4;
  // The order's outcome is being established.
  UNCONFIRMED = 5;
}

// SwapOrder is one spot order of a Swap: an immediate-or-cancel limit order
// at the Swap's protection price, on one leg of one slice.
message SwapOrder {
  // Spot order ID, once the market accepted the order; 0 before.
  fixed64 order_id = 1;
  // Stable numeric pair ID from GetSpotConfig.
  uint32 symbol_id = 2;
  // Side of the order.
  Side side = 3;
  // Zero-based position of the order's market in the Swap's route.
  uint32 leg = 4;
  // State of the order.
  SwapOrderStatus status = 5;
  // Limit price in quote-asset price ticks (1e-9 quote units per base unit):
  // the worst price at which the order nets the Swap's minimum rate after fees.
  int64 limit_price_ticks = 6;
  // Amount the order spent in settled fills, fees in the spent asset included,
  // in 18-decimal units.
  polyester.type.v1.U128 spent_e18 = 7;
  // Amount the order received in settled fills after fees, in 18-decimal
  // units.
  polyester.type.v1.U128 received_e18 = 8;
  // Fee charged on settled fills, in 18-decimal units of the asset the order
  // receives.
  polyester.type.v1.U128 fee_e18 = 9;
  // Zero-based slice of the Swap's schedule the order belongs to; 0 at
  // market.
  uint32 slice = 10;
}

// SwapLeg is one market of a Swap's route and its settled totals.
message SwapLeg {
  // Zero-based position of the market in the route.
  uint32 leg = 1;
  // Stable numeric pair ID from GetSpotConfig.
  uint32 symbol_id = 2;
  // Side of the leg's orders.
  Side side = 3;
  // Amount the leg spent in settled fills, fees in the spent asset included,
  // in 18-decimal units of the asset it spends.
  polyester.type.v1.U128 spent_e18 = 4;
  // Amount the leg received in settled fills after fees, in 18-decimal units
  // of the asset it receives.
  polyester.type.v1.U128 received_e18 = 5;
  // Fee charged on the leg's settled fills, in 18-decimal units of
  // fee_asset_id.
  polyester.type.v1.U128 fee_e18 = 6;
  // Asset the leg's fee is charged in: the asset it receives.
  uint32 fee_asset_id = 7;
}

// SwapSlice is one slot of a TWAP Swap's schedule, including a slot that
// traded nothing. Its index and planned_at never change.
message SwapSlice {
  // State distinguishes pending work from a final slice outcome.
  enum State {
    // No state; never returned.
    STATE_UNSPECIFIED = 0;
    // Scheduled; no order has been sent yet.
    PLANNED = 1;
    // An order has been sent and the outcome is not final.
    EXECUTING = 2;
    // The slice traded its planned orders in full.
    TRADED = 3;
    // The slice traded some input but left an order partly unfilled or
    // intermediate asset unconverted.
    PARTLY_TRADED = 4;
    // No input traded because the slot was not used or no order could fill.
    SKIPPED = 5;
    // No input traded because an order or its execution failed.
    FAILED = 6;
  }
  // Reason explains a slice outcome or why intermediate asset was carried.
  enum Reason {
    // No reason is needed while pending or after a fully traded slice.
    SLICE_REASON_UNSPECIFIED = 0;
    // The slot ended before an order could be sent.
    SLOT_MISSED = 1;
    // The execution deadline ended this slice.
    DEADLINE_REACHED = 2;
    // The required market was closed.
    MARKET_CLOSED = 3;
    // The amount was below the market's minimum order size.
    BELOW_MINIMUM = 4;
    // The amount exceeded the market's maximum order size.
    ABOVE_MAXIMUM = 5;
    // No order could satisfy the Swap's price protection.
    PROTECTION_NOT_MET = 6;
    // An order was refused.
    REFUSED = 7;
    // Available liquidity did not fill the whole order at its protected price.
    INSUFFICIENT_LIQUIDITY = 8;
    // The execution ended before this slot was used.
    EXECUTION_ENDED = 9;
    // The Swap was canceled (CancelSwap) before this slot was used, or before
    // a later slice could convert this slice's intermediate.
    CANCELED = 10;
  }
  // Zero-based position in the Swap's frozen schedule.
  uint32 index = 1;
  // Frozen scheduled start of the slot.
  google.protobuf.Timestamp planned_at = 2;
  // When its first order was sent; unset for an unsent slice.
  google.protobuf.Timestamp executed_at = 3;
  // When its outcome became final; unset while planned or executing.
  google.protobuf.Timestamp finished_at = 4;
  // Current slice state.
  State state = 5;
  // Why a final slice did not trade in full; unspecified after full trading.
  Reason reason = 6;
  // Whether the slice traded source amount and is over.
  bool completed = 7;
  // Source amount the slice's first leg spent in settled fills, in
  // 18-decimal units.
  polyester.type.v1.U128 input_traded_e18 = 8;
  // Destination amount received in the slice after fees, in 18-decimal
  // units. On a two-leg route this is its second leg's output, which can
  // include intermediate carried from earlier slices.
  polyester.type.v1.U128 output_received_e18 = 9;
  // On a two-leg route, intermediate amount the slice's second leg spent, in
  // 18-decimal units; zero on a direct route.
  polyester.type.v1.U128 second_leg_input_e18 = 10;
  // On a two-leg route, intermediate acquired through this slice, from it and
  // earlier slices, that no second leg had converted by its end, in
  // 18-decimal units: added to a later slice's second leg when none could be
  // ordered (carry_reason), otherwise left on the account. Zero on a direct
  // route.
  polyester.type.v1.U128 intermediate_carried_e18 = 11;
  // Why intermediate asset could not be converted in this slice;
  // unspecified when no conversion was refused.
  Reason carry_reason = 12;
}

// SwapProgress is a Swap's execution schedule and slices.
message SwapProgress {
  // Slices that traded source amount and are over.
  uint32 completed_slices = 1;
  // Slices of the schedule: 1 at market, duration_ms over slice_interval_ms
  // rounded up for a TWAP; zero until execution is planned.
  uint32 total_slices = 2;
  // When a TWAP's schedule started, its first slot; unset at market and
  // until the TWAP is planned.
  google.protobuf.Timestamp started_at = 3;
  // The last moment an order of the Swap may be sent: the TWAP's start plus
  // its duration, or the end of the market execution window. Unset until
  // execution is planned. An order sent before it may settle, and an order's
  // outcome be confirmed (RECONCILING), after it; the Swap is terminal only
  // then.
  google.protobuf.Timestamp deadline = 4;
  // A TWAP's slices in index order, at most 50, including future slices.
  // Empty at market.
  repeated SwapSlice slices = 5;
  // True when the TWAP has more than 50 slices; only the first 50 are
  // listed, and completed_slices still counts them all.
  bool slices_truncated = 6;
}

// Swap is one signed-in Swap and its outcome. Amounts count settled fills
// only.
message Swap {
  // Swap ID.
  fixed64 swap_id = 1;
  // Idempotency key the Swap was created with.
  string idempotency_key = 2;
  // Sub-account public ID funding the Swap; 0 for the root account.
  fixed64 subaccount_id = 3;
  // Asset spent.
  uint32 source_asset_id = 4;
  // Asset received.
  uint32 destination_asset_id = 5;
  // Source amount requested, in 18-decimal units.
  polyester.type.v1.U128 amount_e18 = 6;
  // Minimum destination amount after fees for the whole amount, in 18-decimal
  // units. Each traded part nets at least this rate.
  polyester.type.v1.U128 min_amount_out_e18 = 7;
  // Current status.
  SwapStatus status = 8;
  // Why the Swap did not trade its whole amount; set with
  // PARTIALLY_COMPLETED, FAILED and CANCELED.
  SwapReason reason = 9;
  // True once the status is final: COMPLETED, PARTIALLY_COMPLETED, FAILED or
  // CANCELED.
  bool is_terminal = 10;
  // Source amount spent in settled fills, in 18-decimal units.
  polyester.type.v1.U128 executed_amount_e18 = 11;
  // Source amount not spent, in 18-decimal units; it never left the
  // account. Final once is_terminal is true.
  polyester.type.v1.U128 unspent_amount_e18 = 12;
  // Destination amount received after fees, in 18-decimal units.
  polyester.type.v1.U128 received_amount_e18 = 13;
  // The Swap's spot orders, in placement order.
  repeated SwapOrder orders = 15;
  // When the Swap was created.
  google.protobuf.Timestamp created_at = 16;
  // How the Swap executes.
  Execution execution = 17;
  // Unified asset ID of a two-leg route's intermediate asset; zero for a
  // direct route.
  uint32 intermediate_asset_id = 18;
  // On a two-leg route, intermediate asset received and not converted, in
  // 18-decimal units; it is on the account. Final once is_terminal is true.
  // Zero for a direct route.
  polyester.type.v1.U128 intermediate_remainder_e18 = 19;
  // The route's markets in order, with each leg's settled totals and fee.
  repeated SwapLeg legs = 20;
  // Execution schedule and slices; unset before execution is planned.
  SwapProgress progress = 21;
  // When the Swap's owner first canceled it (CancelSwap); unset when it was
  // never canceled. Set once and never changed. A cancel that came when
  // nothing was left to stop leaves the Swap's outcome as it would have been
  // (for example COMPLETED), with this set.
  google.protobuf.Timestamp cancel_requested_at = 22;
}

// QuoteSwapRequest asks for a quote of terms.
message QuoteSwapRequest {
  // Terms to quote.
  SwapTerms terms = 1 [(buf.validate.field).required = true];
  // Accepted shortfall from the expected output, in basis points (1 bp =
  // 0.01%), from 1 to 1000; sets the quote's min_amount_out.
  uint32 max_slippage_bps = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
}

// QuoteSwapResponse is the quote.
message QuoteSwapResponse {
  // The quote.
  SwapQuote quote = 1;
}

// CreateSwapRequest creates and executes a Swap.
message CreateSwapRequest {
  // Client-chosen key, unique per caller, that makes creation idempotent: the
  // same key and request return the same Swap; another request with the same
  // key is IDEMPOTENCY_CONFLICT. Keys starting "aw:" are reserved for
  // auto-withdraw's conversions and refused (INVALID_ARGUMENT).
  string idempotency_key = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$"];
  // Terms to execute.
  SwapTerms terms = 2 [(buf.validate.field).required = true];
  // Positive minimum destination amount after fees for the whole amount, in
  // 18-decimal units, usually the quote's min_amount_out_e18. An order that
  // matches within its window never nets a lower rate: its price limit allows
  // for the taker fee in force then. What cannot be traded at that rate stays
  // on the account. An order the exchange first accepts after its window
  // (only under severe delay) may pay a later scheduled fee; if that takes a
  // fill below the minimum rate, the Swap fails closed with MINIMUM_NOT_MET.
  polyester.type.v1.U128 min_amount_out_e18 = 3 [(buf.validate.field).required = true];
  // The accepted quote's expires_at. The Swap is refused with QUOTE_EXPIRED
  // once it has passed.
  google.protobuf.Timestamp quote_expires_at = 4 [(buf.validate.field).required = true];
}

// CreateSwapResponse is the created (or existing) Swap.
message CreateSwapResponse {
  // The Swap.
  Swap swap = 1;
}

// GetSwapRequest selects one Swap of the caller.
message GetSwapRequest {
  // Exactly one selector.
  oneof selector {
    option (buf.validate.oneof).required = true;
    // Swap ID.
    fixed64 swap_id = 1 [(buf.validate.field).fixed64.gt = 0];
    // Idempotency key the Swap was created with.
    string idempotency_key = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:-]{1,128}$"];
  }
}

// GetSwapResponse is the selected Swap.
message GetSwapResponse {
  // The Swap.
  Swap swap = 1;
}

// CancelSwapRequest cancels one of the caller's Swaps.
message CancelSwapRequest {
  // Swap ID.
  fixed64 swap_id = 1 [(buf.validate.field).fixed64.gt = 0];
}

// CancelSwapResponse is the Swap as the cancel left it.
message CancelSwapResponse {
  // The Swap: CANCELING until what was already placed finishes, or
  // RECONCILING while an order's outcome is being confirmed; already
  // terminal; or, after the Swap's deadline, unchanged (EXECUTING or
  // RECONCILING, without cancel_requested_at).
  Swap swap = 1;
}

// ListSwapsRequest lists the caller's Swaps funded by one account, newest
// first.
message ListSwapsRequest {
  // Optional sub-account public ID whose Swaps to list. When omitted, the
  // Swaps funded by the caller's root account are listed, or those of the
  // sub-account an API key is bound to.
  fixed64 subaccount_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).fixed64.gt = 0
  ];
  // When true, only Swaps that have not ended (is_terminal false) are listed.
  bool open_only = 2;
  // Maximum number of Swaps to return: 0 means 20, at most 50.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 50];
  // Opaque, exclusive, keyset-backed cursor from a previous response's
  // next_page_token. It is bound to the caller, subaccount_id and open_only,
  // and to the newest-first creation order with a stable tie-breaker for
  // Swaps created at the same instant; reuse it only with the same values.
  // Empty for the first page.
  string page_token = 4 [(buf.validate.field).string.max_len = 256];
}

// ListSwapsResponse returns one page of Swaps, newest first.
message ListSwapsResponse {
  // Swaps ordered by creation time, newest first, each as GetSwap returns
  // it.
  repeated Swap swaps = 1;
  // Cursor for the next page. Empty when no more results exist.
  string next_page_token = 2;
}

// ErrorCode identifies a Swap API error.
enum ErrorCode {
  // No code.
  ERROR_UNSPECIFIED = 0;
  // No spot market trades the source asset against the destination asset,
  // directly or through USDT or USDC.
  ROUTE_UNSUPPORTED = 1;
  // The amount is outside the market's current limits. The error carries the
  // limits (min_amount_e18, max_amount_e18) when known.
  AMOUNT_OUT_OF_RANGE = 2;
  // No price is currently available for the route; retry later.
  QUOTE_UNAVAILABLE = 3;
  // Current order-book depth cannot deliver min_amount_out_e18 (or the
  // requested slippage): request a new quote.
  PROTECTION_UNACHIEVABLE = 4;
  // quote_expires_at has passed: request a new quote.
  QUOTE_EXPIRED = 5;
  // The idempotency key was already used with a different request. The error
  // carries the original swap_id.
  IDEMPOTENCY_CONFLICT = 6;
  // No Swap of the caller matches the selector.
  SWAP_NOT_FOUND = 7;
  // subaccount_id is not a valid sub-account ID.
  INVALID_SUBACCOUNT_ID = 8;
  // The sub-account does not exist.
  SUBACCOUNT_NOT_FOUND = 9;
  // The sub-account is not active.
  SUBACCOUNT_INACTIVE = 10;
  // The caller may not Swap on the account: the role, the API key's policy or
  // the sub-account's policy does not grant SWAP, or a root-scoped API key
  // selected a sub-account.
  SWAP_NOT_PERMITTED = 11;
  // A required service is temporarily unavailable; retry the same request.
  SERVICE_UNAVAILABLE = 12;
  // A market of the route trades its two assets but cannot execute a Swap in
  // this direction: a buy there would pay its fee in the asset it spends.
  DIRECTION_UNSUPPORTED = 13;
  // The Swap ended before it was canceled; the error carries its swap_id.
  // Read it with GetSwap.
  SWAP_ALREADY_FINAL = 14;
  // The Swap converts an auto-withdraw payout and ends only with its
  // auto-withdraw run.
  SWAP_NOT_CANCELABLE = 15;
}

// ErrorDetail is attached to Swap errors as an error detail of type
// swap.v1.ErrorDetail.
message ErrorDetail {
  // Stable error code.
  ErrorCode code = 1;
  // IDEMPOTENCY_CONFLICT and SWAP_ALREADY_FINAL only: the Swap bound to the
  // idempotency key, or the Swap that ended.
  fixed64 swap_id = 2;
  // AMOUNT_OUT_OF_RANGE only: the smallest amount that currently quotes, in
  // 18-decimal units of the source asset. Guidance, not a guarantee.
  polyester.type.v1.U128 min_amount_e18 = 3;
  // AMOUNT_OUT_OF_RANGE only: the largest amount current depth absorbs in one
  // order within the market's maximum order quantity, in 18-decimal units of
  // the source asset. A buy above it would buy more than the maximum order
  // quantity, so it is refused rather than partly executed.
  polyester.type.v1.U128 max_amount_e18 = 4;
}

// SwapService converts one asset of an account's Trading balance into another
// through Polyester's spot order books, on the direct market or through USDT
// or USDC, at market or as a TWAP over up to 24 hours. A Swap
// executes as immediate-or-cancel spot orders on the account, at the
// account's spot taker fee on each market and with no other fee, protected by
// the end-to-end min_amount_out the caller accepts: each order's price limit
// covers the taker fee scheduled within its window, so any part that trades
// nets at least that rate, and anything that cannot stays on the account. An
// order the exchange first accepts after its window (only under severe
// delay) may pay a later scheduled fee; if that takes a fill below the rate,
// the Swap finishes with MINIMUM_NOT_MET. Quotes are estimates and reserve
// nothing.
//
// Requests are authenticated with a session token or a signed API key. The
// caller needs the SWAP permission on the account: the trading roles grant it
// on sub-accounts, and API keys and sub-account policies must include the SWAP
// action. A Swap's orders also remain subject to the sub-account's spot
// trading policy.
//
// Follow a Swap with GetSwap until is_terminal is true; a market Swap usually
// completes within seconds, a TWAP by its deadline. CancelSwap stops a Swap
// that has not ended: no further slice starts, and what already traded
// stays traded. ListSwaps finds an account's Swaps again, those that have
// not ended among them.
service SwapService {
  option (polyester.api.docs_group) = "trading";

  // QuoteSwap prices terms against current order-book depth and the account's
  // taker fee. Nothing is reserved.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request, AMOUNT_OUT_OF_RANGE or
  //   INVALID_SUBACCOUNT_ID.
  // - FAILED_PRECONDITION: ROUTE_UNSUPPORTED, DIRECTION_UNSUPPORTED,
  //   PROTECTION_UNACHIEVABLE or SUBACCOUNT_INACTIVE.
  // - NOT_FOUND: SUBACCOUNT_NOT_FOUND.
  // - PERMISSION_DENIED: SWAP_NOT_PERMITTED.
  // - UNAVAILABLE: QUOTE_UNAVAILABLE or SERVICE_UNAVAILABLE; retry later.
  // - UNAUTHENTICATED: missing or invalid credentials.
  rpc QuoteSwap(QuoteSwapRequest) returns (QuoteSwapResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Quote Swap"
      description: "Price a Swap of the account's Trading balance without reserving anything."
      tags: "Swap"
    };
  }

  // CreateSwap creates the Swap for idempotency_key and executes it at once.
  // It re-prices the terms against current depth first: the Swap is created
  // only while the quote is unexpired and min_amount_out_e18 is achievable.
  // It is idempotent per caller and key: a repeated or concurrent request with
  // the same body returns the same Swap, so every unknown outcome is resolved
  // by repeating the request unchanged.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request, AMOUNT_OUT_OF_RANGE or
  //   INVALID_SUBACCOUNT_ID.
  // - FAILED_PRECONDITION: ROUTE_UNSUPPORTED, DIRECTION_UNSUPPORTED,
  //   PROTECTION_UNACHIEVABLE, QUOTE_EXPIRED or SUBACCOUNT_INACTIVE; nothing is
  //   created.
  // - ALREADY_EXISTS: IDEMPOTENCY_CONFLICT; the original Swap stands.
  // - NOT_FOUND: SUBACCOUNT_NOT_FOUND.
  // - PERMISSION_DENIED: SWAP_NOT_PERMITTED.
  // - UNAVAILABLE, DEADLINE_EXCEEDED: QUOTE_UNAVAILABLE, SERVICE_UNAVAILABLE
  //   or an unknown outcome; retry the same request.
  // - UNAUTHENTICATED: missing or invalid credentials.
  rpc CreateSwap(CreateSwapRequest) returns (CreateSwapResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Swap"
      description: "Create and execute a Swap of the account's Trading balance, or return the Swap of an idempotency key."
      tags: "Swap"
    };
  }

  // GetSwap returns one of the caller's Swaps by swap_id or idempotency key.
  // It needs the SWAP permission on the Swap's funding account; the Swaps of
  // a sub-account that is not active can still be read.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed selector.
  // - NOT_FOUND: SWAP_NOT_FOUND.
  // - PERMISSION_DENIED: SWAP_NOT_PERMITTED.
  // - UNAVAILABLE: SERVICE_UNAVAILABLE; retry later.
  // - UNAUTHENTICATED: missing or invalid credentials.
  rpc GetSwap(GetSwapRequest) returns (GetSwapResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Swap"
      description: "Get one Swap by identifier or by idempotency key."
      tags: "Swap"
    };
  }

  // CancelSwap cancels one of the caller's Swaps that has not ended. From
  // the cancel on, no new slice starts and no further first-leg order is
  // placed. A first-leg order placed just before the cancel arrives may
  // still be accepted, once; it is immediate-or-cancel and finishes. A
  // slice whose first leg traded still sends its second leg for that slice's
  // own intermediate asset; intermediate asset carried from earlier slices
  // is not converted and stays on the account. Nothing that traded is
  // undone. Until that work ends the Swap is CANCELING, or RECONCILING
  // while an order's outcome is being confirmed (it can move between the
  // two); it then becomes terminal: CANCELED with reason USER_CANCELED; or,
  // when the cancel came too late to stop anything, the outcome it would
  // have had (COMPLETED, PARTIALLY_COMPLETED or FAILED); or FAILED with
  // MINIMUM_NOT_MET, which still applies to what traded. A cancel usually
  // takes effect within seconds; confirming an order's outcome can take
  // longer, and the Swap stays non-terminal until it is confirmed. A cancel
  // after the Swap's deadline changes nothing: a Swap that has not ended is
  // returned as it is, EXECUTING or RECONCILING, without
  // cancel_requested_at, and one that has ended answers SWAP_ALREADY_FINAL.
  // Keep polling GetSwap until is_terminal is true.
  //
  // The cancel is idempotent: repeating a cancel that was recorded in time,
  // before or after the Swap ends, returns the Swap with its original
  // cancel_requested_at, so an unknown outcome is resolved by repeating the
  // request. Canceling needs the SWAP
  // permission on the funding account, through the caller's role or the API
  // key's policy; the sub-account's policy does not restrict it, and it
  // works on a sub-account that is not active, since a cancel only stops
  // trading.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request.
  // - NOT_FOUND: SWAP_NOT_FOUND.
  // - FAILED_PRECONDITION: SWAP_ALREADY_FINAL when the Swap ended with no
  //   cancel recorded (also after its deadline); SWAP_NOT_CANCELABLE for an
  //   auto-withdraw conversion.
  // - PERMISSION_DENIED: SWAP_NOT_PERMITTED.
  // - UNAVAILABLE, DEADLINE_EXCEEDED: SERVICE_UNAVAILABLE or an unknown
  //   outcome; retry the same request.
  // - UNAUTHENTICATED: missing or invalid credentials.
  rpc CancelSwap(CancelSwapRequest) returns (CancelSwapResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "Cancel Swap"
      description: "Cancel a Swap that has not ended: no further slice starts, and what already traded stays traded."
      tags: "Swap"
    };
  }

  // ListSwaps lists the caller's Swaps funded by one account, the root
  // account or a sub-account, newest first, each as GetSwap returns it. With
  // open_only it lists only the Swaps that have not ended, so a client can
  // find the Swaps it still follows. A sub-account that is not active is
  // listed too, so its open Swaps can be found and canceled. Each page
  // continues strictly after the last Swap of the page before it, in the
  // listing order, and holds the Swaps as they are when it is read: a
  // listing never repeats a Swap and never skips one that existed when the
  // listing started and still matches the filter. A Swap created while a
  // listing is under way is listed on a later page only if it sorts after
  // the last Swap already listed; otherwise it appears only when listing
  // starts again. With open_only, a Swap that ends between pages is left out
  // of the later ones.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed request or page_token, or
  //   INVALID_SUBACCOUNT_ID.
  // - NOT_FOUND: SUBACCOUNT_NOT_FOUND.
  // - PERMISSION_DENIED: SWAP_NOT_PERMITTED.
  // - UNAVAILABLE: SERVICE_UNAVAILABLE; retry later.
  // - UNAUTHENTICATED: missing or invalid credentials.
  rpc ListSwaps(ListSwapsRequest) returns (ListSwapsResponse) {
    option (polyester.api.authentication_methods) = SESSION_TOKEN;
    option (polyester.api.authentication_methods) = API_KEY;
    option (gnostic.openapi.v3.operation) = {
      summary: "List Swaps"
      description: "List the Swaps funded by one account, newest first, optionally only those that have not ended."
      tags: "Swap"
    };
  }
}
